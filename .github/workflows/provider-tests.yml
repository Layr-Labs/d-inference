        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  test-cluster:
    # DarkbloomClusterRuntimeTests in selections, each in its own process, on
    # separate Macs (scripts/cluster-test-plan.py): every test without a
    # switch, and the switched tests that pass on these runners. Shard 1 runs
    # the base selection, the share probe, then base-gemma-runtime, one at a
    # time; shards 2, 3, 6 and 7 each run a GPU group beside a group of base
    # selections that starts with a batch-session selection; shards 4 and 5
    # each run two groups of model-free base selections at the same time.
    # Shard 6 also runs the worker package's request lifecycle tests.
    name: Cluster Runtime Tests (shard ${{ matrix.shard }})
    # Starts beside Build cluster test products and waits for its products, as
    # test-provider does for its build.
    if: ${{ inputs.cluster == 'true' }}
    # Reads the run's jobs to wait for its build job (scripts/ci-test-products.py wait).
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(inputs.routes)[matrix.lane] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each shard and the route lane it reads (provider-plan.yml). Shards 2,
      # 3, 6 and 7 share test-cluster-2, and shards 4 and 5 test-cluster-3:
      # each of those lanes is requested for its jobs and carries one size.
      matrix:
        include:
          - {shard: 1, lane: test-cluster-1}
          - {shard: 2, lane: test-cluster-2}
          - {shard: 3, lane: test-cluster-2}
          - {shard: 4, lane: test-cluster-3}
          - {shard: 5, lane: test-cluster-3}
          - {shard: 6, lane: test-cluster-2}
          - {shard: 7, lane: test-cluster-2}
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      # The fixed build path, as in build-cluster (scripts/ci-test-products.py).
      - name: Work at the fixed build path
        run: |
          cd /
          rm -rf /private/tmp/dinf /private/tmp/dinf-ci "$GITHUB_WORKSPACE"
          mkdir -p /private/tmp/dinf /private/tmp/dinf-ci
          ln -s /private/tmp/dinf "$GITHUB_WORKSPACE"
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        if: env.CI_ACTIONS_CACHE != 'off'
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged or unsafe cached .git
        run: |
          [ -e .git ] || [ -L .git ] || exit 0
          # Checked before git reads it: a restored .git must be a directory
          # that runs nothing. No symbolic link, no hook but git's samples (here
          # or in a submodule) and no config that sets a hook directory or a
          # file system monitor or includes another file; git config --file
          # only parses. Names ignore case, as macOS does.
          if [ -L .git ] || [ ! -d .git ]; then
            reason="it is not a directory"
          elif [ -n "$(find .git -type l 2>/dev/null || true)" ]; then
            reason="it holds a symbolic link"
          elif [ -n "$(find .git -ipath '*/hooks/*' ! -type d ! -iname '*.sample' 2>/dev/null || true)" ]; then
            reason="it holds a hook"
          elif [ -n "$(find .git \( -iname config -o -iname config.worktree \) ! -type d \
              -exec git config --file {} --name-only --list \; 2>/dev/null |
              grep -i -E '^(core\.(fsmonitor|hookspath)|include\.|includeif\.)' || true)" ]; then
            reason="its config sets core.fsmonitor, core.hooksPath or an include"
          elif ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            reason="git fsck rejected it"
          else
            exit 0
          fi
          echo "::warning title=.git cache::Discarded the restored .git ($reason); checking out without it."
          rm -rf .git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      # What `submodules: recursive` does, with one parallel fetch per submodule.
      - name: Check out the submodules
        run: python3 scripts/ci-checkout-submodules.py
      - name: Save .git for later runs
        if: env.CI_ACTIONS_CACHE != 'off' && env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      # The worker package's own request lifecycle tests (WorkerTests,
      # WorkerLaneTests: the coordinator over its real pipes with a fake
      # runtime, CPU only), which no other job runs: among them D6's no-exit
      # path, a running request ended alone for a rank's memory while the
      # worker serves the next. They need no test products, so shard 6, the
      # shortest runtime shard, builds and runs them (a debug build of their
      # own, outside the checkout, on the runner's 4 vCPUs) while it waits for
      # the cluster build (scripts/ci-background-step.py).
      - name: Select SDK 27 provider toolchain
        id: toolchain
        if: ${{ matrix.shard == 6 }}
        run: ./scripts/prepare-provider-release-toolchain.sh
      - name: Start the worker's request lifecycle tests
        id: worker-lifecycle
        if: ${{ matrix.shard == 6 && steps.toolchain.outcome == 'success' }}
        env:
          DARKBLOOM_WORKER_TEST_JOBS: '4'
          DARKBLOOM_WORKER_TEST_SCRATCH: ${{ runner.temp }}/worker-lifecycle-build
        run: python3 scripts/ci-background-step.py start "$RUNNER_TEMP/worker-lifecycle" bash libs/darkbloom-cluster-worker/Tests/LifecycleChecks/run.sh
      - name: Download cluster test products
        id: test-products
        uses: ./.github/actions/provider-ci-products
        with:
          lane: cluster
          direction: download
      # Fails the job when they failed. It ends before the runtime tests start,
      # which then have the Mac to themselves, and they run either way.
      - name: Wait for the worker's request lifecycle tests
        if: ${{ !cancelled() && steps.worker-lifecycle.outcome == 'success' }}
        run: python3 scripts/ci-background-step.py wait "$RUNNER_TEMP/worker-lifecycle"
      - name: Run cluster runtime tests
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/cluster-test-plan.py run blocking "$SHARD"
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

