name: SDK 27 release preparation

on:
  push:
    branches: [master]
    paths:
      - 'provider-swift/**'
      - 'libs/**'
      - 'fixtures/prompt-contract/**'
      - 'scripts/**'
      - '.github/actions/provider-release-build/**'
      - '.github/workflows/provider-release-cache.yml'
      - '.github/workflows/release-swift.yml'
  pull_request:
    paths:
      - '.github/actions/provider-release-build/**'
      - '.github/workflows/release-swift.yml'
      - '.github/workflows/provider-release-cache.yml'
      - 'scripts/provider-release-cache.py'
      - 'scripts/provider_release_cache/**'
      - 'scripts/test-provider-release-cache.py'
      - 'scripts/test-provider-release-pipeline.py'
      - 'scripts/provider-release-swift.sh'
      - 'scripts/prepare-provider-release-toolchain.sh'
      - 'scripts/install-release-cmake.sh'
      - 'scripts/prepare-metal-toolchain.py'
      - 'scripts/test-prepare-metal-toolchain.py'
      - 'scripts/fetch-metallib.sh'
      - 'scripts/verify-prompt-parity.sh'
      - 'scripts/verify-nemotron-prompt-parity.sh'
      - 'scripts/prepare-prompt-fixtures.py'
      - 'scripts/test-prepare-prompt-fixtures.py'
      - 'scripts/run-provider-tests.sh'
      - 'scripts/provider-cluster-runtime-facts.sh'
      - 'scripts/provider-cluster-runtime-models.py'
      - 'provider-swift/Sources/ProviderCore/Config/ClusterRuntimeApprovalFacts.swift'
      - 'provider-swift/Sources/darkbloom/ClusterRuntimeFactsCommand.swift'
      - 'provider-swift/Tests/ProviderCoreTests/Qwen4StandaloneAdmissionTests.swift'
      - 'provider-swift/Sources/ProviderCore/KVCacheSSD/BoundedSingleConsumerPipeline.swift'
      - 'provider-swift/Tests/ProviderCoreTests/KVCacheSSD/BoundedSingleConsumerPipelineTests.swift'
  workflow_dispatch:

permissions:
  contents: read

# Let the current warm finish saving reusable objects; only the latest pending
# master revision needs another warm. PR validation writes only its own PR scope.
concurrency:
  group: provider-sdk27-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Only pull-request warming may use Darkbloom Sandboxes. Master and dispatched
  # runs warm the caches that release builds restore, so they keep Blacksmith.
  route:
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        warm macos_arm64 blacksmith-12vcpu-macos-27 ${{ github.event_name == 'pull_request' && 2 || 0 }}

  warm:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    name: SDK 27 ${{ matrix.lane }}
    needs: route
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(needs.route.outputs.routes)['warm'] || 'blacksmith-12vcpu-macos-27' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [release, qualification]
    env:
      MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'
      # As in ci.yml: test and warm the production identity on the dev branch too.
      DARKBLOOM_RELEASE_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Warm the same unsigned build used by releases
        id: build
        uses: ./.github/actions/provider-release-build
        with:
          lane: ${{ matrix.lane }}
      - name: Verify unsigned release handoff without signing
        if: matrix.lane == 'release'
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          METALLIB: ${{ steps.build.outputs.metallib }}
          CLUSTER_HELPERS: ${{ steps.build.outputs.cluster-helpers-dir }}
        run: |
          set -euo pipefail
          REPORTED=$("$BIN_DIR/darkbloom" --version)
          VERSION=${REPORTED#darkbloom }
          ./scripts/check-release-version.sh "$VERSION" "$REPORTED"
          python3 scripts/provider-signing-validation.py stage \
            --source "$GITHUB_WORKSPACE" --bin "$BIN_DIR" --metallib "$METALLIB" \
            --cluster-helpers "$CLUSTER_HELPERS" \
            --output "$RUNNER_TEMP/unsigned-roundtrip" --version "$VERSION"
          COPYFILE_DISABLE=1 tar czf "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" -C "$RUNNER_TEMP/unsigned-roundtrip" .
          python3 scripts/provider-signing-validation.py unpack \
            --archive "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" \
            --output "$RUNNER_TEMP/verified-roundtrip" \
            --source-sha "$GITHUB_SHA" --version "$VERSION"

      # Evidence before merge for the dev release's cluster runtime facts: the
      # app this build staged runs the script the dev release lane runs on its
      # signed app, so its own worker describes every model it qualifies on a
      # cluster from the public registry's manifests (metadata only). Pull
      # requests only: master warms the release caches with no registry read.
      - name: Describe the qualified cluster models with the built app
        if: matrix.lane == 'release' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ROUNDTRIP="$RUNNER_TEMP/verified-roundtrip"
          IFS=$'\t' read -r APP_NAME CLI_NAME < <(python3 -c \
            'import json, sys; names = json.load(open(sys.argv[1]))["packaging"]; print(names["appBundleName"] + "\t" + names["cliName"])' \
            "$ROUNDTRIP/unsigned-files.json")
          scripts/provider-cluster-runtime-facts.sh "$ROUNDTRIP/$APP_NAME" "$CLI_NAME" "$RUNNER_TEMP/cluster-runtime"
          {
            echo '### Cluster runtime facts of this build (unsigned, not published)'
            echo '```json'
            python3 -m json.tool --sort-keys "$RUNNER_TEMP/cluster-runtime/cluster-runtime.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
