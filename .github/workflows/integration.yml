name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  integration-tests:
    name: E2E Integration Tests
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 90
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      DARKBLOOM_PROMPT_SIDECAR_BINARY: ${{ github.workspace }}/coordinator/promptsidecar/target/release/promptsidecar
      TESTBED_PROVIDER_CONFIG: debug
      GPT_OSS_REVISION: 773a7da77e569019bb0fd17a554b263738d669a3
      EXACT_CACHE_MODEL_REVISION: 2c3e507453b4f218d05fe3cc97bea5c5a654257e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Build prompt-contract sidecar
        run: cargo build --manifest-path coordinator/promptsidecar/Cargo.toml --release

      - name: Extract mlx.metallib
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install 'mlx==0.31.2'
          cp /tmp/mlxvenv/lib/python*/site-packages/mlx/lib/mlx.metallib \
             provider-swift/.build/debug/mlx.metallib

      - name: Install Hugging Face client
        # v0.7.5 one-engine: the testbed default is the smallest
        # CBv2-servable checkpoint (gpt-oss-20b, ~12 GB — the old tiny
        # Qwen/gemma-3 fixtures have no CBv2 adapter and can no longer
        # register). Exact-cache routing additionally uses the small Gemma 4
        # checkpoint because GPT-OSS's dynamic-date template is cold-only.
        # A warm HF cache makes these downloads no-ops.
        run: /tmp/mlxvenv/bin/pip install huggingface_hub

      - name: Download model (protected read-only auth)
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=os.environ.get('HF_TOKEN') or None)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=os.environ.get('HF_TOKEN') or None)"

      - name: Download public model (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request: downloading public model without Hugging Face authentication"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=False)"

      - name: Pin exact-cache model snapshot selection
        run: |
          /tmp/mlxvenv/bin/python <<'PY'
          import os
          from pathlib import Path

          snapshots = (
              Path.home()
              / ".cache/huggingface/hub/models--mlx-community--gemma-4-e2b-it-4bit/snapshots"
          )
          selected = snapshots / os.environ["EXACT_CACHE_MODEL_REVISION"]
          if not selected.is_dir():
              raise SystemExit(f"pinned exact-cache snapshot missing: {selected}")
          for candidate in snapshots.iterdir():
              if candidate.is_dir():
                  os.utime(candidate, (1, 1))
          os.utime(selected, None)
          print(f"Pinned exact-cache snapshot: {selected.name}")
          PY

      # THE PAGED GATE. Pinned to an EXPLICIT paged posture, not left on the
      # provider's default, because `.auto` is ALLOWED to degrade: a paged
      # preflight, capacity-planning or pool-construction failure silently
      # lands an `.auto` slot on contiguous and the suite still passes. That
      # made this job green whether or not paged ever ran.
      #
      # `EngineV2KVBackendPolicy.degradesPagedFailure` returns false for an
      # explicit `.paged` selection: it REFUSES the load with
      # `EngineV2ProductionError.pagedUnavailable` instead of degrading. So a
      # paged regression that trips that path now fails this step rather than
      # quietly swapping the system under test.
      #
      # The cap is pinned WITH the backend and not inherited. Selecting a
      # backend makes the testbed hand the provider a TOML, which moves it onto
      # its config-decoder defaults, and that path still reads
      # `engine_v2_max_concurrent` as 4. Paged at B=4 measures 0.98x of
      # contiguous against 1.17x at B=8, so setting the backend alone would
      # have bought the B=1 regression and none of the throughput.
      # NON-BLOCKING as of the .auto reversal. `.auto` resolves CONTIGUOUS
      # again because paged ADOPTION is not exact against paged COLD -- on
      # gemma-4 at 28,672 tokens a paged slot answers differently depending
      # on whether a prefix-cache hit occurred, which is state the caller
      # cannot see. Paged is therefore opt-in, and a gate's blocking-ness
      # should match the feature's default-ness.
      #
      # This lane is EXPECTED RED until the engine-side frozen-bound fix
      # lands. It is kept, pinned, and visible rather than removed: the red
      # IS the finding, and unpinning it would recreate the "gate that
      # cannot fail" pattern this release fixed four separate times.
      # Promote back to blocking in the same change that re-flips `.auto`.
      - name: Run integration + profile tests (paged @ 8 — informational)
        continue-on-error: true
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # The one silent hole an explicit paged selection does NOT close: the
          # fleet kill switch is an override, not a failure, so it degrades
          # without refusing. Fail loudly rather than measure contiguous.
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this gate"
            exit 1
          fi
          echo "KV posture requested: engine_v2_kv_backend=$DARKBLOOM_TESTBED_KV_BACKEND" \
               "engine_v2_max_concurrent=$DARKBLOOM_TESTBED_MAX_CONCURRENT" \
               "DARKBLOOM_CBV2_PAGED_KV=<unset>"
          echo "Explicit paged refuses rather than degrades, so a green run here" \
               "served paged. Grep the log for 'provider KV posture' to confirm."
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run 'TestIntegration|TestProfile'

      # Default-posture lane. The step above is the only one that pins a
      # backend, so without this NOTHING would still exercise what a stock
      # install actually does: launch with no `--config` at all, on `.auto`,
      # at the provider's own memberwise cap. That is a different code path
      # from the gate — no TOML is written, no `--config` argument is added,
      # and the config-migration cleanup never engages — so it cannot be
      # inferred from a green paged run.
      #
      # Deliberately UNSET rather than `DARKBLOOM_TESTBED_KV_BACKEND=auto`:
      # naming `auto` would write a TOML and thereby change the launch path
      # and drop the cap to the decoder's 4, testing neither default.
      #
      # COST, honestly: this is a second provider boot plus a second
      # gpt-oss-20b load (warm HF cache, but the weights still page in) for
      # two inference round-trips. Same shape as the reverse-compat lane
      # below, which the repo already budgets 15m for the same two tests.
      # Step budget for the job goes 25+15+15=55m to 25+10+15+15=65m against
      # a 90m job timeout.
      - name: Run default-posture smoke (.auto = contiguous — BLOCKING gate)
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          echo "KV posture requested: provider default (no testbed override)"
          go test ./e2e/ -count=1 -v -timeout 10m -p=1 \
            -run '^TestIntegration_(NonStreaming|Streaming)Inference$'

      # The paged env is scoped to the gate STEP on purpose — do not promote it
      # to the job's `env:`. This lane and the reverse one below run RELEASED
      # v0.7.12 binaries, and a job-level setting would make the current
      # testbed hand a v0.7.12 provider a TOML selecting a backend that release
      # does not have.
      - name: Verify current coordinator with released v0.7.12 provider
        run: |
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # Recorded, not enforced. The gate used to hard-require SIP and so
          # went red (never ran) on a SIP-disabled runner. It is now pinned to
          # the released binary's SHA-256 instead; the only SIP-dependent
          # assertion adapts to whatever this prints. Reported here so a run
          # that cannot cover the positive sip_enabled round-trip says so.
          echo "Runner SIP state: $(/usr/bin/csrutil status 2>&1 || true)"
          RELEASED_PROVIDER=$(./scripts/fetch-v0712-provider.sh "$RUNNER_TEMP/released-providers")
          DARKBLOOM_MIXED_VERSION=1 \
          DARKBLOOM_PROVIDER_BINARY="$RELEASED_PROVIDER" \
            go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
              -run TestIntegrationMixedVersionReleasedV0712Provider

      # Reverse lane: the RELEASED v0.7.12 coordinator against the CANDIDATE
      # provider. Named for v0.7.13 until v0.7.15; the pinned tag below has
      # always been v0.7.12, which is what this actually checks out.
      - name: Verify released v0.7.12 coordinator with candidate provider
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          RELEASED_COORDINATOR="$RUNNER_TEMP/d-inference-v0.7.12"
          git worktree add --detach "$RELEASED_COORDINATOR" v0.7.12
          trap 'git worktree remove --force "$RELEASED_COORDINATOR"' EXIT
          (
            cd "$RELEASED_COORDINATOR"
            for test_name in NonStreamingInference StreamingInference; do
              DARKBLOOM_REPO_ROOT="$GITHUB_WORKSPACE" \
              TESTBED_PROVIDER_CONFIG=debug \
              DARKBLOOM_CBV2_MTP=0 \
              DARKBLOOM_PREFIX_CACHE_ALLOW_EPHEMERAL=1 \
              DARKBLOOM_PREFIX_CACHE_TEST_ROOT="$RUNNER_TEMP/v0712-reverse-cache-$test_name" \
                go test ./e2e -count=1 -v -timeout 15m -p=1 \
                  -run "^TestIntegration_${test_name}$"
            done
          )

  benchmark:
    name: E2E Benchmarks
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    environment: benchmarks
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      TESTBED_PROVIDER_CONFIG: debug
      BENCHMARK_MD_PATH: /tmp/benchmark-results.md
      RUNNER_DESC: macos-15 (M1 Virtual)
      GPT_OSS_REVISION: 773a7da77e569019bb0fd17a554b263738d669a3
      GEMMA_REVISION: 0e3cbab38ce568cf6e23543010d08d03b731910c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Extract mlx.metallib
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install 'mlx==0.31.2'
          cp /tmp/mlxvenv/lib/python*/site-packages/mlx/lib/mlx.metallib \
             provider-swift/.build/debug/mlx.metallib

      - name: Install Hugging Face client
        # Benchmarks serve the CBv2 default (gpt-oss-20b, ~12 GB) plus the
        # secondary multi-model checkpoint (gemma-4-26B QAT, ~14.5 GB) for
        # TestBenchmark_MultiModelMultiProvider. Warm HF cache ⇒ no-op.
        run: /tmp/mlxvenv/bin/pip install huggingface_hub

      - name: Download public models (pull request)
        run: |
          echo "Pull request: downloading public models without Hugging Face authentication"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-26B-A4B-it-qat-4bit', revision=os.environ['GEMMA_REVISION'], token=False)"

      - name: Run benchmarks
        run: |
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run 'TestBenchmark'

      - name: Post benchmark results
        if: always()
        run: |
          if [ ! -f /tmp/benchmark-results.md ]; then
            echo "No benchmark results file found"
            exit 0
          fi
          BODY=$(cat /tmp/benchmark-results.md)
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY" \
            --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
