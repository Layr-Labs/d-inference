name: Darkbloom Route

# Chooses a runner for each read-only CI lane: a Darkbloom Sandbox when the
# plane grants one, otherwise the lane's fallback label. Callers run each job on
# `fromJSON(needs.route.outputs.routes)['<lane>']`. Routing is off unless the
# DARKBLOOM_ROUTING variable is exactly `on`; the plane can never fail this job.
# DARKBLOOM_MACOS_LANES, when set, caps the macOS jobs one run asks for: lanes
# are kept in the caller's order while they fit, and the others keep their
# fallback without asking. A macOS lane can name a size. Sizes are sent only
# when the DARKBLOOM_JOB_SHAPES variable is exactly `on`; otherwise the request
# is the one without sizes, and a `required` lane keeps its fallback without
# asking. A run that targets master or main (a push to it, or a pull request
# into it) asks the plane at DARKBLOOM_SANDBOX_URL. Every other run asks the plane at
# DARKBLOOM_SANDBOX_DEV_URL when that variable is set, and otherwise the same
# plane as master.
on:
  workflow_call:
    inputs:
      lanes:
        description: >-
          One lane per line: `<lane> <profile> <fallback-label> [count [size
          [required]]]`. Profiles are linux_arm64 and macos_arm64. Count is the
          number of jobs that will run (default 1); 0 keeps the fallback
          without asking. Size, macOS only, is `<vCPUs>x<GiB>`, such as 4x24.
          While sizes are off, a `required` lane keeps its fallback without
          asking, and any other lane asks without its size.
        type: string
        required: true
    outputs:
      routes:
        description: JSON object mapping every lane to its runs-on value.
        value: ${{ jobs.select.outputs.routes }}

permissions: {}

jobs:
  select:
    name: Select Runners
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 3
    outputs:
      routes: ${{ steps.route.outputs.routes }}
    steps:
      - name: Choose a Darkbloom or fallback runner for each lane
        id: route
        shell: bash
        env:
          LANES: ${{ inputs.lanes }}
          ROUTING: ${{ vars.DARKBLOOM_ROUTING }}
          MACOS_LANES: ${{ vars.DARKBLOOM_MACOS_LANES }}
          JOB_SHAPES: ${{ vars.DARKBLOOM_JOB_SHAPES }}
          PLANE_URL: ${{ vars.DARKBLOOM_SANDBOX_URL }}
          DEV_PLANE_URL: ${{ vars.DARKBLOOM_SANDBOX_DEV_URL }}
          # The branch the run targets: a pull request's base, else the pushed
          # or dispatched branch.
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # The only labels a lane can receive besides its fallback. A plane
          # decision is used only when it repeats its profile's array exactly.
          # For a lane sent with a size, the size qualifies the last label
          # (darkbloom-macos-arm64-4x24).
          profiles='{"linux_arm64":["self-hosted","linux","ARM64","darkbloom-linux-arm64"],"macos_arm64":["self-hosted","macOS","ARM64","darkbloom-macos-arm64"]}'
          # Plane text is untrusted: keep it short, on one line, and free of
          # Markdown, HTML and workflow-command syntax before printing it.
          clean='def clean: tostring | gsub("[^A-Za-z0-9 _.,:;/=+()-]"; "?") | .[0:120];'

          configuration_error() {
            echo "::error title=Darkbloom route configuration::$1"
            exit 1
          }

          configured='[]'
          seen=' '
          while read -r lane profile fallback count shape required extra; do
            [ -n "$lane" ] || continue
            count=${count:-1}
            [ -z "$extra" ] || configuration_error "lane $lane has more than six fields"
            [[ $lane =~ ^[A-Za-z0-9_-]+$ ]] || configuration_error "invalid lane name: $lane"
            jq -e --arg profile "$profile" 'has($profile)' <<<"$profiles" >/dev/null \
              || configuration_error "lane $lane has unknown profile: $profile"
            [[ $fallback =~ ^[A-Za-z0-9._-]+$ ]] \
              || configuration_error "lane $lane has invalid fallback label: $fallback"
            [[ $count =~ ^(0|[1-9][0-9]?)$ ]] || configuration_error "lane $lane has invalid count: $count"
            # The plane's size grammar: <vCPUs>x<GiB>, lowercase decimal, no leading zeros.
            if [ -n "$shape" ]; then
              [[ $shape =~ ^[1-9][0-9]*x[1-9][0-9]*$ ]] \
                || configuration_error "lane $lane has invalid size: $shape (use <vCPUs>x<GiB>, such as 4x24)"
              [ "$profile" = macos_arm64 ] || configuration_error "lane $lane has a size, but sizes are macOS only"
            fi
            [ -z "$required" ] || [ "$required" = required ] \
              || configuration_error "lane $lane has an unknown sixth field: $required"
            case $seen in *" $lane "*) configuration_error "lane $lane is listed twice" ;; esac
            seen="$seen$lane "
            configured=$(jq -c --arg lane "$lane" --arg profile "$profile" --arg fallback "$fallback" \
              --argjson count "$count" --arg shape "$shape" --arg required "$required" \
              '. + [{$lane, $profile, $fallback, $count,
                     shape: (if $shape == "" then null else $shape end), required: ($required != ""), held: false}]' \
              <<<"$configured")
          done <<<"${LANES:-}"
          [ "$configured" != '[]' ] || configuration_error "no lanes are configured"

          # Job sizes are a repository setting, off unless exactly `on`. While
          # they are off, no size is sent, so the request is the request of a
          # lane table without sizes. A `required` lane is then held: it keeps
          # its fallback without asking and takes no place under the macOS cap.
          shapes_note=""
          if jq -e 'any(.[]; .shape != null)' <<<"$configured" >/dev/null; then
            if [ "${JOB_SHAPES:-}" = on ]; then
              shapes_note=" Job sizes are on: DARKBLOOM_JOB_SHAPES is 'on'."
            else
              shapes_note=" Job sizes are off: DARKBLOOM_JOB_SHAPES is not 'on'. No size was requested."
              configured=$(jq -c 'map(.held = .required | .shape = null)' <<<"$configured")
            fi
          fi

          # The macOS cap is a repository setting, not caller configuration: a
          # value other than 0 to 99 asks for no macOS lane rather than failing.
          macos_cap=${MACOS_LANES:-}
          cap_note=""
          if [ -n "$macos_cap" ] && ! [[ $macos_cap =~ ^(0|[1-9][0-9]?)$ ]]; then
            cap_note=" DARKBLOOM_MACOS_LANES is not a number from 0 to 99, so no macOS lane was requested."
            macos_cap=0
          fi
          configured=$(jq -c --arg cap "$macos_cap" '
            reduce .[] as $entry ({used: 0, lanes: []};
              if $entry.held then .lanes += [$entry + {capped: false}]
              elif $cap != "" and $entry.profile == "macos_arm64" and $entry.count > 0
                and .used + $entry.count > ($cap | tonumber)
              then .lanes += [$entry + {capped: true}]
              else .used += (if $entry.profile == "macos_arm64" then $entry.count else 0 end)
                | .lanes += [$entry + {capped: false}]
              end) | .lanes' <<<"$configured")
          # A lane without a size is exactly {lane, profile, count}.
          requested=$(jq -c '[.[] | select(.count > 0 and (.capped | not) and (.held | not))
            | {lane, profile, count} + (if .shape != null then {shape} else {} end)]' <<<"$configured")

          plane_url=${PLANE_URL:-https://api-sandbox.darkbloom.dev}
          plane_variable=DARKBLOOM_SANDBOX_URL
          plane_name=$plane_url
          # The plane comes from the branch the run targets, never from this
          # file, so this file squashed from dev into master still asks
          # DARKBLOOM_SANDBOX_URL there. A run with no target branch does too.
          case ${TARGET_BRANCH:-} in
            ''|master|main) ;;
            *)
              if [ -n "${DEV_PLANE_URL:-}" ]; then
                plane_url=$DEV_PLANE_URL
                plane_variable=DARKBLOOM_SANDBOX_DEV_URL
                plane_name="$plane_url ($plane_variable)"
              fi
              ;;
          esac
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          reply=/dev/null
          fallback_reason=""
          if [ "${ROUTING:-}" != on ]; then
            fallback_reason="routing is off"
            note="Routing is off: DARKBLOOM_ROUTING is not 'on'. No request was sent."
          elif [[ ${EVENT_NAME:-} == pull_request* && ${HEAD_REPOSITORY:-} != "${REPOSITORY:-}" ]]; then
            fallback_reason="pull request from a fork"
            note="Pull requests from forks keep their fallback runners. No request was sent."
          elif [ "$requested" = '[]' ]; then
            note="No lane has jobs to run. No request was sent."
          elif [[ $plane_url != https://* ]]; then
            fallback_reason="plane URL is not https"
            note="$plane_variable must start with https://. No request was sent."
          elif ! [[ ${RUN_ID:-} =~ ^[0-9]+$ && ${RUN_ATTEMPT:-} =~ ^[0-9]+$ ]]; then
            fallback_reason="run identity is unavailable"
            note="The run ID or attempt is not numeric. No request was sent."
          else
            request=$(jq -n -c --arg repository "$REPOSITORY" --argjson run_id "$RUN_ID" \
              --argjson run_attempt "$RUN_ATTEMPT" --argjson lanes "$requested" \
              '{$repository, $run_id, $run_attempt, $lanes}')
            # The request names only the repository, the run and the lanes.
            echo "Request: $request"
            # One attempt plus at most one retry after a transport failure,
            # timeout or transient status; each attempt is bounded to 5 seconds.
            for attempt in 1 2; do
              status=$(curl --disable --silent --show-error --proto '=https' --max-time 5 \
                --max-filesize 65536 --user-agent darkbloom-route/1 --request POST \
                --header 'Content-Type: application/json' --header 'Accept: application/json' \
                --data-binary @- --output "$body" --write-out '%{http_code}' \
                "${plane_url%/}/v1/ci/routes" <<<"$request") || status=000
              case $status in
                000|408|429|5??) [ "$attempt" = 2 ] || sleep 1 ;;
                *) break ;;
              esac
            done
            if [ "$status" != 200 ]; then
              fallback_reason="plane request failed (HTTP $status)"
            elif ! jq -e -s 'length == 1 and (.[0] | type == "object"
                and (.route_id | type == "string" and length > 0)
                and (.expires_at | type == "string")
                and (.lanes | type == "object"))' "$body" >/dev/null 2>&1; then
              fallback_reason="plane reply is malformed"
            else
              reply=$body
            fi
            if [ -n "$fallback_reason" ]; then
              note="Asked $plane_name: $fallback_reason. Requested lanes keep their fallback runners."
            else
              note=$(jq -r --arg url "$plane_name" \
                "$clean"'"Asked \($url): route \(.route_id | clean), expires \(.expires_at | clean)."' "$body")
            fi
          fi

          decisions=$(jq -n -c --argjson configured "$configured" --argjson profiles "$profiles" \
            --arg fallback_reason "$fallback_reason" --slurpfile reply "$reply" "$clean"'
            ($reply[0].lanes // {}) as $plane_decisions
            | [ $configured[]
                | ($plane_decisions[.lane] | if type == "object" then . else {} end) as $decision
                | (.shape as $shape | $profiles[.profile]
                    | if $shape == null then . else .[:-1] + [.[-1] + "-" + $shape] end) as $labels
                | if .count == 0 then .target = "fallback" | .reason = "not requested"
                  elif $fallback_reason != "" then .target = "fallback" | .reason = $fallback_reason
                  elif .held then .target = "fallback" | .reason = "needs its size, and job sizes are off (DARKBLOOM_JOB_SHAPES)"
                  elif .capped then .target = "fallback" | .reason = "over the macOS lane cap (DARKBLOOM_MACOS_LANES)"
                  elif $decision.target == "darkbloom" and $decision.runs_on == $labels
                  then .target = "darkbloom" | .reason = "granted"
                  elif $decision.target == "fallback"
                  then .target = "fallback" | .reason = "plane: " + ($decision.reason // "no reason" | clean)
                  else .target = "fallback" | .reason = "plane decision is missing or invalid"
                  end
                | .runs_on = (if .target == "darkbloom" then $decision.runs_on else .fallback end) ]')
          routes=$(jq -c 'map({key: .lane, value: .runs_on}) | from_entries' <<<"$decisions")
          echo "routes=$routes" >> "$GITHUB_OUTPUT"

          note="$note$cap_note$shapes_note"
          echo "$note"
          jq -r '.[] | (if .shape == null then "" else "; size \(.shape)" end) as $size
            | "\(.lane): \(.runs_on | if type == "array" then join(",") else . end) (\(.reason)\($size))"' <<<"$decisions"
          {
            echo "### Darkbloom runner routing"
            echo
            echo "$note"
            echo
            echo "| Lane | Profile | Jobs | Size | Runner | Decision |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.lane)` | \(.profile) | \(.count) | \(.shape // "-") | `\(.runs_on | if type == "array" then join(", ") else . end)` | \(.target): \(.reason) |"' <<<"$decisions"
          } >> "$GITHUB_STEP_SUMMARY"
