[tools]
# Coordinator (Go control plane). Source of truth: go.mod `go 1.25.0`.
go = "1.25.0"

# Prompt-contract sidecar. CI and the coordinator container use the same
# release so Cargo.lock resolution and language semantics stay reproducible.
rust = "1.88.0"

# Console UI (Next.js 16 / React 19). Matches `node-version: '22'` in
# .github/workflows/ci.yml.
node = "22"

# Provider (Swift 6.3, Apple Silicon). The local `libs/mlx-swift` dependency
# declares `// swift-tools-version: 6.3`, which sets the effective minimum even
# though provider-swift's own manifest remains source-compatible with 6.1.
# mise installs swiftly toolchains; on macOS the system Xcode swift is also
# acceptable — this pin ensures a consistent CLI for non-Xcode shells / Linux
# cross builds of ProviderCoreFoundation.
swift = "6.3"

# Python is used by helper scripts (scripts/benchmark-models.py) and to
# fetch the MLX metallib in CI (.github/workflows/integration.yml).
# MLX 0.31.x wheels target 3.10–3.12.
python = "3.12"

# Common CLIs the repo's scripts shell out to.
jq = "latest"           # scripts/smoke-dev.sh
gh = "latest"           # release + admin tooling
awscli = "latest"       # R2 uploads in release-swift.yml
gcloud = "latest"       # dev coordinator on GCP (gcloud logging read ...)

[env]
# Keep pip/uv from polluting the user site when running benchmark scripts.
PIP_REQUIRE_VIRTUALENV = "true"
