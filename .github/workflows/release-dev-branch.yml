name: Release Dev-Branch Provider

# Dev-branch provider lane: builds, signs, notarizes and publishes a provider
# from the d-inference `dev` branch to the dev coordinator. DevNet runs the dev
# branch end to end.
#
# Branch rule: dev builds dev, and master builds master. A master push and a
# release tag run release-swift.yml; a coalesced schedule (every 6 hours) or
# manual workflow_dispatch on `dev` runs this file. No workflow dispatches a
# build of another branch from non-default ref; the scheduled gate runs on
# `master` (GitHub runs schedules only from the default branch) and dispatches
# this workflow on `refs/heads/dev` only when `dev` HEAD moved past the last
# green run with release-relevant changes.
#
# The `qualify` job calls the reusable release-qualify.yml (the SDK
# qualification shards and their gate) with read-only permissions and no
# secrets. Only after it passes, the `dev` job calls the reusable
# release-provider.yml with environment dev, the same chain that every release
# lane runs: the source gate, the build, Developer ID signing, notarization and
# stapling, R2 staging and registration. There is no second build or signing
# path here. The reusable workflows come from the dispatched `dev` commit; the
# source gate (job resolve-env) runs master's copy of
# scripts/provider-release-resume.py verify-source, and the `dev` commit's
# scripts/resolve-provider-release.sh stamps the version
# <base>-dev.branch.<run number>.
#
# Secrets: `secrets: inherit` on the `dev` call is the only secret reference in
# this file; the `qualify` job passes none. The `gate` job holds no secrets and
# no `contents: write`. For
# environment dev the reusable workflow reads the Apple signing and notarization
# secrets in its signing job and only DEV_* secrets for staging and publication.
# The reusable workflow's signing, staging and publication jobs name the GitHub
# environment dev for this lane, so these secrets are that environment's and its
# branch policy applies before each of those jobs starts.
#
# Re-runs: a new signing attempt makes new signed bytes under the same version,
# and the coordinator refuses them (HTTP 409). Re-run failed jobs only after the
# signing job passed. To rebuild, dispatch on `dev` again.

run-name: >-
  dev-branch provider release of ${{ github.sha }} (-dev.branch.${{ github.run_number }})

on:
  schedule:
    # Coalesce dev-branch provider releases every 6 hours instead of firing
    # 7 Blacksmith macOS runners on every dev push.
    - cron: '23 */6 * * *'
  workflow_dispatch:

# Separate schedule checks from active dev builds so a 6-hour tick never
# cancels an in-flight dev release; newer manual dispatches supersede stale ones.
# The reusable workflow's publish job also joins provider-publication-dev
# (cancel-in-progress: false).
concurrency:
  group: release-dev-branch-${{ github.event_name == 'schedule' && 'schedule' || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Check whether dev needs a release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch dev-branch release if dev changed since last green run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          unfinished=$(gh api "repos/$REPOSITORY/actions/workflows/release-dev-branch.yml/runs?branch=dev&per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed") | .html_url] | join(" ")' 2>/dev/null || echo "")
          if [ -n "$unfinished" ]; then
            echo "::notice title=Dev release skipped::A release-dev-branch run on dev is already unfinished: $unfinished"
            exit 0
          fi

          dev_head=$(gh api "repos/$REPOSITORY/git/ref/heads/dev" --jq '.object.sha' 2>/dev/null || echo "")
          last_green=$(gh api "repos/$REPOSITORY/actions/workflows/release-dev-branch.yml/runs?branch=dev&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" or .event == "push")][0].head_sha // ""' 2>/dev/null || echo "")
          if [ -n "$dev_head" ] && [ -n "$last_green" ] && [ "$last_green" = "$dev_head" ]; then
            echo "::notice title=Dev release skipped::dev HEAD ($dev_head) already has a successful release-dev-branch run."
            exit 0
          fi

          if [ -n "$dev_head" ] && [ -n "$last_green" ]; then
            compare_json=$(mktemp)
            trap 'rm -f "$compare_json"' EXIT
            if gh api "repos/$REPOSITORY/compare/${last_green}...${dev_head}" > "$compare_json" 2>/dev/null; then
              should_run=$(python3 - "$compare_json" <<'PY' 2>/dev/null
          import fnmatch, json, sys

          PATTERNS = [
              'provider-swift/**',
              'libs/**',
              '.gitmodules',
              '.github/workflows/release-dev-branch.yml',
              '.github/workflows/release-provider.yml',
              '.github/workflows/release-qualify.yml',
              '.github/actions/provider-release-build/**',
              'scripts/check-release-version.sh',
              'scripts/resolve-provider-release.sh',
              'scripts/provider-release-resume.py',
              'scripts/provider_release_resume/**',
              'scripts/provider-release-cache.py',
              'scripts/provider_release_cache/**',
              'scripts/provider-release-publication.py',
              'scripts/provider-release-publication-requirements.txt',
              'scripts/provider-release-build-list.py',
              'scripts/provider_release_build_list.py',
              'scripts/provider_release_artifact.py',
              'scripts/provider_release_github.py',
              'scripts/provider_release_notes.py',
              'scripts/changelog.py',
              'scripts/provider_release_identity.py',
              'scripts/provider-signing-validation.py',
              'scripts/provider-build-default.py',
              'scripts/provider-cluster-runtime-models.py',
              'scripts/provider-cluster-runtime-facts.sh',
              'scripts/build-cluster-helpers.sh',
              'scripts/check-fixed-stack.sh',
              'scripts/check-provider-weak-imports.py',
              'scripts/sign-cluster-helpers.sh',
              'scripts/import-signing-certificate.sh',
              'scripts/remove-signing-keychain.sh',
              'scripts/stage-swiftpm-resource-bundles.sh',
              'scripts/prepare-provider-release-toolchain.sh',
              'scripts/prepare-metal-toolchain.py',
              'scripts/prepare-app-attest-entitlements.py',
              'scripts/install-macos-github-cli.sh',
              'scripts/install-release-cmake.sh',
              'scripts/fetch-metallib.sh',
              'scripts/test-qwen4-packaged-resources.py',
              'scripts/verify-prompt-parity.sh',
              'scripts/verify-nemotron-prompt-parity.sh',
              'scripts/provider-test-shards.py',
              'scripts/prepare-mimo-*-fixtures.py',
              'scripts/run-provider-tests.sh',
              'scripts/run-nested-suite.sh',
              'scripts/run-provider-test-watchdog.py',
          ]

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('status') not in ('ahead', 'identical'):
              print('true')
              sys.exit(0)
          files = data.get('files') or []
          # GitHub caps compare responses at 300 files; fail open if truncated.
          if len(files) >= 300:
              print('true')
              sys.exit(0)
          def matches(path, pat):
              if pat.endswith('/**'):
                  prefix = pat[:-3]
                  return path == prefix or path.startswith(prefix + '/')
              return fnmatch.fnmatchcase(path, pat)
          for entry in files:
              name = entry.get('filename') or ''
              prev = entry.get('previous_filename') or ''
              if any(matches(p, pat) for p in (name, prev) if p for pat in PATTERNS):
                  print('true')
                  sys.exit(0)
          print('false')
          PY
              ) || should_run=true
              if [ "$should_run" = false ]; then
                echo "::notice title=Dev release skipped::No release-relevant files changed on dev between $last_green and $dev_head."
                exit 0
              fi
            fi
          fi

          gh workflow run release-dev-branch.yml --repo "$REPOSITORY" --ref dev
          echo "Dispatched release-dev-branch.yml on dev (${dev_head:-unknown})."

  qualify:
    # SDK 27 qualification first (release-qualify.yml). It gets only read
    # permissions and no credentials, so its shards may run on a Darkbloom
    # Sandbox; this is the run's one route request.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/release-qualify.yml
    with:
      environment: dev

  # The credentialed release starts only after qualification passed.
  dev:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    # The reusable workflow's publish-release job declares contents: write
    # (gh release create, prod only), and its jobs declare actions: read
    # (download this run's artifacts); a caller must grant at least what its
    # jobs declare.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-provider.yml
    with:
      environment: dev
    secrets: inherit
