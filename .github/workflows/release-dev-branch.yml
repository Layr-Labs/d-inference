name: Release Dev-Branch Provider

# Dev-branch provider lane: a push to the d-inference `dev` branch builds,
# signs, notarizes and publishes a provider from the pushed dev commit to the
# dev coordinator. DevNet runs the dev branch end to end.
#
# Branch rule: dev builds dev, and master builds master. A master push and a
# release tag run release-swift.yml; a dev push runs this file. No workflow
# dispatches a build of another branch.
#
# This file is only a caller. Its `dev` job calls the reusable
# release-provider.yml with environment dev, the same chain that every release
# lane runs: the source gate, the build, the SDK qualification, Developer ID
# signing, notarization and stapling, R2 staging and registration. There is no
# second build or signing path here. Its `route` job asks Darkbloom for a
# sandbox for each SDK qualification shard, the only jobs of the chain that
# neither read a secret nor make bytes that are signed; every other job, and a
# shard the plane does not grant, runs on Blacksmith. The reusable workflow
# comes from the pushed
# commit; its source gate (job resolve-env) runs master's copy of
# scripts/provider-release-resume.py verify-source, and the pushed commit's
# scripts/resolve-provider-release.sh stamps the version
# <base>-dev.branch.<run number>.
#
# Secrets: `secrets: inherit` on the `dev` call is the only secret reference in
# this file; the route job gets no secret and no token permission. For
# environment dev the reusable workflow reads the Apple signing and
# notarization secrets (APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD,
# PROVISIONING_PROFILE_BASE64, APPLE_ID, APPLE_APP_PASSWORD) in its signing job
# and only DEV_* secrets for staging and publication. It reads a PROD_*,
# STAGING_* or unprefixed publication secret only when the environment is prod
# or staging. All of these are repository secrets; no job attaches a GitHub
# environment.
#
# Trust: only a push to `dev` starts this file, and the job also checks that
# github.ref is refs/heads/dev. Review is not enforced on `dev` today: its rules
# are required signatures and the "Darkbloom PR access control" ruleset, which
# lets only the accounts on that ruleset's bypass list create or update a ref.
# A dev push now gets the Developer ID signature, so `dev` needs a pull_request
# rule before this lane runs.
#
# Re-runs: a new signing attempt makes new signed bytes under the same version,
# and the coordinator refuses them (HTTP 409). Re-run failed jobs only after the
# signing job passed. To rebuild, push a new commit. A newer dev push cancels a
# run that is still pending in the release-dev-branch group; a running run
# always completes.

run-name: >-
  dev-branch provider release of ${{ github.sha }} (-dev.branch.${{ github.run_number }})

on:
  push:
    # A dev push publishes a dev-branch release. These paths are release-swift.yml's
    # master push paths, with this file in place of release-swift.yml: the
    # provider sources, the submodule pins, and every script the reusable
    # workflow and .github/actions/provider-release-build run.
    branches: [dev]
    paths:
      - 'provider-swift/**'
      - 'libs/**'
      - '.gitmodules'
      - '.github/workflows/release-dev-branch.yml'
      - '.github/workflows/release-provider.yml'
      - '.github/actions/provider-release-build/**'
      - 'scripts/check-release-version.sh'
      - 'scripts/resolve-provider-release.sh'
      - 'scripts/provider-release-resume.py'
      - 'scripts/provider_release_resume/**'
      - 'scripts/provider-release-cache.py'
      - 'scripts/provider_release_cache/**'
      - 'scripts/provider-release-publication.py'
      - 'scripts/provider_release_artifact.py'
      - 'scripts/provider_release_github.py'
      - 'scripts/provider_release_notes.py'
      - 'scripts/changelog.py'
      - 'scripts/provider_release_identity.py'
      - 'scripts/provider-signing-validation.py'
      - 'scripts/provider-build-default.py'
      - 'scripts/provider-cluster-runtime-models.py'
      - 'scripts/provider-cluster-runtime-facts.sh'
      - 'scripts/build-cluster-helpers.sh'
      - 'scripts/check-provider-weak-imports.py'
      - 'scripts/sign-cluster-helpers.sh'
      - 'scripts/stage-swiftpm-resource-bundles.sh'
      - 'scripts/prepare-provider-release-toolchain.sh'
      - 'scripts/prepare-metal-toolchain.py'
      - 'scripts/prepare-app-attest-entitlements.py'
      - 'scripts/install-macos-github-cli.sh'
      - 'scripts/install-release-cmake.sh'
      - 'scripts/fetch-metallib.sh'
      - 'scripts/test-qwen4-packaged-resources.py'
      - 'scripts/verify-prompt-parity.sh'
      - 'scripts/verify-nemotron-prompt-parity.sh'
      - 'scripts/provider-test-shards.py'
      - 'scripts/prepare-mimo-*-fixtures.py'
      - 'scripts/run-provider-tests.sh'
      - 'scripts/run-nested-suite.sh'
      - 'scripts/run-provider-test-watchdog.py'

# One dev-branch release at a time, serialized with itself. The reusable
# workflow's publish job also joins provider-publication-dev.
concurrency:
  group: release-dev-branch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One lane per shard of release-provider.yml's qualify-sdk-shard: the plane
  # grants a lane whole, so each shard takes a free sandbox or falls back
  # alone.
  route:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        qualify-sdk-1 macos_arm64 blacksmith-12vcpu-macos-27
        qualify-sdk-2 macos_arm64 blacksmith-12vcpu-macos-27
        qualify-sdk-3 macos_arm64 blacksmith-12vcpu-macos-27
        qualify-sdk-4 macos_arm64 blacksmith-12vcpu-macos-27
        qualify-sdk-5 macos_arm64 blacksmith-12vcpu-macos-27

  dev:
    # A failed route job must not stop a release: without routes every shard
    # keeps Blacksmith.
    needs: route
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
    # The reusable workflow declares contents: write (gh release create, prod
    # only) and actions: read (download this run's artifacts); a caller must
    # grant at least what it declares.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-provider.yml
    with:
      environment: dev
      routes: ${{ needs.route.outputs.routes }}
    secrets: inherit
