name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  integration-tests:
    name: E2E Integration Tests
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 30
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      TESTBED_PROVIDER_CONFIG: debug
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Extract mlx.metallib
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install 'mlx==0.31.2'
          cp /tmp/mlxvenv/lib/python*/site-packages/mlx/lib/mlx.metallib \
             provider-swift/.build/debug/mlx.metallib

      - name: Download model
        # v0.7.5 one-engine: the testbed default is the smallest
        # CBv2-servable checkpoint (gpt-oss-20b, ~12 GB — the old tiny
        # Qwen/gemma-3 fixtures have no CBv2 adapter and can no longer
        # register). A warm HF cache makes this a no-op; a cold runner
        # pays the download once.
        run: |
          /tmp/mlxvenv/bin/pip install huggingface_hub
          /tmp/mlxvenv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8')"

      - name: Run integration + profile tests
        run: |
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run 'TestIntegration|TestProfile'

  benchmark:
    name: E2E Benchmarks
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    environment: benchmarks
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      TESTBED_PROVIDER_CONFIG: debug
      BENCHMARK_MD_PATH: /tmp/benchmark-results.md
      RUNNER_DESC: macos-15 (M1 Virtual)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Extract mlx.metallib
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install 'mlx==0.31.2'
          cp /tmp/mlxvenv/lib/python*/site-packages/mlx/lib/mlx.metallib \
             provider-swift/.build/debug/mlx.metallib

      - name: Download models
        # Benchmarks serve the CBv2 default (gpt-oss-20b, ~12 GB) plus the
        # secondary multi-model checkpoint (gemma-4-26B QAT, ~14.5 GB) for
        # TestBenchmark_MultiModelMultiProvider. Warm HF cache ⇒ no-op.
        run: |
          /tmp/mlxvenv/bin/pip install huggingface_hub
          /tmp/mlxvenv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8')"
          /tmp/mlxvenv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-26B-A4B-it-qat-4bit')"

      - name: Run benchmarks
        run: |
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run 'TestBenchmark'

      - name: Post benchmark results
        if: always()
        run: |
          if [ ! -f /tmp/benchmark-results.md ]; then
            echo "No benchmark results file found"
            exit 0
          fi
          BODY=$(cat /tmp/benchmark-results.md)
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY" \
            --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
