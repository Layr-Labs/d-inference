name: SDK 27 release preparation

on:
  push:
    branches: [master]
    paths:
      - 'provider-swift/**'
      - 'libs/**'
      - 'coordinator/promptsidecar/**'
      - 'coordinator/promptcontract/**'
      - 'coordinator/cmd/promptfixtureinput/**'
      - 'coordinator/cmd/promptsidecarloadproof/**'
      - 'fixtures/prompt-contract/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/actions/provider-release-build/**'
      - '.github/workflows/provider-release-cache.yml'
      - '.github/workflows/release-swift.yml'
  pull_request:
    paths:
      - '.github/actions/provider-release-build/**'
      - '.github/workflows/release-swift.yml'
      - '.github/workflows/provider-release-cache.yml'
      - 'scripts/provider-release-cache.py'
      - 'scripts/provider_release_cache/**'
      - 'scripts/test-provider-release-cache.py'
      - 'scripts/test-provider-release-pipeline.py'
      - 'scripts/provider-release-swift.sh'
      - 'scripts/prepare-provider-release-toolchain.sh'
      - 'scripts/fetch-metallib.sh'
      - 'scripts/verify-prompt-parity.sh'
      - 'scripts/run-provider-tests.sh'
      - 'provider-swift/Tests/ProviderCoreTests/Qwen4StandaloneAdmissionTests.swift'
  workflow_dispatch:

permissions:
  contents: read

# Let the current warm finish saving reusable objects; only the latest pending
# master revision needs another warm. PR validation writes only its own PR scope.
concurrency:
  group: provider-sdk27-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    name: SDK 27 ${{ matrix.lane }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [release, qualification]
    env:
      MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Warm the same unsigned build used by releases
        id: build
        uses: ./.github/actions/provider-release-build
        with:
          lane: ${{ matrix.lane }}
      - name: Verify unsigned release handoff without signing
        if: matrix.lane == 'release'
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          METALLIB: ${{ steps.build.outputs.metallib }}
        run: |
          set -euo pipefail
          REPORTED=$("$BIN_DIR/darkbloom" --version)
          VERSION=${REPORTED#darkbloom }
          ./scripts/check-release-version.sh "$VERSION" "$REPORTED"
          python3 scripts/provider-signing-validation.py stage \
            --source "$GITHUB_WORKSPACE" --bin "$BIN_DIR" --metallib "$METALLIB" \
            --output "$RUNNER_TEMP/unsigned-roundtrip" --version "$VERSION"
          COPYFILE_DISABLE=1 tar czf "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" -C "$RUNNER_TEMP/unsigned-roundtrip" .
          python3 scripts/provider-signing-validation.py unpack \
            --archive "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" \
            --output "$RUNNER_TEMP/verified-roundtrip" \
            --source-sha "$GITHUB_SHA" --version "$VERSION"
