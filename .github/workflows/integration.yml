name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  integration-tests:
    name: E2E Integration Tests
    runs-on: blacksmith-12vcpu-macos-latest
    # Job budget is the sum of every step's worst case, including the two
    # sequential reverse-compatibility probes. Test allowances:
    # 25m (blocking paged contracts) + 15m (expected-red exact-cache probe)
    # + 10m (default-posture smoke) + 20m (full-network multi-model smoke)
    # + 15m (mixed-version artifact tier)
    # + 30m (reverse lane: two sequential 15m runs) = 115m.
    # Setup/build/download overhead can reach ~35m on a cold runner because
    # this job downloads gpt-oss-20b plus both Gemma fixtures.
    timeout-minutes: 150
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      DARKBLOOM_PROMPT_SIDECAR_BINARY: ${{ github.workspace }}/coordinator/promptsidecar/target/release/promptsidecar
      TESTBED_PROVIDER_CONFIG: debug
      GPT_OSS_REVISION: 773a7da77e569019bb0fd17a554b263738d669a3
      EXACT_CACHE_MODEL_REVISION: 2c3e507453b4f218d05fe3cc97bea5c5a654257e
      GEMMA_REVISION: 0e3cbab38ce568cf6e23543010d08d03b731910c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Build prompt-contract sidecar
        run: cargo build --manifest-path coordinator/promptsidecar/Cargo.toml --release

      - name: Build and stage source-matched mlx.metallib
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || brew install cmake
          METALLIB_CACHE_DIR="$RUNNER_TEMP/metallib-cache" \
            ./scripts/fetch-metallib.sh "$RUNNER_TEMP"
          metallib="$RUNNER_TEMP/mlx.metallib"
          provider_bin=$(cd provider-swift && swift build -c debug --show-bin-path)
          for destination in provider-swift/.build/debug "$provider_bin"; do
            mkdir -p "$destination"
            cp "$metallib" "$destination/mlx.metallib"
          done
          while IFS= read -r macos; do
            cp "$metallib" "$macos/mlx.metallib"
          done < <(
            find provider-swift/.build libs/mlx-swift-lm/.build \
              -type d -path '*.xctest/Contents/MacOS' -print 2>/dev/null
          )

      - name: Install Hugging Face client
        # The blocking/default lanes serve gpt-oss-20b. Exact-cache uses the
        # small Gemma 4 e2b checkpoint, while the explicit full-network lane
        # routes gpt-oss and Gemma 4 26B through one Swift provider. A warm
        # Hugging Face cache makes these downloads no-ops.
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install huggingface_hub

      - name: Download models (protected read-only auth)
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=os.environ.get('HF_TOKEN') or None)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=os.environ.get('HF_TOKEN') or None)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-26B-A4B-it-qat-4bit', revision=os.environ['GEMMA_REVISION'], token=os.environ.get('HF_TOKEN') or None)"

      - name: Download public models (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request: downloading public models without Hugging Face authentication"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-26B-A4B-it-qat-4bit', revision=os.environ['GEMMA_REVISION'], token=False)"

      - name: Pin exact-cache model snapshot selection
        run: |
          /tmp/mlxvenv/bin/python <<'PY'
          import os
          from pathlib import Path

          model_root = (
              Path.home()
              / ".cache/huggingface/hub/models--mlx-community--gemma-4-e2b-it-4bit"
          )
          revision = os.environ["EXACT_CACHE_MODEL_REVISION"]
          selected = model_root / "snapshots" / revision
          if not selected.is_dir():
              raise SystemExit(f"pinned exact-cache snapshot missing: {selected}")
          ref = model_root / "refs" / "main"
          ref.parent.mkdir(parents=True, exist_ok=True)
          ref.write_text(revision + "\n")
          print(f"Pinned exact-cache ref {ref} -> {revision}")
          PY

      # BLOCKING PAGED GATE. The tests here are the retained one-provider
      # cross-language contracts not owned by the default-posture lane below.
      # Pinning both backend and cap prevents `.auto` from silently degrading
      # to contiguous, while the engine-reported expectation proves the
      # requested backend actually reached the Swift engine. Exact-cache is
      # isolated in its own expected-red step; no broad TestIntegration regex
      # is allowed to pull opt-in or coordinator-only tests into this gate.
      - name: Run one-provider integration contracts (paged @ 8 — BLOCKING gate)
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: paged
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # The fleet kill switch is an override rather than a paged failure;
          # it can silently force contiguous even for an explicit selection.
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this gate"
            exit 1
          fi
          expected_tests=(
            TestIntegration_GreedyDeterminism
            TestIntegration_BillingAccounting
            TestIntegration_ConcurrentRequests
            TestIntegration_ProviderMetadata
          )
          echo "KV posture requested: engine_v2_kv_backend=$DARKBLOOM_TESTBED_KV_BACKEND" \
               "engine_v2_max_concurrent=$DARKBLOOM_TESTBED_MAX_CONCURRENT" \
               "DARKBLOOM_CBV2_PAGED_KV=<unset>"
          echo "Backend assertion armed: providers must report" \
               "kv_backend=$DARKBLOOM_TESTBED_EXPECT_KV_BACKEND."
          paged_log="$RUNNER_TEMP/paged-integration.log"
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run '^(TestIntegration_GreedyDeterminism|TestIntegration_BillingAccounting|TestIntegration_ConcurrentRequests|TestIntegration_ProviderMetadata)$' \
            2>&1 | tee "$paged_log"
          for test_name in "${expected_tests[@]}"; do
            run_count=$(grep -c "^=== RUN   ${test_name}$" "$paged_log" || true)
            if [ "$run_count" -lt 1 ]; then
              echo "::error::paged gate did not execute ${test_name}"
              exit 1
            fi
          done

      # EXPECTED RED — because of the FIXTURE, not because of the default.
      # This test runs gemma-4-e2b-it-4bit, and e2b is the one checkpoint
      # where paged ADOPTION is the inexact arm: an adopted paged slot
      # answers differently from its own cold run. e2b appears zero times
      # in the production catalog -- on the two models we do serve, paged
      # adoption is the EXACT arm and contiguous is the one that diverges.
      #
      # STILL RED AFTER THE v0.8.1 FLIP, and deliberately unchanged. The
      # v0.8.0 comment here predicted this: "promote back to blocking when
      # the fixture stops being the exception -- NOT on any further `.auto`
      # change." This lane pins DARKBLOOM_TESTBED_KV_BACKEND=paged
      # EXPLICITLY, so it never read the default in the first place; it
      # still runs e2b on paged and still hits the one adoption path that
      # diverges. `.auto` moving to contiguous changes what the FLEET
      # serves, not what this lane measures.
      #
      # (The v0.8.1 contiguous prefix-cache gate does not reach it either:
      # that gate skips cache construction only on a RESOLVED-contiguous
      # slot, and this lane resolves paged.)
      #
      # EXPECTED RED until the e2b paged adoption path is fixed or this
      # fixture moves to a served model. Kept, pinned, and visible rather
      # than removed: the red IS the finding, and unpinning it would
      # recreate the "gate that cannot fail" pattern this release fixed
      # four separate times.
      #
      # ISOLATED in its own step (v0.8.0 gate audit) so `continue-on-error`
      # covers exactly the one expected-red test instead of the entire paged
      # lane it used to blanket. No DARKBLOOM_TESTBED_EXPECT_KV_BACKEND here:
      # the expectation pre-warms every slot at suite start, and this test's
      # cold-vs-adopted routing semantics are exactly what a pre-warm would
      # perturb — its posture is already pinned by the explicit paged TOML.
      - name: Run exact-cache routing (paged @ 8 — expected red, informational)
        continue-on-error: true
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this lane"
            exit 1
          fi
          echo "Expected-red fixture lane: e2b paged adoption is the known inexact arm."
          exact_cache_log="$RUNNER_TEMP/exact-cache-routing.log"
          set +e
          go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
            -run '^TestIntegrationExactCacheRouting$' \
            2>&1 | tee "$exact_cache_log"
          test_status=${PIPESTATUS[0]}
          set -e
          run_count=$(grep -c '^=== RUN   TestIntegrationExactCacheRouting$' "$exact_cache_log" || true)
          if [ "$run_count" -lt 1 ]; then
            echo "::error::expected-red exact-cache probe matched no test"
            exit 1
          fi
          exit "$test_status"

      # Default-posture lane. The steps above are the only ones that pin a
      # backend, so without this NOTHING would still exercise what a stock
      # install actually does: launch with no `--config` at all, on `.auto`,
      # at the provider's own memberwise cap. That is a different code path
      # from the gate — no TOML is written, no `--config` argument is added,
      # and the config-migration cleanup never engages — so it cannot be
      # inferred from a green paged run.
      #
      # Deliberately UNSET rather than `DARKBLOOM_TESTBED_KV_BACKEND=auto`:
      # naming `auto` would write a TOML and thereby change the launch path
      # and drop the cap to the decoder's 4, testing neither default.
      #
      # `.auto` resolves CONTIGUOUS as of v0.8.1 — that is the release
      # posture and what a stock install serves. This is the ONE lane that
      # reads the default, so it is the one that has to move with it: it was
      # `contiguous` before v0.8.0, `paged` for v0.8.0, and is `contiguous`
      # again now. Keep the expectation equal to the shipped default; a lane
      # that asserts the previous release's default is a lane that fails on
      # every correct build.
      #
      # The expectation is still armed (not dropped) even though contiguous
      # is now also the DEGRADE target, because it catches the opposite
      # drift: a build that resolves paged here would mean the flip did not
      # land in the binary under test. It no longer distinguishes "resolved
      # contiguous" from "degraded to contiguous" — nothing can, once they
      # are the same value — so the thing that pins the difference is the
      # unit gate (`EngineV2KVBackendGateTests`, which asserts a NIL
      # fallback reason on `.auto`), not this lane.
      #
      # This deliberately owns the basic non-streaming and streaming smoke
      # contracts; the paged gate owns the other retained integration tests,
      # so no blocking lane pays for the same test twice.
      - name: Run default-posture smoke (.auto = contiguous — BLOCKING gate)
        env:
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: contiguous
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "this lane must measure the DEFAULT, not a killed paged"
            exit 1
          fi
          if [ -n "${DARKBLOOM_TESTBED_KV_BACKEND:-}" ] || \
             [ -n "${DARKBLOOM_TESTBED_MAX_CONCURRENT:-}" ]; then
            echo "::error::default-posture lane inherited a testbed backend or cap override"
            exit 1
          fi
          expected_tests=(
            TestIntegration_NonStreamingInference
            TestIntegration_StreamingContentValidation
          )
          echo "KV posture requested: provider default (no testbed override;" \
               ".auto resolves contiguous as of v0.8.1)"
          echo "Backend assertion armed: providers must report" \
               "kv_backend=$DARKBLOOM_TESTBED_EXPECT_KV_BACKEND."
          default_log="$RUNNER_TEMP/default-posture.log"
          go test ./e2e/ -count=1 -v -timeout 10m -p=1 \
            -run '^(TestIntegration_NonStreamingInference|TestIntegration_StreamingContentValidation)$' \
            2>&1 | tee "$default_log"
          for test_name in "${expected_tests[@]}"; do
            run_count=$(grep -c "^=== RUN   ${test_name}$" "$default_log" || true)
            if [ "$run_count" -lt 1 ]; then
              echo "::error::default-posture gate did not execute ${test_name}"
              exit 1
            fi
          done

      # Full coordinator -> one real Swift provider -> two real MLX models.
      # The opt-in and both model IDs are scoped to this step. Keeping it
      # separate from the default smoke proves one provider advertises and
      # serves both models without making the second model a hidden local
      # prerequisite for the ordinary integration target.
      - name: Run full-network single-provider multi-model smoke
        env:
          DARKBLOOM_FULL_NETWORK_SMOKE: "1"
          DARKBLOOM_FULL_NETWORK_MODEL_A: mlx-community/gpt-oss-20b-MXFP4-Q8
          DARKBLOOM_FULL_NETWORK_MODEL_B: mlx-community/gemma-4-26B-A4B-it-qat-4bit
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_TESTBED_KV_BACKEND:-}" ] || \
             [ -n "${DARKBLOOM_TESTBED_MAX_CONCURRENT:-}" ] || \
             [ -n "${DARKBLOOM_TESTBED_EXPECT_KV_BACKEND:-}" ]; then
            echo "::error::full-network lane inherited another lane's KV posture"
            exit 1
          fi
          full_network_log="$RUNNER_TEMP/full-network-multi-model.log"
          go test ./e2e/ -count=1 -v -timeout 20m -p=1 \
            -run '^TestIntegration_FullNetworkSingleSwiftProviderMultiModelRouting$' \
            2>&1 | tee "$full_network_log"
          run_count=$(grep -c '^=== RUN   TestIntegration_FullNetworkSingleSwiftProviderMultiModelRouting$' "$full_network_log" || true)
          if [ "$run_count" -lt 1 ]; then
            echo "::error::full-network multi-model smoke matched no test"
            exit 1
          fi

      # The paged env is scoped to the gate STEP on purpose — do not promote it
      # to the job's `env:`. This lane and the reverse one below run RELEASED
      # v0.7.12 binaries, and a job-level setting would make the current
      # testbed hand a v0.7.12 provider a TOML selecting a backend that release
      # does not have.
      #
      # Mixed-version coverage has two explicit tiers and two distinct tests:
      #
      #   artifact — hash-verifies the pinned v0.7.12 executable + metallib
      #              and proves the legacy provider was never booted.
      #   full     — independently verifies the artifact, boots the released
      #              provider, and exercises the compatibility wire surface.
      #
      # This runner is SIP-disabled, so it runs the pure gate contract and can
      # block on the artifact-only test, but it cannot boot the v0.7.12
      # provider. The artifact step must select exactly those two tests. A
      # future SIP-enabled runner must use DARKBLOOM_MIXED_VERSION_EXPECT=full,
      # select exactly TestIntegrationMixedVersionFullV0712Provider, and
      # require MIXED_VERSION_TIER_FULL_LEGACY_BOOT_OK. Do not broaden either
      # tier selector: a skipped or renamed tier must be red rather than
      # silently passing.
      - name: Verify released v0.7.12 provider artifact
        env:
          DARKBLOOM_MIXED_VERSION_EXPECT: artifact
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          echo "Runner SIP state: $(/usr/bin/csrutil status 2>&1 || true)"
          released_provider=$(./scripts/fetch-v0712-provider.sh "$RUNNER_TEMP/released-providers")
          mixed_version_log="$RUNNER_TEMP/mixed-version-artifact.log"
          DARKBLOOM_MIXED_VERSION=1 \
          DARKBLOOM_PROVIDER_BINARY="$released_provider" \
            go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
              -run '^(TestIntegrationMixedVersionGateContract|TestIntegrationMixedVersionArtifactOnlyV0712)$' \
            2>&1 | tee "$mixed_version_log"
          expected_tests=(
            TestIntegrationMixedVersionGateContract
            TestIntegrationMixedVersionArtifactOnlyV0712
          )
          for test_name in "${expected_tests[@]}"; do
            run_count=$(grep -c "^=== RUN   ${test_name}$" "$mixed_version_log" || true)
            if [ "$run_count" -lt 1 ]; then
              echo "::error::mixed-version artifact lane did not execute ${test_name}"
              exit 1
            fi
          done
          marker_count=$(grep -c 'MIXED_VERSION_TIER_ARTIFACT_ONLY_NO_LEGACY_BOOT_OK' "$mixed_version_log" || true)
          if [ "$marker_count" -lt 1 ]; then
            echo "::error::mixed-version artifact lane did not reach" \
                 "MIXED_VERSION_TIER_ARTIFACT_ONLY_NO_LEGACY_BOOT_OK"
            exit 1
          fi

      # Reverse lane: the RELEASED v0.7.12 coordinator against the CANDIDATE
      # provider. Named for v0.7.13 until v0.7.15; the pinned tag below has
      # always been v0.7.12, which is what this actually checks out.
      - name: Verify released v0.7.12 coordinator with candidate provider
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          RELEASED_COORDINATOR="$RUNNER_TEMP/d-inference-v0.7.12"
          git worktree add --detach "$RELEASED_COORDINATOR" v0.7.12
          trap 'git worktree remove --force "$RELEASED_COORDINATOR"' EXIT
          (
            cd "$RELEASED_COORDINATOR"
            for test_name in NonStreamingInference StreamingInference; do
              reverse_log="$RUNNER_TEMP/v0712-reverse-$test_name.log"
              DARKBLOOM_REPO_ROOT="$GITHUB_WORKSPACE" \
              TESTBED_PROVIDER_CONFIG=debug \
              DARKBLOOM_CBV2_MTP=0 \
              DARKBLOOM_PREFIX_CACHE_ALLOW_EPHEMERAL=1 \
              DARKBLOOM_PREFIX_CACHE_TEST_ROOT="$RUNNER_TEMP/v0712-reverse-cache-$test_name" \
                go test ./e2e -count=1 -v -timeout 15m -p=1 \
                  -run "^TestIntegration_${test_name}$" \
                2>&1 | tee "$reverse_log"
              run_count=$(grep -c "^=== RUN   TestIntegration_${test_name}$" "$reverse_log" || true)
              if [ "$run_count" -lt 1 ]; then
                echo "::error::reverse mixed-version lane did not execute TestIntegration_${test_name}"
                exit 1
              fi
            done
          )

  # The E2E Benchmarks job used to live here as a second job. It is gated on
  # the approval-required `benchmarks` environment, which is created on every
  # PR and — measured over this release's 26 PR runs — never approved, so the
  # workflow-level status of "Integration Tests" was permanently `waiting`
  # even when the integration job above had long since completed. The
  # benchmark job now lives in `.github/workflows/benchmarks.yml` so its
  # (deliberate, cost-controlling) approval gate holds only its own workflow
  # open, and this one concludes with the integration job's real result.
