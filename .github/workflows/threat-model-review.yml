name: Threat Model Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  threat-model-review:
    name: Threat Model Review
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Depth 2 so the PR merge commit's first parent (the base tip) is
          # available for the local-diff fallback below.
          fetch-depth: 2

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The API diff 406s on PRs over 20k lines ("diff exceeded the
          # maximum number of lines") — fall back to diffing the checked-out
          # merge commit against its first parent (the base branch tip):
          # the same delta, no size ceiling. The review script truncates
          # per-file/total diff content itself, so a huge diff is safe.
          if ! gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr.diff; then
            echo "gh pr diff failed (likely >20k lines); using local git diff fallback"
            git diff HEAD^1 HEAD > /tmp/pr.diff
          fi
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Install Python dependencies
        run: pip install "anthropic>=0.50.0" pyyaml --quiet

      - name: Run threat model review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 .github/scripts/threat-model-review.py \
            --threat-model docs/threat-model.yaml \
            --diff /tmp/pr.diff \
            --output /tmp/review.md
          echo "Review size: $(wc -c < /tmp/review.md) bytes"

      - name: Post or update PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- threat-model-review -->';
            const body = fs.readFileSync('/tmp/review.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
              core.info(`Created new comment ${created.id}`);
            }
