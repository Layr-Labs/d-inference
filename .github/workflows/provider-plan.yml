name: Provider Plan

# What one CI run tests and where, shared by CI (dev) and CI (master). The
# classifier selects the components a change touches; the tree lookup skips
# every test job when a successful run of the same workflow already tested
# this exact tree (scripts/ci-tested-tree.py); the route asks the Darkbloom
# plane once for every lane of the run (the plane routes a run attempt once),
# the caller's own Linux lanes included.
on:
  workflow_call:
    inputs:
      linux_lanes:
        description: The caller's own route lanes, one per line (darkbloom-route.yml format)
        type: string
        default: ''
    outputs:
      provider:
        description: "'true' when the provider jobs run (selected, and the tree is untested)"
        value: ${{ jobs.components.outputs.provider }}
      cluster:
        value: ${{ jobs.components.outputs.cluster }}
      mimo_audio:
        value: ${{ jobs.components.outputs.mimo_audio }}
      changed_provider:
        description: The classifier's provider selection, before the tree lookup
        value: ${{ jobs.components.outputs.changed_provider }}
      changed_cluster:
        value: ${{ jobs.components.outputs.changed_cluster }}
      changes_result:
        value: ${{ jobs.components.outputs.changes_result }}
      skip:
        description: "'true' when a successful run already tested this tree"
        value: ${{ jobs.tested.outputs.skip }}
      tested_run:
        value: ${{ jobs.tested.outputs.tested_run }}
      tree:
        value: ${{ jobs.tested.outputs.tree }}
      base:
        description: The tested change's base (`push` for a push)
        value: ${{ jobs.tested.outputs.base }}
      head:
        value: ${{ jobs.tested.outputs.head }}
      routes:
        value: ${{ jobs.route.outputs.routes }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/component-changes.yml
    permissions:
      contents: read

  tested:
    name: Find an earlier test of this tree
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
      tested_run: ${{ steps.lookup.outputs.tested_run }}
      tree: ${{ steps.tree.outputs.tree }}
      base: ${{ steps.tree.outputs.base }}
      head: ${{ steps.tree.outputs.head }}
    steps:
      # On a pull request github.sha is its test merge commit of the event's
      # base and head; on a push, the pushed commit. Only the lookup script is
      # checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-tested-tree.py
          sparse-checkout-cone-mode: false
      - name: Name the change this run tests
        id: tree
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'push' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "base=$BASE"
            echo "head=$HEAD"
          } >> "$GITHUB_OUTPUT"
      - name: Look for a successful run that tested it
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          TREE: ${{ steps.tree.outputs.tree }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SELECTED: provider=${{ needs.changes.outputs.provider }},cluster=${{ needs.changes.outputs.cluster }},mimo_audio=${{ needs.changes.outputs.mimo_audio }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/ci-tested-tree.py lookup --repository "$REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" --event "$EVENT" --sha "$SHA" --tree "$TREE" \
            --base "$BASE" --head "$HEAD" --components "$SELECTED" --run-id "$RUN_ID"

  # The components the test jobs run: the classifier's, or none when the tree
  # was tested. A failed lookup has already answered "test".
  components:
    name: Choose the components to test
    needs: [changes, tested]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      provider: ${{ steps.choose.outputs.provider }}
      cluster: ${{ steps.choose.outputs.cluster }}
      mimo_audio: ${{ steps.choose.outputs.mimo_audio }}
      changed_provider: ${{ needs.changes.outputs.provider }}
      changed_cluster: ${{ needs.changes.outputs.cluster }}
      changes_result: ${{ needs.changes.result }}
    steps:
      - name: Choose the components to test
        id: choose
        env:
          SKIP: ${{ needs.tested.outputs.skip }}
          PROVIDER: ${{ needs.changes.outputs.provider }}
          CLUSTER: ${{ needs.changes.outputs.cluster }}
          MIMO_AUDIO: ${{ needs.changes.outputs.mimo_audio }}
        run: |
          if [ "$SKIP" = true ]; then PROVIDER=false CLUSTER=false MIMO_AUDIO=false; fi
          {
            echo "provider=$PROVIDER"
            echo "cluster=$CLUSTER"
            echo "mimo_audio=$MIMO_AUDIO"
          } >> "$GITHUB_OUTPUT"

  # Chooses a Darkbloom Sandbox or the Blacksmith fallback for the macOS jobs
  # of provider-tests.yml. This table is the one place that names each job's
  # lane and size. A lane is granted whole or falls back whole, so each job
  # (each shard) has a lane of its own and falls back alone, except where two
  # shards share one lane with a count of 2: the two Cluster Focused Checks
  # shards, Cluster Runtime Tests shards 2 and 3 (test-cluster-2) and shards
  # 4 and 5 (test-cluster-3). A lane asks for a job only when the job runs.
  # The two Cluster GPU Tests shards are not routed: shard 2 uses 42 GiB, more
  # than any signed size, and one lane carries one size for both shards. They
  # run on blacksmith-12vcpu-macos-27.
  #
  # Sizes (<vCPUs>x<GiB>) are sent only while DARKBLOOM_JOB_SHAPES is `on`
  # (darkbloom-route.yml). A job asks for the smallest signed size (4x16,
  # 4x24, 8x16, 12x32) that holds 1.25 times its sampled used memory (app +
  # wired + compressed, scripts/ci-resource-sampler.py) and on which it is at
  # most 5% slower than on 12 vCPUs; a lane that two shards share holds the
  # larger. There are two exceptions. Cluster runtime shard 2 used up to
  # 29.3 GiB (the Metal memory of the GLM-5.3 paged KV tests): 12x32, the
  # largest size, holds it with a smaller margin. Build cluster
  # test products and Cluster Release Build Checks ask for 8x16, on which a
  # cold build is 5 to 10% slower. The sampled memory of each job is in
  # docs/developer/build.md (Job sizes).
  #
  # While sizes are off, the 9 blocking test jobs ask without a size, as
  # before. The build jobs and Cluster Release Build Checks are `required`:
  # while sizes are off they keep Blacksmith without asking. The lanes are in
  # the order the DARKBLOOM_MACOS_LANES cap keeps them: the critical-path test
  # shards first, then the `required` jobs.
  route:
    needs: [tested, components]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        ${{ inputs.linux_lanes }}
        test-cluster-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.cluster == 'true' && 2 || 0 }} 12x32
        test-cluster-3 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.cluster == 'true' && 2 || 0 }} 4x24
        test-cluster-focused macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.cluster == 'true' && 2 || 0 }} 4x16
        test-provider-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.provider == 'true' && 1 || 0 }} 4x24
        test-cluster-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.cluster == 'true' && 1 || 0 }} 4x16
        test-provider-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.provider == 'true' && 1 || 0 }} 4x16
        build-cluster macos_arm64 blacksmith-12vcpu-macos-27 ${{ (needs.components.outputs.cluster == 'true' || (github.event_name == 'push' && needs.tested.outputs.skip == 'true' && needs.components.outputs.changed_cluster == 'true')) && 1 || 0 }} 8x16 required
        build-provider macos_arm64 blacksmith-12vcpu-macos-27 ${{ (needs.components.outputs.provider == 'true' || (github.event_name == 'push' && needs.tested.outputs.skip == 'true' && needs.components.outputs.changed_provider == 'true')) && 1 || 0 }} 12x32 required
        cluster-release-checks macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.components.outputs.cluster == 'true' && 1 || 0 }} 8x16 required
