name: Bug report
description: Report a defect in the provider, native runtime, installer, or landing site
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster we can fix it.

        Before filing, please search [existing issues](https://github.com/Layr-Labs/d-inference/issues?q=is%3Aissue) to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - provider-swift (Swift CLI)
        - native runtime / MLX
        - landing (Next.js)
        - enclave (Swift Secure Enclave helper)
        - CI / provider release
        - docs
        - not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error messages or unexpected output.
      placeholder: e.g. provider crashed with X after running `darkbloom start` on a fresh M2 Air
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Install the provider via the install.sh one-liner
        2. Run `darkbloom start`
        3. Describe the request or local operation that fails
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Anything relevant to reproducing this: provider version (`darkbloom --version`), macOS version, Mac model + RAM, browser (for landing bugs), etc.
      placeholder: |
        - provider: v0.3.5
        - macOS: 15.4 (Sequoia)
        - hardware: MacBook Pro M3 Pro, 36 GB
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant provider log output. Use code fences and redact prompts, completions, credentials, and other sensitive data.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
