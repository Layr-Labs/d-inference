name: Bisect release shard-2 SIGBUS

# TEMPORARY, never merged. Runs the release SDK 27 qualification build (the
# provider-release-build action, as release-provider.yml qualify-sdk-shard
# does) and then one subset of the failing shard-2 selection of dev 70b2f6dc9
# (run 41704012078), always with ProviderCoreTests.Qwen4PagingPrefixIntegrationTests.

on:
  pull_request:
    branches: [bisect-base/release-sigbus]

permissions:
  contents: read

env:
  DEVELOPER_ID: 'Developer ID Application: Eigen Labs, Inc. (SLDQ2GJ6TL)'
  APPLE_TEAM_ID: 'SLDQ2GJ6TL'
  FAN_HELPER_NAME: 'darkbloom-fan-helper'
  FAN_HELPER_ID: 'io.darkbloom.fan-helper'
  MIN_MACOS: '14.0'
  MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'

jobs:
  bisect:
    name: Bisect (${{ matrix.name }})
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wedge-confirmed
            filter: '^(ProviderCoreTests[./]NemotronSuperManagedSlotTests/confirmedWedgeRetiresTheSlotOffTheCapacityTick|ProviderCoreTests[./]Qwen4PagingPrefixIntegrationTests)([./(]|$)'
            skip: ''
          - name: wedge-both
            filter: '^(ProviderCoreTests[./]NemotronSuperManagedSlotTests/(confirmedWedgeRetiresTheSlotOffTheCapacityTick|wedgedRetirementPastItsBoundIsARetainedFault)|ProviderCoreTests[./]Qwen4PagingPrefixIntegrationTests)([./(]|$)'
            skip: ''
    env:
      DARKBLOOM_RELEASE_ENVIRONMENT: prod
      BISECT_NAME: ${{ matrix.name }}
      BISECT_FILTER: ${{ matrix.filter }}
      BISECT_SKIP: ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: ./.github/actions/provider-release-build
        with:
          lane: qualification
          environment: dev
          shard: 1/5
      - name: Collect crash reports
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/crash"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] && find "$d" -type f -mmin -90 \( -name '*.ips' -o -name '*.crash' \) -exec cp {} "$RUNNER_TEMP/crash/" \; || true
          done
          ls -la "$RUNNER_TEMP/crash"
          for f in "$RUNNER_TEMP"/crash/*; do [ -f "$f" ] && head -c 20000 "$f"; done || true
      - name: Retain crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bisect-crash-${{ matrix.name }}
          path: ${{ runner.temp }}/crash
          if-no-files-found: ignore
