name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/component-changes.yml
    permissions:
      contents: read

  integration-tests:
    name: E2E Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: blacksmith-12vcpu-macos-27
    # Job budget = the sum of every step's worst case, not the warm-path wall
    # time. Test allowances: 25m (blocking paged lane) + 15m (blocking
    # exact-cache lane) + 10m (default-posture smoke) = 50m. Setup/build/
    # download overhead: ~3m warm, but a cold runner pays the full Swift
    # provider build, the cargo sidecar build, and the gpt-oss-20b (~12 GB)
    # + gemma-4 snapshot downloads — budget 25m. 50m + 25m = 75m.
    # Coverage: each lane builds its test binary with `-cover`, and a report
    # and upload step runs at the end. That adds about a minute, which fits in
    # the 25m overhead budget. The per-lane test timeouts do not change.
    timeout-minutes: 75
    env:
      LC_ALL: en_US.UTF-8
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      DARKBLOOM_PROMPT_SIDECAR_BINARY: ${{ github.workspace }}/coordinator/promptsidecar/target/release/promptsidecar
      TESTBED_PROVIDER_CONFIG: debug
      GPT_OSS_REVISION: 773a7da77e569019bb0fd17a554b263738d669a3
      EXACT_CACHE_MODEL_REVISION: 2c3e507453b4f218d05fe3cc97bea5c5a654257e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      - name: Install pinned Rust toolchain
        run: ./scripts/install-release-rust.sh
      - name: Install pinned CMake
        run: ./scripts/install-release-cmake.sh
      - name: Prepare source-matched Metal compiler
        run: python3 scripts/prepare-metal-toolchain.py

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      # Statement coverage of the coordinator code that the e2e tests run.
      # The testbed serves the coordinator in the test process
      # (e2e/testbed/suite.go calls api.NewServer), so `go test -coverpkg`
      # counts it. The package list leaves out the test-only `tests`,
      # `testkit` and `testdb` packages, as scripts/run-coordinator-tests.py
      # does. Each lane runs with `-covermode=set`: it stores 1 per block and
      # is the cheapest mode, so the TestProfile latency checks see the least
      # extra work.
      - name: Select e2e coverage packages
        run: |
          set -euo pipefail
          packages=$(go list ./coordinator/... | grep -Ev '/(tests|testkit|testdb)(/|$)' | paste -sd, -)
          test -n "$packages"
          echo "E2E_COVER_PKG=$packages" >> "$GITHUB_ENV"

      - name: Set up Homebrew
        run: ./scripts/setup-macos-homebrew.sh
      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Build prompt-contract sidecar
        run: cargo build --manifest-path coordinator/promptsidecar/Cargo.toml --release

      - name: Build and stage source-matched mlx.metallib
        run: |
          set -euo pipefail
          cmake --version
          METALLIB_CACHE_DIR="$RUNNER_TEMP/metallib-cache" \
            ./scripts/fetch-metallib.sh "$RUNNER_TEMP"
          metallib="$RUNNER_TEMP/mlx.metallib"
          provider_bin=$(cd provider-swift && swift build -c debug --show-bin-path)
          for destination in provider-swift/.build/debug "$provider_bin"; do
            mkdir -p "$destination"
            cp "$metallib" "$destination/mlx.metallib"
          done
          while IFS= read -r macos; do
            cp "$metallib" "$macos/mlx.metallib"
          done < <(
            find provider-swift/.build libs/mlx-swift-lm/.build \
              -type d -path '*.xctest/Contents/MacOS' -print 2>/dev/null
          )

      - name: Install Hugging Face client
        # v0.7.5 one-engine: the testbed default is the smallest
        # CBv2-servable checkpoint (gpt-oss-20b, ~12 GB — the old tiny
        # Qwen/gemma-3 fixtures have no CBv2 adapter and can no longer
        # register). Exact-cache routing additionally uses the small Gemma 4
        # checkpoint because GPT-OSS's dynamic-date template is cold-only.
        # A warm HF cache makes these downloads no-ops.
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install huggingface_hub

      - name: Download model (protected read-only auth)
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=os.environ.get('HF_TOKEN') or None)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=os.environ.get('HF_TOKEN') or None)"

      - name: Download public model (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request: downloading public model without Hugging Face authentication"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=False)"

      - name: Pin exact-cache model snapshot selection
        run: |
          /tmp/mlxvenv/bin/python <<'PY'
          import os
          from pathlib import Path

          snapshots = (
              Path.home()
              / ".cache/huggingface/hub/models--mlx-community--gemma-4-e2b-it-4bit/snapshots"
          )
          selected = snapshots / os.environ["EXACT_CACHE_MODEL_REVISION"]
          if not selected.is_dir():
              raise SystemExit(f"pinned exact-cache snapshot missing: {selected}")
          for candidate in snapshots.iterdir():
              if candidate.is_dir():
                  os.utime(candidate, (1, 1))
          os.utime(selected, None)
          print(f"Pinned exact-cache snapshot: {selected.name}")
          PY

      # THE PAGED GATE — BLOCKING. Pinned to an EXPLICIT paged posture, not
      # left on the provider's default, because `.auto` is ALLOWED to degrade:
      # a paged preflight, capacity-planning or pool-construction failure
      # silently lands an `.auto` slot on contiguous and the suite still
      # passes. That made this job green whether or not paged ever ran.
      #
      # `EngineV2KVBackendPolicy.degradesPagedFailure` returns false for an
      # explicit `.paged` selection: it REFUSES the load with
      # `EngineV2ProductionError.pagedUnavailable` instead of degrading. So a
      # paged regression that trips that path now fails this step rather than
      # quietly swapping the system under test.
      #
      # The cap is pinned WITH the backend and not inherited. An unnamed cap
      # seats the provider on its own default, which v0.8.1 reverted to 4 along
      # with the contiguous KV default. Paged at B=4 measures 0.98x of
      # contiguous against 1.17x at B=8, so setting the backend alone would
      # have bought the B=1 regression and none of the throughput. This lane
      # pins 8 explicitly, so the concurrency revert does not move it.
      #
      # DARKBLOOM_TESTBED_EXPECT_KV_BACKEND closes the last construction-side
      # hole: after the providers register, the testbed pre-warms each
      # advertised slot and asserts the ENGINE-REPORTED `kv_backend` on the
      # heartbeat equals the lane's declared backend, failing the suite when
      # it does not. Explicit-paged refusal covers the load path; the
      # expectation covers everything else (a future degrade path, a testbed
      # regression that stops writing the TOML, the wrong binary under test).
      #
      # Both paged lanes are blocking. Exact-cache runs separately because it
      # controls cold loading and donation before checking reuse.
      - name: Run integration + profile tests (paged @ 8 — BLOCKING gate)
        id: paged
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: paged
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # The one silent hole an explicit paged selection does NOT close: the
          # fleet kill switch is an override, not a failure, so it degrades
          # without refusing. Fail loudly rather than measure contiguous.
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this gate"
            exit 1
          fi
          echo "KV posture requested: engine_v2_kv_backend=$DARKBLOOM_TESTBED_KV_BACKEND" \
               "engine_v2_max_concurrent=$DARKBLOOM_TESTBED_MAX_CONCURRENT" \
               "DARKBLOOM_CBV2_PAGED_KV=<unset>"
          echo "Backend assertion armed: the testbed fails any suite whose" \
               "providers do not report kv_backend=$DARKBLOOM_TESTBED_EXPECT_KV_BACKEND."
          covdir="$RUNNER_TEMP/e2e-coverage/paged"
          mkdir -p "$covdir"
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -cover -covermode=set -coverpkg="$E2E_COVER_PKG" \
            -run 'TestIntegration|TestProfile' \
            -skip '^TestIntegrationExactCacheRouting$' \
            -args -test.gocoverdir="$covdir"

      # Use the same pinned e2b artifact and assert exact cached output. The
      # fixture explicitly enables SSD caching and establishes repeat demand
      # before requiring a donation. No pre-warm assertion here: the test owns
      # loading order, while the explicit paged TOML keeps the backend pinned.
      - name: Run exact-cache routing (paged @ 8 — BLOCKING gate)
        id: exact_cache
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this lane"
            exit 1
          fi
          echo "Exact-cache gate: cold, donation, reuse, isolation and recovery must pass."
          covdir="$RUNNER_TEMP/e2e-coverage/exact-cache"
          mkdir -p "$covdir"
          go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
            -cover -covermode=set -coverpkg="$E2E_COVER_PKG" \
            -run '^TestIntegrationExactCacheRouting$' \
            -args -test.gocoverdir="$covdir"

      # Default-posture lane. The steps above are the only ones that pin a
      # backend, so without this NOTHING would still exercise what a stock
      # install actually does: launch with no `--config` at all, on `.auto`,
      # at the provider's own memberwise cap. That is a different code path
      # from the gate — no TOML is written, no `--config` argument is added,
      # and the config-migration cleanup never engages — so it cannot be
      # inferred from a green paged run.
      #
      # Deliberately UNSET rather than `DARKBLOOM_TESTBED_KV_BACKEND=auto`:
      # naming `auto` would write a TOML and thereby change the launch path
      # and drop the cap to the decoder's 4, testing neither default.
      #
      # `.auto` resolves CONTIGUOUS as of v0.8.1 — that is the release
      # posture and what a stock install serves. This is the ONE lane that
      # reads the default, so it is the one that has to move with it: it was
      # `contiguous` before v0.8.0, `paged` for v0.8.0, and is `contiguous`
      # again now. Keep the expectation equal to the shipped default; a lane
      # that asserts the previous release's default is a lane that fails on
      # every correct build.
      #
      # The expectation is still armed (not dropped) even though contiguous
      # is now also the DEGRADE target, because it catches the opposite
      # drift: a build that resolves paged here would mean the flip did not
      # land in the binary under test. It no longer distinguishes "resolved
      # contiguous" from "degraded to contiguous" — nothing can, once they
      # are the same value — so the thing that pins the difference is the
      # unit gate (`EngineV2KVBackendGateTests`, which asserts a NIL
      # fallback reason on `.auto`), not this lane.
      #
      # COST, honestly: this is a second provider boot plus a second
      # gpt-oss-20b load (warm HF cache, but the weights still page in) for
      # two inference round-trips, budgeted 10m. The full job arithmetic
      # (50m of test allowances plus cold setup overhead) lives on
      # `timeout-minutes` at the top of the job.
      - name: Run default-posture smoke (.auto = contiguous — BLOCKING gate)
        id: smoke
        env:
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: contiguous
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "this lane must measure the DEFAULT, not a killed paged"
            exit 1
          fi
          echo "KV posture requested: provider default (no testbed override;" \
               ".auto resolves contiguous as of v0.8.1)"
          echo "Backend assertion armed: a stock install that resolves paged" \
               "fails this gate via DARKBLOOM_TESTBED_EXPECT_KV_BACKEND=contiguous."
          covdir="$RUNNER_TEMP/e2e-coverage/smoke"
          mkdir -p "$covdir"
          go test ./e2e/ -count=1 -v -timeout 10m -p=1 \
            -cover -covermode=set -coverpkg="$E2E_COVER_PKG" \
            -run '^TestIntegration_(NonStreaming|Streaming)Inference$' \
            -args -test.gocoverdir="$covdir"

      # Report-only. A low number never fails the job. The step fails when a
      # lane passed but wrote no coverage data, because then the flags above
      # were lost, and when the merged data has no coordinator total. A lane
      # that failed or was skipped is listed and left out. The unit-test
      # number comes from a different workflow (ci.yml) on a Linux runner, so
      # this row is reported on its own and not merged.
      - name: Report e2e coverage
        if: ${{ !cancelled() }}
        env:
          PAGED_OUTCOME: ${{ steps.paged.outcome }}
          EXACT_CACHE_OUTCOME: ${{ steps.exact_cache.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e2e-coverage"
          inputs=()
          lanes=""
          missing=0
          for entry in "paged:$PAGED_OUTCOME" "exact-cache:$EXACT_CACHE_OUTCOME" "smoke:$SMOKE_OUTCOME"; do
            lane="${entry%%:*}"
            outcome="${entry#*:}"
            if compgen -G "$root/$lane/covcounters.*" >/dev/null; then
              inputs+=("$root/$lane")
              lanes="${lanes:+$lanes, }$lane ($outcome)"
            elif [ "$outcome" = "success" ]; then
              echo "::error::lane $lane passed but wrote no coverage data"
              missing=1
            else
              echo "Lane $lane has no coverage data (step outcome: ${outcome:-not run})"
            fi
          done
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "No e2e coverage data to report."
            exit "$missing"
          fi
          merged="$root/e2e-coverage.out"
          go tool covdata textfmt -i="$(IFS=,; echo "${inputs[*]}")" -o "$merged"
          statements=$(scripts/coordinator-statement-coverage.sh \
            "$merged" "$root/e2e-coverage-coordinator.out")
          echo "Coordinator (Go) e2e statement coverage: $statements"
          {
            echo "| Component | Statements or Lines | Regions or Branches | Functions | Target |"
            echo "|---|---|---|---|---|"
            echo "| Coordinator (Go), e2e | $statements statements | not reported | not reported | none (report-only) |"
            echo
            echo "Denominator: statements in the \`coordinator/...\` production packages that the \`e2e\` test binary links. The \`coordinator/tests/...\` packages and their helpers are not instrumented, and packages the binary does not link (for example \`cmd/...\`) are not counted. Lanes merged: $lanes."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$missing"

      - name: Upload e2e coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinator-e2e-coverage
          path: ${{ runner.temp }}/e2e-coverage/
          if-no-files-found: warn
          retention-days: 14

  # The E2E Benchmarks job used to live here as a second job. It is gated on
  # the approval-required `benchmarks` environment, which is created on every
  # PR and — measured over this release's 26 PR runs — never approved, so the
  # workflow-level status of "Integration Tests" was permanently `waiting`
  # even when the integration job above had long since completed. The
  # benchmark job now lives in `.github/workflows/benchmarks.yml` so its
  # (deliberate, cost-controlling) approval gate holds only its own workflow
  # open, and this one concludes with the integration job's real result.
