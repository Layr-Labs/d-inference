name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test-coordinator:
    name: Coordinator Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_USER: testbed
          POSTGRES_PASSWORD: testbed
          POSTGRES_DB: testbed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testbed -d testbed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Run tests
        env:
          DATABASE_URL: postgres://testbed:testbed@127.0.0.1:5432/testbed?sslmode=disable
        run: go test -race $(go list ./... | grep -v /e2e)
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

  lint-coordinator:
    name: Coordinator Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run

  test-coordinator-rust:
    name: Rust Coordinator Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_USER: rust_coord
          POSTGRES_PASSWORD: rust_coord
          POSTGRES_DB: rust_coord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rust_coord -d rust_coord"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://rust_coord:rust_coord@127.0.0.1:5432/rust_coord?sslmode=disable
      DARKBLOOM_TEST_DATABASE_URL: postgres://rust_coord:rust_coord@127.0.0.1:5432/rust_coord?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Fetch locked dependencies
        working-directory: coordinator-rs
        run: cargo fetch --locked
      - name: Prepare PostgreSQL schema for SQLx
        run: go run ./coordinator/cmd/migrate -database-url "$DATABASE_URL"
      - name: Check SQLx offline metadata
        working-directory: coordinator-rs
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
          cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Check formatting
        working-directory: coordinator-rs
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: coordinator-rs
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        working-directory: coordinator-rs
        run: cargo test --workspace --all-features --locked
      - name: Build all targets
        working-directory: coordinator-rs
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Check dependency policy
        working-directory: coordinator-rs
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check advisories bans licenses sources
      - name: Verify Go-to-Rust NaCl compatibility
        run: go test ./coordinator/internal/e2e -run '^TestCrossLanguageEncryption$' -count=1

  test-provider:
    name: Provider Tests
    runs-on: blacksmith-12vcpu-macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-
      - name: Build provider-swift (incl. tests)
        working-directory: provider-swift
        # Build the TEST bundle too, so the .xctest bundle exists before we
        # place the metallib next to its runner binary (see next step).
        run: |
          swift build --build-tests
          # The root helper is a separately packaged executable product and is
          # not guaranteed to be linked merely because the test bundle builds.
          swift build --product darkbloom-fan-helper
      - name: Extract mlx.metallib
        working-directory: provider-swift
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install 'mlx==0.31.2'
          metallib="/tmp/mlxvenv/lib/python$(/tmp/mlxvenv/bin/python -c 'import sys;print(f"{sys.version_info.major}.{sys.version_info.minor}")')/site-packages/mlx/lib/mlx.metallib"
          # MLX's C++ loader (device.cpp load_default_library) searches for the
          # metallib COLOCATED WITH THE RUNNING BINARY. Under `swift test` the
          # running binary is the xctest runner INSIDE the .xctest bundle, so a
          # copy in .build/debug alone is not found — it must sit next to the
          # runner. Place it in both locations to cover `swift run`/built-binary
          # paths and the test runner. Fail loudly if the source isn't there.
          test -f "$metallib" || { echo "::error::mlx.metallib not found at $metallib"; exit 1; }
          cp "$metallib" "$RUNNER_TEMP/mlx.metallib"
          cp "$metallib" .build/debug/mlx.metallib
          for bundle in .build/debug/*PackageTests.xctest; do
            macos="$bundle/Contents/MacOS"
            if [ -d "$macos" ]; then
              cp "$metallib" "$macos/mlx.metallib"
              echo "placed metallib in $macos"
            fi
          done
      - name: Run Swift tests
        working-directory: provider-swift
        # NOTE: do NOT pass --build-tests-relinking flags; the bundle is already
        # built above, so `swift test` reuses it (and our colocated metallib).
        run: swift test
      - name: Build nested paged safety tests
        working-directory: libs/mlx-swift-lm
        # Cold builds compile the full Cmlx C++/Metal tree (~20 min on the
        # 12-vcpu runner); warm runs restore libs/mlx-swift-lm/.build from
        # the SwiftPM cache and finish in ~1 min.
        timeout-minutes: 35
        run: swift build --build-tests
      - name: Run nested paged safety tests directly
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/mlx.metallib" .build/debug/mlx.metallib
          for bundle in .build/debug/*PackageTests.xctest; do
            macos="$bundle/Contents/MacOS"
            if [ -d "$macos" ]; then
              cp "$RUNNER_TEMP/mlx.metallib" "$macos/mlx.metallib"
            fi
          done
          swift test --skip-build --filter CBv2PagedSafetyTests
      - name: Run atomic installer artifact tests
        timeout-minutes: 2
        run: ./scripts/test-install-atomic.sh

  cache-swift:
    name: Swift Build + Cache
    runs-on: blacksmith-12vcpu-macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-
      - name: Build provider-swift
        working-directory: provider-swift
        run: |
          swift build -c release --product darkbloom
          swift build -c release --product darkbloom-fan-helper
      - name: Build nested mlx-swift-lm tests (warms nested cache)
        working-directory: libs/mlx-swift-lm
        # The test-provider job runs CBv2PagedSafetyTests from this nested
        # .build; saving it here keeps that lane warm across PRs.
        timeout-minutes: 35
        run: swift build --build-tests
      - name: Save SwiftPM cache
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}

  lint-console:
    name: Console UI Lint & Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console-ui/package-lock.json
      - name: Install dependencies
        run: cd console-ui && npm ci
      - name: Lint
        run: cd console-ui && npx eslint src/
      - name: Build
        run: cd console-ui && npm run build
