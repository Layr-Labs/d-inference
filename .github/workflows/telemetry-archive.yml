name: Telemetry archive
on:
  pull_request:
    paths:
      - 'scripts/telemetry_archive/**'
      - '.github/workflows/telemetry-archive.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/telemetry_archive/**'
      - '.github/workflows/telemetry-archive.yml'
permissions:
  contents: read
jobs:
  archive-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: archive-test-only
          POSTGRES_DB: archive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.10.9
      - name: Test lossless archive and catalog publication
        working-directory: scripts/telemetry_archive
        env:
          TEST_ARCHIVE_DATABASE_URL: postgresql://archive:archive-test-only@127.0.0.1:5432/archive_test
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q
