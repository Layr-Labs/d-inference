name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Only revisions of the same PR supersede each other; pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/component-changes.yml
    permissions:
      contents: read

  release-integrity:
    name: Release Integrity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source, fallback, and installer parity
        run: |
          ./scripts/check-release-version.sh
          python3 scripts/test-provider-release-resolution.py
          python3 scripts/test-provider-release-resume.py
          python3 scripts/test-provider-release-toolchain.py
          python3 scripts/test-provider-release-cache.py
          python3 scripts/test-prepare-metal-toolchain.py
          python3 scripts/test-provider-release-pipeline.py
          python3 scripts/test-provider-release-publication.py
          python3 scripts/test-provider-signing-validation.py
          python3 scripts/test-provider-test-watchdog.py
          python3 scripts/test-stage-test-metallib.py
          python3 scripts/test-provider-ci-cache.py
          python3 scripts/test-provider-ci-workflow.py
          python3 scripts/test-integration-ci-workflow.py
          python3 scripts/test-ci-component-paths.py
          python3 scripts/test-app-attest-entitlements.py
          ./scripts/sync-install-embed.sh check
          ./scripts/test-prod-env-refresh.sh
          ./scripts/test-setup-macos-homebrew.sh
      - name: Test startup observer against local stubs
        run: python3 -m unittest discover -s scripts/startup_measurement -t scripts -p 'test_*.py'
      - name: Test advisory threat review with local HTTP fixtures
        run: |
          python3 .github/scripts/test-threat-model-review.py
          python3 .github/scripts/test-threat-full-scan.py
          python3 .github/scripts/test-threat-ensemble.py
          python3 .github/scripts/test-threat-budget.py
      - name: Test native GPU CI routing without a GPU
        run: python3 scripts/test-native-gpu-ci.py
      - name: Test bounded MiMo provider fixture provisioning offline
        run: python3 scripts/test-prepare-mimo-provider-fixtures.py
      - name: Test serving qualification evidence and catalogs without a GPU
        run: python3 -m unittest discover -s scripts/serving_performance -t scripts -p 'test_*.py'

  docs:
    name: Docs Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Frozen source links require committed document provenance.
      - name: Initialize pinned SDK documentation
        run: git submodule update --init --depth 1 libs/mlx-swift-lm
      - name: Test historical source-link validation
        run: python3 scripts/test-docs-check-historical-links.py
      - name: Test date-only freshness stamping
        run: python3 scripts/test-docs-stamp.py
      - name: Check freshness stamps, links, cited paths, orphans
        run: ./scripts/docs-check.sh

  test-coordinator:
    name: Coordinator Tests
    needs: changes
    if: ${{ needs.changes.outputs.coordinator == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testbed
          POSTGRES_PASSWORD: testbed
          POSTGRES_DB: testbed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testbed -d testbed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Check adversarial numeric parsing without instrumentation
        run: go test -race=false -cover=false ./coordinator/tests/api/inference/request -run '^TestConstrainedExactNonnegativeIntBoundsAdversarialLiterals$' -count=1
      - name: Test coordinator runner guards
        run: python3 scripts/test-coordinator-tests.py
      - name: Run tests
        env:
          DATABASE_URL: postgres://testbed:testbed@127.0.0.1:5432/testbed?sslmode=disable
        run: |
          # Word splitting is the point here: one argument per package path,
          # and Go package paths contain no spaces. Only the top-level e2e
          # integration package is excluded (it needs a real Swift provider,
          # see integration.yml); coordinator/internal/e2e and e2e/testbed/...
          # are ordinary unit tests and run here.
          packages=$(go list ./...)
          packages=$(printf '%s\n' "$packages" | grep -vx 'github.com/eigeninference/d-inference/e2e')
          test -n "$packages"
          # shellcheck disable=SC2086
          python3 scripts/run-coordinator-tests.py --race \
            --jobs 8 \
            --coverprofile "$RUNNER_TEMP/coverage.out" \
            --output-dir "$RUNNER_TEMP/coordinator-tests" \
            $packages
      - name: Upload coordinator test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinator-test-timings
          path: |
            ${{ runner.temp }}/coordinator-tests/**/*.json
            ${{ runner.temp }}/coordinator-tests/**/*.jsonl
            ${{ runner.temp }}/coordinator-tests/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Check formatting
        run: |
          set -o pipefail
          # Dated report evidence preserves the exact captured source bytes.
          # Check tracked Go source outside that immutable archive.
          UNFORMATTED=$(git ls-files -z -- '*.go' ':!:docs/reports/evidence/**' | xargs -0 gofmt -l --)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Report coverage
        run: |
          set -o pipefail
          # A profile with only its "mode:" line measured nothing.
          if [ "$(wc -l < "$RUNNER_TEMP/coverage.out")" -le 1 ]; then
            echo "coverage.out has no coverage data"
            exit 1
          fi
          # The runner passes -coverpkg, so tests in coordinator/tests credit
          # the production packages they run. The profile also holds
          # e2e/testbed and a frozen docs evidence package. The reported
          # number counts coordinator packages only.
          scoped="$RUNNER_TEMP/coverage-coordinator.out"
          head -n 1 "$RUNNER_TEMP/coverage.out" > "$scoped"
          if ! grep '^github.com/eigeninference/d-inference/coordinator/' "$RUNNER_TEMP/coverage.out" >> "$scoped"; then
            echo "coverage.out has no coordinator rows"
            exit 1
          fi
          statements=$(go tool cover -func="$scoped" | awk '$1 == "total:" && $2 == "(statements)" {print $3}')
          if ! [[ "$statements" =~ ^[0-9]+(\.[0-9]+)?%$ ]]; then
            echo "Missing statement coverage: '$statements'"
            exit 1
          fi
          echo "Coordinator (Go) statement coverage: $statements"
          {
            echo "| Component | Statements or Lines | Regions or Branches | Functions | Target |"
            echo "|---|---|---|---|---|"
            echo "| Coordinator (Go) | $statements statements | not reported | not reported | 80% (report-only) |"
            echo
            echo "Denominator: statements in the \`coordinator/...\` production packages, from the test run above. The runner instruments them in every test binary with \`-coverpkg\`, so the tests in \`coordinator/tests/\` credit the code they run. The top-level \`e2e\` package does not run here, and \`e2e/testbed/...\` and a frozen docs evidence package are left out."
            echo
            echo "Excluded: \`_test.go\` files, the \`coordinator/tests/...\` packages and their helpers, and generated code (there is none); \`go test\` has no branch counters, so only statements are reported."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinator-coverage
          path: ${{ runner.temp }}/coverage.out
          if-no-files-found: error
          retention-days: 14

  lint-coordinator:
    name: Coordinator Lint
    needs: changes
    if: ${{ needs.changes.outputs.coordinator == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run

  test-prompt-sidecar:
    name: Prompt Sidecar Tests
    needs: changes
    if: ${{ needs.changes.outputs.sidecar == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.88.0
      - name: Verify MiMo fixture setup without network
        run: python3 scripts/test-prepare-mimo-prompt-fixtures.py
      - name: Prepare pinned public MiMo metadata and original corpus
        run: python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$GITHUB_ENV"
      - name: Check formatting, lint, and tests
        working-directory: coordinator/promptsidecar
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Verify static Linux container build
        run: docker build --platform=linux/amd64 --target prompt-sidecar-builder -t darkbloom-prompt-sidecar-ci -f coordinator/Dockerfile .
      - name: Prove production Linux sidecar under real contract load
        timeout-minutes: 15
        run: |
          container=$(docker create darkbloom-prompt-sidecar-ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "$container:/app/coordinator/promptsidecar/target/x86_64-unknown-linux-musl/release/promptsidecar" \
            "$RUNNER_TEMP/promptsidecar-linux"
          chmod +x "$RUNNER_TEMP/promptsidecar-linux"
          file "$RUNNER_TEMP/promptsidecar-linux" | grep -Eq "statically linked|static-pie linked"
          ./scripts/verify-prompt-sidecar-linux.sh "$RUNNER_TEMP/promptsidecar-linux"
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview --toolchain 1.88.0
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Report coverage
        working-directory: coordinator/promptsidecar
        run: |
          cargo llvm-cov --locked --all-targets --no-report
          cargo llvm-cov report --summary-only
          json="$RUNNER_TEMP/sidecar-coverage.json"
          cargo llvm-cov report --json --summary-only --output-path "$json"
          # Read each total by its field name. jq -e fails when it is missing.
          percent() {
            local value
            value=$(jq -er --arg k "$1" '.data[0].totals[$k].percent | select(type == "number")' "$json") || return 1
            printf '%.2f%%' "$value"
          }
          lines=$(percent lines)
          regions=$(percent regions)
          functions=$(percent functions)
          echo "Prompt sidecar (Rust) coverage: lines $lines, regions $regions, functions $functions"
          {
            echo "| Component | Statements or Lines | Regions or Branches | Functions | Target |"
            echo "|---|---|---|---|---|"
            echo "| Prompt sidecar (Rust) | $lines lines | $regions regions | $functions | 80% (report-only) |"
            echo
            echo "Denominator: lines and regions in \`coordinator/promptsidecar/src\`, from a \`cargo test --all-targets\` run."
            echo
            echo "Excluded: the tests under \`tests/\`, every \`tests.rs\` test module under \`src/\`, dependencies and generated code (the crate has none); inline unit-test modules inside other \`src\` files are counted. Branch counters need a nightly toolchain, so branches are not reported."
          } >> "$GITHUB_STEP_SUMMARY"

  test-provider:
    name: Provider Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build provider CI prerequisites
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: provider
      - name: Test Qwen resources in a relocated app
        run: python3 scripts/test-qwen4-packaged-resources.py
      - name: Test profile inventory authentication in a terminal
        run: python3 scripts/test-profile-inventory-auth.py
      - name: Prepare pinned public MiMo metadata and original corpus
        id: mimo-prompt-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$GITHUB_ENV"
      - name: Prepare bounded synthetic MiMo provider fixtures offline
        id: mimo-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: |
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-provider-fixtures" --github-env "$GITHUB_ENV"
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-prefix-fixtures" --asymmetric
      - name: Run Swift tests
        id: provider-unit-tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        timeout-minutes: 20
        env:
          MIMO_V26_PROVIDER_LIFETIME_METADATA_TESTS: '1'
        working-directory: provider-swift
        # Reuse the built bundle and matched metallib. The exact allocator
        # suite runs in its own process even if the general suite fails.
        run: |
          python3 ../scripts/run-provider-test-watchdog.py \
            --output-dir "$RUNNER_TEMP/provider-test-diagnostics" \
            --diagnostic-after-seconds 480 --timeout-seconds 900 \
            -- ../scripts/run-provider-tests.sh
      - name: Upload provider test diagnostics
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-test-diagnostics
          path: ${{ runner.temp }}/provider-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Run isolated native MiMo startup gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'MiMoV26StandaloneLifecycleTests.test(ActualScannerPreloadStartsListenerWithSameNativeOwner|StartRefusesActualUnpublishedPreloadWithoutReplacingOwner)' --no-parallel
      - name: Run isolated native MiMo memory admission gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMemoryAdmission|testNativeShutdownActivitySurvivesPendingHostUntilRealQuiescentDrain' --no-parallel
      - name: Run isolated native MiMo media admission gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMediaRelease|testAuthenticatedChatResponsesActuallyRouteEncodedImageThroughNativeBridge|testActualMemoryBackedVideoIndicesAndAuthenticatedNativeRoute|testNativeIdleBootstrapLearnsRealTargetRateAndKeepsTextRateIsolated|testNativePreparedSealReachesRealAtomicDeadlineRejectionWithoutLosingCharge|testTypedDeadlineGatePreservesRawTextAndOffPolicyAndRefusesForeignCapability|MiMoMediaDecodeMemoryTests' --no-parallel
      - name: Run isolated native MiMo complete-prefix gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-prefix-fixtures
        run: ../scripts/run-nested-suite.sh 'MiMoV26NativeLoadTransactionTests.testNativeCompletePrefix' --no-parallel
      - name: Run isolated native MiMo retained-fault gate
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_PROVIDER_LIFETIME_NATIVE_TESTS: '1'
          MIMO_V26_PROVIDER_LIFETIME_FAULT_CASE: testNativeFenceRefusalKeepsActualBundlePermitAndBlocksOtherOwnerReclaim
          DARKBLOOM_PREFIX_CACHE: '0'
          DARKBLOOM_PREFIX_CACHE_MEMORY: '0'
        run: ../scripts/run-nested-suite.sh testNativeFenceRefusalKeepsActualBundlePermitAndBlocksOtherOwnerReclaim --no-parallel
      - name: Restore pinned MiMo audio codec
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        id: mimo-audio-cache
        with:
          path: ${{ runner.temp }}/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Prepare selected MiMo audio fixture
        id: mimo-audio-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-audio-fixtures.py --cache "$RUNNER_TEMP/mimo-audio-source" --output "$RUNNER_TEMP/mimo-audio-fixtures" --github-env "$GITHUB_ENV"
      - name: Cache verified MiMo audio codec
        if: ${{ !cancelled() && steps.mimo-audio-fixtures.outcome == 'success' && steps.mimo-audio-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Run isolated native MiMo audio gate
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-audio-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_MANAGED_AUDIO_PROVIDER_TESTS: '1'
        run: ../scripts/run-nested-suite.sh testNativeAudioRelease --no-parallel
      - name: Run atomic installer artifact tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: ./scripts/test-install-atomic.sh

  test-provider-sdk:
    name: Provider SDK Tests
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build SDK CI prerequisites
        id: provider-ci-build
        timeout-minutes: 35
        uses: ./.github/actions/provider-ci-build
        with:
          lane: sdk
      # FLAKE-ORDERING GUARD (audit fix, v0.8.0): every nested step below runs
      # under !cancelled() with successful build/metallib prerequisites. A
      # failed suite cannot hide a later correctness gate, and a failed build
      # produces one attributable failure rather than cascading test failures.
      - name: Verify DiffusionGemma artifact and expert reduction
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        run: ../../scripts/run-nested-suite.sh 'DiffusionGemma(ArtifactFixture|ExpertReduction)Tests' --no-parallel
      # NOTE (v0.8.0): the guards below exist because these gates once
      # reported GREEN while executing NOTHING. `Tests/BenchCBv2Tests`
      # depended on the BenchCBv2 EXECUTABLE target, so SwiftPM routed the
      # swift-testing pass at that binary, which rejects
      # `--test-bundle-path` and exits — every `@Test` in the package was
      # unreachable and only XCTestCase classes ran. `swift test` exits 0 in
      # that state, which is why it went unnoticed.
      #
      # FIXED: BenchCBv2 is now split into a `BenchCBv2Core` library plus a
      # thin executable shim, and the test target depends on the library.
      #
      # The guards STAY as a permanent tripwire. This failure mode is silent
      # by construction — a dark suite and a passing one are
      # indistinguishable by exit code — so any future change that re-routes
      # the swift-testing pass must be RED here, not green.
      # The suites below are already compiled by the `swift build
      # --build-tests` action above but were never executed, so the paged-KV
      # migration had no automated numerical gate. They add no compile time,
      # only run time; one step each so a slow or failing suite is
      # attributable straight from the job summary. They reuse the metallib
      # placed by the step above.
      #
      # The bodies are ONE script (scripts/run-nested-suite.sh), which is what
      # carries the executed-count and zero-skip tripwires. ALL six suites go
      # through it — a bare `swift test --filter` here would bypass the
      # tripwire and reintroduce the dark-gate hole the script closes (the
      # safety and prompt-hash suites below used to run bare for exactly that
      # reason). Inline copies of a check whose failure mode is silence are
      # that many chances to edit one and miss the rest.
      - name: Run nested MiMo media decode tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh 'MiMoV26(OpenRouterMedia|VisionWorkingSet|AudioWorkingSet|VisualDecodeMemory|EncodedVisualDecoder|EncodedAudioDecoder|EncodedAACAudio|EncodedAudiovisualDecoder)Tests|MiMoV26PixelsTests.test(RGB|Temporal|Invalid|Explicit)' --no-parallel
      - name: Prepare tiny MiMo fixture for media-to-text isolation
        id: sdk-mimo-isolation-fixture
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-media-isolation"
      - name: Verify media refusal leaves the native text engine usable
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.sdk-mimo-isolation-fixture.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_NATIVE_MEDIA_DEADLINE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-media-isolation
        run: ../../scripts/run-nested-suite.sh MiMoV26NativeMediaDeadlineTests --no-parallel
      - name: Run nested paged safety tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Runtime smoke over the JIT-compiled paged Metal kernels.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PagedSafetyTests
      - name: Run nested prompt-hash tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Prefix-cache prompt-hash identity; pure Swift.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PrefixCacheHasherTests
      - name: Run nested paged eligibility tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Pure Swift threadgroup-budget arithmetic; no GPU dispatch.
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh CBv2PagedEligibilityTests
      - name: Run nested paged backend tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Pool bookkeeping, per-sequence page tables, windowed rings,
        # reservation admission, backend lifecycle. Small MLX arrays only.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PagedBackendTests
      - name: Run nested paged kernel parity tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Heaviest of the set: fp32 decode-kernel parity, bitwise
        # batch-composition invariance, and a 200-step greedy token match.
        # Dispatches the JIT-compiled Metal kernels, exactly as
        # CBv2PagedSafetyTests' runtimeSmoke already does in this job.
        timeout-minutes: 20
        # The composition assertion opts in only in its own test process;
        # both invocations retain the nonempty/no-skips tripwires.
        run: ../../scripts/run-paged-kernel-tests.sh
      - name: Run nested KV-sharing contiguous/paged parity tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Two-arm differential over TinyTestModel's KV-sharing variant. The
        # paged arm used to XCTSkip when the backend was unavailable; the
        # runner script now FAILS on any skip, because "paged unavailable on
        # the gate runner" is precisely the condition this lane must not be
        # green under.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2KVSharingParityTests
      - name: Run Nemotron production SDK gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 20
        run: |
          # Each filter has its own nonzero/no-skip tripwire. Continue after a
          # failure so one broken suite cannot hide another unexecuted gate.
          onboarding_failed=0
          for suite in SSMDecodeBoundsTests NemotronHTests \
                       NemotronH35BackendParityTests NemotronH35StorageParityTests \
                       NemotronH35MTPTests NemotronH35MTPPrimingTests \
                       MutableInputKernelTests MutableInputExportTests \
                       CBv2QwenMTPIntegrationTests CBv2MTPDepthControllerTests \
                       PagedMTPBatchedColumnsTests CBv2CompleteCheckpointEngineTests \
                       NemotronH35ProductionDefaultsTests \
                       OpenAIServiceTests ToolCallParserIntegrationTests; do
            if ! ../../scripts/run-nested-suite.sh "$suite"; then
              onboarding_failed=1
            fi
          done
          exit "$onboarding_failed"

  test-provider-parity:
    name: Provider Prompt Parity
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Build prompt parity CI prerequisites
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: parity
      - name: Prepare pinned public MiMo metadata and original corpus
        id: mimo-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$GITHUB_ENV"
      - name: Verify production prompt parity
        id: prompt-parity
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        run: ./scripts/verify-prompt-parity.sh
      - name: Verify pinned Nemotron prompts and numeric cache plans
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: ./scripts/verify-nemotron-prompt-parity.sh
      - name: Save verified prompt parity Cargo dependencies
        if: ${{ !cancelled() && steps.prompt-parity.outcome == 'success' && steps.provider-ci-build.outputs.rust-cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            coordinator/promptsidecar/target
          key: ${{ steps.provider-ci-build.outputs.rust-key }}

  provider-test-gate:
    name: Provider Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes, test-provider, test-provider-sdk, test-provider-parity]
    if: ${{ always() }}
    steps:
      - name: Require selected provider lanes or verified intentional skips
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROVIDER_CHANGED: ${{ needs.changes.outputs.provider }}
          UNIT_RESULT: ${{ needs.test-provider.result }}
          SDK_RESULT: ${{ needs.test-provider-sdk.result }}
          PARITY_RESULT: ${{ needs.test-provider-parity.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$PROVIDER_CHANGED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$UNIT_RESULT" = "$expected"
          test "$SDK_RESULT" = "$expected"
          test "$PARITY_RESULT" = "$expected"

  cache-swift:
    name: Swift Build + Cache
    runs-on: blacksmith-12vcpu-macos-27
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v4-blacksmith-macos27-native-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}
          restore-keys: |
            spm-v4-blacksmith-macos27-native-${{ runner.os }}-
      - name: Discard metallibs restored by the generic SwiftPM cache
        run: |
          for root in provider-swift/.build libs/mlx-swift-lm/.build; do
            [ ! -d "$root" ] || find "$root" -type f -name mlx.metallib -delete
          done
      - name: Build provider-swift
        working-directory: provider-swift
        run: |
          swift build -c release --product darkbloom
          swift build -c release --product darkbloom-fan-helper
      - name: Save SwiftPM cache
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v4-blacksmith-macos27-native-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}

  lint-console:
    name: Console UI Lint & Build
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console-ui/package-lock.json
      - name: Install dependencies
        run: cd console-ui && npm ci
      - name: Lint
        run: cd console-ui && npx eslint src/
      - name: Test
        run: cd console-ui && npm test
      - name: Build
        run: cd console-ui && npm run build
