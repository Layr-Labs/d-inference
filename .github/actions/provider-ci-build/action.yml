name: Provider CI Build
description: Build full debug test products with lane-specific caches and source-matched Metal
inputs:
  lane:
    description: provider or cluster; each owns independent build outputs
    required: true
  save-caches:
    description: "'true' to save this lane's caches; provider-tests.yml passes true only for pushes to master and dev"
    default: 'false'
  strict-cache:
    description: "'true' to restore only an entry of this exact recipe (provider-tests.yml passes true for master)"
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate build lane
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        case "$LANE" in
          provider|cluster) ;;
          *) echo "Unknown provider CI lane: $LANE" >&2; exit 2 ;;
        esac
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12.10'
    - name: Select SDK 27 provider toolchain
      shell: bash
      run: ./scripts/prepare-provider-release-toolchain.sh
    - name: Install pinned CMake
      shell: bash
      run: ./scripts/install-release-cmake.sh
    - name: Prepare source-matched Metal compiler
      shell: bash
      run: python3 scripts/prepare-metal-toolchain.py
    - name: Resolve compatible build and Metal caches
      id: keys
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        python3 scripts/provider-ci-cache.py keys --lane "$LANE" >> "$GITHUB_OUTPUT"
        # actions/cache stores a path outside the workspace relative to the
        # workspace, so SwiftPM's cache is shared only between equal layouts.
        echo "home-layout=$(printf '%s\n' "$HOME" "$GITHUB_WORKSPACE" | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
        echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
    # The jobs of the test products run in a workspace linked to
    # /private/tmp/dinf. actions/cache stores each path relative to the
    # workspace, so a path that shares more than `/` with the workspace
    # (runner.temp, the home directory) would be unpacked under the link's
    # target instead; every cache outside the workspace lives in
    # /private/tmp/dinf-ci. SwiftPM reads its repositories from the home
    # directory, through this link.
    - name: Link SwiftPM's repository cache into the CI cache directory
      shell: bash
      run: |
        mkdir -p /private/tmp/dinf-ci/swiftpm-repositories "$HOME/Library/Caches/org.swift.swiftpm"
        rm -rf "$HOME/Library/Caches/org.swift.swiftpm/repositories"
        ln -s /private/tmp/dinf-ci/swiftpm-repositories "$HOME/Library/Caches/org.swift.swiftpm/repositories"
    # Dependency clones for a cold build; the lane's own build cache already
    # holds them when it is restored.
    - name: Restore SwiftPM repositories
      id: spm-repos
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: /private/tmp/dinf-ci/swiftpm-repositories
        key: spm-repos-v1-${{ runner.os }}-${{ steps.keys.outputs.home-layout }}-${{ inputs.lane }}-${{ hashFiles('**/Package.resolved', '!**/.build/**') }}
        restore-keys: spm-repos-v1-${{ runner.os }}-${{ steps.keys.outputs.home-layout }}-${{ inputs.lane }}-
    # A Darkbloom host keeps the entries it saved, 10 GiB per repository, so a
    # push saves at most one build per lane and UTC day there; every other
    # runner keys the build by commit.
    - name: Choose the Swift test build's cache key
      id: build-key
      shell: bash
      env:
        PREFIX: ${{ steps.keys.outputs.swift-prefix }}
        COMMIT_KEY: ${{ steps.keys.outputs.swift-key }}
      run: |
        case "${RUNNER_NAME:-}" in
          darkbloom-*) echo "key=${PREFIX}day-$(date -u +%F)" >> "$GITHUB_OUTPUT" ;;
          *) echo "key=$COMMIT_KEY" >> "$GITHUB_OUTPUT" ;;
        esac
    # Restore tiers: this recipe's newest entry; then any recipe's with the
    # same toolchain, dependencies and checkout path; then any entry with the
    # same toolchain, checkout path and MLX pins, whose MLX objects stay valid.
    # The build steps build once more from nothing if a looser entry fails.
    # strict-cache (master) keeps only the first tier.
    - name: Restore lane-specific Swift test build
      id: swift-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          provider-swift/.build
          libs/darkbloom-cluster/.build
        key: ${{ steps.build-key.outputs.key }}
        restore-keys: |
          ${{ steps.keys.outputs.swift-prefix }}
          ${{ inputs.strict-cache != 'true' && steps.keys.outputs.swift-loose-prefix || '' }}
          ${{ inputs.strict-cache != 'true' && steps.keys.outputs.swift-mlx-prefix || '' }}
    - name: Revalidate source timestamps and discard cached runtime resources
      shell: bash
      run: |
        python3 scripts/provider-release-cache.py restore-mtimes
        for root in provider-swift/.build libs/darkbloom-cluster/.build; do
          [ -d "$root" ] || continue
          find "$root" -type f -name mlx.metallib -delete
          find "$root" -mindepth 3 -maxdepth 3 -type d \
            -path "$root/*-apple-macosx/*/*.bundle" -prune -exec rm -rf {} +
        done
    - name: Build all provider test products
      if: inputs.lane == 'provider'
      id: provider-build
      shell: bash
      working-directory: provider-swift
      env:
        PROVIDER_CI_MATCHED_KEY: ${{ steps.swift-cache.outputs.cache-matched-key }}
        PROVIDER_CI_STRICT_PREFIX: ${{ steps.keys.outputs.swift-prefix }}
      # Instrumented for the coverage report. Both builds use the same flags,
      # so neither rebuilds the other.
      run: |
        build() {
          swift build --build-tests --enable-code-coverage &&
            swift build --product darkbloom-fan-helper --enable-code-coverage
        }
        build || { ../scripts/provider-ci-cold-retry.sh && build; }
    - name: Build all cluster test products
      if: inputs.lane == 'cluster'
      id: cluster-build
      shell: bash
      working-directory: libs/darkbloom-cluster
      env:
        PROVIDER_CI_MATCHED_KEY: ${{ steps.swift-cache.outputs.cache-matched-key }}
        PROVIDER_CI_STRICT_PREFIX: ${{ steps.keys.outputs.swift-prefix }}
      run: swift build --build-tests || { ../../scripts/provider-ci-cold-retry.sh && swift build --build-tests; }
    - name: Record timestamps for successfully built sources
      if: ${{ !cancelled() && (steps.provider-build.outcome == 'success' || steps.cluster-build.outcome == 'success') }}
      id: timestamps
      shell: bash
      run: python3 scripts/provider-release-cache.py snapshot-mtimes
    # Only callers' trusted pushes save (save-caches): a pull request's entry
    # is scoped to its merge ref, where nothing else restores it.
    - name: Save lane-specific Swift test build
      if: ${{ !cancelled() && inputs.save-caches == 'true' && steps.timestamps.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          provider-swift/.build
          libs/darkbloom-cluster/.build
        key: ${{ steps.build-key.outputs.key }}
    - name: Save SwiftPM repositories
      if: ${{ !cancelled() && inputs.save-caches == 'true' && steps.timestamps.outcome == 'success' && steps.spm-repos.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: /private/tmp/dinf-ci/swiftpm-repositories
        key: ${{ steps.spm-repos.outputs.cache-primary-key }}
    - name: Restore source-matched Metal cache
      id: metallib-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: /private/tmp/dinf-ci/metallib-cache
        key: ${{ steps.keys.outputs.metallib-key }}
    - name: Validate and stage matched Metal for the actual test products
      id: metallib
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        METALLIB_CACHE_DIR: /private/tmp/dinf-ci/metallib-cache
      run: |
        cmake --version
        case "$LANE" in
          cluster) package=libs/darkbloom-cluster ;;
          *) package=provider-swift ;;
        esac
        bin=$(swift build --package-path "$package" --show-bin-path)
        ./scripts/stage-test-metallib.sh "$bin"
    - name: Save validated source-matched Metal cache
      if: ${{ !cancelled() && inputs.save-caches == 'true' && steps.metallib.outcome == 'success' && steps.metallib-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: /private/tmp/dinf-ci/metallib-cache
        key: ${{ steps.keys.outputs.metallib-key }}
