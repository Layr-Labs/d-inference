# Prod overlay. image.tag is set by the human who runs helm (or a GitHub
# workflow_dispatch later). secrets.existingSecret must already exist.

replicaCount: 1

image:
  repository: us-east4-docker.pkg.dev/darkbloom-mainnet/coordinator/coordinator
  pullPolicy: IfNotPresent

secrets:
  existingSecret: coordinator-runtime

persistence:
  size: 100Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

computeClass:
  enabled: true
  name: darkbloom-coordinator
  zones: [us-east4-a]

gatewayAPI:
  enabled: true
  gatewayClassName: gke-l7-global-external-managed
  hostnames:
    - api.darkbloom.dev

serviceAccount:
  name: coordinator
  annotations:
    iam.gke.io/gcp-service-account: darkbloom-coordinator@darkbloom-mainnet.iam.gserviceaccount.com
