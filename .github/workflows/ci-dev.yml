name: CI (dev)

# Pull requests into dev and pushes to dev run the provider, SDK and cluster
# tests (.github/workflows/provider-tests.yml) and nothing else: Release
# Integrity, Docs Lint and the contribution gates run only for master
# (.github/workflows/ci-master.yml, docs-impact.yml).
on:
  push:
    # Pushes to dev save the caches that pull requests into dev restore.
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Revisions of the same PR supersede each other. Pushes to dev share one group:
# one run is in progress and the newest push waits (GitHub cancels an older
# waiting run), so a burst of merges runs twice, not once per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/provider-tests.yml
    permissions:
      contents: read
