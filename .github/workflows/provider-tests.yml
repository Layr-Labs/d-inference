name: Provider Tests

# The provider and cluster build and test jobs and the Provider Tests gate,
# shared by CI (dev) (.github/workflows/ci-dev.yml) and CI (master)
# (.github/workflows/ci-master.yml). Their plan (provider-plan.yml) chooses
# the components and the runner of every macOS job; pull requests and pushes
# run the same jobs. Each lane builds once, on a large runner, and its test
# jobs run those products. Only pushes save caches.
on:
  workflow_call:
    inputs:
      provider: {type: string, required: true}
      cluster: {type: string, required: true}
      cluster_gpu: {type: string, required: true}
      mimo_audio: {type: string, required: true}
      changed_provider: {type: string, required: true}
      changed_cluster: {type: string, required: true}
      changes_result: {type: string, required: true}
      skip: {type: string, required: true}
      tested_run: {type: string, required: true}
      tree: {type: string, required: true}
      base: {type: string, required: true}
      head: {type: string, required: true}
      routes: {type: string, required: true}
      # The commit every checkout of the tested tree uses (provider-plan.yml's
      # `sha`): a dispatch's resolved `ref`, otherwise empty (the event's default).
      sha: {type: string, default: ''}
      # true: restore only this recipe's builds (master: release-bound
      # builds never reuse objects of another recipe or dependency set).
      strict_cache: {type: boolean, default: false}

permissions:
  contents: read

# A plain build of the dev branch is a DevNet build (provider-swift/Package.swift).
# CI builds the production identity, which the provider suites pin, as on
# master; BuildEnvironmentTests checks that the build is the one requested.
env:
  DARKBLOOM_RELEASE_ENVIRONMENT: prod
  # Only pushes to master and dev, and the hourly dispatch on dev, save
  # caches. A pull request restores its base branch's entries and saves none
  # (docs/developer/build.md#ci-caching).
  SAVE_CACHES: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
  # Every checkout but Docs Lint's skips the evidence tarballs and landing media
  # (408 MB of the tree), which only Docs Lint reads. The rest of the evidence
  # stays: provider-ci-cache.py hashes every tracked Package.swift.
  CHECKOUT_SPARSE: |
    /*
    !/docs/reports/evidence/**/*.gz
    !/landing/public/media/

jobs:
  build-cluster:
    # Each lane builds once, on a large runner, and hands its debug test
    # products to its test jobs (.github/actions/provider-ci-products). The
    # cluster lane builds in a job of its own, so the cluster tests start as
    # soon as their products are up. A push whose tree an earlier run already
    # tested skips both build and test jobs (provider-plan.yml). The build
    # jobs need a large Mac: their lanes ask with their size
    # (provider-plan.yml).
    name: Build cluster test products
    if: ${{ inputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(inputs.routes)['build-cluster'] }}
    timeout-minutes: 60
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      # SwiftPM's products hold absolute paths, and Blacksmith and Darkbloom
      # check out to different paths. A job that builds or runs the test
      # products works at one fixed path: its workspace becomes a link to it,
      # so every step's working directory resolves there
      # (scripts/ci-test-products.py). Its caches outside the workspace live
      # in /private/tmp/dinf-ci: actions/cache unpacks each path relative to
      # the workspace, which a runner.temp or home path cannot survive here.
      - name: Work at the fixed build path
        run: |
          cd /
          rm -rf /private/tmp/dinf /private/tmp/dinf-ci "$GITHUB_WORKSPACE"
          mkdir -p /private/tmp/dinf /private/tmp/dinf-ci
          ln -s /private/tmp/dinf "$GITHUB_WORKSPACE"
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        if: env.CI_ACTIONS_CACHE != 'off'
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged or unsafe cached .git
        run: |
          [ -e .git ] || [ -L .git ] || exit 0
          # Checked before git reads it: a restored .git must be a directory
          # that runs nothing. No symbolic link, no hook but git's samples (here
          # or in a submodule) and no config that sets a hook directory or a
          # file system monitor or includes another file; git config --file
          # only parses. Names ignore case, as macOS does.
          if [ -L .git ] || [ ! -d .git ]; then
            reason="it is not a directory"
          elif [ -n "$(find .git -type l 2>/dev/null || true)" ]; then
            reason="it holds a symbolic link"
          elif [ -n "$(find .git -ipath '*/hooks/*' ! -type d ! -iname '*.sample' 2>/dev/null || true)" ]; then
            reason="it holds a hook"
          elif [ -n "$(find .git \( -iname config -o -iname config.worktree \) ! -type d \
              -exec git config --file {} --name-only --list \; 2>/dev/null |
              grep -i -E '^(core\.(fsmonitor|hookspath)|include\.|includeif\.)' || true)" ]; then
            reason="its config sets core.fsmonitor, core.hooksPath or an include"
          elif ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            reason="git fsck rejected it"
          else
            exit 0
          fi
          echo "::warning title=.git cache::Discarded the restored .git ($reason); checking out without it."
          rm -rf .git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      # What `submodules: recursive` does, with one parallel fetch per submodule.
      - name: Check out the submodules
        run: python3 scripts/ci-checkout-submodules.py
      - name: Save .git for later runs
        if: env.CI_ACTIONS_CACHE != 'off' && env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      - name: Build cluster test products
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: cluster
          save-caches: ${{ env.SAVE_CACHES }}
          strict-cache: ${{ inputs.strict_cache }}
      # Only a run that tests the lane hands its products on; a push of a
      # tested tree only refreshes the caches.
      - name: Upload cluster test products
        if: ${{ inputs.cluster == 'true' }}
        uses: ./.github/actions/provider-ci-products
        with:
          lane: cluster
          direction: upload
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  build-provider:
    name: Build provider test products
    if: ${{ inputs.provider == 'true' }}
    runs-on: ${{ fromJSON(inputs.routes)['build-provider'] }}
    timeout-minutes: 60
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      # The fixed build path, as in build-cluster (scripts/ci-test-products.py).
      - name: Work at the fixed build path
        run: |
          cd /
          rm -rf /private/tmp/dinf /private/tmp/dinf-ci "$GITHUB_WORKSPACE"
          mkdir -p /private/tmp/dinf /private/tmp/dinf-ci
          ln -s /private/tmp/dinf "$GITHUB_WORKSPACE"
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        if: env.CI_ACTIONS_CACHE != 'off'
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged or unsafe cached .git
        run: |
          [ -e .git ] || [ -L .git ] || exit 0
          # Checked before git reads it: a restored .git must be a directory
          # that runs nothing. No symbolic link, no hook but git's samples (here
          # or in a submodule) and no config that sets a hook directory or a
          # file system monitor or includes another file; git config --file
          # only parses. Names ignore case, as macOS does.
          if [ -L .git ] || [ ! -d .git ]; then
            reason="it is not a directory"
          elif [ -n "$(find .git -type l 2>/dev/null || true)" ]; then
            reason="it holds a symbolic link"
          elif [ -n "$(find .git -ipath '*/hooks/*' ! -type d ! -iname '*.sample' 2>/dev/null || true)" ]; then
            reason="it holds a hook"
          elif [ -n "$(find .git \( -iname config -o -iname config.worktree \) ! -type d \
              -exec git config --file {} --name-only --list \; 2>/dev/null |
              grep -i -E '^(core\.(fsmonitor|hookspath)|include\.|includeif\.)' || true)" ]; then
            reason="its config sets core.fsmonitor, core.hooksPath or an include"
          elif ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            reason="git fsck rejected it"
          else
            exit 0
          fi
          echo "::warning title=.git cache::Discarded the restored .git ($reason); checking out without it."
          rm -rf .git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      # What `submodules: recursive` does, with one parallel fetch per submodule.
      - name: Check out the submodules
        run: python3 scripts/ci-checkout-submodules.py
      - name: Save .git for later runs
        if: env.CI_ACTIONS_CACHE != 'off' && env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      - name: Build provider test products
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: provider
          save-caches: ${{ env.SAVE_CACHES }}
          strict-cache: ${{ inputs.strict_cache }}
      # Only a run that tests the lane hands its products on; a push of a
      # tested tree only refreshes the caches.
      - name: Upload provider test products
        if: ${{ inputs.provider == 'true' }}
        uses: ./.github/actions/provider-ci-products
        with:
          lane: provider
          direction: upload
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  test-provider:
    # The provider suite runs in shards on separate Macs
    # (scripts/provider-test-shards.py), each routed through its own
    # test-provider-<shard> lane. Each shard runs the products of Build
    # provider test products and PROVIDER_TEST_PROCESSES selections at the
    # same time, each serially in its own process
    # (scripts/run-provider-tests.sh). Selection 1 also runs the MLX-free test
    # targets in one parallel process; shard 1 also runs Prompt Parity. The
    # last selection runs every suite that no other selection picks; the last
    # shard then runs the isolated processes, alone. The checks that run once
    # beside the suite are Provider Gates' (test-provider-gates). Each shard
    # then checks that its selections executed exactly their plans (the last
    # shard also that the plans cover the suite once) and reports its own
    # coverage.
    name: Provider Unit Tests (shard ${{ matrix.shard }})
    # No `needs: build-provider`: the shards start beside the build, so their
    # Macs, checkouts and toolchains are ready when its products are, and the
    # products step waits for the build job (.github/actions/provider-ci-products).
    if: ${{ inputs.provider == 'true' }}
    # Reads the run's jobs to wait for its build job (scripts/ci-test-products.py wait).
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(inputs.routes)[format('test-provider-{0}', matrix.shard)] }}
    timeout-minutes: 60
    strategy:
      # A failed shard does not cancel the other shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      # The fixed build path, as in build-cluster (scripts/ci-test-products.py).
      - name: Work at the fixed build path
        run: |
          cd /
          rm -rf /private/tmp/dinf /private/tmp/dinf-ci "$GITHUB_WORKSPACE"
          mkdir -p /private/tmp/dinf /private/tmp/dinf-ci
          ln -s /private/tmp/dinf "$GITHUB_WORKSPACE"
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        if: env.CI_ACTIONS_CACHE != 'off'
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged or unsafe cached .git
        run: |
          [ -e .git ] || [ -L .git ] || exit 0
          # Checked before git reads it: a restored .git must be a directory
          # that runs nothing. No symbolic link, no hook but git's samples (here
          # or in a submodule) and no config that sets a hook directory or a
          # file system monitor or includes another file; git config --file
          # only parses. Names ignore case, as macOS does.
          if [ -L .git ] || [ ! -d .git ]; then
            reason="it is not a directory"
          elif [ -n "$(find .git -type l 2>/dev/null || true)" ]; then
            reason="it holds a symbolic link"
          elif [ -n "$(find .git -ipath '*/hooks/*' ! -type d ! -iname '*.sample' 2>/dev/null || true)" ]; then
            reason="it holds a hook"
          elif [ -n "$(find .git \( -iname config -o -iname config.worktree \) ! -type d \
              -exec git config --file {} --name-only --list \; 2>/dev/null |
              grep -i -E '^(core\.(fsmonitor|hookspath)|include\.|includeif\.)' || true)" ]; then
            reason="its config sets core.fsmonitor, core.hooksPath or an include"
          elif ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            reason="git fsck rejected it"
          else
            exit 0
          fi
          echo "::warning title=.git cache::Discarded the restored .git ($reason); checking out without it."
          rm -rf .git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      # What `submodules: recursive` does, with one parallel fetch per submodule.
      - name: Check out the submodules
        run: python3 scripts/ci-checkout-submodules.py
      - name: Save .git for later runs
        if: env.CI_ACTIONS_CACHE != 'off' && env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      # The pinned downloads below need no test products, so each shard
      # restores them and downloads what its entry lacks while the build runs,
      # in the background, with the interpreter the products step selects for
      # the later steps (docs/developer/build.md#ci-caching).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12.10'
      # The pinned MiMo metadata downloads, named by their SHA-256; each
      # script uses an entry only if its bytes still have the pinned digest.
      # A Mac holds only the entries it saved, so in 246 of 550 shard jobs of
      # the 110 green pull request runs on 2026-11-23 and 2026-11-24 the
      # preparation downloaded them after the products, in 4 to 99 s.
      - name: Restore verified MiMo metadata downloads
        id: mimo-metadata-cache
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/mimo-metadata-cache
          key: mimo-metadata-v1-${{ hashFiles('scripts/prepare-mimo-prompt-fixtures.py', 'scripts/prepare-mimo-audio-fixtures.py') }}
      # The preparation's three commands, in their order, in one background
      # command. The two scripts write the variables they set to a file of the
      # command's own, which its wait adds to the job's environment.
      - name: Start the pinned MiMo metadata downloads
        id: mimo-metadata-downloads
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci-background-step.py start "$RUNNER_TEMP/mimo-metadata-downloads" bash -e -c '
            python3 scripts/test-prepare-mimo-image-http-fixtures.py
            python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$1" --cache /private/tmp/dinf-ci/mimo-metadata-cache
            python3 scripts/prepare-mimo-image-http-fixtures.py --output "$RUNNER_TEMP/mimo-image-http-fixtures" --github-env "$1" --cache /private/tmp/dinf-ci/mimo-metadata-cache
          ' mimo-metadata "$RUNNER_TEMP/mimo-metadata-downloads/github-env"
      # The prompt artifacts both parity steps download (tokenizers, templates
      # and configs), one file per pinned SHA-256
      # (scripts/verified_download_cache.py). The key hashes the manifests that
      # pin them; prepare-prompt-fixtures.py uses an entry only if its bytes
      # still have the pinned size and digest, and downloads any other. Only
      # this shard saves the entry, so few Macs hold it: in 82 of 110 green pull
      # request runs on 2026-11-23 and 2026-11-24, Prompt Parity downloaded all
      # of it after the tests, in 12 to 317 s.
      - name: Restore verified prompt fixture downloads
        id: prompt-fixture-cache
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && matrix.shard == 1 }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/prompt-fixture-cache
          key: prompt-fixtures-v1-${{ hashFiles('fixtures/prompt-contract/v1/manifests/*.json', 'fixtures/prompt-contract/nemotron/manifests/*.json') }}
      # One download per parity step, with the downloader, manifests and cache
      # of its script; each stores only verified bytes. Each parity step waits
      # for its own, which prints the output, so either step still runs and
      # fails on its own. The paths are physical, as the downloader requires.
      - name: Start the pinned prompt fixture downloads
        id: prompt-fixture-downloads
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          PROMPT_PARITY_DOWNLOAD_CACHE: /private/tmp/dinf-ci/prompt-fixture-cache
        run: |
          root=$(pwd -P)
          work=$(cd "$RUNNER_TEMP" && pwd -P)/prompt-fixture-prefetch
          mkdir "$work"
          for contracts in v1 nemotron; do
            python3 scripts/ci-background-step.py start "$RUNNER_TEMP/prompt-fixture-downloads/$contracts" \
              python3 scripts/prepare-prompt-fixtures.py \
              --manifest-source-directory "$root/fixtures/prompt-contract/$contracts/manifests" \
              --cdn-url "${PROMPT_PARITY_CDN_URL:-https://models.darkbloom.ai}" \
              --artifact-root "$work/$contracts/artifacts" --manifest-directory "$work/$contracts/manifests" \
              --download-cache "$PROMPT_PARITY_DOWNLOAD_CACHE"
          done
      - name: Download provider test products
        id: test-products
        uses: ./.github/actions/provider-ci-products
        with:
          lane: provider
          direction: download
      # The provider lane builds with --enable-code-coverage. Every provider
      # process after this step writes its own profile here, and the report
      # step at the end of this job merges them.
      - name: Collect provider coverage profiles
        run: |
          profiles="$RUNNER_TEMP/provider-profiles"
          mkdir -p "$profiles"
          echo "PROVIDER_COVERAGE_DIR=$profiles" >> "$GITHUB_ENV"
          echo "LLVM_PROFILE_FILE=$profiles/%p-%m.profraw" >> "$GITHUB_ENV"
      # The tests read the MiMo metadata from here on. A failed or stalled
      # preparation fails this wait, with its output, and the tests then do
      # not run (nor download again).
      - name: Wait for the pinned MiMo metadata downloads
        id: mimo-prompt-fixtures
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-metadata-downloads.outcome == 'success' }}
        run: |
          python3 scripts/ci-background-step.py wait "$RUNNER_TEMP/mimo-metadata-downloads"
          cat "$RUNNER_TEMP/mimo-metadata-downloads/github-env" >> "$GITHUB_ENV"
      - name: Save verified MiMo metadata downloads
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && env.SAVE_CACHES == 'true' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-metadata-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/mimo-metadata-cache
          key: ${{ steps.mimo-metadata-cache.outputs.cache-primary-key }}
      - name: Prepare bounded synthetic MiMo provider fixtures offline
        id: mimo-fixtures
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        run: |
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-provider-fixtures" --github-env "$GITHUB_ENV"
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-prefix-fixtures" --asymmetric
      - name: Run Swift tests
        id: provider-unit-tests
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        timeout-minutes: 35
        env:
          MIMO_V26_PROVIDER_LIFETIME_METADATA_TESTS: '1'
          PROVIDER_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Selections per shard, at the same time: 3 on a 12-vCPU runner.
          PROVIDER_TEST_PROCESSES: '3'
          PROVIDER_TEST_REPORT_DIR: ${{ runner.temp }}/provider-unit-shard
        working-directory: provider-swift
        # Reuse the built bundle and matched metallib. The exact allocator
        # suite runs in its own process even if the general suite fails.
        run: |
          python3 ../scripts/run-provider-test-watchdog.py \
            --output-dir "$RUNNER_TEMP/provider-test-diagnostics" \
            --diagnostic-after-seconds 900 --timeout-seconds 1800 \
            -- ../scripts/run-provider-tests.sh
      - name: Upload provider test diagnostics
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-test-diagnostics-${{ matrix.shard }}
          # The watchdog's diagnostics, and each process's whole output, which
          # the runner prints only after all of the shard's processes end.
          path: |
            ${{ runner.temp }}/provider-test-diagnostics
            ${{ runner.temp }}/provider-unit-shard/slot-*.out
          if-no-files-found: warn
          retention-days: 7
      # A failed or stalled download fails its wait, with the downloader's
      # output, and its parity step then does not run (nor download again).
      - name: Wait for the pinned v1 prompt fixture downloads
        id: prompt-fixture-downloads-v1
        if: ${{ !cancelled() && matrix.shard == 1 && steps.test-products.outcome == 'success' && steps.prompt-fixture-downloads.outcome == 'success' }}
        run: python3 scripts/ci-background-step.py wait "$RUNNER_TEMP/prompt-fixture-downloads/v1"
      # Prompt Parity runs once, in shard 1 (the shard of selection
      # PARITY_SHARD), against the provider products. A failure fails the shard,
      # and with it the Provider Tests gate. The summary checks each run's
      # executed count against the suite list; the count comes from the run's
      # xUnit report and stdout (NESTED_SUITE_REPORT, scripts/run-nested-suite.sh).
      - name: Verify public prompt golden vectors
        id: prompt-parity
        if: ${{ !cancelled() && matrix.shard == 1 && steps.test-products.outcome == 'success' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.prompt-fixture-downloads-v1.outcome == 'success' }}
        env:
          PROMPT_PARITY_SKIP_BUILD: '1'
          PROMPT_PARITY_DOWNLOAD_CACHE: /private/tmp/dinf-ci/prompt-fixture-cache
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/provider-unit-shard"
          mkdir -p "$report"
          NESTED_SUITE_REPORT="$report/parity-prompt" ./scripts/verify-prompt-parity.sh
          python3 scripts/provider-test-shards.py counts parity ProductionPromptParityTests \
            "$report/parity-prompt-swift-testing.xml" "$report/parity-prompt.log" "$report/shard-parity-prompt.json"
      - name: Wait for the pinned Nemotron prompt fixture downloads
        id: prompt-fixture-downloads-nemotron
        if: ${{ !cancelled() && matrix.shard == 1 && steps.test-products.outcome == 'success' && steps.prompt-fixture-downloads.outcome == 'success' }}
        run: python3 scripts/ci-background-step.py wait "$RUNNER_TEMP/prompt-fixture-downloads/nemotron"
      - name: Verify pinned Nemotron prompts and numeric cache plans
        id: nemotron-parity
        if: ${{ !cancelled() && matrix.shard == 1 && steps.test-products.outcome == 'success' && steps.prompt-fixture-downloads-nemotron.outcome == 'success' }}
        env:
          PROMPT_PARITY_DOWNLOAD_CACHE: /private/tmp/dinf-ci/prompt-fixture-cache
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/provider-unit-shard"
          mkdir -p "$report"
          NESTED_SUITE_REPORT="$report/parity-nemotron" ./scripts/verify-nemotron-prompt-parity.sh
          python3 scripts/provider-test-shards.py counts parity NemotronTemplateParityLiveTests \
            "$report/parity-nemotron-swift-testing.xml" "$report/parity-nemotron.log" "$report/shard-parity-nemotron.json"
      # Both parity steps passed, so the cache holds every pinned artifact, and
      # only verified bytes were stored in it.
      - name: Save verified prompt fixture downloads
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && env.SAVE_CACHES == 'true' && matrix.shard == 1 && steps.prompt-parity.outcome == 'success' && steps.nemotron-parity.outcome == 'success' && steps.prompt-fixture-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/prompt-fixture-cache
          key: ${{ steps.prompt-fixture-cache.outputs.cache-primary-key }}
      # Report-only coverage: each shard merges its own profiles and writes
      # its own report.
      - name: Merge shard coverage profiles
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=("$PROVIDER_COVERAGE_DIR"/*.profraw)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "::error::No provider coverage profiles in $PROVIDER_COVERAGE_DIR"
            exit 1
          fi
          echo "Merging ${#profiles[@]} provider coverage profiles"
          mkdir -p "$RUNNER_TEMP/provider-unit-shard"
          xcrun llvm-profdata merge -sparse -o "$RUNNER_TEMP/provider-unit-shard/provider.profdata" "${profiles[@]}"
      # The full-suite audit, split by job: this shard's selections each ran
      # exactly their plan, and the last shard checks that all plans cover
      # `swift test list` once (scripts/provider-test-shards.py audit-job).
      - name: Check this shard's selections against the suite list
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        working-directory: provider-swift
        env:
          PROVIDER_TEST_PROCESSES: '3'
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -euo pipefail
          swift test list --skip-build > "$RUNNER_TEMP/provider-tests.txt"
          python3 ../scripts/provider-test-shards.py audit-job "$RUNNER_TEMP/provider-tests.txt" \
            "$RUNNER_TEMP/provider-unit-shard" "$SHARD"
      # Report-only, this shard's processes only (scripts/report-provider-coverage.sh).
      - name: Report provider coverage
        id: provider-coverage
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        working-directory: provider-swift
        run: ../scripts/report-provider-coverage.sh "$RUNNER_TEMP/provider-unit-shard/provider.profdata" "$RUNNER_TEMP/provider-coverage"
      - name: Upload provider coverage report
        if: ${{ !cancelled() && steps.provider-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-coverage-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/provider-coverage/provider-coverage.txt
            ${{ runner.temp }}/provider-coverage/provider-coverage.json
            ${{ runner.temp }}/provider-coverage/provider-coverage-summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload shard counts, timings and coverage
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-unit-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/provider-unit-shard/*.json
            ${{ runner.temp }}/provider-unit-shard/*.xml
            ${{ runner.temp }}/provider-unit-shard/provider.profdata
          if-no-files-found: error
          retention-days: 14
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  test-provider-gates:
    # The provider checks that run once beside the suite, each in processes
    # of its own: the relocated-resource, MDM-reader and installer checks, the
    # Gemma conformance switches, the desktop control API and the native MiMo
    # gates (the audio gate only when its inputs changed). They ran after the
    # last shard's selections; in a job of their own they run beside the
    # shards, which plan the suite without them (scripts/provider-test-shards.py
    # LAST_SHARD_EXTRA_SECONDS keeps only the isolated processes). The job
    # prepares the MiMo fixtures the shards prepare, so each gate sees the
    # environment it had there, and reports its own coverage.
    name: Provider Gates
    # Starts beside Build provider test products and waits for its products,
    # as test-provider does.
    if: ${{ inputs.provider == 'true' }}
    # Reads the run's jobs to wait for its build job (scripts/ci-test-products.py wait).
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(inputs.routes)['test-provider-gates'] }}
    timeout-minutes: 60
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      # The fixed build path, as in build-cluster (scripts/ci-test-products.py).
      - name: Work at the fixed build path
        run: |
          cd /
          rm -rf /private/tmp/dinf /private/tmp/dinf-ci "$GITHUB_WORKSPACE"
          mkdir -p /private/tmp/dinf /private/tmp/dinf-ci
          ln -s /private/tmp/dinf "$GITHUB_WORKSPACE"
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        if: env.CI_ACTIONS_CACHE != 'off'
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged or unsafe cached .git
        run: |
          [ -e .git ] || [ -L .git ] || exit 0
          # Checked before git reads it: a restored .git must be a directory
          # that runs nothing. No symbolic link, no hook but git's samples (here
          # or in a submodule) and no config that sets a hook directory or a
          # file system monitor or includes another file; git config --file
          # only parses. Names ignore case, as macOS does.
          if [ -L .git ] || [ ! -d .git ]; then
            reason="it is not a directory"
          elif [ -n "$(find .git -type l 2>/dev/null || true)" ]; then
            reason="it holds a symbolic link"
          elif [ -n "$(find .git -ipath '*/hooks/*' ! -type d ! -iname '*.sample' 2>/dev/null || true)" ]; then
            reason="it holds a hook"
          elif [ -n "$(find .git \( -iname config -o -iname config.worktree \) ! -type d \
              -exec git config --file {} --name-only --list \; 2>/dev/null |
              grep -i -E '^(core\.(fsmonitor|hookspath)|include\.|includeif\.)' || true)" ]; then
            reason="its config sets core.fsmonitor, core.hooksPath or an include"
          elif ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            reason="git fsck rejected it"
          else
            exit 0
          fi
          echo "::warning title=.git cache::Discarded the restored .git ($reason); checking out without it."
          rm -rf .git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      # What `submodules: recursive` does, with one parallel fetch per submodule.
      - name: Check out the submodules
        run: python3 scripts/ci-checkout-submodules.py
      - name: Save .git for later runs
        if: env.CI_ACTIONS_CACHE != 'off' && env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      # The MiMo metadata and the audio codec need no test products, so they
      # are fetched while the build runs, with the interpreter the products
      # step selects for the later steps.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12.10'
      # The MiMo metadata as in test-provider: restored, then prepared in the
      # background, and waited for where the preparation stood.
      - name: Restore verified MiMo metadata downloads
        id: mimo-metadata-cache
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/mimo-metadata-cache
          key: mimo-metadata-v1-${{ hashFiles('scripts/prepare-mimo-prompt-fixtures.py', 'scripts/prepare-mimo-audio-fixtures.py') }}
      - name: Start the pinned MiMo metadata downloads
        id: mimo-metadata-downloads
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci-background-step.py start "$RUNNER_TEMP/mimo-metadata-downloads" bash -e -c '
            python3 scripts/test-prepare-mimo-image-http-fixtures.py
            python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$1" --cache /private/tmp/dinf-ci/mimo-metadata-cache
            python3 scripts/prepare-mimo-image-http-fixtures.py --output "$RUNNER_TEMP/mimo-image-http-fixtures" --github-env "$1" --cache /private/tmp/dinf-ci/mimo-metadata-cache
          ' mimo-metadata "$RUNNER_TEMP/mimo-metadata-downloads/github-env"
      # The 1.87 GB codec is fetched only when the audio gate's inputs changed
      # (scripts/ci-component-paths.py MIMO_AUDIO) and on master pushes: after
      # the products it took 21 to 137 s (runs 44914459288, 44912466550).
      - name: Restore pinned MiMo audio codec
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && inputs.mimo_audio == 'true' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        id: mimo-audio-cache
        with:
          path: /private/tmp/dinf-ci/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Prepare selected MiMo audio fixture
        id: mimo-audio-fixtures
        if: ${{ !cancelled() && inputs.mimo_audio == 'true' }}
        run: python3 scripts/prepare-mimo-audio-fixtures.py --cache /private/tmp/dinf-ci/mimo-audio-source --output "$RUNNER_TEMP/mimo-audio-fixtures" --github-env "$GITHUB_ENV"
      - name: Cache verified MiMo audio codec
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && env.SAVE_CACHES == 'true' && steps.mimo-audio-fixtures.outcome == 'success' && steps.mimo-audio-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: /private/tmp/dinf-ci/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Download provider test products
        id: test-products
        uses: ./.github/actions/provider-ci-products
        with:
          lane: provider
          direction: download
      # The provider lane builds with --enable-code-coverage. Every provider
      # process after this step writes its own profile here, and the report
      # step at the end of this job merges them.
      - name: Collect provider coverage profiles
        run: |
          profiles="$RUNNER_TEMP/provider-profiles"
          mkdir -p "$profiles"
          echo "PROVIDER_COVERAGE_DIR=$profiles" >> "$GITHUB_ENV"
          echo "LLVM_PROFILE_FILE=$profiles/%p-%m.profraw" >> "$GITHUB_ENV"
      - name: Test Qwen resources in a relocated app
        run: python3 scripts/test-qwen4-packaged-resources.py
      - name: Test SwiftPM resource bundle staging
        run: python3 scripts/test-stage-swiftpm-resource-bundles.py
      - name: Test that the provider reads MDM enrollment only unprivileged
        run: python3 scripts/test-provider-profiles-unprivileged.py
      - name: Wait for the pinned MiMo metadata downloads
        id: mimo-prompt-fixtures
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-metadata-downloads.outcome == 'success' }}
        run: |
          python3 scripts/ci-background-step.py wait "$RUNNER_TEMP/mimo-metadata-downloads"
          cat "$RUNNER_TEMP/mimo-metadata-downloads/github-env" >> "$GITHUB_ENV"
      - name: Save verified MiMo metadata downloads
        if: ${{ env.CI_ACTIONS_CACHE != 'off' && !cancelled() && env.SAVE_CACHES == 'true' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-metadata-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /private/tmp/dinf-ci/mimo-metadata-cache
          key: ${{ steps.mimo-metadata-cache.outputs.cache-primary-key }}
      - name: Prepare bounded synthetic MiMo provider fixtures offline
        id: mimo-fixtures
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        run: |
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-provider-fixtures" --github-env "$GITHUB_ENV"
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-prefix-fixtures" --asymmetric
      - name: Test Gemma quoted numeric argument conformance switches
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        run: |
          for enabled in 0 1; do
            env DARKBLOOM_GEMMA_SCHEMA_COERCION="$enabled" ../scripts/run-nested-suite.sh GemmaQuotedArgumentConformanceTests --no-parallel
          done
      - name: Test desktop control API with isolated local state
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 scripts/test-desktop-api.py provider-swift/.build/debug/darkbloom
      - name: Test Gemma reopened thought conformance switches
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        run: |
          for enabled in 0 1; do
            env DARKBLOOM_GEMMA_REOPENED_THOUGHTS="$enabled" ../scripts/run-nested-suite.sh GemmaReopenedThoughtRoutingTests --no-parallel
          done
      - name: Run isolated native MiMo startup gates
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'MiMoV26StandaloneLifecycleTests.test(ActualScannerPreloadStartsListenerWithSameNativeOwner|StartRefusesActualUnpublishedPreloadWithoutReplacingOwner)' --no-parallel
      - name: Run isolated native MiMo memory admission gates
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMemoryAdmission|testNativeShutdownActivitySurvivesPendingHostUntilRealQuiescentDrain' --no-parallel
      - name: Run isolated native MiMo media admission gates
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMediaRelease|testAuthenticatedChatResponsesActuallyRouteEncodedImageThroughNativeBridge|testActualMemoryBackedVideoIndicesAndAuthenticatedNativeRoute|testNativeIdleBootstrapLearnsRealTargetRateAndKeepsTextRateIsolated|testNativePreparedSealReachesRealAtomicDeadlineRejectionWithoutLosingCharge|testTypedDeadlineGatePreservesRawTextAndOffPolicyAndRefusesForeignCapability|MiMoMediaDecodeMemoryTests' --no-parallel
      - name: Run isolated native MiMo complete-prefix gates
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-prefix-fixtures
        run: ../scripts/run-nested-suite.sh 'MiMoV26NativeLoadTransactionTests.testNativeCompletePrefix' --no-parallel
      - name: Run isolated native MiMo retained-fault gate
        if: ${{ !cancelled() && steps.test-products.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
