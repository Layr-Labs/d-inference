# Cloud Build config for the d-inference DEV coordinator on Google Cloud.
#
# Triggered on push to master (path filter: coordinator/** | deploy/gcp/**).
# Builds coordinator/Dockerfile (same image shape prod uses), pushes to
# Artifact Registry, then pins the VM's container image tag and restarts the
# systemd unit so it picks up the new image.
#
# Why GCE VM instead of Cloud Run: the coordinator runs
# MicroMDM (BoltDB), which needs reliable local filesystem semantics that
# Cloud Run's ephemeral FS + gcsfuse can't provide. The VM has a persistent
# disk at /mnt/disks/userdata — the same persistent path used in prod.
#
# Upgrade time: ~2-4 minutes end-to-end (build + push + SSH restart).

timeout: 1800s

substitutions:
  _INSTANCE: d-inference-dev
  _ZONE: us-central1-a
  _IMAGE: us-central1-docker.pkg.dev/sepolia-ai/coordinator/coordinator
  _HEALTH_URL: https://api.dev.darkbloom.xyz/health
  # One-time only for the first migration of the known legacy dev schema.
  _ADOPT_LEGACY: 'false'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:$SHORT_SHA
      - --tag=${_IMAGE}:latest
      - --file=coordinator/Dockerfile
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:$SHORT_SHA']

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:latest']

  # Pin the image, apply its schema while the old coordinator is still serving,
  # then restart the systemd unit. Any migration failure aborts this step before
  # restart, leaving the old process and image running.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Re-fetch secrets from Secret Manager and regenerate the env
        # file before restarting. Pipe the script via SSH stdin to avoid
        # SCP permission issues with Cloud Build's ephemeral SSH keys.
        cat deploy/gcp/refresh-env.sh | gcloud compute ssh ${_INSTANCE} \
          --zone=${_ZONE} --tunnel-through-iap -- "sudo bash -s"

        cat deploy/gcp/migrate-coordinator.sh | gcloud compute ssh ${_INSTANCE} \
          --zone=${_ZONE} --tunnel-through-iap -- \
          "sudo bash -s -- '$SHORT_SHA' '${_ADOPT_LEGACY}'"

        # Commit every boot-affecting metadata change only after migration
        # succeeds. A failed migration leaves the running process, image tag,
        # and reboot startup script on their last known-compatible versions.
        gcloud compute instances add-metadata ${_INSTANCE} \
          --zone=${_ZONE} \
          --metadata=DINF_IMAGE_TAG=$SHORT_SHA \
          --metadata-from-file=startup-script=deploy/gcp/vm-startup.sh

        gcloud compute ssh ${_INSTANCE} --zone=${_ZONE} --tunnel-through-iap -- \
          "sudo systemctl restart d-inference-coordinator"

        echo "Restart requested; polling /health..."
        for i in $(seq 1 48); do
          code=$(curl -sk -o /dev/null -w '%{http_code}' "${_HEALTH_URL}" || true)
          if [ "$code" = "200" ]; then
            echo "health check passed after $((i*5))s"
            exit 0
          fi
          echo "attempt $i: got $code"
          sleep 5
        done
        echo "health check failed after 4 minutes"
        exit 1

images:
  - '${_IMAGE}:$SHORT_SHA'
  - '${_IMAGE}:latest'
