name: Provider Tests

# The provider, SDK and cluster test jobs and the Provider Tests gate, shared by
# CI (dev) (.github/workflows/ci-dev.yml) and CI (master)
# (.github/workflows/ci-master.yml). Every job reads the caller's event, so
# both callers run the same jobs with the same conditions.
on:
  workflow_call:

permissions:
  contents: read

# A plain build of the dev branch is a DevNet build (provider-swift/Package.swift).
# CI builds the production identity, which the provider suites pin, as on
# master; BuildEnvironmentTests checks that the build is the one requested.
env:
  DARKBLOOM_RELEASE_ENVIRONMENT: prod
  # Only pushes to master and dev save caches. A pull request restores its
  # base branch's entries and saves none (docs/developer/build.md#ci-caching).
  SAVE_CACHES: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
  # Every checkout but Docs Lint's skips the evidence tarballs and landing media
  # (408 MB of the tree), which only Docs Lint reads. The rest of the evidence
  # stays: provider-ci-cache.py hashes every tracked Package.swift.
  CHECKOUT_SPARSE: |
    /*
    !/docs/reports/evidence/**/*.gz
    !/landing/public/media/

jobs:
  changes:
    uses: ./.github/workflows/component-changes.yml
    permissions:
      contents: read

  # Chooses a Darkbloom Sandbox or the Blacksmith fallback for each macOS job
  # below. It follows the classifier so only jobs that will run are requested.
  # A lane is granted whole or falls back whole, so each shard has a lane of
  # its own and gets a free Mac even when there is not one per shard. This is
  # the run's only route request: the plane routes a run attempt once, so the
  # callers' own jobs keep literal runners. The lanes are listed in the order
  # the DARKBLOOM_MACOS_LANES cap keeps them: the critical-path shards first.
  route:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        test-cluster-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.cluster == 'true' && 1 || 0 }}
        test-provider-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.provider == 'true' && 1 || 0 }}
        test-provider-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.provider == 'true' && 1 || 0 }}
        test-cluster-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.cluster == 'true' && 1 || 0 }}
        test-cluster-checks macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.cluster == 'true' && 1 || 0 }}
        test-cluster-focused macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.cluster == 'true' && 1 || 0 }}
        test-provider-summary macos_arm64 blacksmith-12vcpu-macos-27 ${{ needs.changes.outputs.provider == 'true' && 1 || 0 }}
        test-provider-sdk macos_arm64 blacksmith-12vcpu-macos-27 ${{ (github.event_name == 'push' || needs.changes.outputs.sdk == 'true') && 1 || 0 }}
        test-cluster-gpu-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ github.event_name == 'push' && needs.changes.outputs.cluster == 'true' && 1 || 0 }}
        test-cluster-gpu-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ github.event_name == 'push' && needs.changes.outputs.cluster == 'true' && 1 || 0 }}

  test-provider:
    # The provider suite runs in shards on separate Macs
    # (scripts/provider-test-shards.py), each routed through its own
    # test-provider-<shard> lane above. Each shard builds once and runs
    # PROVIDER_TEST_PROCESSES selections at the same time, each serially in its
    # own process (scripts/run-provider-tests.sh). Selection 1 also runs the
    # MLX-free test targets in one parallel process; shard 1 also runs Prompt
    # Parity. The last selection runs every suite that no other selection
    # picks; the last shard then runs the isolated processes and the native
    # gates below, alone. Provider Unit Tests Summary checks that the
    # selections together executed the full suite and reports coverage.
    name: Provider Unit Tests (shard ${{ matrix.shard }})
    needs: [changes, route]
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)[format('test-provider-{0}', matrix.shard)] }}
    timeout-minutes: 60
    strategy:
      # A failed shard does not cancel the other shards.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Build provider CI prerequisites
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: provider
          save-caches: ${{ env.SAVE_CACHES }}
      # The provider lane builds with --enable-code-coverage. Every provider
      # process after this step writes its own profile here, and the report
      # step at the end of this job merges them.
      - name: Collect provider coverage profiles
        run: |
          profiles="$RUNNER_TEMP/provider-profiles"
          mkdir -p "$profiles"
          echo "PROVIDER_COVERAGE_DIR=$profiles" >> "$GITHUB_ENV"
          echo "LLVM_PROFILE_FILE=$profiles/%p-%m.profraw" >> "$GITHUB_ENV"
      - name: Test Qwen resources in a relocated app
        if: ${{ matrix.shard == strategy.job-total }}
        run: python3 scripts/test-qwen4-packaged-resources.py
      - name: Test SwiftPM resource bundle staging
        if: ${{ matrix.shard == strategy.job-total }}
        run: python3 scripts/test-stage-swiftpm-resource-bundles.py
      - name: Test profile inventory authentication in a terminal
        if: ${{ matrix.shard == strategy.job-total }}
        run: python3 scripts/test-profile-inventory-auth.py
      # The pinned metadata downloads, named by their SHA-256; each script
      # uses an entry only if its bytes still have the pinned digest.
      - name: Restore verified MiMo metadata downloads
        id: mimo-metadata-cache
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/mimo-metadata-cache
          key: mimo-metadata-v1-${{ hashFiles('scripts/prepare-mimo-prompt-fixtures.py', 'scripts/prepare-mimo-audio-fixtures.py') }}
      - name: Prepare pinned public MiMo metadata and original corpus
        id: mimo-prompt-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: |
          python3 scripts/test-prepare-mimo-image-http-fixtures.py
          python3 scripts/prepare-mimo-prompt-fixtures.py --output "$RUNNER_TEMP/mimo-prompt-fixtures" --github-env "$GITHUB_ENV" --cache "$RUNNER_TEMP/mimo-metadata-cache"
          python3 scripts/prepare-mimo-image-http-fixtures.py --output "$RUNNER_TEMP/mimo-image-http-fixtures" --github-env "$GITHUB_ENV" --cache "$RUNNER_TEMP/mimo-metadata-cache"
      - name: Save verified MiMo metadata downloads
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-metadata-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/mimo-metadata-cache
          key: ${{ steps.mimo-metadata-cache.outputs.cache-primary-key }}
      - name: Prepare bounded synthetic MiMo provider fixtures offline
        id: mimo-fixtures
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: |
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-provider-fixtures" --github-env "$GITHUB_ENV"
          python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-prefix-fixtures" --asymmetric
      - name: Run Swift tests
        id: provider-unit-tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.mimo-prompt-fixtures.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        timeout-minutes: 35
        env:
          MIMO_V26_PROVIDER_LIFETIME_METADATA_TESTS: '1'
          PROVIDER_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Selections per shard, at the same time: 3 on a 12-vCPU runner.
          PROVIDER_TEST_PROCESSES: '3'
          PROVIDER_TEST_REPORT_DIR: ${{ runner.temp }}/provider-unit-shard
        working-directory: provider-swift
        # Reuse the built bundle and matched metallib. The exact allocator
        # suite runs in its own process even if the general suite fails.
        run: |
          python3 ../scripts/run-provider-test-watchdog.py \
            --output-dir "$RUNNER_TEMP/provider-test-diagnostics" \
            --diagnostic-after-seconds 900 --timeout-seconds 1800 \
            -- ../scripts/run-provider-tests.sh
      - name: Upload provider test diagnostics
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-test-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/provider-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
      # Prompt Parity runs once, in shard 1 (the shard of selection
      # PARITY_SHARD), against this shard's build. A failure fails the shard,
      # and with it the Provider Tests gate. The summary checks each run's
      # executed count against the suite list.
      - name: Verify public prompt golden vectors
        id: prompt-parity
        if: ${{ !cancelled() && matrix.shard == 1 && steps.provider-ci-build.outcome == 'success' && steps.mimo-prompt-fixtures.outcome == 'success' }}
        env:
          PROMPT_PARITY_SKIP_BUILD: '1'
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/provider-unit-shard"
          mkdir -p "$report"
          ./scripts/verify-prompt-parity.sh 2>&1 | tee "$report/parity-prompt.log"
          python3 scripts/provider-test-shards.py counts parity ProductionPromptParityTests \
            "$report/parity-prompt.log" "$report/shard-parity-prompt.json"
      - name: Verify pinned Nemotron prompts and numeric cache plans
        if: ${{ !cancelled() && matrix.shard == 1 && steps.provider-ci-build.outcome == 'success' }}
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/provider-unit-shard"
          mkdir -p "$report"
          ./scripts/verify-nemotron-prompt-parity.sh 2>&1 | tee "$report/parity-nemotron.log"
          python3 scripts/provider-test-shards.py counts parity NemotronTemplateParityLiveTests \
            "$report/parity-nemotron.log" "$report/shard-parity-nemotron.json"
      - name: Test desktop control API with isolated local state
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 scripts/test-desktop-api.py provider-swift/.build/debug/darkbloom
      - name: Run isolated native MiMo startup gates
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'MiMoV26StandaloneLifecycleTests.test(ActualScannerPreloadStartsListenerWithSameNativeOwner|StartRefusesActualUnpublishedPreloadWithoutReplacingOwner)' --no-parallel
      - name: Run isolated native MiMo memory admission gates
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMemoryAdmission|testNativeShutdownActivitySurvivesPendingHostUntilRealQuiescentDrain' --no-parallel
      - name: Run isolated native MiMo media admission gates
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        run: ../scripts/run-nested-suite.sh 'testNativeMediaRelease|testAuthenticatedChatResponsesActuallyRouteEncodedImageThroughNativeBridge|testActualMemoryBackedVideoIndicesAndAuthenticatedNativeRoute|testNativeIdleBootstrapLearnsRealTargetRateAndKeepsTextRateIsolated|testNativePreparedSealReachesRealAtomicDeadlineRejectionWithoutLosingCharge|testTypedDeadlineGatePreservesRawTextAndOffPolicyAndRefusesForeignCapability|MiMoMediaDecodeMemoryTests' --no-parallel
      - name: Run isolated native MiMo complete-prefix gates
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-prefix-fixtures
        run: ../scripts/run-nested-suite.sh 'MiMoV26NativeLoadTransactionTests.testNativeCompletePrefix' --no-parallel
      - name: Run isolated native MiMo retained-fault gate
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_PROVIDER_LIFETIME_NATIVE_TESTS: '1'
          MIMO_V26_PROVIDER_LIFETIME_FAULT_CASE: testNativeFenceRefusalKeepsActualBundlePermitAndBlocksOtherOwnerReclaim
          DARKBLOOM_PREFIX_CACHE: '0'
          DARKBLOOM_PREFIX_CACHE_MEMORY: '0'
        run: ../scripts/run-nested-suite.sh testNativeFenceRefusalKeepsActualBundlePermitAndBlocksOtherOwnerReclaim --no-parallel
      - name: Run isolated native MiMo lifecycle drain gate
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_PROVIDER_LIFETIME_NATIVE_TESTS: '1'
          DARKBLOOM_PREFIX_CACHE: '0'
          DARKBLOOM_PREFIX_CACHE_MEMORY: '0'
        run: ../scripts/run-nested-suite.sh testGracefulDrainAfterServedRequestRetiresNativeOwnerWithinDeadline --no-parallel
      # The 1.87 GB codec is fetched only when the audio gate's inputs changed
      # (scripts/ci-component-paths.py MIMO_AUDIO) and on master pushes.
      - name: Restore pinned MiMo audio codec
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && needs.changes.outputs.mimo_audio == 'true' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        id: mimo-audio-cache
        with:
          path: ${{ runner.temp }}/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Prepare selected MiMo audio fixture
        id: mimo-audio-fixtures
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && needs.changes.outputs.mimo_audio == 'true' }}
        run: python3 scripts/prepare-mimo-audio-fixtures.py --cache "$RUNNER_TEMP/mimo-audio-source" --output "$RUNNER_TEMP/mimo-audio-fixtures" --github-env "$GITHUB_ENV"
      - name: Cache verified MiMo audio codec
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && matrix.shard == strategy.job-total && steps.mimo-audio-fixtures.outcome == 'success' && steps.mimo-audio-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/mimo-audio-source
          key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
      - name: Run isolated native MiMo audio gate
        if: ${{ !cancelled() && matrix.shard == strategy.job-total && steps.provider-ci-build.outcome == 'success' && steps.mimo-audio-fixtures.outcome == 'success' }}
        working-directory: provider-swift
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_MANAGED_AUDIO_PROVIDER_TESTS: '1'
        run: ../scripts/run-nested-suite.sh testNativeAudioRelease --no-parallel
      - name: Run atomic installer artifact tests
        if: ${{ !cancelled() && matrix.shard == strategy.job-total }}
        timeout-minutes: 2
        run: ./scripts/test-install-atomic.sh
      # Report-only coverage: each shard merges its own profiles, and Provider
      # Unit Tests Summary merges the shards and writes the report.
      - name: Merge shard coverage profiles
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=("$PROVIDER_COVERAGE_DIR"/*.profraw)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "::error::No provider coverage profiles in $PROVIDER_COVERAGE_DIR"
            exit 1
          fi
          echo "Merging ${#profiles[@]} provider coverage profiles"
          mkdir -p "$RUNNER_TEMP/provider-unit-shard"
          xcrun llvm-profdata merge -sparse -o "$RUNNER_TEMP/provider-unit-shard/provider.profdata" "${profiles[@]}"
      - name: Upload shard counts, timings and coverage
        if: ${{ !cancelled() && steps.provider-unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-unit-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/provider-unit-shard/*.json
            ${{ runner.temp }}/provider-unit-shard/*.xml
            ${{ runner.temp }}/provider-unit-shard/provider.profdata
          if-no-files-found: error
          retention-days: 14

  test-provider-summary:
    # Checks the shards against the full suite list and reports coverage.
    name: Provider Unit Tests Summary
    needs: [changes, route, test-provider]
    if: ${{ !cancelled() && needs.changes.outputs.provider == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['test-provider-summary'] }}
    timeout-minutes: 30
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      # On a push this restores the shards' build; on a pull request, the base
      # branch's newest compatible build. It rebuilds from the same sources and
      # flags; `swift test list` and llvm-cov read its binaries.
      - name: Build provider CI prerequisites
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: provider
          save-caches: ${{ env.SAVE_CACHES }}
      - name: Download shard reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: provider-unit-shard-*
          path: ${{ runner.temp }}/provider-unit-shards
      - name: Check that the shards executed the full provider suite
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: provider-swift
        run: |
          set -euo pipefail
          swift test list --skip-build > "$RUNNER_TEMP/provider-tests.txt"
          python3 ../scripts/provider-test-shards.py audit "$RUNNER_TEMP/provider-tests.txt" "$RUNNER_TEMP/provider-unit-shards"
      # Report-only: measured seconds per suite, the input for
      # scripts/provider-test-shard-weights.json when the shards drift apart.
      - name: Measure suite times for shard balance
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-test-shard-weights"
          python3 scripts/provider-test-shards.py weights "$RUNNER_TEMP"/provider-unit-shards/*/shard-*.xml \
            > "$RUNNER_TEMP/provider-test-shard-weights/provider-test-shard-weights.json"
      - name: Upload measured suite times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-test-shard-weights
          path: ${{ runner.temp }}/provider-test-shard-weights/provider-test-shard-weights.json
          if-no-files-found: warn
          retention-days: 14
      # Report-only. The test steps above keep their own exit codes, so a
      # coverage failure here cannot hide or replace a test failure.
      - name: Report provider coverage
        id: provider-coverage
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: provider-swift
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=("$RUNNER_TEMP"/provider-unit-shards/*/provider.profdata)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "::error::No provider coverage profiles in $RUNNER_TEMP/provider-unit-shards"
            exit 1
          fi
          echo "Merging ${#profiles[@]} shard coverage profiles"
          out="$RUNNER_TEMP/provider-coverage"
          mkdir -p "$out"
          xcrun llvm-profdata merge -sparse -o "$out/provider.profdata" "${profiles[@]}"
          bin=$(swift build --show-bin-path)
          # The test bundle holds the libraries and the executables the tests
          # import; the executables are added so their own code also counts.
          bundles=("$bin"/*.xctest)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No test bundle in $bin"
            exit 1
          fi
          binaries=()
          for bundle in "${bundles[@]}"; do
            binaries+=("$bundle/Contents/MacOS/$(basename "$bundle" .xctest)")
          done
          for tool in darkbloom darkbloom-fan-helper darkbloom-enclave darkbloom-publish; do
            binaries+=("$bin/$tool")
          done
          # llvm-cov takes the first binary as an argument, the rest as -object.
          args=("${binaries[0]}")
          for binary in "${binaries[@]:1}"; do
            args+=(-object "$binary")
          done
          args+=(-instr-profile "$out/provider.profdata"
            -ignore-filename-regex '/(Tests|\.build|libs)/'
            "$PWD/Sources")
          xcrun llvm-cov report "${args[@]}" > "$out/provider-coverage.txt"
          tail -n 1 "$out/provider-coverage.txt"
          xcrun llvm-cov export -summary-only "${args[@]}" > "$out/provider-coverage.json"
          # One row for the code that serves requests (the product), one each
          # for the CLI and the benchmark harness, and the total of all files.
          # Each value is read by its field name; a missing field or an empty
          # row fails the step.
          python3 - "$out/provider-coverage.json" "$PWD/Sources" \
            > "$out/provider-coverage-summary.md" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as export:
              coverage = json.load(export)["data"][0]
          source_root = sys.argv[2].rstrip("/") + "/"
          product = ["ProviderCore", "ProviderCoreFoundation", "ProviderAppAttest", "DarkbloomFanCore"]
          rows = {
              "Provider (Swift) product": product,
              "Provider CLI (`darkbloom`)": ["darkbloom"],
              "Provider benchmark (`ProviderBenchmark`)": ["ProviderBenchmark"],
          }
          row_by_target = {target: name for name, targets in rows.items() for target in targets}
          metrics = ("lines", "regions", "functions")
          totals_by_row = {name: {metric: [0, 0] for metric in metrics} for name in rows}
          seen_targets = set()
          for entry in coverage["files"]:
              target = entry["filename"].removeprefix(source_root).split("/")[0]
              seen_targets.add(target)
              if target not in row_by_target:
                  continue
              row_totals = totals_by_row[row_by_target[target]]
              for metric in metrics:
                  row_totals[metric][0] += entry["summary"][metric]["covered"]
                  row_totals[metric][1] += entry["summary"][metric]["count"]
          totals_by_row["Provider (Swift) total"] = {
              metric: [coverage["totals"][metric]["covered"], coverage["totals"][metric]["count"]]
              for metric in metrics
          }
          print("| Component | Statements or Lines | Regions or Branches | Functions | Target |")
          print("|---|---|---|---|---|")
          for name, row_totals in totals_by_row.items():
              if row_totals["lines"][1] == 0:
                  sys.exit(f"No lines for {name}")
              lines, regions, functions = (
                  f"{100 * covered / count:.2f}%"
                  for covered, count in (row_totals[metric] for metric in metrics)
              )
              print(f"| {name} | {lines} of {row_totals['lines'][1]:,} lines | {regions} regions | {functions} | 80% (report-only) |")
          product_names = [f"`{target}`" for target in product]
          other = ", ".join(f"`{target}`" for target in sorted(seen_targets.difference(row_by_target), key=str.lower))
          print()
          print(f"The product row counts the code that serves requests: {', '.join(product_names[:-1])} and {product_names[-1]}. "
                f"The CLI and the benchmark harness have their own rows. The total counts every file in the report. These targets are only in the total: {other}.")
          PY
          cat "$out/provider-coverage-summary.md"
          {
            cat "$out/provider-coverage-summary.md"
            echo
            echo "Denominator: Swift lines and regions in \`provider-swift/Sources\`, from every provider test process in the Provider Unit Tests shards, Prompt Parity included; the Provider SDK Tests lane runs in another job and does not count."
            echo
            echo "Excluded: \`Tests/\`, \`.build/\` (dependencies and generated code), the \`libs/\` checkouts, and the one C++ file in \`ProviderMetallibControl\`, which is not instrumented; Swift has no branch counters, so branches are not reported."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload provider coverage report
        if: ${{ !cancelled() && steps.provider-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-coverage
          path: |
            ${{ runner.temp }}/provider-coverage/provider-coverage.txt
            ${{ runner.temp }}/provider-coverage/provider-coverage.json
            ${{ runner.temp }}/provider-coverage/provider-coverage-summary.md
          if-no-files-found: error
          retention-days: 14

  test-provider-sdk:
    # Not part of the Provider Tests gate. A pull request runs it only when an
    # SDK-lane input changes (scripts/ci-component-paths.py SDK); every push to
    # dev or master runs it, and a failure there notifies without blocking.
    name: Provider SDK Tests
    needs: [changes, route]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.sdk == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['test-provider-sdk'] }}
    timeout-minutes: 60
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Build SDK CI prerequisites
        id: provider-ci-build
        timeout-minutes: 35
        uses: ./.github/actions/provider-ci-build
        with:
          lane: sdk
          save-caches: ${{ env.SAVE_CACHES }}
      # FLAKE-ORDERING GUARD (audit fix, v0.8.0): every nested step below runs
      # under !cancelled() with successful build/metallib prerequisites. A
      # failed suite cannot hide a later correctness gate, and a failed build
      # produces one attributable failure rather than cascading test failures.
      - name: Verify DiffusionGemma artifact and expert reduction
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        run: ../../scripts/run-nested-suite.sh 'DiffusionGemma(ArtifactFixture|ExpertReduction)Tests' --no-parallel
      # NOTE (v0.8.0): the guards below exist because these gates once
      # reported GREEN while executing NOTHING. `Tests/BenchCBv2Tests`
      # depended on the BenchCBv2 EXECUTABLE target, so SwiftPM routed the
      # swift-testing pass at that binary, which rejects
      # `--test-bundle-path` and exits — every `@Test` in the package was
      # unreachable and only XCTestCase classes ran. `swift test` exits 0 in
      # that state, which is why it went unnoticed.
      #
      # FIXED: BenchCBv2 is now split into a `BenchCBv2Core` library plus a
      # thin executable shim, and the test target depends on the library.
      #
      # The guards STAY as a permanent tripwire. This failure mode is silent
      # by construction — a dark suite and a passing one are
      # indistinguishable by exit code — so any future change that re-routes
      # the swift-testing pass must be RED here, not green.
      # The suites below are already compiled by the `swift build
      # --build-tests` action above but were never executed, so the paged-KV
      # migration had no automated numerical gate. They add no compile time,
      # only run time; one step each so a slow or failing suite is
      # attributable straight from the job summary. They reuse the metallib
      # placed by the step above.
      #
      # The bodies are ONE script (scripts/run-nested-suite.sh), which is what
      # carries the executed-count and zero-skip tripwires. ALL six suites go
      # through it — a bare `swift test --filter` here would bypass the
      # tripwire and reintroduce the dark-gate hole the script closes (the
      # safety and prompt-hash suites below used to run bare for exactly that
      # reason). Inline copies of a check whose failure mode is silence are
      # that many chances to edit one and miss the rest.
      - name: Run nested MiMo media decode tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh 'MiMoV26(OpenRouterMedia|VisionWorkingSet|AudioWorkingSet|VisualDecodeMemory|EncodedVisualDecoder|EncodedAudioDecoder|EncodedAACAudio|EncodedAudiovisualDecoder)Tests|MiMoV26PixelsTests.test(RGB|Temporal|Invalid|Explicit)' --no-parallel
      - name: Verify native historical retention policy
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh CBv2NativeHistoricalRetentionTests --no-parallel
      - name: Verify demanded checkpoint scheduling and projection
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh CBv2DemandedCheckpointPartitionTests --no-parallel
      - name: Verify demanded long range continuation and projection
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh CBv2DemandedCheckpointContinuationTests --no-parallel
      - name: Prepare asymmetric tiny MiMo fixture for native retention
        id: sdk-mimo-retention-fixture
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-native-retention" --asymmetric
      - name: Verify native retained frontier after donor retirement
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.sdk-mimo-retention-fixture.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-native-retention
        run: ../../scripts/run-nested-suite.sh MiMoV26NativeHistoricalRetentionTests.testDemandedMiddleFrontierSurvivesNativePublicationAndReopenedFork --no-parallel
      - name: Prepare tiny MiMo fixture for media-to-text isolation
        id: sdk-mimo-isolation-fixture
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        run: python3 scripts/prepare-mimo-provider-fixtures.py --output "$RUNNER_TEMP/mimo-media-isolation"
      - name: Verify media refusal leaves the native text engine usable
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' && steps.sdk-mimo-isolation-fixture.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_NATIVE_MEDIA_DEADLINE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-media-isolation
        run: ../../scripts/run-nested-suite.sh MiMoV26NativeMediaDeadlineTests --no-parallel
      - name: Run nested paged safety tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Runtime smoke over the JIT-compiled paged Metal kernels.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PagedSafetyTests
      - name: Run nested prompt-hash tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Prefix-cache prompt-hash identity; pure Swift.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PrefixCacheHasherTests
      - name: Run nested paged eligibility tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Pure Swift threadgroup-budget arithmetic; no GPU dispatch.
        timeout-minutes: 5
        run: ../../scripts/run-nested-suite.sh CBv2PagedEligibilityTests
      - name: Run nested paged backend tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Pool bookkeeping, per-sequence page tables, windowed rings,
        # reservation admission, backend lifecycle. Small MLX arrays only.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2PagedBackendTests
      - name: Run nested paged kernel parity tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Heaviest of the set: fp32 decode-kernel parity, bitwise
        # batch-composition invariance, and a 200-step greedy token match.
        # Dispatches the JIT-compiled Metal kernels, exactly as
        # CBv2PagedSafetyTests' runtimeSmoke already does in this job.
        timeout-minutes: 20
        # The composition assertion opts in only in its own test process;
        # both invocations retain the nonempty/no-skips tripwires.
        run: ../../scripts/run-paged-kernel-tests.sh
      - name: Run nested KV-sharing contiguous/paged parity tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        # Two-arm differential over TinyTestModel's KV-sharing variant. The
        # paged arm used to XCTSkip when the backend was unavailable; the
        # runner script now FAILS on any skip, because "paged unavailable on
        # the gate runner" is precisely the condition this lane must not be
        # green under.
        timeout-minutes: 10
        run: ../../scripts/run-nested-suite.sh CBv2KVSharingParityTests
      - name: Run Nemotron production SDK gates
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        working-directory: libs/mlx-swift-lm
        timeout-minutes: 20
        run: |
          # Each filter has its own nonzero/no-skip tripwire. Continue after a
          # failure so one broken suite cannot hide another unexecuted gate.
          onboarding_failed=0
          for suite in SSMDecodeBoundsTests NemotronHTests \
                       NemotronH35BackendParityTests NemotronH35StorageParityTests \
                       NemotronH35MTPTests NemotronH35MTPPrimingTests \
                       MutableInputKernelTests MutableInputExportTests \
                       CBv2QwenMTPIntegrationTests CBv2MTPDepthControllerTests \
                       PagedMTPBatchedColumnsTests CBv2CompleteCheckpointEngineTests \
                       NemotronH35ProductionDefaultsTests \
                       OpenAIServiceTests ToolCallParserIntegrationTests; do
            if ! ../../scripts/run-nested-suite.sh "$suite"; then
              onboarding_failed=1
            fi
          done
          exit "$onboarding_failed"

  test-cluster-checks:
    # The model-free cluster check runners. Each compiles its own source closure
    # (the capability runner links the actual Runtime and MLX, but executes only
    # metadata and argument checks) and runs it on the retained fixtures: no GPU,
    # no model load, no weights. Every runner runs even after another fails.
    name: Cluster Metadata Checks
    needs: [changes, route]
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['test-cluster-checks'] }}
    timeout-minutes: 60
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        id: toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      # The capability runner's release build of the cluster runtime and MLX is
      # reused across runs: SwiftPM rebuilds what changed, and source timestamps
      # are restored only for files whose contents match the cached build's
      # (scripts/provider-release-cache.py). The key binds the toolchain, the
      # package manifests, the submodule pins, the runner script and the paths;
      # it drops `git describe` text, which depends on the refs a cached .git holds.
      - name: Resolve cluster metadata build cache key
        id: cluster-build-key
        if: ${{ steps.toolchain.outcome == 'success' }}
        env:
          MANIFESTS: ${{ hashFiles('libs/darkbloom-cluster/Package.swift', 'libs/darkbloom-cluster/Package.resolved', 'libs/darkbloom-cluster-worker/Package.swift', 'libs/darkbloom-cluster-worker/Package.resolved', 'libs/darkbloom-cluster/Tests/Support/native-metadata.sh', '.gitmodules') }}
        run: |
          set -euo pipefail
          identity=$( { swift --version 2>&1; xcodebuild -version; xcrun --show-sdk-path; \
            git submodule status --recursive | awk '{print $1, $2}'; echo "$GITHUB_WORKSPACE $RUNNER_TEMP $MANIFESTS"; } | shasum -a 256 | cut -c1-32)
          echo "prefix=cluster-metadata-release-v1-$identity-" >> "$GITHUB_OUTPUT"
          echo "key=cluster-metadata-release-v1-$identity-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore cluster metadata build
        id: cluster-build-cache
        if: ${{ steps.cluster-build-key.outcome == 'success' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/cluster-native-metadata
          key: ${{ steps.cluster-build-key.outputs.key }}
          restore-keys: ${{ steps.cluster-build-key.outputs.prefix }}
      - name: Restore unchanged source timestamps
        if: ${{ steps.cluster-build-key.outcome == 'success' }}
        run: |
          manifest="$RUNNER_TEMP/cluster-native-metadata/provider-release-source-mtimes.json"
          if [ -f "$manifest" ]; then
            mkdir -p provider-swift/.build
            cp "$manifest" provider-swift/.build/
            python3 scripts/provider-release-cache.py restore-mtimes
          fi
      - name: Run worker capability checks
        id: capability-checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        # The runner is this job's alone: compile the native closure on all its cores.
        env:
          DARKBLOOM_CLUSTER_METADATA_BUILD_JOBS: '12'
          DARKBLOOM_CLUSTER_METADATA_BUILD_ROOT: ${{ runner.temp }}/cluster-native-metadata
        run: bash libs/darkbloom-cluster-worker/Tests/CapabilityChecks/run.sh
      # Builds the bootstrap product beside the capability runner's, in the same
      # retained build, before the steps below record and save it.
      - name: Run prefill schedule checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          DARKBLOOM_CLUSTER_METADATA_BUILD_JOBS: '12'
          DARKBLOOM_CLUSTER_METADATA_BUILD_ROOT: ${{ runner.temp }}/cluster-native-metadata
        run: bash libs/darkbloom-cluster/Tests/PrefillScheduleChecks/run.sh
      # Only pushes to master and dev save the cluster build (SAVE_CACHES).
      - name: Record source timestamps for the cluster build
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.capability-checks.outcome == 'success' && steps.cluster-build-cache.outputs.cache-hit != 'true' }}
        run: |
          python3 scripts/provider-release-cache.py snapshot-mtimes
          cp provider-swift/.build/provider-release-source-mtimes.json "$RUNNER_TEMP/cluster-native-metadata/"
      - name: Upload cluster metadata build cache
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.capability-checks.outcome == 'success' && steps.cluster-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/cluster-native-metadata
          key: ${{ steps.cluster-build-key.outputs.key }}
      - name: Run stage metadata checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 libs/darkbloom-cluster/Tests/StageMetadataChecks/run.py --output "$RUNNER_TEMP/stage-metadata-checks"
      - name: Run GPT-OSS stage checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash libs/darkbloom-cluster/Tests/GPTOSSStageChecks/run.sh
      - name: Run Nemotron stage checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash libs/darkbloom-cluster/Tests/NemotronStageChecks/run.sh
      # The download cache-policy check of the same runner stays on a Mac: on the
      # hosted VM, 0.75 of the pages written with F_NOCACHE stayed resident
      # (run 40804083002), which the VM's kernel and disk decide, not the code.
      - name: Run cluster model provisioning checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterModelProvisioningChecks/run.sh provisioning
      - name: Run cluster onboarding checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterOnboardingChecks/run.sh

  test-cluster:
    # DarkbloomClusterRuntimeTests in selections, each in its own process, on
    # separate Macs (scripts/cluster-test-plan.py): every test without a
    # switch, and the switched tests that pass on these runners. Shard 1 runs
    # the base selection alone; shard 2 runs its ordered groups of selections
    # at the same time.
    name: Cluster Runtime Tests (shard ${{ matrix.shard }})
    needs: [changes, route]
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)[format('test-cluster-{0}', matrix.shard)] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Build cluster test products
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: cluster
          save-caches: ${{ env.SAVE_CACHES }}
      - name: Run cluster runtime tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/cluster-test-plan.py run blocking "$SHARD"

  test-cluster-gpu:
    # The switched cluster runtime tests these runners cannot pass, the long
    # ones and the benchmarks (scripts/cluster-test-plan.py). They run and
    # report on pushes that change cluster inputs (every master push), not on
    # pull requests; a failure does not fail the workflow.
    name: Cluster GPU Tests (non-blocking, shard ${{ matrix.shard }})
    needs: [changes, route]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)[format('test-cluster-gpu-{0}', matrix.shard)] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Build cluster test products
        id: provider-ci-build
        uses: ./.github/actions/provider-ci-build
        with:
          lane: cluster
          save-caches: ${{ env.SAVE_CACHES }}
      - name: Run non-blocking cluster GPU tests
        if: ${{ !cancelled() && steps.provider-ci-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/cluster-test-plan.py run nonblocking "$SHARD"

  test-cluster-focused:
    # The model-free runner scripts under libs/darkbloom-cluster/Tests that
    # Cluster Metadata Checks does not run (scripts/cluster-test-plan.py).
    name: Cluster Focused Checks
    needs: [changes, route]
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['test-cluster-focused'] }}
    timeout-minutes: 60
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        id: toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      - name: Run cluster focused checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 40
        run: python3 scripts/cluster-test-plan.py run focused 1

  provider-test-gate:
    name: Provider Tests
    runs-on: ubuntu-24.04
    needs: [changes, test-provider, test-provider-summary, test-cluster, test-cluster-focused]
    if: ${{ always() }}
    steps:
      - name: Require selected provider lanes or verified intentional skips
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROVIDER_CHANGED: ${{ needs.changes.outputs.provider }}
          CLUSTER_CHANGED: ${{ needs.changes.outputs.cluster }}
          UNIT_RESULT: ${{ needs.test-provider.result }}
          SUMMARY_RESULT: ${{ needs.test-provider-summary.result }}
          CLUSTER_RESULT: ${{ needs.test-cluster.result }}
          CLUSTER_FOCUSED_RESULT: ${{ needs.test-cluster-focused.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$PROVIDER_CHANGED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$UNIT_RESULT" = "$expected"
          test "$SUMMARY_RESULT" = "$expected"
          # The cluster jobs run only when their inputs changed (and on
          # pushes); a skip passes only when the classifier did not select them.
          case "$CLUSTER_CHANGED" in
            true) cluster_expected=success ;;
            false) cluster_expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$CLUSTER_RESULT" = "$cluster_expected"
          test "$CLUSTER_FOCUSED_RESULT" = "$cluster_expected"
