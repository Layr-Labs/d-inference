name: Marketing UI

on:
  pull_request:
    paths:
      - 'marketing-ui/**'
      - '.github/workflows/marketing-ui.yml'
  push:
    branches: [master, main]
    paths:
      - 'marketing-ui/**'
      - '.github/workflows/marketing-ui.yml'

permissions:
  contents: read

jobs:
  check:
    name: Marketing UI Lint & Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
