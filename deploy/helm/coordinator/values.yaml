replicaCount: 1

image:
  repository: us-east4-docker.pkg.dev/darkbloom-mainnet/coordinator/coordinator
  tag: ""
  pullPolicy: IfNotPresent
# Empty on purpose. Kubelet authenticates to Artifact Registry as the GKE node
# GSA (roles/artifactregistry.reader on the coordinator repo). A JSON-key
# imagePullSecret is not used.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: coordinator
  annotations:
    iam.gke.io/gcp-service-account: darkbloom-coordinator@darkbloom-mainnet.iam.gserviceaccount.com

podAnnotations: {}
podLabels: {}

# Each ordinal gets its own RWO PVC. Scale-down and helm uninstall must not
# delete disks: whenScaled/whenDeleted Retain plus a Retain StorageClass.
persistence:
  enabled: true
  createStorageClass: true
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 100Gi
  diskType: pd-balanced
  mountPath: /mnt/disks/userdata
  whenDeleted: Retain
  whenScaled: Retain
  annotations:
    darkbloom.io/protect: "true"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Burst extra ordinals. Each new replica gets a fresh PVC (kept on scale-down).
# Provider WebSockets are in-process: CLIENT_IP affinity keeps a client on one
# ordinal; extra replicas still split the fleet across distinct client IPs.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics: []
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

computeClass:
  enabled: true
  name: darkbloom-coordinator
  whenUnsatisfiable: ScaleUpAnyway
  zones: [us-east4-a]
  priorities:
    - machineFamily: c3d
    - machineFamily: n2
    - machineFamily: e2

terminationGracePeriodSeconds: 630

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    partition: 0

podManagementPolicy: OrderedReady

service:
  type: ClusterIP
  port: 8080
  mdmPort: 9002
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  annotations: {}

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /health
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 30

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "8"
    memory: 32Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Rewrites EIGENINFERENCE_DATABASE_URL host/port to status.hostIP:15432
# (Cloud SQL Auth Proxy DaemonSet). The Secret Manager URL can keep the
# Cloud SQL private IP; the wrapper swaps it at start.
database:
  rewriteHostToNodeIP: true
  proxyPort: 15432

secrets:
  existingSecret: ""

externalSecret:
  enabled: false
  targetName: coordinator-runtime
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data: []

gatewayAPI:
  enabled: true
  createGateway: true
  gatewayName: ""
  gatewayNamespace: ""
  gatewayClassName: gke-l7-global-external-managed
  hostnames:
    - api.darkbloom.dev
  listener:
    name: https
    port: 443
    protocol: HTTPS
  tls:
    mode: Terminate
    certificateRefs: []
    certmap: ""
  httpRoute:
    timeouts:
      request: 3600s
      backendRequest: 3600s
  backend:
    timeoutSec: 86400
    sessionAffinity: CLIENT_IP
    drainingTimeoutSec: 630
  healthCheck:
    path: /readyz
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2

config:
  ENVIRONMENT: prod
  COORDINATOR_URL: https://api.darkbloom.dev
  COORDINATOR_WS_URL: wss://api.darkbloom.dev/ws/provider
  CONSOLE_URL: https://console.darkbloom.dev
  BASE_URL: https://api.darkbloom.dev
  CORS_ORIGIN: https://console.darkbloom.dev
  DOMAIN: api.darkbloom.dev
  EIGENINFERENCE_PORT: "8080"
  EIGENINFERENCE_BASE_URL: https://api.darkbloom.dev
  EIGENINFERENCE_CONSOLE_URL: https://console.darkbloom.dev
  EIGENINFERENCE_MDM_URL: https://localhost:9002
  USER_PERSISTENT_DATA_PATH: /mnt/disks/userdata
  EIGENINFERENCE_PROMPT_SIDECAR_ENABLED: "true"
  EIGENINFERENCE_PROMPT_SIDECAR_BINARY: /usr/local/bin/promptsidecar
  EIGENINFERENCE_PROMPT_SIDECAR_SOCKET: /run/darkbloom/promptsidecar.sock
  EIGENINFERENCE_PROMPT_SIDECAR_ARTIFACT_ROOT: /mnt/disks/userdata/prompt-contracts
  MIN_TRUST: hardware
  MDM_ENABLED: "true"
  EIGENINFERENCE_MIN_TRUST: hardware
  EIGENINFERENCE_BILLING_MOCK: "false"
  EIGENINFERENCE_MIN_PROVIDER_VERSION: "0.7.5"
  EIGENINFERENCE_HEALTH_EJECTION: "on"
  EIGENINFERENCE_COLD_DISPATCH: "false"
  EIGENINFERENCE_DEDICATED_MODELS: gemma-4
  EIGENINFERENCE_MIN_DECODE_TPS: "15"
  EIGENINFERENCE_QUEUE_BEFORE_SHED: "true"
  EIGENINFERENCE_QUEUE_MAX_DEPTH: "8"
  EIGENINFERENCE_QUEUE_MAX_WAIT: 6s
  EIGENINFERENCE_SERVABILITY_GATE: "true"
  EIGENINFERENCE_PREFILL_DECODE_RATIO: "12"
  EIGENINFERENCE_PREFILL_KEEPALIVE_INTERVAL: 5s
  EIGENINFERENCE_PROMPT_CALIBRATION: gpt-oss:1.3
  EIGENINFERENCE_MODEL_SOLO_TPS_SEED: gemma-4-26b-qat-4bit=14,gemma-4-26b-qat-4bit@M4|Max=70,gpt-oss-20b=30,gpt-oss-20b@M4|Max=70
  EIGENINFERENCE_TTFT_ADMISSION_MODE: shadow
  EIGENINFERENCE_TTFT_HARD_REJECT: "true"
  EIGENINFERENCE_TTFT_LIVE_DEADLINE_BASE_MS: "9000"
  EIGENINFERENCE_TTFT_OCCUPANCY_ALPHA: "50"
  EIGENINFERENCE_WARM_POOL_ENABLED: "true"
  EIGENINFERENCE_WARM_POOL_OBSERVE_ONLY: "false"
  EIGENINFERENCE_WARM_POOL_INTERVAL: 30s
  EIGENINFERENCE_WARM_POOL_MIN_DWELL: 1m
  EIGENINFERENCE_WARM_POOL_MIN_WARM: gpt-oss-20b=16,gemma-4-26b-qat-4bit=32
  EIGENINFERENCE_WARM_POOL_QUEUE_AGE_THRESHOLD: 5s
  EIGENINFERENCE_WARM_POOL_CAPACITY_REJECT_THRESHOLD: "1"
  EIGENINFERENCE_WARM_POOL_COLD_DISPATCH_THRESHOLD: "1"
  EIGENINFERENCE_WARM_POOL_LOAD_DURATION_THRESHOLD: 20s
  EIGENINFERENCE_WARM_POOL_MAX_GLOBAL_PENDING_LOADS: "16"
  EIGENINFERENCE_WARM_POOL_MAX_LOADS_PER_TICK: "8"
  EIGENINFERENCE_WARM_POOL_SPECULATIVE_START_THRESHOLD: "2"
  EIGENINFERENCE_WARM_POOL_SPECULATIVE_WIN_THRESHOLD: "1"
  EIGENINFERENCE_WARM_POOL_TTFT_MISS_THRESHOLD: "1"
  EIGENINFERENCE_WARM_POOL_WARM_SATURATION_THRESHOLD: "0.8"
  EIGENINFERENCE_CACHE_ROUTING_MODE: "off"
  EIGENINFERENCE_CACHE_ROUTING_PERCENT: "1"
  EIGENINFERENCE_CACHE_ROUTING_MAX_PLAN_QPS: "1"
  EIGENINFERENCE_PROMPT_SIDECAR_HEALTH_TIMEOUT_MS: "250"
  EIGENINFERENCE_PROMPT_SIDECAR_PRELOAD_TIMEOUT_MS: "120000"
  EIGENINFERENCE_PROMPT_SIDECAR_STARTUP_TIMEOUT_MS: "120000"
  EIGENINFERENCE_PROMPT_SIDECAR_HEALTH_INTERVAL_MS: "1000"
  EIGENINFERENCE_PROMPT_SIDECAR_HEALTH_FAILURE_THRESHOLD: "5"
  EIGENINFERENCE_PROMPT_SIDECAR_RESTART_WINDOW_MS: "60000"
  EIGENINFERENCE_PROMPT_SIDECAR_RESTART_MAX_IN_WINDOW: "3"
  EIGENINFERENCE_PROMPT_SIDECAR_RESTART_COOLDOWN_MS: "30000"
  EIGENINFERENCE_PROMPT_SIDECAR_STDERR_MAX_BYTES: "16384"
  EIGENINFERENCE_MEDIA_FETCH_ENABLED: "true"

extraEnv: []
extraVolumeMounts: []
extraVolumes: []
