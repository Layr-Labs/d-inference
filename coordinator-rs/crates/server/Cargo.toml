[package]
name = "darkbloom-coordinator-server"
description = "Axum and SQLx composition root for the Darkbloom coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws", "http2"] }
base64 = "0.22.1"
darkbloom-coordinator-core = { version = "0.1.0", path = "../core" }
darkbloom-coordinator-protocol = { version = "0.1.0", path = "../protocol" }
futures-util = { version = "0.3.32", features = ["sink"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.10.2"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.4", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
http-body-util = "0.1.3"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"], default-features = false }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

[lints]
workspace = true
