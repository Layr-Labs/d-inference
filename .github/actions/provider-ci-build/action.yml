name: Provider CI Build
description: Build full debug test products with lane-specific caches and source-matched Metal
inputs:
  lane:
    description: provider, sdk, or parity; each owns independent build outputs
    required: true
outputs:
  rust-key:
    description: Exact key for the parity job to save after successful verification
    value: ${{ steps.keys.outputs.rust-key }}
  rust-cache-hit:
    description: Whether the parity dependency cache was restored exactly
    value: ${{ steps.rust-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Validate build lane
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        case "$LANE" in
          provider|sdk|parity) ;;
          *) echo "Unknown provider CI lane: $LANE" >&2; exit 2 ;;
        esac
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12.10'
    - name: Select SDK 27 provider toolchain
      shell: bash
      run: ./scripts/prepare-provider-release-toolchain.sh
    - name: Install pinned CMake
      shell: bash
      run: ./scripts/install-release-cmake.sh
    - name: Install pinned Rust for prompt parity
      if: inputs.lane == 'parity'
      shell: bash
      run: ./scripts/install-release-rust.sh
    - name: Prepare source-matched Metal compiler
      shell: bash
      run: python3 scripts/prepare-metal-toolchain.py
    - name: Resolve compatible build and Metal caches
      id: keys
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: python3 scripts/provider-ci-cache.py keys --lane "$LANE" >> "$GITHUB_OUTPUT"
    - name: Restore lane-specific Swift test build
      id: swift-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          provider-swift/.build
          libs/mlx-swift-lm/.build
        key: ${{ steps.keys.outputs.swift-key }}
        restore-keys: ${{ steps.keys.outputs.swift-prefix }}
    - name: Restore prompt parity Cargo dependencies
      if: inputs.lane == 'parity'
      id: rust-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
          coordinator/promptsidecar/target
        key: ${{ steps.keys.outputs.rust-key }}
        restore-keys: ${{ steps.keys.outputs.rust-prefix }}
    - name: Revalidate source timestamps and discard cached runtime resources
      shell: bash
      run: |
        python3 scripts/provider-release-cache.py restore-mtimes
        for root in provider-swift/.build libs/mlx-swift-lm/.build; do
          [ -d "$root" ] || continue
          find "$root" -type f -name mlx.metallib -delete
          find "$root" -mindepth 3 -maxdepth 3 -type d \
            -path "$root/*-apple-macosx/*/*.bundle" -prune -exec rm -rf {} +
        done
    - name: Rebuild workspace Rust products
      if: inputs.lane == 'parity'
      shell: bash
      run: cargo +1.88.0 clean --manifest-path coordinator/promptsidecar/Cargo.toml -p promptsidecar
    - name: Build all provider test products
      if: inputs.lane != 'sdk'
      id: provider-build
      shell: bash
      working-directory: provider-swift
      run: |
        swift build --build-tests
        swift build --product darkbloom-fan-helper
    - name: Build all SDK test products against local MLX
      if: inputs.lane == 'sdk'
      id: sdk-build
      shell: bash
      working-directory: libs/mlx-swift-lm
      run: |
        swift package unedit --force mlx-swift >/dev/null 2>&1 || true
        swift package edit --path ../mlx-swift mlx-swift
        swift build --build-tests
    - name: Record timestamps for successfully built sources
      if: ${{ !cancelled() && (steps.provider-build.outcome == 'success' || steps.sdk-build.outcome == 'success') }}
      id: timestamps
      shell: bash
      run: python3 scripts/provider-release-cache.py snapshot-mtimes
    - name: Save lane-specific Swift test build
      if: ${{ !cancelled() && steps.timestamps.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          provider-swift/.build
          libs/mlx-swift-lm/.build
        key: ${{ steps.keys.outputs.swift-key }}
    - name: Restore source-matched Metal cache
      id: metallib-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ runner.temp }}/metallib-cache
        key: ${{ steps.keys.outputs.metallib-key }}
    - name: Validate and stage matched Metal for the actual test products
      id: metallib
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        METALLIB_CACHE_DIR: ${{ runner.temp }}/metallib-cache
      run: |
        cmake --version
        if [ "$LANE" = sdk ]; then
          bin=$(swift build --package-path libs/mlx-swift-lm --show-bin-path)
        else
          bin=$(swift build --package-path provider-swift --show-bin-path)
        fi
        ./scripts/stage-test-metallib.sh "$bin"
    - name: Save validated source-matched Metal cache
      if: ${{ !cancelled() && steps.metallib.outcome == 'success' && steps.metallib-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ runner.temp }}/metallib-cache
        key: ${{ steps.keys.outputs.metallib-key }}
