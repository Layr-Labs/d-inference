name: System Map Prose

# Writes the generated half of the system map's overlay — the prose that explains
# a route or a piece of state — and commits it to the pull request's branch.
#
# The curated overlay has two halves with very different risk. Clusters,
# namespaces, auth classes and declared tables decide what the map *draws*: a wrong
# value there publishes a wrong architecture, so they stay hand-written and the
# `System Map` gate in ci.yml keeps failing until a person supplies them. Prose
# decides only what the page *says* about something the extractor already found,
# and its gate can only ever check that a sentence exists — never that it is still
# true. That is the half that rots, and the half this job owns.
#
# What makes it safe to automate:
#
#   * Prose only. Generated text lands in a route's description and details, a
#     node's label, and the depDocs fields. Nothing here can create a node, an
#     edge, a cluster or an auth class — a new route with no cluster still fails
#     the gate for a human.
#   * Grounded. Each entry is written from the derived facts the extractor found
#     for that route or node, and `cmd/enrich` rejects a sentence naming state
#     those facts do not contain before it reaches the file.
#   * Falsifiable. Each entry stores a hash of the facts it was written from, so
#     prose describing code that has since changed becomes drift rather than a
#     confident lie.
#   * Reviewed. The output is a commit on the PR branch, so every generated
#     sentence is read by whoever reviews the code that caused it.
#
# Fork pull requests have no secrets, by design. There the job publishes the
# manifest as an artifact and fails with instructions, rather than pretending the
# prose is written.
#
# A commit pushed with GITHUB_TOKEN does not retrigger workflows, so the `System
# Map` check on this PR keeps whatever status it had before the push; this job's
# own conclusion is the current answer, because `make enrich` re-runs the gate
# after writing. The next push to the branch re-runs everything.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'coordinator/**'
      - 'tools/systemmap/**'
      - 'docs/reference/api-map/**'
      - '.github/workflows/systemmap-enrich.yml'
  workflow_dispatch:

permissions:
  contents: write

# One enrichment per branch. Cancelling a superseded run is safe: the manifest is
# derived from source, so the next run recomputes exactly what is still missing.
concurrency:
  group: systemmap-prose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Whether this run can reach the secret at all. A `workflow_dispatch` run has no
# pull request, so `head.repo.full_name` is empty — comparing it to the repository
# name directly sent every manual run down the fork path and failed it. A fork is
# a head repository that exists and is a different one.
env:
  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}

jobs:
  prose:
    name: Generate map prose
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The branch itself, not the merge commit: this job commits to it. On a
          # fork PR this checks out the fork's branch, which is untrusted code —
          # safe here only because a fork PR receives no secrets and this job
          # pushes nothing.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Plan the prose
        # No key and no network: the plan is derived from source. It fails on
        # drift, which is the normal state of a PR that added a route, so the
        # manifest is what this step is read for.
        id: plan
        run: |
          set -uo pipefail
          # A manifest left behind by anything else would be read as this commit's
          # plan, so the file this step reports on is only ever one it just wrote.
          rm -f tmp/systemmap-enrich.json
          make -C tools/systemmap plan MANIFEST=tmp/systemmap-enrich.json
          if [ ! -f tmp/systemmap-enrich.json ]; then
            echo "::error::the generator produced no manifest; it failed before it could plan"
            exit 1
          fi
          # Workflow-command lines go to the log, and only `key=value` to the output
          # file — a `::notice::` written there is not a valid output and fails the step.
          python3 - <<'PY'
          import json, os
          plan = json.load(open('tmp/systemmap-enrich.json'))
          n = len(plan['requests']) + len(plan['prune'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"work={n}\n")
              out.write(f"requests={len(plan['requests'])}\n")
          for req in plan['requests']:
              print(f"::notice::needs prose: {req['kind']}:{req['key']}")
          PY

      - name: Nothing to write
        if: steps.plan.outputs.work == '0'
        run: echo "Every route and node the map draws already has prose."

      - name: Explain the fork fallback
        # A fork PR cannot be enriched and must not silently look enriched.
        if: steps.plan.outputs.work != '0' && env.IS_FORK == 'true'
        run: |
          echo "::error::This pull request adds ${{ steps.plan.outputs.requests }} route(s) or node(s) that need map prose."
          echo "Fork pull requests receive no secrets, so prose cannot be generated here."
          echo "A maintainer runs: make -C tools/systemmap enrich"
          echo "The manifest naming exactly what is missing is attached as an artifact."
          exit 1

      - name: Write the prose
        if: steps.plan.outputs.work != '0' && env.IS_FORK != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          go -C tools/systemmap run ./cmd/enrich -manifest tmp/systemmap-enrich.json

      - name: Verify the map is complete
        if: steps.plan.outputs.work != '0' && env.IS_FORK != 'true'
        # The gate again, now with the generated prose in place. If it still
        # fails, what is missing is the half a person owns — a cluster, a
        # namespace, an auth class, a declared table — and the report says which.
        run: make -C tools/systemmap check

      - name: Commit to the pull request branch
        if: ${{ !cancelled() && steps.plan.outputs.work != '0' && env.IS_FORK != 'true' }}
        # `!cancelled()` so prose that was written survives a *later failure*: the
        # entries are correct, they cost a model call, and committing them means the
        # next run only writes what is still missing. Not `always()` — a cancelled run
        # is a superseded one, and pushing from it would race the run that replaced it.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` first, then ask the index: `git diff` says nothing about a file
          # git does not track yet, so the very first run — the one that creates
          # prose.json — reported "no prose changed" and threw the file away.
          git add docs/reference/api-map/prose.json
          if git diff --cached --quiet -- docs/reference/api-map/prose.json; then
            echo "No prose changed."
            exit 0
          fi
          git commit -F - <<'MSG'
          docs(systemmap): generate map prose

          Prose for the routes and state this branch added or changed, written from
          the facts the extractor derived and hashed against them. Prose only — no
          cluster, namespace, auth class or table declaration is touched.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          # The branch may have moved while the model was writing. Rebase onto it and
          # retry once rather than force-pushing over whatever arrived: this commit
          # touches one generated file, so a rebase either applies cleanly or the
          # branch already has newer prose and the next run recomputes what is missing.
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/$branch"
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push the generated prose after 3 attempts"
          exit 1

      - name: Upload the manifest
        if: ${{ !cancelled() && steps.plan.outputs.work != '0' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: systemmap-prose-manifest
          path: |
            tmp/systemmap-enrich.json
            docs/reference/api-map/prose.json
          if-no-files-found: warn
