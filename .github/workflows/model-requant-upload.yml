name: Model Requant Upload

# Re-quantize an existing model's language-model linears from its pinned bf16 source with
# scripts/models/requant.py, verify the result byte for byte against the canonical manifest of the
# candidate that was built and tested locally, then reserve and upload it to the model bucket
# (manifest last). It never registers or promotes: promotion stays `Register Model` with
# publish_revision_only=true and promote=true, on the owner's go.
#
# Approval: the key-holding job runs in the `prod` environment. Each run waits for Gajesh2007's
# approval of the `prod` environment (its required reviewer; admins can't bypass) before any step
# that holds a key starts. The environment's deployment policy allows `master`, `v*` branches and
# `v*` tags. This workflow adds no other gate.
#
# Owner notes on `prod` (2026-11-10 review):
#   - drop the `v*` branch rule from its deployment policy (nothing uses it; a pushed `v*` branch
#     could carry a copy of this workflow without the ref guard, leaving only the approval);
#   - create any future PROD_R2_* inside `prod` as environment secrets, not repository secrets;
#   - never add R2_* to `prod`: same-named environment secrets would silently replace the
#     repository's R2_* that `keys=legacy` means in this job.
# The gate protects only secrets created in `prod`; the repository's R2_* stay readable by any
# workflow a writer pushes, as before this workflow.
#
# Two jobs. `preflight` holds no secret: the ref guard, the inputs, the hash-pinned tools and the
# quantizer's selftest. `requant-upload` runs in the `prod` environment, after preflight passes, so
# the approval above applies, the environment's deployment policy applies, and the environment's
# secrets are visible. Three modes (default `check`):
#   check   test both R2 key sets with a read-only head-object of a known darkbloom-models object:
#           `legacy` (the repo's R2_* from 04-04, which the 0.10.11 production release used for every
#           key) and `prod` (PROD_R2_*, absent from the prod environment on 2026-11-10). Prints only
#           pass, fail or absent per set; an absent set is not a failure of the run
#   build   check + rebuild + verify against the manifest; no write
#   upload  build + the conditional revision reservation + upload with the `keys` set (default
#           legacy), which must have passed this run's check; needs confirm_version = version
#
# Dispatch from master only (`gh workflow run model-requant-upload.yml --ref master ...`): a run on
# any other ref stops at its first step, so the bytes are checked by the reviewed code. One run at a
# time; a third dispatch while one runs replaces the pending second (GitHub's concurrency rule).
#
# Inputs are untrusted: every one reaches the scripts through `env`, never through `${{ }}` inside a
# script, and `upload-model-revision.py inputs` validates them before any step that holds a secret.
# The tools are installed by hash (scripts/models/requirements-requant-upload.txt).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (both key sets, read only), build (rebuild and verify, no write) or upload
        required: true
        default: check
        type: choice
        options: [check, build, upload]
      model_id:
        description: Existing model ID (a new revision of it), for example qwen3.6-35b-a3b-vl-mtp-mxfp8
        required: true
      version:
        description: The new revision's version (one path component)
        required: true
      recipe:
        description: requant.py recipe (g32, mixed46, router8, router8+mixed46)
        required: true
      template_url:
        description: The current revision's base URL, https://models.darkbloom.ai/v2/<slug>--<sha12>/<version>
        required: true
      source_url:
        description: The bf16 source, https://huggingface.co/<owner>/<repo>/resolve/<40-hex commit>
        required: true
      manifest_json:
        description: The canonical manifest (darkbloom-publish hash) of the locally built and tested candidate
        required: true
      keys:
        description: For upload, the R2 key set, which must pass this run's check (legacy = the repo's R2_*, prod = PROD_R2_*)
        required: true
        default: legacy
        type: choice
        options: [legacy, prod]
      confirm_version:
        description: For upload only, the version again
        required: false
        default: ""

concurrency:
  group: model-requant-upload
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode }}
  MODEL_ID: ${{ inputs.model_id }}
  VERSION: ${{ inputs.version }}
  RECIPE: ${{ inputs.recipe }}
  TEMPLATE_URL: ${{ inputs.template_url }}
  SOURCE_URL: ${{ inputs.source_url }}
  MANIFEST_JSON: ${{ inputs.manifest_json }}
  KEYS: ${{ inputs.keys }}
  CONFIRM_VERSION: ${{ inputs.confirm_version }}

jobs:
  preflight:
    name: Preflight, no secrets (${{ inputs.mode }} ${{ inputs.model_id }} ${{ inputs.version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Refuse a run from any ref but master
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/master ]; then
            echo "::error::Dispatch this workflow from master: gh workflow run model-requant-upload.yml --ref master"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST_JSON" > "$RUNNER_TEMP/manifest.json"
          python3 scripts/models/upload-model-revision.py inputs --model-id "$MODEL_ID" --version "$VERSION" \
            --template-url "$TEMPLATE_URL" --source-url "$SOURCE_URL" --recipe "$RECIPE" \
            --manifest "$RUNNER_TEMP/manifest.json" --mode "$MODE" --confirm-version "$CONFIRM_VERSION" --keys "$KEYS"

      - name: Install tools by hash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r scripts/models/requirements-requant-upload.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Self-test the quantizer against the recorded digests
        run: |
          set -euo pipefail
          sha256sum scripts/models/requant.py
          python3 scripts/models/requant.py selftest

  requant-upload:
    name: ${{ inputs.mode }} ${{ inputs.model_id }} ${{ inputs.version }} (prod approval)
    needs: preflight
    environment: prod
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 300
    steps:
      - name: Refuse a run from any ref but master
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/master ]; then
            echo "::error::Dispatch this workflow from master: gh workflow run model-requant-upload.yml --ref master"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate inputs (no secret in scope)
        id: inputs
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST_JSON" > "$RUNNER_TEMP/manifest.json"
          python3 scripts/models/upload-model-revision.py inputs --model-id "$MODEL_ID" --version "$VERSION" \
            --template-url "$TEMPLATE_URL" --source-url "$SOURCE_URL" --recipe "$RECIPE" \
            --manifest "$RUNNER_TEMP/manifest.json" --mode "$MODE" --confirm-version "$CONFIRM_VERSION" --keys "$KEYS"

      - name: Install tools by hash (numpy as the local build's, so the bytes reproduce; awscli for R2)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r scripts/models/requirements-requant-upload.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Self-test the quantizer against the recorded digests
        run: |
          set -euo pipefail
          sha256sum scripts/models/requant.py
          python3 scripts/models/requant.py selftest

      - name: Check both R2 key sets against the model bucket (read only)
        id: check
        env:
          PROD_R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          PROD_R2_ENDPOINT: ${{ secrets.PROD_R2_ENDPOINT }}
          LEGACY_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          LEGACY_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LEGACY_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          KEY: ${{ steps.inputs.outputs.template_manifest_key }}
        run: |
          set -euo pipefail
          # One set: absent (every part empty), incomplete (some empty), or a head-object of the
          # template's manifest.json. Only the verdict is printed: aws's error text can name the endpoint.
          probe() {
            local label=$1 id=$2 secret=$3 endpoint=$4
            if [ -z "$id$secret$endpoint" ]; then
              echo "keys $label: absent"
              verdict=absent
            elif [ -z "$id" ] || [ -z "$secret" ] || [ -z "$endpoint" ]; then
              echo "keys $label: fail (incomplete)"
              verdict=fail
            elif AWS_ACCESS_KEY_ID="$id" AWS_SECRET_ACCESS_KEY="$secret" aws s3api head-object \
                 --bucket darkbloom-models --key "$KEY" --endpoint-url "$endpoint" --region auto > /dev/null 2>&1; then
              echo "keys $label: pass"
              verdict=pass
            else
              echo "keys $label: fail"
              verdict=fail
            fi
          }
          verdict=fail
          probe "prod (PROD_R2_*)" "${PROD_R2_ACCESS_KEY_ID:-}" "${PROD_R2_SECRET_ACCESS_KEY:-}" "${PROD_R2_ENDPOINT:-}"
          prod=$verdict
          probe "legacy (R2_*)" "${LEGACY_R2_ACCESS_KEY_ID:-}" "${LEGACY_R2_SECRET_ACCESS_KEY:-}" "${LEGACY_R2_ENDPOINT:-}"
          legacy=$verdict
          { echo "prod=$prod"; echo "legacy=$legacy"; } >> "$GITHUB_OUTPUT"
          if [ "$prod" != pass ] && [ "$legacy" != pass ]; then
            echo "::error::No R2 key set can read darkbloom-models."
            exit 1
          fi
          if [ "$MODE" = upload ]; then
            case "$KEYS" in
              prod) chosen=$prod ;;
              legacy) chosen=$legacy ;;
              *) chosen=fail ;;
            esac
            if [ "$chosen" != pass ]; then
              echo "::error::The keys=$KEYS set is $chosen in this check, so this run cannot upload."
              exit 1
            fi
          fi

      - name: Free runner disk
        if: env.MODE != 'check'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$RUNNER_TEMP"

      - name: Rebuild the candidate
        if: env.MODE != 'check'
        run: |
          set -euo pipefail
          need=$(python3 -c 'import json,os; print(int(json.load(open(os.environ["RUNNER_TEMP"]+"/manifest.json"))["total_size_bytes"]/2**30)+10)')
          free=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc 0-9)
          [ "$free" -ge "$need" ] || { echo "::error::runner has ${free} GiB free, needs ${need}"; exit 1; }
          python3 scripts/models/requant.py build --template "$TEMPLATE_URL" --source "$SOURCE_URL" \
            --recipe "$RECIPE" --out "$RUNNER_TEMP/model"

      - name: Verify against the manifest
        if: env.MODE != 'check'
        run: python3 scripts/models/upload-model-revision.py verify --manifest "$RUNNER_TEMP/manifest.json" --directory "$RUNNER_TEMP/model"

      - name: Reserve and upload (manifest last; no registration, no promotion)
        if: env.MODE == 'upload'
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.keys == 'prod' && secrets.PROD_R2_ACCESS_KEY_ID || '' }}${{ inputs.keys == 'legacy' && secrets.R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.keys == 'prod' && secrets.PROD_R2_SECRET_ACCESS_KEY || '' }}${{ inputs.keys == 'legacy' && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_ENDPOINT: ${{ inputs.keys == 'prod' && secrets.PROD_R2_ENDPOINT || '' }}${{ inputs.keys == 'legacy' && secrets.R2_ENDPOINT || '' }}
          PROD_CHECK: ${{ steps.check.outputs.prod }}
          LEGACY_CHECK: ${{ steps.check.outputs.legacy }}
        run: |
          set -euo pipefail
          case "$KEYS" in
            prod) checked=${PROD_CHECK:-}; names="PROD_R2_ACCESS_KEY_ID PROD_R2_SECRET_ACCESS_KEY PROD_R2_ENDPOINT" ;;
            legacy) checked=${LEGACY_CHECK:-}; names="R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT" ;;
            *) echo "::error::keys must be prod or legacy"; exit 1 ;;
          esac
          if [ "$checked" != pass ]; then
            echo "::error::The keys=$KEYS set did not pass this run's check; upload refused."
            exit 1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ENDPOINT:-}" ]; then
            echo "::error::A secret of the keys=$KEYS set is empty ($names)."
            exit 1
          fi
          python3 scripts/models/upload-model-revision.py upload --manifest "$RUNNER_TEMP/manifest.json" \
            --directory "$RUNNER_TEMP/model" --endpoint "$R2_ENDPOINT"
          echo "Next, on the owner's go: Register Model with model_id=$MODEL_ID version=$VERSION publish_revision_only=true promote=true"
