name: Landing

on:
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  push:
    branches: [master, main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        check linux_arm64 blacksmith-4vcpu-ubuntu-2404

  check:
    name: Landing Lint, Build & Test
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['check'] }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: ${{ env.CI_ACTIONS_CACHE != 'off' && 'npm' || '' }}
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
