name: Provider Signing Validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of a commit on master to build
        required: true
        type: string
      version:
        description: Exact existing source version; does not change source
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build unsigned validation input
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 60
    # One set of names for build, stage and sign. The stage step records the
    # same set in unsigned-files.json, and unpack checks the app against it.
    outputs:
      app_name: ${{ steps.identity.outputs.APP_NAME }}
      cli_name: ${{ steps.identity.outputs.CLI_NAME }}
      enclave_name: ${{ steps.identity.outputs.ENCLAVE_NAME }}
      release_environment: ${{ steps.identity.outputs.DARKBLOOM_RELEASE_ENVIRONMENT }}
      unsigned_artifact_id: ${{ steps.unsigned_retention.outputs.artifact-id }}
      unsigned_artifact_digest: ${{ steps.unsigned_retention.outputs.artifact-digest }}
    steps:
      - name: Checkout reviewed workflow tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Install pinned GitHub CLI
        run: bash tooling/scripts/install-macos-github-cli.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      # Dispatched on master, and the commit to build is verified and on
      # master's ancestry (scripts/provider_release_resume/api.py).
      - name: Require a reviewed master source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/scripts/provider-release-resume.py verify-validation-source --source "$SOURCE_SHA"
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Select the Xcode 27.2 release toolchain
        env:
          DARKBLOOM_PROVIDER_TOOLCHAIN: release
        run: bash tooling/scripts/prepare-provider-release-toolchain.sh
      - name: Validate packaging and workflow isolation guards
        run: python3 tooling/scripts/test-provider-signing-validation.py
      - name: Resolve packaged names and build environment
        id: identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        # The candidate's own identity file, so the products and the
        # environment agree with the source that is built. A candidate from
        # before that file existed uses this tooling's file.
        run: |
          set -euo pipefail
          {
            python3 tooling/scripts/provider_release_identity.py --source candidate "$EXPECTED_VERSION"
            echo "DARKBLOOM_RELEASE_ENVIRONMENT=$(python3 tooling/scripts/provider_release_identity.py --environment --source candidate "$EXPECTED_VERSION")"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
      - name: Install pinned CMake for Metal build
        run: bash tooling/scripts/install-release-cmake.sh
      - name: Build exact source and stage unsigned app
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SOURCE"
          candidate/scripts/check-release-version.sh "$EXPECTED_VERSION"
          cmake --version
          cd candidate/provider-swift
          # The release swift wrapper adds --build-system native and the selected SDK.
          # A fixed 8 MiB main-thread stack, as the release build links it
          # (tooling/scripts/check-fixed-stack.sh).
          stack=(-Xlinker -stack_size -Xlinker 0x800000)
          swift build -c release --scratch-path "$RUNNER_TEMP/provider-build" --product "$PRODUCT_CLI_NAME" "${stack[@]}"
          swift build -c release --scratch-path "$RUNNER_TEMP/provider-build" --product "$PRODUCT_ENCLAVE_NAME" "${stack[@]}"
          swift build -c release --scratch-path "$RUNNER_TEMP/provider-build" --product darkbloom-fan-helper "${stack[@]}"
          bin_dir=$(swift build -c release --scratch-path "$RUNNER_TEMP/provider-build" --show-bin-path)
          cd "$GITHUB_WORKSPACE"
          bash tooling/scripts/check-fixed-stack.sh \
            "$bin_dir/$PRODUCT_CLI_NAME" "$bin_dir/$PRODUCT_ENCLAVE_NAME" "$bin_dir/darkbloom-fan-helper"
          METALLIB_CACHE_DIR="$RUNNER_TEMP/metallib-cache" candidate/scripts/fetch-metallib.sh "$RUNNER_TEMP/metallib"
          DARKBLOOM_CLUSTER_WORKER_BUILD_JOBS="$(sysctl -n hw.logicalcpu)" \
            candidate/scripts/build-cluster-helpers.sh "$RUNNER_TEMP/metallib/mlx.metallib" "$RUNNER_TEMP/cluster-helpers"
          bash tooling/scripts/check-fixed-stack.sh \
            "$RUNNER_TEMP/cluster-helpers/darkbloom-cluster-worker" "$RUNNER_TEMP/cluster-helpers/darkbloom-cluster-plan"
          python3 tooling/scripts/provider-signing-validation.py stage \
            --source "$GITHUB_WORKSPACE/candidate" --bin "$bin_dir" \
            --metallib "$RUNNER_TEMP/metallib/mlx.metallib" \
            --cluster-helpers "$RUNNER_TEMP/cluster-helpers" \
            --output "$RUNNER_TEMP/unsigned-stage" --version "$EXPECTED_VERSION"
          tar czf "$RUNNER_TEMP/unsigned-validation.tar.gz" -C "$RUNNER_TEMP/unsigned-stage" .
      - name: Retain unsigned input for the separate signing job
        id: unsigned_retention
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-signing-input
          path: ${{ runner.temp }}/unsigned-validation.tar.gz
          retention-days: 7
          if-no-files-found: error

  signing:
    name: Validate signing and notarization without publication
    needs: build
    runs-on: blacksmith-12vcpu-macos-27
    # The signing and notarization secrets are prod's; its branch policy and
    # reviewers apply before this job starts.
    environment: prod
    timeout-minutes: 35
    env:
      DEVELOPER_ID: 'Developer ID Application: Eigen Labs, Inc. (SLDQ2GJ6TL)'
      APPLE_TEAM_ID: SLDQ2GJ6TL
      SIGNING_CERTIFICATE_REQUIREMENT: 'certificate leaf = H"95b67556e04653f56ba5411d20d33dd263ef6e2a"'
      APP_NAME: ${{ needs.build.outputs.app_name }}
      CLI_NAME: ${{ needs.build.outputs.cli_name }}
      ENCLAVE_NAME: ${{ needs.build.outputs.enclave_name }}
      DARKBLOOM_RELEASE_ENVIRONMENT: ${{ needs.build.outputs.release_environment }}
    steps:
      - name: Checkout reviewed signing tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Install pinned GitHub CLI
        run: bash tooling/scripts/install-macos-github-cli.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select the Xcode 27.2 release toolchain
        env:
          DARKBLOOM_PROVIDER_TOOLCHAIN: release
        run: bash tooling/scripts/prepare-provider-release-toolchain.sh
      - name: Read this run's unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          UNSIGNED_ARTIFACT_ID: ${{ needs.build.outputs.unsigned_artifact_id }}
          UNSIGNED_ARTIFACT_DIGEST: ${{ needs.build.outputs.unsigned_artifact_digest }}
        run: |
          set -euo pipefail
          # The exact bytes the build job uploaded: its artifact id, its digest
          # and this run, not whichever artifact carries the name.
          python3 tooling/scripts/provider-release-publication.py download \
            --artifact-id "$UNSIGNED_ARTIFACT_ID" --artifact-digest "$UNSIGNED_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" --directory "$RUNNER_TEMP/incoming"
          python3 tooling/scripts/provider-signing-validation.py unpack \
            --archive "$RUNNER_TEMP/incoming/unsigned-validation.tar.gz" \
            --output "$RUNNER_TEMP/signing-stage" \
            --source-sha "$EXPECTED_SOURCE" --version "$EXPECTED_VERSION"
      - name: Embed and check the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PROFILE_BASE64"
          app="$RUNNER_TEMP/signing-stage/$APP_NAME"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$app/Contents/embedded.provisionprofile"
          security cms -D -i "$app/Contents/embedded.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          python3 tooling/scripts/provider-signing-validation.py profile --profile "$RUNNER_TEMP/profile.plist"
          python3 tooling/scripts/prepare-app-attest-entitlements.py \
            --base tooling/provider-swift/entitlements.plist --profile "$RUNNER_TEMP/profile.plist" \
            --output "$RUNNER_TEMP/provider-signing-entitlements.plist"
      # The signing key exists from here to the step 'Remove the signing
      # keychain', for the codesign calls alone.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash tooling/scripts/import-signing-certificate.sh "$RUNNER_TEMP/signing-validation.keychain-db"
      - name: Sign and statically verify the app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/signing-stage/$APP_NAME"
          keychain="$RUNNER_TEMP/signing-validation.keychain-db"
          codesign --force --options runtime --timestamp --identifier io.darkbloom.fan-helper \
            --keychain "$keychain" --sign "$DEVELOPER_ID" "$app/Contents/Helpers/darkbloom-fan-helper"
          codesign --verify --strict -R="anchor apple generic and identifier \"io.darkbloom.fan-helper\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and $SIGNING_CERTIFICATE_REQUIREMENT" \
            "$app/Contents/Helpers/darkbloom-fan-helper"
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$DEVELOPER_ID" "$app/Contents/MacOS/mlx.metallib"
          bash tooling/scripts/sign-cluster-helpers.sh "$app" "$keychain" "$DEVELOPER_ID" "$APPLE_TEAM_ID" \
            tooling/provider-swift/entitlements-cluster-worker.plist
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --entitlements tooling/provider-swift/entitlements-enclave.plist \
            --sign "$DEVELOPER_ID" "$app/Contents/MacOS/$ENCLAVE_NAME"
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --entitlements "$RUNNER_TEMP/provider-signing-entitlements.plist" \
            --sign "$DEVELOPER_ID" "$app/Contents/MacOS/$CLI_NAME"
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --entitlements "$RUNNER_TEMP/provider-signing-entitlements.plist" --sign "$DEVELOPER_ID" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/$CLI_NAME"
          codesign -d --entitlements - --xml "$app/Contents/MacOS/$CLI_NAME" > "$RUNNER_TEMP/cli-entitlements.plist"
          python3 tooling/scripts/provider-signing-validation.py cli-entitlements --plist "$RUNNER_TEMP/cli-entitlements.plist"
          # Every executable in the app (the CLI, the enclave and fan helpers,
          # the cluster worker and plan) must be signed by the Developer ID with
          # get-task-allow absent, as in the release workflow.
          python3 tooling/scripts/provider-signing-validation.py bundle-entitlements --app "$app"
          python3 tooling/scripts/prepare-app-attest-entitlements.py \
            --base tooling/provider-swift/entitlements.plist --profile "$RUNNER_TEMP/profile.plist" \
            --output "$RUNNER_TEMP/provider-signing-entitlements.plist" --verify "$RUNNER_TEMP/cli-entitlements.plist"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarization-input.zip"
      - name: Remove the signing keychain
        run: bash tooling/scripts/remove-signing-keychain.sh "$RUNNER_TEMP/signing-validation.keychain-db" "$DEVELOPER_ID"
      # The notarization credentials are in this step alone, after the key is gone.
      - name: Validate Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD"
          xcrun notarytool submit "$RUNNER_TEMP/notarization-input.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 15m --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,sys; result=json.load(open(sys.argv[1])); assert result.get("status")=="Accepted" and result.get("id")' "$RUNNER_TEMP/notary-result.json"
      - name: Staple and verify the notarized app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/signing-stage/$APP_NAME"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 tooling/scripts/provider-signing-validation.py cluster-helpers --app "$app"
          bash tooling/scripts/sign-cluster-helpers.sh --verify "$app" "$APPLE_TEAM_ID"
          python3 tooling/scripts/provider-signing-validation.py receipt \
            --output "$RUNNER_TEMP/signing-stage" --notary "$RUNNER_TEMP/notary-result.json"
          tar czf "$RUNNER_TEMP/signed-validation.tar.gz" -C "$RUNNER_TEMP/signing-stage" .
          shasum -a 256 "$RUNNER_TEMP/signed-validation.tar.gz" > "$RUNNER_TEMP/signed-validation.sha256"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing-validation.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/profile.plist"
      - name: Retain signing-validation artifact only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-signing-validation
          path: |
            ${{ runner.temp }}/signed-validation.tar.gz
            ${{ runner.temp }}/signed-validation.sha256
            ${{ runner.temp }}/notary-result.json
          retention-days: 3
          if-no-files-found: error
      - name: Retain non-secret notarization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-signing-validation-diagnostics
          path: ${{ runner.temp }}/notary-result.json
          retention-days: 3
          if-no-files-found: ignore
