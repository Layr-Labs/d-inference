name: Threat Model Review (advisory)

on:
  pull_request_target:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      preflight:
        description: 'Verify state writes, budget capacity and funding without paid calls'
        type: boolean
        default: true

permissions:
  contents: write # atomic budget ledger and report checkpoints on a dedicated branch
  pull-requests: write

jobs:
  preflight:
    name: Threat review activation preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create a short-lived state-writer token
        if: ${{ vars.THREAT_REVIEW_APP_ID != '' }}
        id: state-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.THREAT_REVIEW_APP_ID }}
          private-key: ${{ secrets.THREAT_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Check out the maintainer-selected workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /docs/threat-model.yaml
      - name: Verify activation without paid calls
        env:
          GH_TOKEN: ${{ steps.state-token.outputs.token || secrets.THREAT_REVIEW_STATE_TOKEN || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THREAT_REVIEW_BUDGET_MODE: ${{ vars.THREAT_REVIEW_BUDGET_MODE }}
        run: python3 .github/scripts/threat-review-preflight.py
  review:
    name: Threat Model Review (advisory)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      THREAT_REVIEW_REQUIRE_CLEARANCE: ${{ vars.THREAT_REVIEW_REQUIRE_CLEARANCE }}
      # Untrusted forks keep the existing capped OpenRouter path unless a
      # maintainer explicitly opts them into AWS.
      BEDROCK_SCAN_ENABLED: ${{ vars.BEDROCK_SCAN_ENABLED == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || vars.BEDROCK_SCAN_ALLOW_FORKS == 'true') && 'true' || 'false' }}
    # Conditional clearance is activated only after its exact workflow rule is installed.
    continue-on-error: ${{ vars.THREAT_REVIEW_REQUIRE_CLEARANCE != 'true' }}
    if: >-
      ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
          (github.event.action != 'edited' || github.event.changes.base.ref.from != '' || vars.THREAT_REVIEW_REQUIRE_CLEARANCE == 'true') }}
    # In clearance mode an edited PR must not replace a failed required run with
    # a skipped success. Advisory mode still ignores ordinary title/body edits.
    concurrency:
      group: threat-model-advisory-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out the current trusted scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
      - name: Record scanner revision
        run: echo "THREAT_REVIEW_SCANNER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check for an independent manual override
        id: merge-policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/threat-review-gate.py before
      - name: Coalesce follow-up pushes
        if: ${{ github.event.action == 'synchronize' }}
        run: sleep 75
      - name: Create a short-lived state-writer token
        if: ${{ steps.merge-policy.outputs.overridden != 'true' && vars.THREAT_REVIEW_APP_ID != '' }}
        id: state-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.THREAT_REVIEW_APP_ID }}
          private-key: ${{ secrets.THREAT_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Install pinned Bedrock client
        if: ${{ steps.merge-policy.outputs.overridden != 'true' && env.BEDROCK_SCAN_ENABLED == 'true' }}
        run: python3 -m pip install --require-hashes -r .github/scripts/requirements-bedrock.txt
      - name: Obtain short-lived Bedrock credentials
        id: bedrock-auth
        if: ${{ steps.merge-policy.outputs.overridden != 'true' && env.BEDROCK_SCAN_ENABLED == 'true' }}
        continue-on-error: true # Explicitly accounted OpenRouter fallback remains available.
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.BEDROCK_SCAN_ROLE_ARN }}
          aws-region: ${{ vars.BEDROCK_SCAN_AWS_REGION || 'us-east-1' }}
          role-session-name: ghscan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          retry-max-attempts: 1
      - name: Review PR patches as data
        if: ${{ steps.merge-policy.outputs.overridden != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THREAT_REVIEW_BUDGET_MODE: ${{ vars.THREAT_REVIEW_BUDGET_MODE }}
          THREAT_REVIEW_STATE_TOKEN: ${{ steps.state-token.outputs.token || secrets.THREAT_REVIEW_STATE_TOKEN }}
          THREAT_REVIEW_RESULT_FILE: ${{ runner.temp }}/threat-review-result.json
          THREAT_REVIEW_DIAGNOSTICS_FILE: ${{ runner.temp }}/threat-review-diagnostics.json
          THREAT_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Stop with enough time to save findings, publish the human handoff
          # and evaluate clearance before the job or one-hour credentials end.
          THREAT_REVIEW_TIMEOUT_SECONDS: '3000'
          THREAT_REVIEW_ENABLED: ${{ vars.THREAT_REVIEW_ENABLED }}
          BEDROCK_SCAN_PROFILES: ${{ vars.BEDROCK_SCAN_PROFILES }}
          BEDROCK_SCAN_AWS_REGION: ${{ vars.BEDROCK_SCAN_AWS_REGION || 'us-east-1' }}
          BEDROCK_SCAN_CALL_POLICY: workload
          BEDROCK_SCAN_MAX_WORKLOAD_CALLS: ${{ vars.BEDROCK_SCAN_MAX_WORKLOAD_CALLS || '500' }}
          BEDROCK_SCAN_MAX_OUTPUT_TOKENS: ${{ vars.BEDROCK_SCAN_MAX_OUTPUT_TOKENS || '16384' }}
          BEDROCK_SCAN_CREDENTIALS_READY: ${{ steps.bedrock-auth.outcome == 'success' && 'true' || 'false' }}
          BEDROCK_SCAN_USAGE_FILE: ${{ runner.temp }}/bedrock-usage.jsonl
        run: python3 .github/scripts/threat-model-review.py
      - name: Preserve content-free review diagnostics
        if: ${{ always() && steps.merge-policy.outputs.overridden != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threat-review-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/threat-review-diagnostics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve Bedrock usage metadata
        if: ${{ always() && env.BEDROCK_SCAN_ENABLED == 'true' && steps.merge-policy.outputs.overridden != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bedrock-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bedrock-usage.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Create a read-only organization membership token
        id: membership-token
        if: ${{ always() && vars.THREAT_REVIEW_REQUIRE_CLEARANCE == 'true' && steps.merge-policy.outputs.overridden != 'true' && vars.THREAT_REVIEW_APP_ID != '' }}
        continue-on-error: true # Missing membership proof still fails the gate below.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.THREAT_REVIEW_APP_ID }}
          private-key: ${{ secrets.THREAT_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-members: read
      - name: Evaluate conditional merge clearance
        if: ${{ always() && vars.THREAT_REVIEW_REQUIRE_CLEARANCE == 'true' }}
        env:
          THREAT_REVIEW_RESULT_FILE: ${{ runner.temp }}/threat-review-result.json
          THREAT_REVIEW_MEMBERSHIP_TOKEN: ${{ steps.membership-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/threat-review-gate.py after
      - name: Report infrastructure failure
        if: ${{ failure() }}
        run: echo 'Threat-model review incomplete; human review required. Do not manually rerun the paid scan.' >> "$GITHUB_STEP_SUMMARY"
