name: Landing

on:
  # Pull requests run on request only: the `run-ci` label or ready for
  # review (the route job's `if:`), never a push to the branch.
  pull_request:
    types: [labeled, ready_for_review]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  push:
    branches: [master, main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'

permissions:
  contents: read

concurrency:
  # Any other label runs in a group of its own, skips every job and cancels nothing.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'run-ci' && format('label-{0}', github.run_id)) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'run-ci' }}
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        check linux_arm64 blacksmith-4vcpu-ubuntu-2404 1 balanced 4x16

  check:
    name: Landing Lint, Build & Test
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['check'] }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: ${{ env.CI_ACTIONS_CACHE != 'off' && 'npm' || '' }}
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
