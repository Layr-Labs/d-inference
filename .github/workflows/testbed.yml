name: Testbed Integration

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  testbed-integration:
    name: Testbed Integration Test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LIVE_TESTBED_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: coordinator/go.mod

      - name: Install vllm-mlx
        run: |
          brew install python@3.12 2>/dev/null || true
          python3.12 -m pip install --quiet --break-system-packages \
            'mlx-lm>=0.31.2' \
            'vllm-mlx' \
            tokenizers
          python3.12 -c "import vllm_mlx; print(f'vllm-mlx {vllm_mlx.__version__}')"

      - name: Start vllm-mlx backend
        run: |
          vllm-mlx serve mlx-community/Qwen3.5-0.8B-MLX-4bit --port 18200 --host 127.0.0.1 &
          echo "waiting for backend to load model (up to 5 min)..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18200/health 2>/dev/null | python3.12 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('model_loaded') else 1)" 2>/dev/null; then
              echo "backend healthy after $((i*2))s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: backend did not become healthy within 180s"
              exit 1
            fi
            sleep 2
          done

      - name: Run testbed integration test
        run: |
          cd coordinator
          go test -race -v -timeout=300s ./testbed/integration/ -run TestIntegration_TestbedFramework

      - name: Run testbed unit tests
        run: |
          cd coordinator
          go test -race ./testbed/ ./testbed/assert/ ./testbed/profile/
