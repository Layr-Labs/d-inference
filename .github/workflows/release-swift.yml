name: Release Provider Bundle (Swift)

# CLI-only Swift release pipeline.
#
# Builds and ships:
#   - bin/darkbloom          (provider CLI)
#   - bin/darkbloom-enclave  (Secure Enclave attestation/sign helper)
#   - bin/mlx.metallib       (worker's compiled Metal kernels; verifier copy)
#   - Darkbloom.app/Contents/XPCServices/DarkbloomInferenceWorker.xpc
#   - Darkbloom.app/Contents/Helpers/darkbloom-fan-helper (dormant opt-in root helper)
#   - worker XPC mlx.metallib plus the exact paged-attention Metal resource
#
# install.sh creates a backward-compatibility symlink from the legacy
# `eigeninference-enclave` name to `darkbloom-enclave` for existing
# installations that referenced the old binary name.
#
# No SwiftUI app, no DMG, and no Python runtime — this is a pure Swift CLI
# build. The legacy `release.yml` was deleted alongside `app/` once we
# committed to a CLI-only migration.
#
# Swift cutover tag conventions:
#   - vX.Y.Z           -> prod Swift release (reviewer approval required)
#   - vX.Y.Z-swift     -> accepted alias while the migration is in progress
#   - vX.Y.Z-swift.N   -> accepted alias while the migration is in progress
# Dev releases use workflow_dispatch so the requested version can remain
# byte-identical to the checked-in provider and coordinator source constants.
#
# Repo secrets use DEV_/PROD_ prefixes so both environments can remain at
# repo level. The release job still binds the resolved GitHub environment so
# production tags must pass the environment's deployment protection rules:
#   DEV_R2_ACCESS_KEY_ID  / PROD_R2_ACCESS_KEY_ID
#   DEV_R2_SECRET_ACCESS_KEY / PROD_R2_SECRET_ACCESS_KEY
#   DEV_R2_ENDPOINT       / PROD_R2_ENDPOINT
#   DEV_R2_BUCKET         / PROD_R2_BUCKET
#   DEV_R2_PUBLIC_URL     / PROD_R2_PUBLIC_URL
#   DEV_COORDINATOR_URL   / PROD_COORDINATOR_URL
#   DEV_RELEASE_KEY       / PROD_RELEASE_KEY
# Apple signing secrets are shared (same cert for both envs).

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*-swift'
      - 'v*-swift.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      version_override:
        description: 'Optional version string when running manually (otherwise derived from tag)'
        required: false
        type: string

permissions:
  contents: write   # gh release create

env:
  DEVELOPER_ID: 'Developer ID Application: Eigen Labs, Inc. (SLDQ2GJ6TL)'
  APPLE_TEAM_ID: 'SLDQ2GJ6TL'
  CLI_NAME: 'darkbloom'
  ENCLAVE_NAME: 'darkbloom-enclave'
  FAN_HELPER_NAME: 'darkbloom-fan-helper'
  FAN_HELPER_ID: 'io.darkbloom.fan-helper'
  WORKER_NAME: 'darkbloom-inference-worker'
  WORKER_BUNDLE_NAME: 'DarkbloomInferenceWorker.xpc'
  WORKER_ID: 'io.darkbloom.provider.inference-worker'
  MIN_MACOS: '14.0'
  # The mlx.metallib (compiled Metal GPU kernels) is BUILT FROM SOURCE from the
  # MLX fork pinned at libs/mlx-swift/Source/Cmlx/mlx — NOT fetched from a PyPI
  # wheel. Building from source guarantees the GPU kernels match the exact fork
  # commit the host C++ links against (incl. the resource-count trim and the M5
  # _nax kernels) and removes the dependency on a published wheel (there is no
  # mlx==0.32.0 on PyPI). The _nax kernels are only compiled when SDK >= 26.2
  # AND deployment target >= 26.2 AND Metal >= 4.0 (see
  # mlx/backend/metal/kernels/CMakeLists.txt), so we pin the deployment target.
  MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'

jobs:
  resolve-env:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.environment }}" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="prod"
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == *-dev.* ]]; then
            echo "::error::-dev tags are unsupported by the exact-version release contract; use workflow_dispatch with environment=dev"
            exit 1
          fi
          if [ "$ENV" = "prod" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Production publication requires a source-matching release tag"
            exit 1
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          elif [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION=$(awk -F'\"' '/public static let version =/ { print $2 }' \
              provider-swift/Sources/ProviderCore/ProviderCore.swift)
          else
            REF="${GITHUB_REF_NAME#v}"
            VERSION="${REF%-swift*}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved env=$ENV version=$VERSION"

      - name: Fail before approval on version drift
        run: ./scripts/check-release-version.sh "${{ steps.pick.outputs.version }}"

  build-and-release:
    name: Build, sign, notarize, upload, register
    needs: [resolve-env]
    runs-on: blacksmith-12vcpu-macos-latest
    environment: ${{ needs.resolve-env.outputs.environment }}

    env:
      VERSION: ${{ needs.resolve-env.outputs.version }}
      ENV_PREFIX: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - name: Resolve env-specific secrets
        env:
          ENV_PREFIX: ${{ needs.resolve-env.outputs.environment }}
          DEV_R2_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          PROD_R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          DEV_R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          DEV_R2_ENDPOINT: ${{ secrets.DEV_R2_ENDPOINT }}
          PROD_R2_ENDPOINT: ${{ secrets.PROD_R2_ENDPOINT }}
          DEV_R2_BUCKET: ${{ secrets.DEV_R2_BUCKET }}
          PROD_R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          DEV_R2_PUBLIC_URL: ${{ secrets.DEV_R2_PUBLIC_URL }}
          PROD_R2_PUBLIC_URL: ${{ secrets.PROD_R2_PUBLIC_URL }}
          DEV_COORDINATOR_URL: ${{ secrets.DEV_COORDINATOR_URL }}
          PROD_COORDINATOR_URL: ${{ secrets.PROD_COORDINATOR_URL }}
          DEV_RELEASE_KEY: ${{ secrets.DEV_RELEASE_KEY }}
          PROD_RELEASE_KEY: ${{ secrets.PROD_RELEASE_KEY }}
          # Legacy unprefixed prod secrets (pre-DEV_/PROD_ split). Fall back
          # to these when PROD_* is empty so we don't have to duplicate every
          # secret in the GitHub UI just to satisfy the new naming scheme.
          LEGACY_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          LEGACY_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LEGACY_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          LEGACY_R2_BUCKET: ${{ vars.R2_BUCKET }}
          LEGACY_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          LEGACY_COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
          LEGACY_RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          set -euo pipefail
          PREFIX=$(echo "$ENV_PREFIX" | tr '[:lower:]' '[:upper:]')
          for key in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL COORDINATOR_URL RELEASE_KEY; do
            primary="${PREFIX}_${key}"
            legacy="LEGACY_${key}"
            outkey=$(echo "$key" | tr '[:upper:]' '[:lower:]')
            value="${!primary:-}"
            if [ -z "$value" ] && [ "$PREFIX" = "PROD" ]; then
              value="${!legacy:-}"
              if [ -n "$value" ]; then
                echo "::notice::Using legacy unprefixed secret for ${key} (set PROD_${key} to silence this)"
              fi
            fi
            if [ -z "$value" ]; then
              echo "::error::No value resolved for ${PREFIX}_${key} (also tried LEGACY_${key})"
              exit 1
            fi
            echo "${outkey}=${value}" >> "$GITHUB_ENV"
          done

      - name: Checkout (with submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0   # gh release --generate-notes wants full history

      - name: Validate release version integrity
        run: ./scripts/check-release-version.sh "$VERSION"
      - name: Validate inference worker release fixtures
        run: |
          set -euo pipefail
          ./scripts/sync-install-embed.sh check
          plutil -lint \
            scripts/entitlements.plist \
            scripts/inference-worker-entitlements.plist \
            scripts/inference-worker-Info.plist
          python3 - <<'PY'
          import plistlib

          def load(path):
              with open(path, "rb") as stream:
                  return plistlib.load(stream)

          info = load("scripts/inference-worker-Info.plist")
          expected_info = {
              "CFBundleIdentifier": "io.darkbloom.provider.inference-worker",
              "CFBundleExecutable": "darkbloom-inference-worker",
              "CFBundlePackageType": "XPC!",
              "LSMinimumSystemVersion": "14.0",
          }
          for key, expected in expected_info.items():
              actual = info.get(key)
              if actual != expected:
                  raise SystemExit(f"worker Info.plist {key}={actual!r}, expected {expected!r}")
          if info.get("XPCService", {}).get("ServiceType") != "Application":
              raise SystemExit("worker Info.plist must declare XPCService.ServiceType=Application")

          worker = load("scripts/inference-worker-entitlements.plist")
          expected_worker = {
              "com.apple.application-identifier":
                  "SLDQ2GJ6TL.io.darkbloom.provider.inference-worker",
              "keychain-access-groups": ["SLDQ2GJ6TL.io.darkbloom.provider"],
              "com.apple.security.app-sandbox": True,
              "com.apple.security.files.bookmarks.app-scope": True,
          }
          if worker != expected_worker:
              raise SystemExit(
                  f"worker entitlements must be the exact minimal allowlist; got {sorted(worker)}"
              )

          main = load("scripts/entitlements.plist")
          service = main.get(
              "com.apple.security.temporary-exception.mach-lookup.global-name"
          )
          if service != ["io.darkbloom.provider.inference-worker"]:
              raise SystemExit(f"main XPC lookup allowlist is not exact: {service!r}")
          PY

      - name: Set up Go for prompt parity
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.4.0
        with:
          go-version: '1.25.0'

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          go version
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          uname -a

      - name: Prepare private release workspace
        run: |
          set -euo pipefail
          old_umask=$(umask)
          umask 077
          RELEASE_PRIVATE_DIR=$(mktemp -d "$RUNNER_TEMP/darkbloom-release.XXXXXX")
          umask "$old_umask"
          chmod 0700 "$RELEASE_PRIVATE_DIR"
          test ! -L "$RELEASE_PRIVATE_DIR"
          test "$(stat -f '%Lp' "$RELEASE_PRIVATE_DIR")" = "700"
          test "$(stat -f '%u' "$RELEASE_PRIVATE_DIR")" = "$(id -u)"
          echo "RELEASE_PRIVATE_DIR=$RELEASE_PRIVATE_DIR" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RELEASE_PRIVATE_DIR/build.keychain-db"
          CERT_PATH="$RELEASE_PRIVATE_DIR/cert.p12"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "build" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "build" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "build" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Install awscli (R2)
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli >/dev/null 2>&1 || true
          fi
          aws --version

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v3-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}
          restore-keys: |
            spm-v3-${{ runner.os }}-
      - name: Discard metallibs restored by the generic SwiftPM cache
        run: |
          for root in provider-swift/.build libs/mlx-swift-lm/.build; do
            [ ! -d "$root" ] || find "$root" -type f -name mlx.metallib -delete
          done

      - name: Verify production prompt parity
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          ./scripts/verify-prompt-parity.sh

      # The root helper is the sole metallib builder. The Actions cache stores
      # its private cache directory; the helper still runs on every release and
      # authorizes the exact source/toolchain/deployment/JIT contract itself.
      - name: Resolve source-matched metallib cache namespace
        id: mlxkey
        run: |
          set -euo pipefail
          MLX_SRC="libs/mlx-swift/Source/Cmlx/mlx"
          test -f "$MLX_SRC/mlx/version.h" || { echo "::error::mlx submodule not checked out at $MLX_SRC"; exit 1; }
          SOURCE_STATUS=$(git -C "$MLX_SRC" status --porcelain=v1 --untracked-files=all)
          if [ -n "$SOURCE_STATUS" ]; then
            echo "::error::release metallib source checkout is dirty"
            printf '%s\n' "$SOURCE_STATUS"
            exit 1
          fi
          MLX_SHA=$(git -C "$MLX_SRC" rev-parse HEAD)
          HELPER_SHA=$(shasum -a 256 scripts/fetch-metallib.sh | cut -d' ' -f1)
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          XCODE=$(xcodebuild -version | tr -cs '[:alnum:].' '-')
          KEY="metallib-helper-v1-${MLX_SHA}-${HELPER_SHA}-${XCODE}-sdk${SDK}-dt${MLX_METALLIB_DEPLOYMENT_TARGET}-jitoff"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "mlx_sha_short=${MLX_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Metallib cache namespace: $KEY"

      - name: Restore source-matched metallib cache
        id: metallib-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/metallib-cache
          key: ${{ steps.mlxkey.outputs.key }}

      - name: Build source-matched mlx.metallib through root helper
        id: metallib
        env:
          METALLIB_CACHE_DIR: ${{ runner.temp }}/metallib-cache
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || brew install cmake
          MLX_SRC="libs/mlx-swift/Source/Cmlx/mlx"
          test -z "$(git -C "$MLX_SRC" status --porcelain=v1 --untracked-files=all)"
          ./scripts/fetch-metallib.sh "$RUNNER_TEMP/metallib"
          test -z "$(git -C "$MLX_SRC" status --porcelain=v1 --untracked-files=all)" || {
            echo "::error::metallib helper modified the release source checkout"
            exit 1
          }
          MLIB="$RUNNER_TEMP/metallib/mlx.metallib"
          test -s "$MLIB" || { echo "::error::metallib missing at $MLIB"; exit 1; }
          echo "metallib=$MLIB" >> "$GITHUB_OUTPUT"

      - name: Save source-matched metallib cache
        if: steps.metallib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/metallib-cache
          key: ${{ steps.mlxkey.outputs.key }}

      # ----------------------------------------------------------------------
      # Build (tests run by CI, not the release workflow).
      # ----------------------------------------------------------------------

      - name: Build provider-swift (release)
        working-directory: provider-swift
        run: |
          set -euo pipefail
          swift build -c release --product darkbloom
          swift build -c release --product darkbloom-enclave
          swift build -c release --product darkbloom-fan-helper
          swift build -c release --product darkbloom-inference-worker
          BIN_DIR=$(swift build -c release --show-bin-path)
          test -x "$BIN_DIR/$CLI_NAME"
          test -x "$BIN_DIR/$ENCLAVE_NAME"
          test -x "$BIN_DIR/$FAN_HELPER_NAME"
          test -x "$BIN_DIR/$WORKER_NAME"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          ls -la "$BIN_DIR" | head -50
          REPORTED=$("$BIN_DIR/$CLI_NAME" --version)
          ../scripts/check-release-version.sh "$VERSION" "$REPORTED"

      - name: Verify supervisor release-link isolation
        run: |
          set -euo pipefail
          SUPERVISOR="$BIN_DIR/$CLI_NAME"
          SYMBOLS="$RELEASE_PRIVATE_DIR/supervisor-symbols.txt"
          DEPENDENCIES="$RELEASE_PRIVATE_DIR/supervisor-dependencies.txt"
          nm -gj "$SUPERVISOR" | swift-demangle --compact > "$SYMBOLS"
          otool -L "$SUPERVISOR" > "$DEPENDENCIES"

          for forbidden_symbol in \
            InferenceWorkerRuntime \
            StandaloneServer \
            NodeKeyPair \
            bindRuntimeMetallibForMLX \
            darkbloom_mlx_set_metallib_path \
            ModelContainer \
            TokenizerHandle \
            MLXArray \
            MLX.Memory \
            PagedAttentionKernel \
            PrivateV2KeyMaterial \
            PrivateV2Crypto \
            PrivateV2RequestOpener \
            PrivateV2ResponseSealer \
            PrivateV2NativeStreamAdapter \
            CBv2Engine
          do
            if grep -Fq "$forbidden_symbol" "$SYMBOLS"; then
              echo "::error::supervisor release binary contains forbidden inference symbol: $forbidden_symbol"
              exit 1
            fi
          done

          for forbidden_product in \
            MLX \
            MLXNN \
            MLXLLM \
            MLXVLM \
            MLXLMCommon \
            MLXLMServer \
            ProviderMetallibControl
          do
            if grep -Eq \
              "(^|[/[:space:]])(lib)?${forbidden_product}([./[:space:]]|$)" \
              "$DEPENDENCIES"
            then
              echo "::error::supervisor release binary links forbidden inference product: $forbidden_product"
              exit 1
            fi
          done

          echo "Supervisor release-link isolation verified"

      - name: Save SwiftPM cache
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        if: always()
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            provider-swift/.build
            libs/mlx-swift-lm/.build
          key: spm-v3-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('provider-swift/Package.resolved', 'libs/mlx-swift/Package.swift', 'libs/mlx-swift-lm/Package.swift') }}

      # Unit tests are run by CI (ci.yml + integration.yml) on push to
      # master. Skipped here to avoid flaky live MLX inference tests
      # blocking signed releases on CI hardware timing differences.

      # ----------------------------------------------------------------------
      # Stage the app, its minimal nested XPC worker, and flat verifier files.
      # ----------------------------------------------------------------------

      - name: Embed provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WORKER_PROVISIONING_PROFILE_BASE64: ${{ secrets.WORKER_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::PROVISIONING_PROFILE_BASE64 is required (PR #146 persistent SE key)"
            exit 1
          fi
          if [ -z "${WORKER_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::WORKER_PROVISIONING_PROFILE_BASE64 is required for the worker's shared Secure Enclave key access"
            exit 1
          fi
          MAIN_PROFILE="$RELEASE_PRIVATE_DIR/embedded.provisionprofile"
          MAIN_PROFILE_PLIST="$RELEASE_PRIVATE_DIR/profile.plist"
          WORKER_PROFILE="$RELEASE_PRIVATE_DIR/worker.provisionprofile"
          WORKER_PROFILE_PLIST="$RELEASE_PRIVATE_DIR/worker-profile.plist"
          umask 077
          printf '%s' "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$MAIN_PROFILE"

          # Decode the CMS-wrapped profiles to their plist payloads so release
          # fails before signing if either identity grant is stale or broad.
          security cms -D -i "$MAIN_PROFILE" > "$MAIN_PROFILE_PLIST"
          printf '%s' "$WORKER_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$WORKER_PROFILE"
          security cms -D -i "$WORKER_PROFILE" > "$WORKER_PROFILE_PLIST"

          python3 - <<'PY'
          import os
          import plistlib
          import sys
          from datetime import datetime

          private_dir = os.environ['RELEASE_PRIVATE_DIR']
          with open(os.path.join(private_dir, 'profile.plist'), 'rb') as f:
              p = plistlib.load(f)

          errors = []
          team = p.get('TeamIdentifier', [])
          if 'SLDQ2GJ6TL' not in team:
              errors.append(f"TeamIdentifier missing SLDQ2GJ6TL: {team}")

          ents = p.get('Entitlements', {})
          groups = ents.get('keychain-access-groups', [])
          has_group = any(
              g == 'SLDQ2GJ6TL.io.darkbloom.provider' or g == 'SLDQ2GJ6TL.*'
              for g in groups
          )
          if not has_group:
              errors.append(
                  "keychain-access-groups missing "
                  f"SLDQ2GJ6TL.io.darkbloom.provider or wildcard: {groups}"
              )

          app_id = ents.get('application-identifier', '')
          if app_id and not (
              app_id.endswith('io.darkbloom.provider') or app_id.endswith('*')
          ):
              errors.append(f"application-identifier mismatch: {app_id}")

          aps = (
              ents.get('aps-environment')
              or ents.get('com.apple.developer.aps-environment')
          )
          if aps != 'production':
              errors.append(
                  "profile does not grant aps-environment=production "
                  f"(got {aps!r}); regenerate the push-enabled provisioning "
                  "profile and update PROVISIONING_PROFILE_BASE64"
              )

          expiry = p.get('ExpirationDate')
          if expiry is not None:
              days_left = (expiry - datetime.utcnow()).days
              if days_left < 30:
                  errors.append(
                      f"Profile expires in {days_left} days "
                      f"(renew before cutover): {expiry}"
                  )
              else:
                  print(f"Profile valid for {days_left} more days")
          else:
              print("::warning::Provisioning profile has no ExpirationDate field")

          name = p.get('Name', '<unknown>')
          uuid = p.get('UUID', '<unknown>')
          print(
              f"Profile: name={name!r} uuid={uuid} "
              f"team={team} app_id={app_id}"
          )

          with open(
              os.path.join(private_dir, 'worker-profile.plist'), 'rb'
          ) as f:
              worker_profile = plistlib.load(f)
          worker_team = worker_profile.get('TeamIdentifier', [])
          if 'SLDQ2GJ6TL' not in worker_team:
              errors.append(
                  f"worker TeamIdentifier missing SLDQ2GJ6TL: {worker_team}"
              )
          worker_ents = worker_profile.get('Entitlements', {})
          worker_groups = worker_ents.get('keychain-access-groups', [])
          expected_worker_groups = ['SLDQ2GJ6TL.io.darkbloom.provider']
          if worker_groups != expected_worker_groups:
              errors.append(
                  "worker keychain-access-groups must be the exact shared "
                  f"provider group {expected_worker_groups!r}; "
                  f"got {worker_groups!r}"
              )
          worker_app_id = worker_ents.get('application-identifier', '')
          expected_worker_app_id = (
              'SLDQ2GJ6TL.io.darkbloom.provider.inference-worker'
          )
          if worker_app_id != expected_worker_app_id:
              errors.append(
                  "worker application-identifier must be exact; "
                  f"expected {expected_worker_app_id!r}, "
                  f"got {worker_app_id!r}"
              )
          if worker_ents.get('com.apple.security.app-sandbox') is not True:
              errors.append(
                  "worker profile must grant "
                  "com.apple.security.app-sandbox=true"
              )
          if (
              worker_ents.get(
                  'com.apple.security.files.bookmarks.app-scope'
              ) is not True
          ):
              errors.append(
                  "worker profile must grant "
                  "com.apple.security.files.bookmarks.app-scope=true"
              )
          worker_expiry = worker_profile.get('ExpirationDate')
          if worker_expiry is not None:
              worker_days_left = (worker_expiry - datetime.utcnow()).days
              if worker_days_left < 30:
                  errors.append(
                      "Worker profile expires in "
                      f"{worker_days_left} days: {worker_expiry}"
                  )
              else:
                  print(
                      f"Worker profile valid for {worker_days_left} more days"
                  )
          else:
              errors.append("Worker profile has no ExpirationDate field")
          print(
              "Worker profile: "
              f"name={worker_profile.get('Name', '<unknown>')!r} "
              f"uuid={worker_profile.get('UUID', '<unknown>')} "
              f"team={worker_team} app_id={worker_app_id}"
          )

          if errors:
              for error in errors:
                  print(f"::error::{error}", file=sys.stderr)
              sys.exit(1)
          print("Provisioning profile verification passed")
          PY

          echo "profile_available=true" >> "$GITHUB_OUTPUT"
        id: profile

      - name: Stage and sign bundle
        id: bundle
        run: |
          set -euo pipefail
          STAGE="$RELEASE_PRIVATE_DIR/bundle"
          rm -rf "$STAGE"

          # Wrap the CLI in a minimal .app bundle so the provisioning profile
          # authorizes keychain-access-groups for the persistent SE key.
          APP="$STAGE/Darkbloom.app"
          WORKER_XPC="$APP/Contents/XPCServices/$WORKER_BUNDLE_NAME"
          WORKER_EXECUTABLE="$WORKER_XPC/Contents/MacOS/$WORKER_NAME"
          mkdir -p \
            "$APP/Contents/MacOS" \
            "$APP/Contents/Helpers" \
            "$APP/Contents/Resources/darkbloom-runtime-capabilities" \
            "$WORKER_XPC/Contents/MacOS"

          install -m 0755 "$BIN_DIR/$CLI_NAME" "$APP/Contents/MacOS/$CLI_NAME"
          install -m 0755 "$BIN_DIR/$ENCLAVE_NAME" "$APP/Contents/MacOS/$ENCLAVE_NAME"
          install -m 0755 "$BIN_DIR/$WORKER_NAME" "$WORKER_EXECUTABLE"
          cp "${{ steps.metallib.outputs.metallib }}" "$WORKER_XPC/Contents/MacOS/mlx.metallib"
          cp scripts/inference-worker-Info.plist "$WORKER_XPC/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" \
            "$WORKER_XPC/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            "$WORKER_XPC/Contents/Info.plist"
          PAGED_RESOURCE_SOURCE="$BIN_DIR/mlx-swift-lm_MLXLMCommon.bundle/pagedattention.metal"
          PAGED_RESOURCE_DESTINATION="$WORKER_XPC/Contents/Resources/mlx-swift-lm_MLXLMCommon.bundle/pagedattention.metal"
          test -d "$(dirname "$PAGED_RESOURCE_SOURCE")"
          test ! -L "$(dirname "$PAGED_RESOURCE_SOURCE")"
          test -f "$PAGED_RESOURCE_SOURCE"
          test ! -L "$PAGED_RESOURCE_SOURCE"
          test -s "$PAGED_RESOURCE_SOURCE"
          mkdir -p "$(dirname "$PAGED_RESOURCE_DESTINATION")"
          install -m 0644 "$PAGED_RESOURCE_SOURCE" "$PAGED_RESOURCE_DESTINATION"
          install -m 0755 \
            "$BIN_DIR/$FAN_HELPER_NAME" \
            "$APP/Contents/Helpers/$FAN_HELPER_NAME"
          printf '1\n' \
            > "$APP/Contents/Resources/darkbloom-runtime-capabilities/fan-helper-v1"

          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>io.darkbloom.provider</string>
              <key>CFBundleExecutable</key>
              <string>${CLI_NAME}</string>
              <key>CFBundleName</key>
              <string>Darkbloom</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          PLIST

          if [ "${{ steps.profile.outputs.profile_available }}" = "true" ]; then
            cp "$RELEASE_PRIVATE_DIR/embedded.provisionprofile" "$APP/Contents/embedded.provisionprofile"
            cp "$RELEASE_PRIVATE_DIR/worker.provisionprofile" "$WORKER_XPC/Contents/embedded.provisionprofile"
            echo "Provisioning profiles embedded in app and worker bundles"
          fi


          # Sign every nested worker component before the outer app. The XPC
          # executable and bundle share the exact service identifier and Team
          # ID requirement; no ad-hoc identity is accepted in release builds.
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$WORKER_XPC/Contents/MacOS/mlx.metallib"
          codesign --force --options runtime --timestamp \
            --identifier "$WORKER_ID" \
            --entitlements scripts/inference-worker-entitlements.plist \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$WORKER_EXECUTABLE"
          codesign --force --options runtime --timestamp \
            --identifier "$WORKER_ID" \
            --entitlements scripts/inference-worker-entitlements.plist \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$WORKER_XPC"
          WORKER_REQUIREMENT="anchor apple generic and identifier \"$WORKER_ID\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict --verbose=2 \
            "-R=$WORKER_REQUIREMENT" "$WORKER_XPC"
          codesign --verify --strict --verbose=2 \
            "-R=$WORKER_REQUIREMENT" "$WORKER_EXECUTABLE"
          WORKER_ENTITLEMENTS="$RELEASE_PRIVATE_DIR/worker-ents.plist"
          rm -f "$WORKER_ENTITLEMENTS"
          codesign -d --entitlements "$WORKER_ENTITLEMENTS" --xml \
            "$WORKER_EXECUTABLE" 2>/dev/null
          python3 - <<'PY'
          import os
          import plistlib

          with open(os.path.join(os.environ["RELEASE_PRIVATE_DIR"], "worker-ents.plist"), "rb") as stream:
              actual = plistlib.load(stream)
          with open("scripts/inference-worker-entitlements.plist", "rb") as stream:
              expected = plistlib.load(stream)
          if actual != expected:
              raise SystemExit(
                  f"signed worker entitlement drift: actual={actual!r}, expected={expected!r}"
              )
          PY
          WORKER_SANDBOX_OUTPUT=$(DARKBLOOM_SIGNED_HOST_TEST=1 \
            "$WORKER_EXECUTABLE" --sandbox-self-test-v1)
          printf '%s\n' "$WORKER_SANDBOX_OUTPUT"
          printf '%s\n' "$WORKER_SANDBOX_OUTPUT" \
            | grep -Fqx 'DBXPC_SANDBOX_SELF_TEST_V1:63'

          # The fan helper runs as root only after a separate, explicit sudo
          # command. Give it its own identity and no provider APNs/keychain
          # entitlements; ordinary installation leaves it sealed and dormant.
          codesign --force --options runtime --timestamp \
            --identifier "$FAN_HELPER_ID" \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$APP/Contents/Helpers/$FAN_HELPER_NAME"
          FAN_HELPER_REQUIREMENT="anchor apple generic and identifier \"$FAN_HELPER_ID\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --strict --verbose=2 \
            "-R=$FAN_HELPER_REQUIREMENT" \
            "$APP/Contents/Helpers/$FAN_HELPER_NAME"

          # darkbloom-enclave only uses ephemeral SE keys (no keychain).
          codesign --force --options runtime --timestamp \
            --entitlements provider-swift/entitlements-enclave.plist \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$APP/Contents/MacOS/$ENCLAVE_NAME"
          codesign --force --options runtime --timestamp \
            --entitlements scripts/entitlements.plist \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$APP/Contents/MacOS/$CLI_NAME"
          codesign --force --options runtime --timestamp \
            --entitlements scripts/entitlements.plist \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$DEVELOPER_ID" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --verbose=2 "$APP/Contents/MacOS/$CLI_NAME"

          # Persistent Secure Enclave key requires keychain-access-groups
          # bound to the team-scoped access group. If the entitlement is
          # missing, providers fall back to ephemeral SE keys and PR #146
          # silently no-ops. Fail the build instead of shipping a broken
          # attestation.
          EXPECTED_ACCESS_GROUP="SLDQ2GJ6TL.io.darkbloom.provider"
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP/Contents/MacOS/$CLI_NAME" 2>&1 || true)
          if ! echo "$ENTITLEMENTS" | grep -q "keychain-access-groups"; then
            echo "::error::Signed CLI is missing keychain-access-groups entitlement"
            echo "$ENTITLEMENTS"
            exit 1
          fi
          if ! echo "$ENTITLEMENTS" | grep -q "$EXPECTED_ACCESS_GROUP"; then
            echo "::error::Signed CLI is missing access group $EXPECTED_ACCESS_GROUP"
            echo "$ENTITLEMENTS"
            exit 1
          fi
          # v0.6.0 APNs code-identity assertions on the signed CLI:
          #   (a) aps-environment present AND == production (parse the value, not a
          #       bare grep — a dev profile would set 'development' and silently
          #       register against the wrong APNs host).
          #   (b) get-task-allow ABSENT — its absence (not "hardened runtime" per
          #       se) is what blocks even-root debugger attach / dylib injection;
          #       Developer ID + notarization strips it.
          CLI_ENTITLEMENTS="$RELEASE_PRIVATE_DIR/cli-ents.plist"
          rm -f "$CLI_ENTITLEMENTS"
          codesign -d --entitlements "$CLI_ENTITLEMENTS" --xml "$APP/Contents/MacOS/$CLI_NAME" 2>/dev/null || true
          # Fail loudly if extraction produced nothing — otherwise the
          # get-task-allow check below would pass vacuously on an empty file.
          if [ ! -s "$CLI_ENTITLEMENTS" ]; then
            echo "::error::Failed to extract entitlements from signed CLI for APNs/get-task-allow verification"
            exit 1
          fi
          APS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$CLI_ENTITLEMENTS" 2>/dev/null || echo "")
          if [ "$APS_ENV" != "production" ]; then
            echo "::error::Signed CLI aps-environment must be 'production' (got '${APS_ENV:-<absent>}'). Regenerate the push provisioning profile + entitlements (v0.6.0 APNs code-identity)."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$CLI_ENTITLEMENTS" 2>/dev/null | grep -qi true; then
            echo "::error::Signed CLI has get-task-allow=true — defeats even-root injection resistance. It must be absent (Developer ID + notarized strips it)."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import plistlib

          with open(os.path.join(os.environ["RELEASE_PRIVATE_DIR"], "cli-ents.plist"), "rb") as stream:
              entitlements = plistlib.load(stream)
          service = entitlements.get(
              "com.apple.security.temporary-exception.mach-lookup.global-name"
          )
          if service != ["io.darkbloom.provider.inference-worker"]:
              raise SystemExit(f"signed supervisor XPC lookup allowlist is not exact: {service!r}")
          forbidden = {
              "com.apple.security.get-task-allow",
              "com.apple.security.cs.allow-jit",
              "com.apple.security.cs.allow-unsigned-executable-memory",
              "com.apple.security.cs.allow-dyld-environment-variables",
              "com.apple.security.cs.disable-library-validation",
          }
          present = forbidden.intersection(entitlements)
          if present:
              raise SystemExit(f"signed supervisor carries forbidden code-loading entitlements: {sorted(present)}")
          PY
          echo "APNs code-identity entitlements verified: aps-environment=production, get-task-allow absent"
          if [ "${{ steps.profile.outputs.profile_available }}" = "true" ]; then
            if [ ! -f "$APP/Contents/embedded.provisionprofile" ]; then
              echo "::error::Provisioning profile secret set but not embedded in app bundle"
              exit 1
            fi
            if [ ! -f "$WORKER_XPC/Contents/embedded.provisionprofile" ]; then
              echo "::error::Worker provisioning profile secret set but not embedded in XPC bundle"
              exit 1
            fi
          else
            echo "::error::PROVISIONING_PROFILE_BASE64 secret is required to authorize the keychain-access-groups entitlement on provider machines"
            exit 1
          fi
          echo "Entitlement verification passed: $EXPECTED_ACCESS_GROUP authorized via embedded provisioning profile"

          # Flat layout alongside the .app bundle. Coordinator's release
          # artifact verifier (release_handlers.go:413) requires bin/darkbloom
          # to be a regular file — symlinks fail the tar.TypeReg check.
          mkdir -p "$STAGE/bin"
          cp "$APP/Contents/MacOS/$CLI_NAME" "$STAGE/bin/$CLI_NAME"
          cp "$APP/Contents/MacOS/$ENCLAVE_NAME" "$STAGE/bin/$ENCLAVE_NAME"
          cp "$WORKER_XPC/Contents/MacOS/mlx.metallib" "$STAGE/bin/mlx.metallib"

          # Notarize only the canonical app. The flat bin/ copies exist solely
          # for coordinator artifact verification and inherit signatures that
          # are valid only in the app-bundle context, so they are not valid
          # notarization inputs on their own.
          NOTARIZE_ZIP="$RELEASE_PRIVATE_DIR/darkbloom-notarize.zip"
          ARCHIVE="$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz"
          FILE_LIST="$RELEASE_PRIVATE_DIR/darkbloom-bundle-files.txt"
          ditto -c -k --keepParent "$APP" "$NOTARIZE_ZIP"

          # The distribution tar retains both shapes: install.sh uses the app,
          # while the coordinator hashes the regular file at bin/darkbloom.
          tar czf "$ARCHIVE" -C "$STAGE" .
          tar tzf "$ARCHIVE" | sort | tee "$FILE_LIST"

          ls -lh "$ARCHIVE"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="$RELEASE_PRIVATE_DIR/darkbloom-notarize.zip"
          NOTARY_RESULT="$RELEASE_PRIVATE_DIR/notary-result.json"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 15m \
            --output-format json | tee "$NOTARY_RESULT"

          read -r NOTARY_ID NOTARY_STATUS < <(python3 - <<'PY'
          import json
          import os

          result_path = os.path.join(
              os.environ['RELEASE_PRIVATE_DIR'], 'notary-result.json'
          )
          with open(result_path, encoding='utf-8') as result_file:
              result = json.load(result_file)

          submission_id = result.get('id')
          status = result.get('status')
          if not submission_id or not status:
              raise SystemExit('notarytool result is missing id or status')
          print(submission_id, status)
          PY
          )

          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "::error::Apple notarization $NOTARY_ID finished with status $NOTARY_STATUS (expected Accepted)"
            if ! xcrun notarytool log "$NOTARY_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"; then
              echo "::warning::Could not retrieve Apple's rejection log for $NOTARY_ID"
            fi
            exit 1
          fi

          # Stapler supports executable bundles, not individual Mach-O files.
          # Require an attached ticket and a local Gatekeeper acceptance before
          # the distribution artifact can be rebuilt or uploaded.
          STAGE="${{ steps.bundle.outputs.stage }}"
          APP="$STAGE/Darkbloom.app"
          WORKER_XPC="$APP/Contents/XPCServices/$WORKER_BUNDLE_NAME"
          WORKER_EXECUTABLE="$WORKER_XPC/Contents/MacOS/$WORKER_NAME"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Stapling the bundle must not change the executable bytes registered
          # with the coordinator and verified by provider self-update.
          cmp "$STAGE/bin/$CLI_NAME" "$APP/Contents/MacOS/$CLI_NAME"
          cmp "$STAGE/bin/$ENCLAVE_NAME" "$APP/Contents/MacOS/$ENCLAVE_NAME"
          cmp "$STAGE/bin/mlx.metallib" "$WORKER_XPC/Contents/MacOS/mlx.metallib"

          ARCHIVE="$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz"
          FILE_LIST="$RELEASE_PRIVATE_DIR/darkbloom-bundle-files.txt"
          tar czf "$ARCHIVE" -C "${{ steps.bundle.outputs.stage }}" .
          tar tzf "$ARCHIVE" | sort | tee "$FILE_LIST"
          grep -qx './bin/darkbloom' "$FILE_LIST"
          grep -qx './bin/darkbloom-enclave' "$FILE_LIST"
          grep -qx './bin/mlx.metallib' "$FILE_LIST"
          if grep -qx './bin/darkbloom-fan-helper' "$FILE_LIST"; then
            echo "::error::fan helper must not be present in the flat verifier layout"
            exit 1
          fi
          if grep -qx "./bin/${WORKER_NAME}" "$FILE_LIST"; then
            echo "::error::inference worker must exist only inside its signed XPC bundle"
            exit 1
          fi
          grep -qx \
            './Darkbloom.app/Contents/Helpers/darkbloom-fan-helper' \
            "$FILE_LIST"
          grep -qx \
            './Darkbloom.app/Contents/Resources/darkbloom-runtime-capabilities/fan-helper-v1' \
            "$FILE_LIST"
          grep -qx \
            "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/Info.plist" \
            "$FILE_LIST"
          grep -qx \
            "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/embedded.provisionprofile" \
            "$FILE_LIST"
          grep -qx \
            "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/MacOS/${WORKER_NAME}" \
            "$FILE_LIST"
          grep -qx \
            "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/MacOS/mlx.metallib" \
            "$FILE_LIST"
          EXPECTED_WORKER_RESOURCE="./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/Resources/mlx-swift-lm_MLXLMCommon.bundle/pagedattention.metal"
          grep -Fqx "$EXPECTED_WORKER_RESOURCE" "$FILE_LIST"
          while IFS= read -r resource_entry; do
            case "$resource_entry" in
              "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/Resources/"|\
              "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/Resources/mlx-swift-lm_MLXLMCommon.bundle/"|\
              "$EXPECTED_WORKER_RESOURCE")
                ;;
              *)
                echo "::error::inference worker bundle contains unapproved resource: $resource_entry"
                exit 1
                ;;
            esac
          done < <(grep -F \
            "./Darkbloom.app/Contents/XPCServices/${WORKER_BUNDLE_NAME}/Contents/Resources/" \
            "$FILE_LIST")

          # Verify the FINAL archived layout, not merely the staging tree.
          # This runs after signing, notarization, stapling, and tar rebuild,
          # and before any upload or coordinator registration.
          SMOKE_ROOT="$RELEASE_PRIVATE_DIR/final-artifact-smoke"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT"
          tar xzf "$ARCHIVE" -C "$SMOKE_ROOT"
          FINAL_WORKER_XPC="$SMOKE_ROOT/Darkbloom.app/Contents/XPCServices/$WORKER_BUNDLE_NAME"
          FINAL_WORKER="$FINAL_WORKER_XPC/Contents/MacOS/$WORKER_NAME"
          FINAL_WORKER_METALLIB="$FINAL_WORKER_XPC/Contents/MacOS/mlx.metallib"
          FINAL_FLAT_METALLIB="$SMOKE_ROOT/bin/mlx.metallib"
          test -s "$FINAL_WORKER_METALLIB"
          test -s "$FINAL_FLAT_METALLIB"
          cmp "$FINAL_FLAT_METALLIB" "$FINAL_WORKER_METALLIB"
          # Repeat the helper's completeness contract against the final
          # extracted, signed bytes rather than the pre-signing input.
          NAX_SYMBOL="_nax"
          GEMV_SYMBOL="gemv"
          R1_BUILDER_SYMBOL="build_gemma4_sorted_expert_tiles_bm32"
          R1_BUILDER_E256_SYMBOL="build_sorted_expert_tiles_bm32_e256"
          R1_KERNEL_SYMBOL="affine_gather_qmm_gemma4_expert_tiles_bfloat16_t_gs_64_b_4_alN_true_bm_32_bn_32_bk_32"
          QMV_WIDE_W4_M2_SYMBOL="affine_qmv_wide_bfloat16_t_gs_64_b_4_nv_2_kl_8_batch_0"
          QMV_WIDE_W4_M4_BATCHED_SYMBOL="affine_qmv_wide_bfloat16_t_gs_64_b_4_nv_4_kl_8_batch_1"
          QMV_WIDE_W8_M2_SYMBOL="affine_qmv_wide_bfloat16_t_gs_64_b_8_nv_2_kl_8_batch_0"
          QMV_WIDE_W8_M4_BATCHED_SYMBOL="affine_qmv_wide_bfloat16_t_gs_64_b_8_nv_4_kl_8_batch_1"
          for symbol in \
            "$NAX_SYMBOL" \
            "$GEMV_SYMBOL" \
            "$R1_BUILDER_SYMBOL" \
            "$R1_BUILDER_E256_SYMBOL" \
            "$R1_KERNEL_SYMBOL" \
            "$QMV_WIDE_W4_M2_SYMBOL" \
            "$QMV_WIDE_W4_M4_BATCHED_SYMBOL" \
            "$QMV_WIDE_W8_M2_SYMBOL" \
            "$QMV_WIDE_W8_M4_BATCHED_SYMBOL"
          do
            MATCHES=$(strings "$FINAL_FLAT_METALLIB" | grep -F -c "$symbol" || true)
            if [ "$MATCHES" -eq 0 ]; then
              echo "::error::final signed metallib is missing required symbol: $symbol"
              exit 1
            fi
          done
          FINAL_FAN_HELPER="$SMOKE_ROOT/Darkbloom.app/Contents/Helpers/$FAN_HELPER_NAME"
          FINAL_FAN_MARKER="$SMOKE_ROOT/Darkbloom.app/Contents/Resources/darkbloom-runtime-capabilities/fan-helper-v1"
          test -f "$FINAL_FAN_HELPER"
          test ! -L "$FINAL_FAN_HELPER"
          test -x "$FINAL_FAN_HELPER"
          test "$(stat -f '%Lp' "$FINAL_FAN_HELPER")" = "755"
          test -f "$FINAL_FAN_MARKER"
          test ! -L "$FINAL_FAN_MARKER"
          test "$(tr -d '[:space:]' < "$FINAL_FAN_MARKER")" = "1"
          LC_ALL=C grep -a -q -F 'darkbloom-fan-helper-v1' \
            "$SMOKE_ROOT/Darkbloom.app/Contents/MacOS/$CLI_NAME"
          FAN_HELPER_REQUIREMENT="anchor apple generic and identifier \"$FAN_HELPER_ID\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --strict --verbose=2 \
            "-R=$FAN_HELPER_REQUIREMENT" "$FINAL_FAN_HELPER"
          WORKER_REQUIREMENT="anchor apple generic and identifier \"$WORKER_ID\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict --verbose=2 \
            "-R=$WORKER_REQUIREMENT" "$FINAL_WORKER_XPC"
          codesign --verify --strict --verbose=2 \
            "-R=$WORKER_REQUIREMENT" "$FINAL_WORKER"
          codesign --verify --deep --strict --verbose=2 \
            "$SMOKE_ROOT/Darkbloom.app"
          FINAL_WORKER_PROFILE="$FINAL_WORKER_XPC/Contents/embedded.provisionprofile"
          test -f "$FINAL_WORKER_PROFILE"
          test ! -L "$FINAL_WORKER_PROFILE"
          test -s "$FINAL_WORKER_PROFILE"
          FINAL_PAGED_RESOURCE="$FINAL_WORKER_XPC/Contents/Resources/mlx-swift-lm_MLXLMCommon.bundle/pagedattention.metal"
          test -f "$FINAL_PAGED_RESOURCE"
          test ! -L "$FINAL_PAGED_RESOURCE"
          test -s "$FINAL_PAGED_RESOURCE"
          test -z "$(find "$FINAL_WORKER_XPC/Contents/Resources" \
            \( -type f -o -type l \) ! -path "$FINAL_PAGED_RESOURCE" -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$FINAL_WORKER_XPC/Contents/Info.plist")" = "$WORKER_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$FINAL_WORKER_XPC/Contents/Info.plist")" = "$WORKER_NAME"
          FINAL_SANDBOX_OUTPUT=$(DARKBLOOM_SIGNED_HOST_TEST=1 \
            "$FINAL_WORKER" --sandbox-self-test-v1)
          printf '%s\n' "$FINAL_SANDBOX_OUTPUT"
          printf '%s\n' "$FINAL_SANDBOX_OUTPUT" \
            | grep -Fqx 'DBXPC_SANDBOX_SELF_TEST_V1:63'
          REPORTED=$("$SMOKE_ROOT/Darkbloom.app/Contents/MacOS/$CLI_NAME" --version)
          ./scripts/check-release-version.sh "$VERSION" "$REPORTED"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$SMOKE_ROOT/Darkbloom.app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$SMOKE_ROOT/Darkbloom.app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$FINAL_WORKER_XPC/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$FINAL_WORKER_XPC/Contents/Info.plist")" = "$VERSION"

          BINARY_HASH=$(shasum -a 256 "$SMOKE_ROOT/bin/$CLI_NAME" | cut -d' ' -f1)
          WORKER_HASH=$(shasum -a 256 "$FINAL_WORKER" | cut -d' ' -f1)
          BUNDLE_HASH=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)
          METALLIB_HASH=$(shasum -a 256 "$FINAL_FLAT_METALLIB" | cut -d' ' -f1)
          echo "BINARY_HASH=$BINARY_HASH" >> "$GITHUB_ENV"
          echo "WORKER_HASH=$WORKER_HASH" >> "$GITHUB_ENV"
          echo "BUNDLE_HASH=$BUNDLE_HASH" >> "$GITHUB_ENV"
          echo "METALLIB_HASH=$METALLIB_HASH" >> "$GITHUB_ENV"
          echo "Binary hash:   $BINARY_HASH"
          echo "Worker hash:   $WORKER_HASH"
          echo "Bundle hash:   $BUNDLE_HASH"
          echo "Metallib hash: $METALLIB_HASH"

      - name: Upload bundle to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ env.r2_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ env.r2_secret_access_key }}
          R2_ENDPOINT: ${{ env.r2_endpoint }}
          R2_BUCKET: ${{ env.r2_bucket }}
        run: |
          set -euo pipefail
          PREFIX="s3://${R2_BUCKET}/releases/v${VERSION}"
          aws s3 cp "$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz" \
            "${PREFIX}/darkbloom-bundle-macos-arm64.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

          # Latest pointer for `install.sh` discovery. Publish under both
          # the canonical `darkbloom-bundle` name and the legacy
          # `eigeninference-bundle` name for backward compatibility with
          # any caller that hardcoded the old filename.
          aws s3 cp "$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz" \
            "s3://${R2_BUCKET}/releases/latest/darkbloom-bundle-macos-arm64.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz" \
            "s3://${R2_BUCKET}/releases/latest/eigeninference-bundle-macos-arm64.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Compute template hashes
        run: |
          set -euo pipefail
          MODELS_CDN="https://pub-7cbee059c80c46ec9c071dbee2726f8a.r2.dev"
          TEMPLATE_HASHES=""
          for name in qwen3.5 trinity gemma4 minimax; do
            HASH=$(curl -fsSL "$MODELS_CDN/templates/${name}.jinja" 2>/dev/null | shasum -a 256 | cut -d' ' -f1 || true)
            # ignore the empty-string SHA (which means the file 404'd)
            if [ -n "$HASH" ] && [ "$HASH" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
              [ -n "$TEMPLATE_HASHES" ] && TEMPLATE_HASHES+=","
              TEMPLATE_HASHES+="${name}=${HASH}"
              echo "Template $name: ${HASH:0:16}…"
            fi
          done
          if ! [[ "$WORKER_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::post-sign worker hash is missing or malformed"
            exit 1
          fi
          [ -n "$TEMPLATE_HASHES" ] && TEMPLATE_HASHES+=","
          TEMPLATE_HASHES+="inference_worker_binary=${WORKER_HASH}"
          echo "Inference worker binary: ${WORKER_HASH}"
          echo "TEMPLATE_HASHES=$TEMPLATE_HASHES" >> "$GITHUB_ENV"

      - name: Register release with coordinator
        env:
          COORDINATOR_URL: ${{ env.coordinator_url }}
          RELEASE_KEY: ${{ env.release_key }}
          R2_PUBLIC_URL: ${{ env.r2_public_url }}
        run: |
          set -euo pipefail
          BUNDLE_URL="${R2_PUBLIC_URL}/releases/v${VERSION}/darkbloom-bundle-macos-arm64.tar.gz"

          TAG_MSG=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "$GITHUB_REF_NAME" 2>/dev/null || echo "")
          if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" = $'\n' ]; then
            TAG_MSG="Release v${VERSION}"
          fi

          # The Swift provider does NOT expose python_hash / runtime_hash —
          # those fields are dropped post-cutover. Coordinator should accept
          # releases without them when backend == "mlx-swift".
          RELEASE_PAYLOAD="$RELEASE_PRIVATE_DIR/release-payload.json"
          python3 - <<PY > "$RELEASE_PAYLOAD"
          import json, os
          payload = {
              "version":         os.environ["VERSION"],
              "platform":        "macos-arm64",
              "backend":         "mlx-swift",
              "binary_hash":     os.environ["BINARY_HASH"],
              "bundle_hash":     os.environ["BUNDLE_HASH"],
              "metallib_hash":   os.environ["METALLIB_HASH"],
              "template_hashes": os.environ.get("TEMPLATE_HASHES", ""),
              "url":             "${BUNDLE_URL}",
              "changelog":       """${TAG_MSG}""".strip(),
          }
          print(json.dumps(payload))
          PY
          curl -fsSL -X POST "${COORDINATOR_URL}/v1/releases" \
            -H "Authorization: Bearer ${RELEASE_KEY}" \
            -H "Content-Type: application/json" \
            -d @"$RELEASE_PAYLOAD"
          echo
          echo "Release v${VERSION} registered with coordinator"

      - name: Create GitHub Release
        if: needs.resolve-env.outputs.environment == 'prod' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="$RELEASE_PRIVATE_DIR/release-notes.md"
          cat > "$RELEASE_NOTES" <<NOTES
          ## Provider v${VERSION} (Swift CLI)

          **Binary hash:**   \`${BINARY_HASH}\`
          **Worker hash:**   \`${WORKER_HASH}\`
          **Bundle hash:**   \`${BUNDLE_HASH}\`
          **Metallib hash:** \`${METALLIB_HASH}\` (built from mlx \`${{ steps.mlxkey.outputs.mlx_sha_short }}\`)
          **Signed by:**     \`${DEVELOPER_ID}\`
          **Notarized:**     yes
          **Min macOS:**     ${MIN_MACOS}

          ### Install

          \`\`\`bash
          curl -fsSL ${{ env.coordinator_url }}/install.sh | bash
          \`\`\`

          NOTES
          gh release create "${{ github.ref_name }}" \
            "$RELEASE_PRIVATE_DIR/darkbloom-bundle-macos-arm64.tar.gz" \
            --title "${{ github.ref_name }}" \
            --notes-file "$RELEASE_NOTES" \
            --generate-notes

      - name: Cleanup private release workspace
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          case "${RELEASE_PRIVATE_DIR:-}" in
            "$RUNNER_TEMP"/darkbloom-release.??????)
              chmod -R u+rwX "$RELEASE_PRIVATE_DIR" 2>/dev/null || true
              rm -rf -- "$RELEASE_PRIVATE_DIR"
              ;;
          esac
