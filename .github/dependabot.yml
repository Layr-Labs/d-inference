version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/console-ui"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Los_Angeles"
    target-branch: "master"
    commit-message:
      prefix: "[npm-security]"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 0
    labels:
      - "security"
    allow:
      - dependency-type: "direct"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
