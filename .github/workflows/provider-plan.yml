name: Provider Plan

# What one CI run tests and where, shared by CI (dev) and CI (master). The
# classifier selects the components a change touches; the tree lookup skips
# every test job when a successful run of the same workflow already tested
# this exact tree (scripts/ci-tested-tree.py); the route, the plan job's last
# step, asks the Darkbloom plane once for every lane of the run (the plane
# routes a run attempt once), the caller's own Linux lanes included.
on:
  workflow_call:
    inputs:
      linux_lanes:
        description: The caller's own route lanes, one per line (darkbloom-route.yml format)
        type: string
        default: ''
      run_tests:
        description: Whether the caller runs the test jobs (provider-tests.yml); routes their lanes, ci-plan-checks's included
        type: boolean
        default: true
    outputs:
      provider:
        description: "'true' when the provider jobs run (selected, and the tree is untested)"
        value: ${{ jobs.components.outputs.provider }}
      cluster:
        value: ${{ jobs.components.outputs.cluster }}
      cluster_gpu:
        description: "'true' when the non-blocking Cluster GPU shards run (cluster selected, and master push, dispatch or run-gpu-ci PR label)"
        value: ${{ jobs.components.outputs.cluster_gpu }}
      mimo_audio:
        value: ${{ jobs.components.outputs.mimo_audio }}
      changed_provider:
        description: The classifier's provider selection, before the tree lookup
        value: ${{ jobs.components.outputs.changed_provider }}
      changed_cluster:
        value: ${{ jobs.components.outputs.changed_cluster }}
      changes_result:
        value: ${{ jobs.components.outputs.changes_result }}
      skip:
        description: "'true' when a successful run already tested this tree"
        value: ${{ jobs.components.outputs.skip }}
      tested_run:
        value: ${{ jobs.components.outputs.tested_run }}
      tree:
        value: ${{ jobs.components.outputs.tree }}
      base:
        description: The tested change's base (`push` for a push)
        value: ${{ jobs.components.outputs.base }}
      head:
        value: ${{ jobs.components.outputs.head }}
      routes:
        value: ${{ jobs.components.outputs.routes }}
      sha:
        description: The commit every job checks out; on a dispatch its `ref` input resolved to a full SHA, otherwise empty (the event's default)
        value: ${{ jobs.commit.outputs.sha }}

permissions:
  contents: read

jobs:
  # The commit the run tests. A dispatch names it with its `ref` input (a SHA,
  # short or full, or a branch: `gh workflow run ci-dev.yml --ref dev -f
  # ref=<sha>`), resolved here once, from every branch's commits (no trees or
  # files), to one full SHA that a branch of this repository holds; a commit
  # no branch holds (a fork's pull request) is refused and nothing runs. With
  # `pr` (`-f pr=<n>`, and `ref` only as its head) it is that pull request's
  # test merge commit, the head merged with its base, for a head in this
  # repository.
  commit:
    name: Resolve the commit to test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # For `pr`: the pull request's base and head, which the tested-tree record names.
      base: ${{ steps.resolve.outputs.base }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ github.event.inputs.ref != '' }}
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Resolve the dispatch's ref
        id: resolve
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF: ${{ github.event.inputs.ref }}
          PR: ${{ github.event.inputs.pr }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sha=$HEAD_SHA status_sha=$HEAD_SHA base='' head=''
          if [ -n "$REF" ]; then
            case $REF in
              -* | *..* | *[[:space:]]*) echo "::error title=ref::'$REF' is not a commit SHA or a branch"; exit 1 ;;
            esac
            sha=$(git rev-parse --verify -q "refs/remotes/origin/$REF^{commit}" || git rev-parse --verify -q "$REF^{commit}") \
              || { echo "::error title=ref::'$REF' names no commit on a branch of this repository"; exit 1; }
            if [ -z "$(git branch -r --contains "$sha")" ]; then
              echo "::error title=ref::$sha is on no branch of this repository"
              exit 1
            fi
            status_sha=$sha
          fi
          # A pull request: its test merge commit (refs/pull/<n>/merge, the head merged
          # with the base, as a pull request run tests), for a head in this repository.
          if [ -n "$PR" ]; then
            case $PR in
              *[!0-9]* | 0*) echo "::error title=pr::'$PR' is not a pull request number"; exit 1 ;;
            esac
            info=$(gh api "repos/$REPOSITORY/pulls/$PR" \
              --jq '[(.head.repo.full_name // "-"), .head.sha, .state, (.merge_commit_sha // "-")] | join(" ")') \
              || { echo "::error title=pr::no pull request #$PR in $REPOSITORY"; exit 1; }
            read -r head_repo head state merge <<<"$info"
            if [ "$head_repo" != "$REPOSITORY" ]; then
              echo "::error title=pr::#$PR's head is in $head_repo, not this repository"
              exit 1
            fi
            if [ "$state" != open ] || [ "$merge" = - ]; then
              echo "::error title=pr::#$PR is $state and has no test merge commit (a conflict, or closed)"
              exit 1
            fi
            if [ -n "$REF" ] && [ "$sha" != "$head" ]; then
              echo "::error title=pr::$sha is not #$PR's head ($head): GitHub keeps a test merge commit of the head only. Test it unmerged with ref alone, or push it as the head"
              exit 1
            fi
            read -r base second <<<"$(gh api "repos/$REPOSITORY/commits/$merge" --jq '[.parents[].sha] | join(" ")')"
            if [ "$second" != "$head" ]; then
              echo "::error title=pr::#$PR's test merge commit $merge is not of its head $head yet; dispatch again in a minute"
              exit 1
            fi
            sha=$merge status_sha=$head
          fi
          {
            echo "sha=$sha"
            echo "status_sha=$status_sha"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          requested=${REF:-the head of $GITHUB_REF_NAME}
          if [ -n "$PR" ]; then requested="#$PR at ${REF:-its head}, merged with its base"; fi
          echo "Testing ${sha:0:12} (requested: $requested)" >> "$GITHUB_STEP_SUMMARY"

  # One GitHub-hosted job plans the run (runner routing waits for it, so it
  # never queues on a routed fleet): the classifier selects the components a
  # change touches, the tree lookup looks for an earlier successful test of
  # this change, the next step chooses the components the test jobs run (the
  # classifier's, or none when the tree was tested), and the last step routes
  # their lanes (below). changes_result is the classifier step's outcome; the
  # Provider Tests gate fails on anything but `success`. A failed or skipped
  # lookup leaves skip empty: "test". A dispatch's `ref` is resolved first
  # (job `commit`); when that fails, nothing is classified (changes_result
  # `skipped`), so nothing is tested.
  components:
    name: Plan the components to test
    needs: commit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      provider: ${{ steps.choose.outputs.provider }}
      cluster: ${{ steps.choose.outputs.cluster }}
      cluster_gpu: ${{ steps.choose.outputs.cluster_gpu }}
      mimo_audio: ${{ steps.choose.outputs.mimo_audio }}
      changed_provider: ${{ steps.paths.outputs.provider || 'false' }}
      changed_cluster: ${{ steps.paths.outputs.cluster || 'false' }}
      changes_result: ${{ steps.paths.outcome }}
      skip: ${{ steps.lookup.outputs.skip }}
      tested_run: ${{ steps.lookup.outputs.tested_run }}
      tree: ${{ steps.tree.outputs.tree }}
      base: ${{ steps.tree.outputs.base }}
      head: ${{ steps.tree.outputs.head }}
      routes: ${{ steps.route.outputs.routes }}
    steps:
      # On a pull request github.sha is its test merge commit of the event's
      # base and head; on a push, the pushed commit; on a dispatch, the commit
      # its `ref` names (job `commit`), whose tree the API reads.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ inputs.run_tests && needs.commit.result == 'success' }}
        with:
          fetch-depth: 0
          # The classifier diffs trees and walks commits; it reads no file
          # contents outside the checkout, so a blobless clone is enough.
          filter: blob:none
          persist-credentials: false
      # Its outcome is the plan's changes_result; the job goes on to choose.
      - name: Classify complete base-to-head Git diff
        id: paths
        if: ${{ inputs.run_tests && needs.commit.result == 'success' }}
        continue-on-error: true
        run: python3 scripts/ci-component-paths.py
      # The lookup needs the classifier's components: a record must cover them.
      - name: Name the change this run tests
        id: tree
        if: ${{ steps.paths.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || needs.commit.outputs.base || 'push' }}
          HEAD: ${{ github.event.pull_request.head.sha || needs.commit.outputs.head || needs.commit.outputs.sha || github.sha }}
          TESTED: ${{ needs.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$TESTED" ] && [ "$TESTED" != "$(git rev-parse HEAD)" ]; then
            tree=$(gh api "repos/$REPOSITORY/commits/$TESTED" --jq .commit.tree.sha)
          else
            tree=$(git rev-parse 'HEAD^{tree}')
          fi
          {
            echo "tree=$tree"
            echo "base=$BASE"
            echo "head=$HEAD"
          } >> "$GITHUB_OUTPUT"
      - name: Look for a successful run that tested it
        id: lookup
        if: ${{ steps.paths.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ needs.commit.outputs.sha || github.sha }}
          TREE: ${{ steps.tree.outputs.tree }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SELECTED: provider=${{ steps.paths.outputs.provider }},cluster=${{ steps.paths.outputs.cluster }},mimo_audio=${{ steps.paths.outputs.mimo_audio }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/ci-tested-tree.py lookup --repository "$REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" --event "$EVENT" --sha "$SHA" --tree "$TREE" \
            --base "$BASE" --head "$HEAD" --components "$SELECTED" --run-id "$RUN_ID"
      # Runs after any earlier failure unless the run is cancelled: a failed
      # lookup has already answered "test".
      - name: Choose the components to test
        id: choose
        if: ${{ !cancelled() }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
          SKIP: ${{ steps.lookup.outputs.skip }}
          PROVIDER: ${{ steps.paths.outputs.provider }}
          CLUSTER: ${{ steps.paths.outputs.cluster }}
          MIMO_AUDIO: ${{ steps.paths.outputs.mimo_audio }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GPU_LABELED: ${{ github.event_name == 'pull_request' && (github.event.label.name == 'run-gpu-ci' || contains(github.event.pull_request.labels.*.name, 'run-gpu-ci')) }}
        run: |
          if [ "$RUN_TESTS" != true ] || [ "$SKIP" = true ]; then PROVIDER=false CLUSTER=false MIMO_AUDIO=false; fi
          CLUSTER_GPU=false
          if [ "$CLUSTER" = true ] && {
            [ "$EVENT_NAME" = workflow_dispatch ] ||
            { [ "$EVENT_NAME" = push ] && { [ "$REF" = refs/heads/master ] || [ "$REF" = refs/heads/main ]; }; } ||
            [ "$GPU_LABELED" = true ];
          }; then
            CLUSTER_GPU=true
          fi
          {
            echo "provider=$PROVIDER"
            echo "cluster=$CLUSTER"
            echo "cluster_gpu=$CLUSTER_GPU"
            echo "mimo_audio=$MIMO_AUDIO"
          } >> "$GITHUB_OUTPUT"
      # Chooses a Darkbloom Sandbox or the Blacksmith fallback for the macOS jobs
      # of provider-tests.yml. This table is the one place that names each job's
      # lane and size. A lane is granted whole or falls back whole, so each job
      # (each shard) has a lane of its own and falls back alone, except where
      # shards share one lane with a count: the two Cluster Focused Checks
      # shards, Cluster Runtime Tests shards 2, 3, 6 and 7 (test-cluster-2, a
      # count of 4) and shards 4 and 5 (test-cluster-3). A lane asks for a job
      # only when the job runs.
      #
      # Every lane names its size (<vCPUs>x<GiB>) after its count and its
      # placement, `balanced` (darkbloom-route.yml), so no lane gets the
      # approval's pinned macOS size. A job asks for the smallest signed size (4x16,
      # 4x24, 8x16, 12x32) that holds 1.25 times its sampled used memory (app +
      # wired + compressed, scripts/ci-resource-sampler.py) and on which it is at
      # most 5% slower than on 12 vCPUs; a lane that two shards share holds the
      # larger. Build cluster test products and Cluster Release Build Checks are
      # the exception: they ask for 8x16, on which a cold build is 5 to 10%
      # slower, though a cold build with 12 compile jobs used up to 13.6 GiB,
      # more than 16 / 1.25. The sampled memory of each job is in
      # docs/developer/build.md (Job sizes). Three test lanes ask for more than
      # their memory needs: test-cluster-1 for 4x24, because its GLM-5.3
      # resident-stage tests need more than 16 GiB of physical memory
      # (ClusterStageResidency keeps max(16 GiB, a tenth) for the system), and
      # test-provider-1 for 12x32, because the parallel class runs its tests
      # concurrently in one process and on 4 vCPUs its fan and hardware-load
      # tests' bounded waits time out, also with no serial process beside it,
      # and beside it the memory-budget suites of its selections (Nemotron Super
      # prefix cache, EngineV2 reslice floor) size their budgets from physical
      # memory and fail at 16 GiB. At 4x16 both lanes failed every Darkbloom run
      # (10 of 10, 14 of 14); at 8x16 test-provider-1 failed those suites.
      # 12x32 is the signed size with more than 4 vCPUs and more than 16 GiB.
      # test-provider-gates (Provider Gates) asks for 4x24, the size its gates
      # passed on in the last shard: its 7.9 GiB would fit 4x16, but four of its
      # native MiMo gates size their KV budget from the host's physical memory,
      # and they have never run at 16 GiB. They kept at most 3.25 of 4 vCPUs busy
      # (1.4 on average), so 12x32 would not end them sooner.
      #
      # The lanes are listed with the critical-path test shards first, then the
      # build jobs and Cluster Release Build Checks, then the non-blocking GPU
      # shards.
      #
      # Before them, Check the CI plans (provider-tests.yml's ci-plan-checks)
      # asks for one Linux job on every run that runs the test jobs. It runs
      # Python only, beside the test jobs, which usually outlast it by minutes,
      # so the sandbox's start mainly delays a run that tests no component. Its
      # fallback is the GitHub-hosted ubuntu-24.04 it ran on before it was routed.
      #
      # The route is this job's last step, not a job of its own, so the routed
      # jobs wait for this job alone, without a second GitHub-hosted job's
      # queue, setup and teardown (about 5 s of every run, modeled). Its
      # environment and script are darkbloom-route.yml's route step, byte for
      # byte (scripts/test-darkbloom-route.py pins them), with the lanes in
      # LANES and the script's own defaults for the attempts (2) and
      # require-darkbloom (false), as the router's inputs default: the same
      # request, retries, fallbacks and log. This job holds no id-token
      # permission, so the route sends no OIDC token, as before (the
      # repository is public). It runs after any earlier failure unless the
      # run is cancelled.
      - name: Choose a Darkbloom or fallback runner for each lane
        id: route
        if: ${{ !cancelled() }}
        # The router job's bound; the script itself stops within 140 s.
        timeout-minutes: 3
        shell: bash
        env:
          LANES: |
            ${{ inputs.linux_lanes }}
            ci-plan-checks linux_arm64 ubuntu-24.04 ${{ inputs.run_tests && 1 || 0 }} balanced 4x16
            test-cluster-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 4 || 0 }} balanced 4x24
            test-cluster-3 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 2 || 0 }} balanced 4x16
            test-cluster-focused macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 2 || 0 }} balanced 4x16
            test-provider-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 4x24
            test-cluster-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 1 || 0 }} balanced 4x24
            test-provider-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 12x32
            test-provider-3 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 4x24
            test-provider-4 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 4x24
            test-provider-5 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 4x24
            test-provider-gates macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 4x24
            build-cluster macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 1 || 0 }} balanced 8x16
            build-provider macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.provider == 'true' && 1 || 0 }} balanced 12x32
            cluster-release-checks macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster == 'true' && 1 || 0 }} balanced 8x16
            test-cluster-gpu-1 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster_gpu == 'true' && 1 || 0 }} balanced 4x24
            test-cluster-gpu-2 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster_gpu == 'true' && 1 || 0 }} balanced 4x24
            test-cluster-gpu-3 macos_arm64 blacksmith-12vcpu-macos-27 ${{ steps.choose.outputs.cluster_gpu == 'true' && 1 || 0 }} balanced 4x24
          ROUTING: ${{ vars.DARKBLOOM_ROUTING }}
          PLANE_URL: ${{ vars.DARKBLOOM_SANDBOX_URL }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # ASCII ranges in the patterns below, whatever the runner's locale.
          export LC_ALL=C
          # Temporary files are this user's alone: some hold tokens.
          umask 077

          # The runner sets both only for a job that holds `id-token: write`.
          oidc=""
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            oidc=available
            echo "GitHub Actions OIDC token: available (the calling job grants id-token: write)"
          else
            echo "GitHub Actions OIDC token: not available (this job holds no id-token: write, which only a private repository needs)"
          fi

          # The only labels a lane can receive besides its fallback. A plane
          # decision is used only when it repeats the requested profile and placement exactly.
          profiles='{"linux_arm64":["self-hosted","linux","ARM64","darkbloom-linux-arm64"],"macos_arm64":["self-hosted","macOS","ARM64","darkbloom-macos-arm64"]}'
          # Plane text is untrusted: keep it short, on one line, and free of
          # Markdown, HTML and workflow-command syntax before printing it.
          clean='def clean: tostring | gsub("[^A-Za-z0-9 _.,:;/=+()-]"; "?") | .[0:120];'

          configuration_error() {
            local msg
            msg=$(printf '%s' "$1" | tr '\r\n%' '   ' | head -c 200)
            echo "::error title=Darkbloom route configuration::$msg"
            exit 1
          }

          max_attempts=${MAX_ATTEMPTS:-2}
          [[ $max_attempts =~ ^[1-9]$ ]] \
            || configuration_error "invalid max-attempts: $max_attempts (1 to 9)"
          require_darkbloom=${REQUIRE_DARKBLOOM:-false}
          [[ $require_darkbloom == true || $require_darkbloom == false ]] \
            || configuration_error "invalid require-darkbloom: $require_darkbloom (true or false)"

          # The plane's own bounds (POST /v1/ci/routes answers 400 beyond
          # them), checked here so a mistake fails this job instead of
          # quietly falling every lane back.
          configured='[]'
          seen=' '
          lanes=0
          while read -r lane profile fallback count placement shape extra; do
            [ -n "$lane" ] || continue
            count=${count:-1}
            placement=${placement:-balanced}
            [ -z "$extra" ] || configuration_error "lane $lane has more than six fields"
            [[ $lane =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || configuration_error "invalid lane name: $lane"
            jq -e --arg profile "$profile" 'has($profile)' <<<"$profiles" >/dev/null \
              || configuration_error "lane $lane has unknown profile: $profile"
            [[ $fallback =~ ^[A-Za-z0-9._-]+$ ]] \
              || configuration_error "lane $lane has invalid fallback label: $fallback"
            [[ $count =~ ^([0-9]|1[0-6])$ ]] || configuration_error "lane $lane has invalid count: $count (0 to 16)"
            [[ $placement == balanced || $placement == cheapest ]] || configuration_error "lane $lane has invalid placement: $placement (balanced or cheapest)"
            if [ -n "$shape" ]; then
              [[ $shape =~ ^([1-9][0-9]{0,2})x([1-9][0-9]{0,3})$ ]] \
                && [ "${BASH_REMATCH[1]}" -le 256 ] && [ "${BASH_REMATCH[2]}" -le 1024 ] \
                || configuration_error "lane $lane has invalid shape: $shape (1..256 vCPUs x 1..1024 GiB)"
            fi
            case $seen in *" $lane "*) configuration_error "lane $lane is listed twice" ;; esac
            seen="$seen$lane "
            lanes=$((lanes + 1))
            [ "$lanes" -le 32 ] || configuration_error "more than 32 lanes are configured"
            configured=$(jq -c --arg lane "$lane" --arg profile "$profile" --arg fallback "$fallback" \
              --argjson count "$count" --arg placement "$placement" --arg shape "$shape" \
              '. + [{$lane, $profile, $fallback, $count, $placement, $shape}]' <<<"$configured")
          done <<<"${LANES:-}"
          [ "$configured" != '[]' ] || configuration_error "no lanes are configured"
          requested=$(jq -c '[.[] | select(.count > 0) | {lane, profile, count}
            + (if .placement == "cheapest" then {placement} else {} end)
            + (if .shape != "" then {shape} else {} end)]' <<<"$configured")

          plane_url=${PLANE_URL:-https://api-sandbox.darkbloom.dev}
          body=$(mktemp)
          # GitHub's answer to the token request, and the Authorization header
          # for GitHub and the one for the plane: in files, so that no token
          # is ever an argument of a command. `authorization` is empty unless
          # a token goes to the plane.
          issued=$(mktemp)
          asking=$(mktemp)
          authorization=$(mktemp)
          response_headers=$(mktemp)
          trap 'rm -f "$body" "$issued" "$asking" "$authorization" "$response_headers"' EXIT
          reply=/dev/null
          fallback_reason=""
          if [ "${ROUTING:-}" != on ]; then
            fallback_reason="routing is off"
            note="Routing is off: DARKBLOOM_ROUTING is not 'on'. No request was sent."
          elif [[ ${EVENT_NAME:-} == pull_request* && ${HEAD_REPOSITORY:-} != "${REPOSITORY:-}" ]]; then
            fallback_reason="pull request from a fork"
            note="Pull requests from forks keep their fallback runners. No request was sent."
          elif [ "$requested" = '[]' ]; then
            note="No lane has jobs to run. No request was sent."
          elif [[ $plane_url != https://* ]]; then
            fallback_reason="plane URL is not https"
            note="DARKBLOOM_SANDBOX_URL must start with https://. No request was sent."
          elif ! [[ ${RUN_ID:-} =~ ^[0-9]+$ && ${RUN_ATTEMPT:-} =~ ^[0-9]+$ ]]; then
            fallback_reason="run identity is unavailable"
            note="The run ID or attempt is not numeric. No request was sent."
          else
            request=$(jq -n -c --arg repository "$REPOSITORY" --argjson run_id "$RUN_ID" \
              --argjson run_attempt "$RUN_ATTEMPT" --argjson lanes "$requested" \
              '{$repository, $run_id, $run_attempt, $lanes}')
            # A job that may request one sends the plane this run's OIDC token:
            # GitHub's signed statement of the repository, run and attempt,
            # issued for the plane's origin alone, which the plane requires of
            # a private repository. It is a secret: masked before anything
            # could print it, and never printed. A failure here never fails
            # the job: the request then goes without a token.
            with_token=""
            without_token=""
            if [ -n "$oidc" ]; then
              token=""
              # The audience is the plane's origin as the plane names itself
              # (lowercase, no default port), URI-encoded for the query.
              audience=""
              if [[ $plane_url =~ ^https://([A-Za-z0-9.-]+)(:[0-9]+)?(/.*)?$ ]]; then
                port=${BASH_REMATCH[2]}
                [ "$port" != :443 ] || port=""
                audience=$(jq -rn --arg host "${BASH_REMATCH[1]}" --arg port "$port" \
                  '"https://\($host | ascii_downcase)\($port)" | @uri') || audience=""
              fi
              if [ -z "$audience" ]; then
                token_error="DARKBLOOM_SANDBOX_URL is not https://host[:port][/path]"
              elif [[ $ACTIONS_ID_TOKEN_REQUEST_URL != https://* ]]; then
                token_error="the token request URL is not https"
              else
                printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$asking"
                # As the plane request below: at most one retry, 5 seconds each.
                for attempt in 1 2; do
                  status=$(curl --disable --silent --show-error --proto '=https' --max-time 5 \
                    --max-filesize 16384 --user-agent darkbloom-route/1 \
                    --header @"$asking" --header 'Accept: application/json' \
                    --output "$issued" --write-out '%{http_code}' \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience") || status=000
                  case $status in
                    000|408|429|5??) [ "$attempt" = 2 ] || sleep 1 ;;
                    *) break ;;
                  esac
                done
                if [ "$status" != 200 ]; then
                  token_error="the token request failed, HTTP $status"
                else
                  # `{"value": "<token>"}`: three base64url parts of at most
                  # 8192 bytes, the plane's bound. Anything else is no token.
                  token=$(jq -r -s 'if length == 1 and (.[0] | type) == "object" then .[0].value | strings
                    else empty end' "$issued" 2>/dev/null) || token=""
                  [[ ${#token} -le 8192 && $token =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]] || token=""
                  [ -n "$token" ] || token_error="the token reply is malformed"
                fi
              fi
              if [ -n "$token" ]; then
                echo "::add-mask::$token"
                printf 'Authorization: Bearer %s\n' "$token" > "$authorization"
                with_token=" with this run's OIDC token"
              else
                without_token=" No OIDC token could be requested ($token_error): a private repository's lanes keep their fallback runners."
              fi
            fi
            # Attempt 1 -> 2 pauses 1s to join an in-flight route decision
            # (plane RETRY_BY is 6s, DECISION_BUDGET is 10s). Later retries
            # (when max-attempts > 2) use exponential backoff (2, 4, 8, 15s),
            # honor numeric Retry-After up to 15s, add 0..2s jitter, and stop
            # inside a 140s wall-clock ceiling so the 3-minute job timeout is
            # never hit. Each attempt is bounded to 5 seconds.
            route_started=$SECONDS
            attempt=1
            while :; do
              : > "$body"
              : > "$response_headers"
              retry_after=""
              status=$(curl --disable --silent --show-error --proto '=https' --max-time 5 \
                --dump-header "$response_headers" --max-filesize 65536 --user-agent darkbloom-route/1 --request POST \
                --header 'Content-Type: application/json' --header 'Accept: application/json' \
                --header 'X-Darkbloom-Run-Scoped-Labels: 1' \
                --header @"$authorization" \
                --data-binary @- --output "$body" --write-out '%{http_code}' \
                "${plane_url%/}/v1/ci/routes" <<<"$request") || status=000
              if [ "$status" != 200 ]; then
                # Only fixed server error codes and one numeric Retry-After.
                # Never print the body, arbitrary headers, tokens or request IDs.
                error_code=$(jq -r -s 'if length == 1 and (.[0] | type) == "object"
                  then .[0].error | strings else empty end
                  | select(. == "request_deadline" or . == "service_stopping"
                    or . == "rate_limited" or . == "Service Unavailable")' "$body" 2>/dev/null) || error_code=""
                [ -n "$error_code" ] || error_code=unavailable
                retry_after=$(head -c 8192 "$response_headers" | awk '
                  /^HTTP\// { count=0; value="" }
                  tolower($1) == "retry-after:" {
                    count++; value=$0; sub(/^[^:]*:[ \t]*/, "", value); sub(/\r$/, "", value)
                  }
                  END { if (count == 1 && value ~ /^[0-9]+$/ && length(value) <= 5 && value+0 <= 86400) print value+0 }
                ') || retry_after=""
                diagnostic=$(jq -cn --argjson attempt "$attempt" --arg status "$status" \
                  --arg error "$error_code" --arg retry "$retry_after" \
                  '{attempt:$attempt, http_status:$status, error:$error,
                    retry_after_seconds:($retry | if . == "" then null else tonumber end)}')
                echo "Plane request failed: $diagnostic"
              fi
              case $status in
                000|408|429|5??)
                  [ "$attempt" -lt "$max_attempts" ] || break
                  if [ "$attempt" -eq 1 ]; then
                    pause=1
                    if [ "$status" = 429 ] && [ -n "$retry_after" ] && [ "$retry_after" -gt 1 ]; then
                      pause=$retry_after
                      [ "$pause" -le 15 ] || pause=15
                    fi
                  else
                    pause=$((1 << (attempt - 1)))
                    [ "$pause" -le 15 ] || pause=15
                    if [ -n "$retry_after" ] && [ "$retry_after" -gt "$pause" ]; then
                      pause=$retry_after
                      [ "$pause" -le 15 ] || pause=15
                    fi
                    if [ "$pause" -lt 15 ]; then
                      pause=$((pause + RANDOM % 3))
                      [ "$pause" -le 15 ] || pause=15
                    fi
                  fi
                  [ $((SECONDS - route_started + pause + 5)) -le 140 ] || break
                  sleep "$pause"
                  attempt=$((attempt + 1))
                  ;;
                *) break ;;
              esac
            done
            if [ "$status" != 200 ]; then
              fallback_reason="plane request failed (HTTP $status)"
            elif ! jq -e -s 'length == 1 and (.[0] | type == "object"
                and (.route_id | type == "string" and length > 0)
                and (.expires_at | type == "string")
                and (.lanes | type == "object"))' "$body" >/dev/null 2>&1; then
              fallback_reason="plane reply is malformed"
            else
              reply=$body
            fi
            if [ -n "$fallback_reason" ]; then
              note="Asked $plane_url$with_token: $fallback_reason. Requested lanes keep their fallback runners."
            else
              note=$(jq -r --arg url "$plane_url$with_token" \
                "$clean"'"Asked \($url): route \(.route_id | clean), expires \(.expires_at | clean)."' "$body")
            fi
            note="$note$without_token"
          fi

          decisions=$(jq -n -c --argjson configured "$configured" --argjson profiles "$profiles" --arg run_id "$RUN_ID" \
            --arg fallback_reason "$fallback_reason" --slurpfile reply "$reply" "$clean"'
            ($reply[0].lanes // {}) as $plane_decisions
            | [ $configured[]
                | . as $lane
                | ($profiles[.profile]
                    | if $lane.shape != "" then .[3] += ("-" + $lane.shape) else . end
                    | if $lane.placement == "cheapest" then .[3] += "-cheapest" else . end) as $expected
                | ($plane_decisions[.lane] | if type == "object" then . else {} end) as $decision
                | ($expected | .[3] += ("-run-" + $run_id)) as $scoped
                | if .count == 0 then .target = "fallback" | .reason = "not requested"
                  elif $fallback_reason != "" then .target = "fallback" | .reason = $fallback_reason
                  elif $decision.target == "darkbloom" and ($decision.runs_on == $scoped or $decision.runs_on == $expected)
                  then .target = "darkbloom" | .reason = "granted"
                  elif $decision.target == "fallback"
                  then .target = "fallback" | .reason = "plane: " + ($decision.reason // "no reason" | clean)
                  else .target = "fallback" | .reason = "plane decision is missing or invalid"
                  end
                | .runs_on = (if .target == "darkbloom" then $decision.runs_on else .fallback end) ]')
          echo "$note"
          jq -r '.[] | "\(.lane): \(.runs_on | if type == "array" then join(",") else . end) (\(.reason))"' <<<"$decisions"
          {
            echo "### Darkbloom runner routing"
            echo
            echo "$note"
            echo
            echo "| Lane | Profile | Jobs | Runner | Decision |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.lane)` | \(.profile) | \(.count) | `\(.runs_on | if type == "array" then join(", ") else . end)` | \(.target): \(.reason) |"' <<<"$decisions"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$require_darkbloom" = true ]; then
            fell_back=$(jq -r '[.[] | select(.count > 0 and .target != "darkbloom") | "\(.lane) (\(.reason))"] | join(", ")' <<<"$decisions")
            if [ -n "$fell_back" ]; then
              echo "::error title=Darkbloom route required::require-darkbloom is true but lane(s) fell back: $fell_back"
              exit 1
            fi
          fi

          routes=$(jq -c 'map({key: .lane, value: .runs_on}) | from_entries' <<<"$decisions")
          echo "routes=$routes" >> "$GITHUB_OUTPUT"
