name: Bisect release shard-2 SIGBUS

# TEMPORARY, never merged. Runs the release SDK 27 qualification build (the
# provider-release-build action, as release-provider.yml qualify-sdk-shard
# does) and then one subset of the failing shard-2 selection of dev 70b2f6dc9
# (run 41704012078), always with ProviderCoreTests.Qwen4PagingPrefixIntegrationTests.

on:
  pull_request:
    branches: [bisect-base/release-sigbus]

permissions:
  contents: read

env:
  DEVELOPER_ID: 'Developer ID Application: Eigen Labs, Inc. (SLDQ2GJ6TL)'
  APPLE_TEAM_ID: 'SLDQ2GJ6TL'
  FAN_HELPER_NAME: 'darkbloom-fan-helper'
  FAN_HELPER_ID: 'io.darkbloom.fan-helper'
  MIN_MACOS: '14.0'
  MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'

jobs:
  bisect:
    name: Bisect (${{ matrix.name }})
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fixed-nemotron-slot
            filter: '^(ProviderCoreTests[./]NemotronSuperManagedSlotTests|ProviderCoreTests[./]Qwen4PagingPrefixIntegrationTests)([./]|$)'
            skip: ''
          - name: fixed-shard2-all
            filter: '^(DarkbloomCLITests[./](AddonCommandTests|BenchmarkArrivalPromptTests|BenchmarkNativeBlockModeTests|BenchmarkSchedulerPrefillPromptTests|ClusterWorkerOwnerCommandTests|DesktopAccountIdentityTests|DesktopAutopilotTests|DesktopRuntimeProfileTests|DeviceCheckExtractionBoundsTests|DistributedStartCommandTests|DoctorCaptureTests|DoctorClearBackendGuardFailureTests|FanHelperClientTests|IdleCommandTests|KVBackendGuardDiagnosticsTests|LifecycleRecoveryPublicationTests|LocalStartupPreloadGateTests|MiMoImageOnboardingCommandTests|RegistrationWeightHashTests|ReportCommandRunTests|RuntimeSnapshotConfigTests|SandboxEligibilityTests|ScheduledWindowTimingTests|StartCommandTests|WatchdogRecoveryOutcomeDetailTests|WatchdogSignalTrapTests)|GPTOSSOptimizationTests[./](CBv2ModelGemma4ForwardTests|GPTOSSPrefillOutputTests)|ProviderCoreTests[./](AppAttestDeepDiagnosisTests|AppAttestResumeTransportTests|AttentionMetadataProductionOwnerTests|AudioInputRejectionTests|AutoUpdateClaimTests|AutoUpdateCycleTests|AutopilotInventoryTests|AutopilotStartupPreferencesTests|AutopilotStartupTests|BenchmarkEntryPointRefusalTests|Bonsai9BMTPPolicyTests|BuildEnvironmentTests|ChatRequestExtraFieldsTests|ChatTemplateLoopRewritesTests|ChunkSenderTests|ClusterApprovalFetchTests|ClusterApprovalWatchTests|ClusterChipAgnosticGrantTests|ClusterOwnerServingTests|ClusterPairApprovalTests|ClusterPairServingDecisionsTests|ClusterPairSlotServeTests|CompletePrefixCacheCapabilityTests|CoordinatorHandshakeDeadlineTests|CoordinatorIntegrationTests|DarkbloomMDMRemovalTests|DeviceCodeLoginTests|DiffusionBenchmarkTests|DistributedHTTPCompletionTests|DistributedHTTPDisconnectTests|DistributedHTTPOriginTests|DistributedHTTPRetirementTests|DistributedInstalledLanesTests|DistributedLogprobAdmissionTests|DistributedPrefixPartitionTests|DistributedStopStringScopeTests|EngineTransferredRetirementWorkTests|EngineV2BridgeMultimodalTests|EngineV2BridgePumpReceiptTests|EngineV2CapacityTests|EngineV2KVQuantizationPolicyTests|EngineV2LogprobsChannelCapTests|EngineV2MatchedStopSequenceTests|EngineV2PrefixCacheUsageTests|EngineV2RequestRoutingTests|EngineV2SeededSamplingTests|EngineV2VisionMLXFaultTests|EngineV2VisionRoutingTests|EvalProbeTests|FlintContextAdmissionTests|FlintNativeProtocolTests|FlintPagedOnlyBackendTests|FlintPolicyTests|FlintToolChoicePromptPolicyTests|GLM5NextCalibrationLaunchTests|GLMPairForcedOutputTests|GemmaOptimizationEnvironmentTests|GemmaToolConstraintTests|GlobalKVCacheBudgetAuditTests|KVBackendGuardStoreTests|KVPoolIdleSweepTests|KVQuantizationConfigTests|LaunchAgentRemovalTests|LifecycleMailboxTests|LocalEndpointFileTests|LocalOpenAIObjectCompatibilityTests|LocalServingPostureTests|MTPResliceFallbackTests|MetallibHashTests|MiMoInstalledImagePolicyTests|MiMoMediaDecodeMemoryTests|MiMoMemoryAdmissionTests|MiMoV26EncodedAudiovisualIngressTests|MiMoV26LocalContractTests|MiMoV26ManagedMediaForwardingTests|MiMoV26ManagedSlotTests|MiMoV26NativePagedResourcesTests|ModelBenchmarkDispatchTests|ModelBenchmarkReportTests|ModelCalibrationTests|ModelCatalogTests|ModelCheckpointObservationLifetimeTests|ModelCheckpointStorageSpecificationTests|ModelLoadRefusalTests|ModelPrefixBenchmarkTerminalTests|ModelRevisionActivationTests|ModelRevisionPublicationTests|ModelScannerArchitectureTests|NativeCheckpointQuantizationTests|NativeDiffusionCheckpointStoreTests|NativeLocalConsumerOwnershipTests|NativePairMemberInstallTests|NativePairMemberInvocationTests|NativeWorkerServeQualificationTests|Nemotron35ArchitectureTests|NemotronSuperJPEGContainerTests|NemotronSuperLocalHTTPTests|NemotronSuperLocalOwnerTests|NemotronSuperManagedSlotTests|PagedFootprintTelemetryTests|PrefixCacheEvidenceSequencerTests|ProcessLifecycleTests|PromptTokenCacheTests|ProviderLoopCalibrationTests|ProviderRunMarkerTests|ProviderRuntimeCapabilityTests|Qwen35CBv2FixedRequestAccountingTests|Qwen35TemplateFixesTests|Qwen4PagingPrefixIntegrationTests|Qwen4ReclaimAdmissionTests|Qwen4ToolChoicePromptPolicyTests|QwenVLMTargetExtractionTests|RetirementGateTests|RuntimeMetallibTemporaryDirectoryTests|SSDBlockIndexTests|SSDCheckpointCPUAcceptanceTests|SSDEpochContinuityTests|SSDNativeCheckpointOracleTests|SSDPersistentTestKeyNamespaceTests|SSDPrefixCacheDonationOutcomeTests|SSDPrefixCacheLifecycleTests|SSDShorterRestoreClockTests|SSDWholeRootMaintenanceTests|SSDWriteEnduranceTests|ScheduleTests|SelfUpdaterInstallRootTests|ServeLoopAppAttestTests|ServiceReservationInboundTests|ServiceReservationLifetimeTests|StructuredForcedToolAdmissionTests|SwiftJinjaLoopContextTests|TeacherForcedBenchmarkTests|ThinkStreamingLatencyTests|TinyModelLoadTests|ToolChoicePromptPolicyTests|UnitTests|UpdateBannerTests|WatchdogLaunchAdapterTests|WatchdogProbeParseTests|WatchdogSchedulerTests)|ServingQualificationTests[./](ServingPromptCountArtifactTests))([./]|$)'
            skip: ''
    env:
      DARKBLOOM_RELEASE_ENVIRONMENT: prod
      BISECT_NAME: ${{ matrix.name }}
      BISECT_FILTER: ${{ matrix.filter }}
      BISECT_SKIP: ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: ./.github/actions/provider-release-build
        with:
          lane: qualification
          environment: dev
          shard: 1/5
      - name: Collect crash reports
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/crash"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] && find "$d" -type f -mmin -90 \( -name '*.ips' -o -name '*.crash' \) -exec cp {} "$RUNNER_TEMP/crash/" \; || true
          done
          ls -la "$RUNNER_TEMP/crash"
          for f in "$RUNNER_TEMP"/crash/*; do [ -f "$f" ] && head -c 20000 "$f"; done || true
      - name: Retain crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bisect-crash-${{ matrix.name }}
          path: ${{ runner.temp }}/crash
          if-no-files-found: ignore
