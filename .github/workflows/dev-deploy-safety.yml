name: Dev Deploy Safety

on:
  push:
    branches: [master, main]
    # The inputs of scripts/test-dev-deploy.py and their docs. A test there
    # checks the inputs that it names. deploy-dev.yml arrives with PR 1370.
    paths: &dev-deploy-safety-paths
      - .github/workflows/dev-deploy-safety.yml
      - .github/workflows/deploy-dev.yml
      - coordinator/api/server.go
      - coordinator/Dockerfile
      - deploy/gcp/cloudbuild-prod.yaml
      - deploy/gcp/dev/**
      - deploy/gcp/host-setup.sh
      - deploy/gcp/prod/**
      - deploy/environments/prod.env
      - scripts/smoke-dev.sh
      - scripts/test-dev-deploy.py
      - scripts/run-dev-deploy-safety-ci.sh
      - docs/operations/dev-environment.md
      - docs/developer/test.md
  pull_request:
    paths: *dev-deploy-safety-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-safety:
    name: Dev Deploy Safety (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu 24.04
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: macOS 27
            runner: blacksmith-12vcpu-macos-27
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run contained offline dev-deploy tests
        shell: bash
        run: scripts/run-dev-deploy-safety-ci.sh "${{ matrix.platform }}"
