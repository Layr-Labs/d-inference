# Human-driven GKE rollout. A person pushes a git tag; this pipeline
# builds the image and helm-upgrades the coordinator StatefulSet.
#
# Tag pattern: coordinator-v*   (example: coordinator-v0.8.1)
# Provider-only tags like v0.8.1 must not use this prefix.
#
#   git tag coordinator-v0.8.1 <commit>
#   git push origin coordinator-v0.8.1
#
# Create the trigger once (not on every master push):
#   gcloud builds triggers create github \
#     --project=darkbloom-mainnet \
#     --name=coordinator-gke-tag \
#     --repo-owner=Layr-Labs \
#     --repo-name=d-inference \
#     --tag-pattern='^coordinator-v.*' \
#     --build-config=deploy/gcp/cloudbuild-gke.yaml \
#     --service-account=projects/darkbloom-mainnet/serviceAccounts/darkbloom-coordinator-deploy@darkbloom-mainnet.iam.gserviceaccount.com \
#     --region=us-east4
#
# Direct gcloud builds submit is rejected: TAG_NAME must come from the trigger.

timeout: 1800s

substitutions:
  _IMAGE: us-east4-docker.pkg.dev/darkbloom-mainnet/coordinator/coordinator
  _CLUSTER: darkbloom-mainnet
  _CLUSTER_REGION: us-east4
  _NAMESPACE: darkbloom
  _RELEASE: coordinator
  _HELM_VERSION: v3.16.4

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: require-tag
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ -n "${TAG_NAME}" ]] || {
          echo "TAG_NAME is empty; this config is tag-trigger only" >&2
          exit 1
        }
        [[ "${TAG_NAME}" =~ ^coordinator-v[0-9][A-Za-z0-9._-]*$ ]] || {
          echo "tag ${TAG_NAME} is not coordinator-v*" >&2
          exit 1
        }
        [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
          echo "production builds require a repository trigger with COMMIT_SHA" >&2
          exit 1
        }

  - id: release-integrity
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        ./scripts/check-release-version.sh
        ./scripts/sync-install-embed.sh check

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - TRIGGER_COMMIT=$COMMIT_SHA
      - TRIGGER_TAG=$TAG_NAME
    args:
      - -ceu
      - |
        VERSION=$(awk -F'"' '/public static let version =/ { print $$2 }' \
          provider-swift/Sources/ProviderCore/ProviderCore.swift)
        BUILD_COMMIT="$${TRIGGER_COMMIT}"
        IMAGE_TAG="$${TRIGGER_TAG}"
        BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        printf 'BUILD_COMMIT=%s\nIMAGE_TAG=%s\n' \
          "$${BUILD_COMMIT}" "$${IMAGE_TAG}" > /workspace/release-build.env
        docker build \
          --build-arg "BUILD_VERSION=$${VERSION}" \
          --build-arg "BUILD_COMMIT=$${BUILD_COMMIT}" \
          --build-arg "BUILD_DATE=$${BUILD_DATE}" \
          --tag="${_IMAGE}:$${IMAGE_TAG}" \
          --tag="${_IMAGE}:${SHORT_SHA}" \
          --file=coordinator/Dockerfile \
          .

  - id: smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        source /workspace/release-build.env
        docker inspect "${_IMAGE}:$${IMAGE_TAG}" \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
          | grep -Fx "${COMMIT_SHA}"
        docker run --rm --entrypoint /bin/sh "${_IMAGE}:$${IMAGE_TAG}" \
          -c 'test -x /usr/local/bin/coordinator && test -x /usr/local/bin/promptsidecar'

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        source /workspace/release-build.env
        docker push "${_IMAGE}:$${IMAGE_TAG}"
        docker push "${_IMAGE}:${SHORT_SHA}"

  - id: rollout
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        source /workspace/release-build.env
        curl -fsSL "https://get.helm.sh/helm-${_HELM_VERSION}-linux-amd64.tar.gz" \
          | tar -xz -C /tmp
        mv /tmp/linux-amd64/helm /usr/local/bin/helm
        gcloud container clusters get-credentials "${_CLUSTER}" \
          --region="${_CLUSTER_REGION}" \
          --project="${PROJECT_ID}"
        helm upgrade --install "${_RELEASE}" deploy/helm/coordinator \
          --namespace="${_NAMESPACE}" \
          --create-namespace \
          -f deploy/helm/coordinator/values-prod.yaml \
          --set "image.tag=$${IMAGE_TAG}" \
          --timeout 15m \
          --wait
