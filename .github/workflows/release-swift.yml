name: Release Provider Bundle (Swift)

# CLI-only Swift release entry point. This workflow owns the triggers and routes
# each one to at most one environment lane; the whole resolve -> build ->
# qualify -> sign -> stage -> publish chain lives in the reusable
# .github/workflows/release-provider.yml, called once per environment.
#
# Triggers:
#   - tag vX.Y.Z        -> one prod lane (signed tag on reviewed master). Path
#                          filters do not apply to tags.
#   - push to master    -> one staging lane, when the push changes the provider
#                          or this release tooling (DBLM-771: staging tracks
#                          main). A master push publishes no dev release.
#   - workflow_dispatch  -> the chosen environment's lane: a manual staging
#                          release or a prod recovery of a retained build. With
#                          validation_only, the dev lane builds a signed
#                          validation artifact that it does not publish.
#
# DevNet runs the d-inference dev branch end to end: a dev push publishes the
# DevNet provider through release-dev-branch.yml. No path in this file publishes
# a dev release.
#
# A plain matrix cannot carry each environment's artifact id and digest across
# the dependent build/sign/stage/publish jobs, so each lane is a separate call
# of the reusable workflow. The reusable workflow signs dev, staging and prod
# with the real Developer ID; resolve-provider-release.sh refuses prod on any
# non-tag trigger, so a master push can never reach the prod signing identity.
# The STAGING_* secrets and the staging coordinator do not exist yet (DBLM-771),
# so the staging lane runs only when the STAGING_ENABLED repository variable is
# 'true' (see the staging job).

run-name: >-
  ${{ (github.ref_type == 'tag' && format('prod provider release {0}', github.ref_name)) ||
      (github.event_name == 'push' && format('staging provider release (master push -staging.{0})', github.run_number)) ||
      (inputs.resume_run_id && format('prod provider release (resume run {0})', inputs.resume_run_id)) ||
      (inputs.validation_only && format('dev provider validation build -dev.{0} (not published)', github.run_number)) ||
      (inputs.environment == 'staging' && format('staging provider release -staging.{0} (manual)', github.run_number)) ||
      'prod provider release (manual)' }}

on:
  push:
    tags:
      - 'v*.*.*'
    # A master push publishes a staging release. These paths
    # are the provider sources, its submodule pins, and every script the reusable
    # workflow and .github/actions/provider-release-build run.
    branches: [master]
    paths:
      - 'provider-swift/**'
      - 'libs/**'
      - '.gitmodules'
      - '.github/workflows/release-swift.yml'
      - '.github/workflows/release-provider.yml'
      - '.github/actions/provider-release-build/**'
      - 'scripts/check-release-version.sh'
      - 'scripts/resolve-provider-release.sh'
      - 'scripts/provider-release-resume.py'
      - 'scripts/provider_release_resume/**'
      - 'scripts/provider-release-cache.py'
      - 'scripts/provider_release_cache/**'
      - 'scripts/provider-release-publication.py'
      - 'scripts/provider_release_artifact.py'
      - 'scripts/provider_release_github.py'
      - 'scripts/provider_release_identity.py'
      - 'scripts/provider-signing-validation.py'
      - 'scripts/stage-swiftpm-resource-bundles.sh'
      - 'scripts/prepare-provider-release-toolchain.sh'
      - 'scripts/prepare-metal-toolchain.py'
      - 'scripts/prepare-app-attest-entitlements.py'
      - 'scripts/install-macos-github-cli.sh'
      - 'scripts/install-release-cmake.sh'
      - 'scripts/fetch-metallib.sh'
      - 'scripts/test-qwen4-packaged-resources.py'
      - 'scripts/verify-prompt-parity.sh'
      - 'scripts/prepare-mimo-*-fixtures.py'
      - 'scripts/run-provider-tests.sh'
      - 'scripts/run-nested-suite.sh'
      - 'scripts/run-provider-test-watchdog.py'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional failed tag run with successful build and SDK tests; resume signing without rebuilding'
        required: false
        type: string
      resume_run_attempt:
        description: 'Attempt containing the successful retained build and SDK tests'
        required: false
        type: string
        default: '1'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # A dispatch runs exactly the chosen environment's lane. prod on a
        # non-tag dispatch is only the retained-build recovery path; otherwise
        # resolve-provider-release.sh refuses prod without a source-matching tag.
        # There is no dev choice: dev releases come from the dev branch
        # (release-dev-branch.yml). validation_only selects the dev lane.
        options: [staging, prod]
        default: staging
      version_override:
        description: 'Optional version string when running manually (otherwise derived from tag)'
        required: false
        type: string
      validation_only:
        description: 'Build a signed dev validation artifact without publishing a release (runs instead of the chosen environment)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # gh release create (granted to the reusable workflow)
  actions: read     # download the unsigned artifact from this run

jobs:
  # Manual signed dev validation build only. It never publishes, so no master
  # path publishes a dev release; resolve-provider-release.sh refuses a dev
  # publication too. A validation build keeps its own per-run group.
  dev:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
    concurrency:
      group: ${{ format('release-swift-{0}', github.run_id) }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-provider.yml
    with:
      environment: dev
      resume_run_id: ${{ inputs.resume_run_id || '' }}
      resume_run_attempt: ${{ inputs.resume_run_attempt || '1' }}
      version_override: ${{ inputs.version_override || '' }}
      validation_only: true
    secrets: inherit

  # Master push: publish staging. Manual staging dispatch.
  # Gated OFF until the staging stack exists: set the STAGING_ENABLED repo
  # variable to 'true' once darkbloom-devnet-infra PR 18 is applied and the
  # STAGING_* secrets exist. Unset (the default) means a master push builds and
  # publishes nothing, so provider pushes never burn a build that would
  # hard-fail at staging publication for want of credentials.
  staging:
    if: >-
      ${{ vars.STAGING_ENABLED == 'true' &&
          ((github.event_name == 'push' && github.ref_type == 'branch') ||
           (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' &&
            !inputs.validation_only)) }}
    # One staging publication at a time across master pushes and manual releases.
    concurrency:
      group: release-staging
      cancel-in-progress: false
    uses: ./.github/workflows/release-provider.yml
    with:
      environment: staging
      resume_run_id: ${{ inputs.resume_run_id || '' }}
      resume_run_attempt: ${{ inputs.resume_run_attempt || '1' }}
      version_override: ${{ inputs.version_override || '' }}
      validation_only: ${{ inputs.validation_only || false }}
    secrets: inherit

  # Tags publish prod. A non-tag prod dispatch is the retained-build recovery
  # path; resolve-provider-release.sh refuses prod otherwise. A push to a branch
  # never selects prod, so the prod signing identity is tag-gated. A validation
  # dispatch runs the dev lane instead of the chosen environment.
  prod:
    if: >-
      ${{ github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' &&
           !inputs.validation_only) }}
    concurrency:
      group: ${{ format('release-swift-{0}', github.run_id) }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-provider.yml
    with:
      environment: prod
      resume_run_id: ${{ inputs.resume_run_id || '' }}
      resume_run_attempt: ${{ inputs.resume_run_attempt || '1' }}
      version_override: ${{ inputs.version_override || '' }}
      validation_only: ${{ inputs.validation_only || false }}
    secrets: inherit
