version: "1.1"
created: "2026-05-14"
methodology: STRIDE
# Provider ownership rescope, 2026-10-09. Retained entries keep their original
# evidence, IDs and limitations; this does not re-verify every historical threat.
# Backend-only entries are available in the immutable platform threat model:
# https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/docs/threat-model.yaml
# New cache-storage details from source 4230fa03ddbc84e34e2de150c89431744d6f1c55
# remain in the retained cache threat. No endpoint or deployment changes here.
# Original scoped verification dates and review notes remain available at:
# https://github.com/Layr-Labs/d-inference/blob/4230fa03ddbc84e34e2de150c89431744d6f1c55/docs/threat-model.yaml
description: >
  Provider and native-runtime threat model, including the external trust
  contracts the provider consumes. The provider and coordinator remain plaintext
  endpoints. Code availability, public golden vectors and repository ownership
  do not establish live policy, physical security transitions or correct inference.
scope:
  in_scope:
    - External coordinator to provider WebSocket contract
    - Provider process versus local operator, memory and disk
    - Native MLX inference, media and encrypted prefix-cache storage
    - Optional privileged fan helper
    - Provider keys, Apple attestation and consumed serving authorization
    - Exact signed provider artifact and qualification contract
  out_of_scope:
    - Backend implementation, databases, payments, consumer console and admin UI
    - Backend infrastructure or console-hosting cutover
    - New production activation or qualification claims
    - Nation-state physical lab attacks on Apple Silicon

adversaries:
  - id: ADV-001
    name: malicious_provider
    description: >
      A Mac owner running the darkbloom provider CLI who wants to exfiltrate consumer
      prompt content, fake attestation to appear trusted, serve manipulated model
      outputs, or steal payment. Has physical and OS-level access to the host machine
      and can attempt reboots, security-policy changes, process instrumentation and
      credential relays. Apple hardware key isolation and verified platform policies
      are trust assumptions, not conclusions drawn from provider-reported flags.

  - id: ADV-002
    name: malicious_consumer
    description: >
      An authenticated or unauthenticated consumer who wants free inference, wants to
      enumerate or attack providers, manipulate billing, or extract information about
      the platform. Has access to the OpenAI-compatible API and console UI with a
      valid or stolen API key.

  - id: ADV-003
    name: external_attacker
    description: >
      An unauthenticated external party targeting the coordinator HTTP API, console UI,
      MDM webhook, or WebSocket endpoint. No prior access assumed. Goals include
      account takeover, SSRF, DoS, trust escalation, or payment manipulation.

assets:
  - id: A-001
    name: consumer_prompts_completions
    description: Plaintext inference requests and responses from consumers.
    sensitivity: critical
    notes: >
      Sealed to the provider's X25519 key on the coordinator→provider leg (fresh
      session key pair per request) and to the coordinator's per-request session key
      on the provider→coordinator leg. The coordinator is a plaintext endpoint on
      every request: it decrypts in memory to parse, route, bill and re-encrypt, and
      does not log or persist content. Optional sender sealing
      (Content-Type application/eigeninference-sealed+json) protects the
      consumer→coordinator leg from TLS-terminating intermediaries; it does not hide
      content from the coordinator. Product copy claiming otherwise is SEC-015.
      Canonical description: docs/architecture/security/encryption.md.

  - id: A-002
    name: provider_se_p256_key
    description: Secure Enclave P-256 key used to sign attestation blobs and challenges.
    sensitivity: critical
    notes: Hardware-bound, non-exportable. Cannot leave the SE silicon.

  - id: A-003
    name: provider_x25519_key
    description: X25519 Diffie-Hellman private key used for E2E encryption of inference traffic.
    sensitivity: critical
    notes: >
      Generated in memory for each provider process (NodeKeyPair.generate() in the
      ProviderLoop initialiser; legacy on-disk key files are purged at start) and
      bound to the Secure Enclave identity through the signed blob's
      encryptionPublicKey. Never written to disk. Compromise of a running process
      exposes traffic for that process lifetime only. See
      docs/architecture/security/identity-binding.md.

  - id: A-004
    name: model_weights
    description: LLM weight files cached at ~/.cache/huggingface on the provider machine.
    sensitivity: high
    notes: >
      Not cryptographically protected at rest. An operator can replace weights; the
      coordinator's weight-hash verification is currently fail-open (SEC-007).
      Supplied hashes may match the desired revision or a previously promoted,
      non-retired revision of that same model during automatic weight updates.
      Explicit revision retirement removes that approval; unpromoted hashes are
      never added to the accepted set.

  - id: A-005
    name: coordinator_release_api_key
    description: Secret API key that authorises release registration at POST /v1/releases.
    sensitivity: critical
    notes: Controls which binary hashes are trusted for provider connections.

  - id: A-009
    name: payment_ledger
    description: Internal micro-USD balance ledger in PostgreSQL.
    sensitivity: high
    notes: Atomic balance operations required; duplicate webhook risk (SEC-012).

  - id: A-010
    name: attestation_blob_and_mda_chain
    description: >
      SE-signed attestation blob (hardware info, binary hash, SIP/SecureBoot state) and
      the Apple MDA DER certificate chain signed by Apple Enterprise Attestation Root CA.
    sensitivity: critical
    notes: >
      Legacy evidence only. MDM SecurityInfo grants hardware after comparison with
      the signed blob; MDA is a separate device-bound proof. App Attest authorization
      never fabricates either flag. Integrity must be maintained end-to-end.

  - id: A-011
    name: provider_binary_hash_registry
    description: Set of SHA-256 hashes of blessed provider binaries registered with the coordinator.
    sensitivity: critical
    notes: Controls which provider binaries can connect and serve private requests.

  - id: A-014
    name: provider_fan_control_authority
    description: >
      Root authority to place Apple Silicon fans into manual mode, set bounded
      RPM targets, and temporarily assert the global Ftst fan-control gate.
    sensitivity: high
    notes: >
      Dormant unless the operator explicitly runs sudo darkbloom fan enable.
      Misuse can reduce cooling or interfere with macOS thermal management.

  - id: A-015
    name: app_attest_credential_and_evidence
    description: >
      Apple App Attest key, verified enrollment/assertion evidence, assertion counters,
      original and renewed risk receipts, and account/machine associations.
    sensitivity: critical
    notes: >
      Separate from the legacy SE signing identity. Raw evidence is private; verified
      continuity does not certify physical uniqueness, RAM or computation correctness.
      Code: coordinator/appattest/verify.go, coordinator/appattest/service/archive.go.

  - id: A-016
    name: app_attest_serving_authorization
    description: >
      Expiring coordinator authorization bound to account, machine, credential,
      connection, process endpoint and current policy/qualification generations.
    sensitivity: critical
    notes: >
      A cached verdict or public diagnostic is not a reusable credential. Final
      dispatch rechecks live state; revocation cannot retract an in-flight request.
      Code: coordinator/registry/app_attest_authorization.go,
      coordinator/registry/inference_authorization.go.

  - id: A-017
    name: durable_build_qualifications
    description: >
      Independently approved signed-artifact and full CodeDirectory identity,
      qualification provenance, revocations and generations consumed by App Attest.
    sensitivity: critical
    notes: >
      Release publication keys cannot approve qualifications. A reported binary hash
      or green CI run alone is not operator qualification or Apple code evidence.
      Code: coordinator/appattest/service/build_qualifications.go.

trust_boundaries:
  - id: TB-002
    name: coordinator_to_provider_websocket
    description: >
      Providers open an outbound WebSocket to the coordinator. The coordinator upgrades
      the connection, receives a RegisterMessage, and runs attestation verification.
      Critically, providers are added to the active registry before attestation completes;
      verification is asynchronous. The coordinator is trusted; providers are adversarial
      until fully attested.
    how_it_works: >
      The WebSocket upgrade (provider.go) uses InsecureSkipVerify: true — no origin
      validation. A hard 10 MB per-message read limit is applied (conn.SetReadLimit). No
      pre-authentication, rate limiting, or connection limit exists before the upgrade.

      On receiving a RegisterMessage the coordinator immediately calls registry.Register()
      (registry.Register) which adds the provider to the active registry. Attestation verification
      runs asynchronously after this. Registration validates: TPS values clamped to hard
      limits; hardware memory clamped to 0–1024 GB; models filtered against the catalog;
      X25519 public key decoded and checked for 32-byte length.

      Binary hash policy: if a policy is configured, the hash in the attestation must
      match a registered blessed hash or the provider is marked untrusted — but it
      remains in the registry. If no policy is configured, any binary passes. Weight
      hash enforcement is fail-open: omitting weight_hash never fails admission.

      Public serving accepts either an independently valid legacy path or a current
      qualified App Attest authorization. Registration alone grants neither. The
      common gate in coordinator/registry/attestation_policy.go
      (providerSupportsPrivateTextAuthorizationAtLocked) requires the current
      process encryption key, mlx-swift backend, encrypted responses, checked runtime
      manifest and all five privacy capabilities. Liveness, RuntimeVerified, model
      and request-trait gates still apply to both paths.

      The legacy branch of the private-text routing gate
      requires all of: PublicKey present, backend mlx-swift, EncryptedResponseChunks,
      RuntimeManifestChecked, ChallengeVerifiedSIP, current application evidence when
      a release policy is enforced, CodeAttested once code-attestation enforcement is
      active, and five PrivacyCapabilities fields (text_backend_inprocess,
      text_proxy_disabled, anti_debug_enabled, core_dumps_disabled, env_scrubbed).
      The retired Python-runtime flags (python_runtime_locked,
      dangerous_modules_blocked) are no longer sent by the Swift provider and are
      never consulted. ChallengeVerifiedSIP is set by
      the coordinator after verifying a signed challenge response — not trusted from
      the provider. The gate is evaluated inside providerLivenessGateReasonLocked
      (routing_eligibility.go), which also requires a challenge verified within the
      last 16 minutes (challengeFreshnessMaxAge), unless the independent App Attest
      lease supplies authorization. A live App Attest grant substitutes for legacy
      trust-minimum, challenge-freshness, SIP, release-evidence and APNs requirements;
      it does not set TrustHardware, MDAVerified or CodeAttested. Shadow evidence alone
      never substitutes. See TB-011 and T-052..T-058.

      Every final inference write rechecks the current connection, account/machine/
      endpoint binding, revocation/expiry, model and request policy under locks
      (coordinator/registry/inference_authorization.go, authorizeInferenceHandoff).
      A successful check commits an in-flight frame; later revocation cannot recall
      that frame or already delivered plaintext. Authenticated owner routing can
      relax the public trust floor and private-only restriction, but retains runtime,
      privacy, freshness and explicit denial gates. It is not public-fleet eligibility.

      Challenge-response runs immediately after registration and then every 5 minutes.
      The coordinator generates a 32-byte cryptographically random nonce, stores it in
      a one-time-use tracker (deleted on first response), and waits 30 seconds. The
      provider signs (nonce + timestamp) with the SE P-256 key; the coordinator verifies
      the ECDSA signature against the registered public key. Three consecutive failures
      mark the provider permanently untrusted; SIP=false or SecureBoot=false in any
      response triggers immediate untrust without the 3-strike rule.

      Status fields (SIPEnabled, SecureBootEnabled, BinaryHash, ActiveModelHash, etc.)
      are covered by a separate status_signature over a canonical JSON payload. Since
      2026-09-27 a provider with an attested SE key must send it: a missing or empty
      status_signature fails the challenge, as does an omitted SIP or Secure Boot
      status. Only a provider without an attested key (trust none) has advisory
      status fields.

      Optional App Attest ready/proof diagnostics (process and boot history,
      signing preflight, local SIP/root observations, key/push history and native
      error chains) are untrusted context, excluded from AppAttestShadowHash and
      the provider clientHash. A provider may forge or omit them. The coordinator
      strips invalid optional members independently; they do not grant, extend,
      revoke or fence serving authorization and are distinct from verified status
      evidence. Private diagnostic events/archives and admin views must not be
      treated as consumer verification. Local marker files and doctor verdicts
      are also not trust evidence. Operator-initiated reports retain OS log
      redaction and bounded, closed-pattern device-wide DeviceCheck observations;
      those observations cannot be attributed to this provider's key. No new
      consumer trust claim or attestation-policy exception follows from this data.
      Code: coordinator/protocol/app_attest_deep_diagnostic.go,
      coordinator/appattest/service/ready_diagnostics.go; contract:
      docs/reference/app-attest-shadow.md, docs/consumer/verification.md.
    current_limitations:
      - "No pre-authentication rate limiting or per-IP connection caps before WebSocket
        upgrade. Any client can open arbitrary connections and attempt registration
        (provider.go, SEC-034)."
      - "Provider is added to the active registry before attestation verification
        completes. There is an async window where a provider with an invalid attestation
        is technically registered. This is not itself serving permission; shared
        gates and final handoff must reject an unqualified connection."
      - "Weight hash enforcement is fail-open: a provider can omit weight_hash entirely
        and still be admitted, even for models with a known expected hash in the catalog
        (registry.go, SEC-007)."
      - "Not every WebSocket frame has an independent signature. Legacy status and
        App Attest proofs have their own verification; inference uses the selected
        connection, live dispatch authorization and encrypted transport. Neither
        attestation path proves that a returned result is correct model execution."
      - "10 MB per-message cap is global with no per-provider send/receive quota."

  - id: TB-003
    name: provider_operator_vs_process
    description: >
      The human operator who owns the Mac has full OS-level access: filesystem, process
      list, network interfaces. The darkbloom process must remain secure against this
      adversary. The design assumes SIP and Hardened Runtime are active (enforced at
      startup and via 5-minute coordinator challenges). The Secure Enclave provides a
      hardware boundary that even the operator cannot cross.
    how_it_works: >
      PT_DENY_ATTACH is applied at process startup via a raw ptrace(PT_DENY_ATTACH, 0,
      nil, 0) syscall (AntiDebug.swift denyDebuggerAttachment). While SIP is active
      this blocks debugger attachment even from root. Any non-zero result is fatal —
      SecurityError.ptDenyAttachFailed ("refusing to continue without anti-debug
      protection") with no environment override; checkDebuggerAttached reads P_TRACED
      via sysctl as a belt-and-suspenders check. At the same point the process
      disables core dumps (setrlimit RLIMIT_CORE=0) and EnvironmentScrubber unsets
      13 loader/malloc-debug variables (DYLD_INSERT_LIBRARIES, DYLD_LIBRARY_PATH,
      DYLD_FRAMEWORK_PATH, LD_PRELOAD, MallocStackLogging,
      MallocStackLoggingNoCompact, MallocScribble, MallocGuardEdges, MallocLogFile,
      MallocErrorAbort, NSZombieEnabled, OBJC_DEBUG_POOL_ALLOCATION,
      CFNETWORK_DIAGNOSTICS).

      SIP is checked once at startup by spawning /usr/bin/csrutil status and parsing for
      "enabled" (SecurityHardening.swift). If disabled the process aborts. The
      check is not repeated after startup; it is sound because disabling SIP requires a
      reboot into Recovery Mode which kills the process and purges inference data.

      The binary is SHA-256 hashed at startup via _NSGetExecutablePath() with symlink
      resolution, read in 64 KB chunks (BinaryHasher.swift). The hash is included in the
      SE-signed attestation blob and verified by the coordinator against its registry of
      blessed hashes. The hash is computed once at startup and not re-verified at runtime.

      The SE P-256 key is now persistent and stored in the macOS keychain via
      the Security framework (PersistentEnclaveKey.swift). On first launch the key is
      created with kSecAttrIsPermanent=true, bound to the keychain access group
      SLDQ2GJ6TL.io.darkbloom.provider (team-scoped), and labeled
      io.darkbloom.provider.attestation-signing.v2 (the current defaultLabel). A
      legacy v1 keychain item is never read: releases after v0.9.10 dropped the
      v1-to-v2 migration, so a host that holds only a v1 key creates a fresh v2
      key, and with it a new SE identity. Subsequent launches load the existing
      key by access group and label query. The private key
      never leaves the SE silicon. Two operations are performed with it: (1) ECDSA
      signing of attestation blobs, and (2) ECIES unwrap/decryption — when the
      default EngineV2 SSD cache is active (unless the single
      DARKBLOOM_PREFIX_CACHE=0 kill switch is set), the
      same key decrypts the wrapped per-provider KEK that protects on-disk KV
      (PersistentEnclaveKey+ECIES.swift, SecureEnclaveKeyWrappingService.swift). This
      grants entitled same-team binaries a decryption capability on this key, not only
      signing — the keychain item to audit is the v2 label above. ProviderLoop tries
      the persistent key first and falls back to an ephemeral CryptoKit key with a
      warning if the persistent path fails (e.g. errSecMissingEntitlement=-34018, which
      fires when a patched or unsigned binary lacks the keychain-access-groups
      entitlement, effectively preventing impostor binaries from using the established
      identity). Note: with the ephemeral fallback the KV cache cannot persist across
      restarts and is disabled rather than using a non-persistent key.

      The X25519 encryption key pair is generated ephemerally in memory using libsodium
      (NodeKeyPair.swift). It is NOT persisted to disk (the pre-v0.5 on-disk
      node_key files were purged by every release through v0.9.10; later releases
      drop that sweep). The secret key exists only in process memory, protected by Hardened
      Runtime (kernel denies task_for_pid).

      The provider config file (~/.config/darkbloom/provider.toml) stores only
      operational settings (coordinator URL, backend port, idle timeout, model list).
      It contains no cryptographic secrets. Core dumps are disabled (RLIMIT_CORE=0).
      Memory wiping functions (secureZero via memset_s) are defined in
      SecurityHardening.swift but call-site coverage in the inference path is not
      confirmed from static analysis.

      Cache payload placement is operator-controlled through provider.toml.
      A selected external APFS volume is not part of the attested Mac boundary:
      its controller can retain, replay or delete ciphertext and expose activity
      metadata. UUID and filesystem checks detect ordinary replacement, not a
      malicious clone. Keys stay on the Mac; T-041 describes cache protections
      and retention limits. Cache disk-space checks use the selected payload
      volume, while daily-write accounting stays on the Mac.
    current_limitations:
      - "Binary hash is computed once at startup. A binary modification after the hash
        is captured (e.g. via a writable path the binary was loaded from) would not be
        detected until the next coordinator challenge (BinaryHasher.swift)."
      - "SIP check is single-shot at startup. This is sound given the Recovery Mode
        reboot requirement, but there is no in-process re-verification between coordinator
        challenges."
      - "secureZero* (memset_s) functions are defined but their invocation in the actual
        inference data path (decrypted prompt buffers, KV-cache tensors) is not confirmed
        by static analysis of SecurityHardening.swift."
      - "GPU-side MLX buffers (Metal) are not explicitly zeroed between requests.
        Residual prompt tokens and KV-cache data may persist in GPU memory until
        overwritten by the next batch."
      - "PT_DENY_ATTACH is applied early in startup, but a narrow race window exists on
        very fast process restart where a debugger could attach before the syscall fires
        (AntiDebug.swift)."
      - "The operator can read and replace model weight files at
        ~/.cache/huggingface. The coordinator's weight hash check is currently fail-open
        (SEC-007), so a substituted model may be served without detection."
      - "The persistent SE key (PersistentEnclaveKey.swift) is accessible to any binary
        presenting the same keychain access group (SLDQ2GJ6TL.io.darkbloom.provider) and
        label query. A legitimately code-signed binary from the same Developer ID team
        that includes the keychain-access-groups entitlement could load and sign with the
        established identity. The entitlement is team-scoped, so this does NOT apply to
        third-party binaries; it is limited to Apple-Developer-ID-signed code from team
        SLDQ2GJ6TL."
      - "errSecMissingEntitlement (-34018) fallback to an ephemeral key means a patched
        binary silently continues to operate rather than refusing to start. The ephemeral
        fallback key will differ from the registered public key, causing coordinator
        attestation verification to fail, but the failure occurs at the coordinator — the
        binary itself does not halt on keychain access failure."

  - id: TB-007
    name: provider_inference_engine
    description: >
      The in-process MLX inference engine (mlx-swift-lm) executes inside the darkbloom
      process on the provider's Apple Silicon GPU. Decrypted prompt data is present in
      process memory during inference. Isolation from the OS and operator is provided by
      the process boundary, Hardened Runtime, and memory wiping. The inference engine
      is the innermost trust boundary — a failure here directly exposes consumer data.
    how_it_works: >
      ProviderLoop and StandaloneServer own one EngineV2Bridge per resident model.
      Each bridge wraps mlx-swift-lm ContinuousBatchingV2 with a configurable
      running-row cap (default 4, clamped to 1–8) and a bounded waiting queue
      (default 64). EngineV2Runtime is the
      process-wide registry used for aggregate capacity and cancellation. Every v0.7.5
      model slot uses this path; there is no legacy inference fallback.

      Model weights are loaded from the HuggingFace cache directory
      (~/.cache/huggingface) via ModelScanner.resolveLocalPath(). Weight integrity is
      verified by WeightHasher: all weight files (*.safetensors, *.npz, *.bin),
      config.json, and tokenizer files are sorted lexicographically, SHA-256 hashed
      individually in parallel, and the per-file digests are concatenated then hashed
      again to produce a single root hash. This hash is advertised to the coordinator at
      registration and in heartbeats. The coordinator's enforcement of this hash is
      currently fail-open (SEC-007).

      Cancellation is managed via InferenceCancellationToken (NSLock-protected boolean).
      The token is checked between token generation steps in the streaming loop
      (ProviderLoop.swift). When cancelled the provider sends an inference_error
      response and stops generation. An active GPU forward pass is not interrupted —
      cancellation is checked only at the Swift layer between MLX calls.

      Response encryption uses the consumer's ephemeral X25519 public key via NaCl
      crypto_box (XSalsa20-Poly1305). Shared-key precomputation or per-chunk encryption
      failure sends inference_error and aborts the stream; plaintext response chunks are
      never emitted. The coordinator independently rejects plaintext chunks.

      Idle timeout requires a resident model, no in-flight requests, and elapsed time
      at or above the configured timeout. On unload, ProviderLoop unregisters and
      gracefully shuts down the model's EngineV2Bridge, removes the ModelSlot, and
      clears MLX's cache before re-slicing the surviving engine grants.

      GPU memory metrics (MLX.GPU.activeMemory, peakMemory, cacheMemory) are tracked
      and reported but not explicitly zeroed between requests. There is no Metal-level
      memset of GPU buffers between inference sessions.

      Encrypted DBK3 cache payloads may reside on the built-in disk or an
      operator-selected local APFS volume. CacheVolume and descriptor-relative
      I/O enforce the selected filesystem's UUID, ownership and suitability;
      external or unclassified volumes must report encryption. The volume is
      not an attested part of the inference boundary: firmware and a cloned
      filesystem UUID remain outside these checks. The KEK and write ledger
      stay on the Mac. T-041 covers the residual cache exposure.
    current_limitations:
      - "GPU-side MLX buffers (Metal allocations for activations, KV-cache, logits) are
        not explicitly zeroed between requests. Residual inference data from one consumer
        may be readable by a subsequent consumer's batch if MLX reuses allocations."
      - "Cancellation does not interrupt an active GPU forward pass. The MLX computation
        continues to completion before the Swift cancellation check fires, wasting
        provider resources and delaying billing reconciliation."
      - "The idle timeout monitor polls every 60 seconds, meaning a model can remain
        resident in GPU memory for up to 60 seconds beyond the configured timeout."
      - "Weight hash enforcement is fail-open at the coordinator (SEC-007). An operator
        who replaces model weight files will cause a hash mismatch in the next heartbeat,
        but omitting the hash entirely passes both registration and challenges."
      - "Model weight files are loaded from the user-writable HuggingFace cache directory.
        The operator can replace weight files between idle periods without affecting the
        currently-loaded model."
      - "Cache TTL does not erase ciphertext from detached,
        replaced or previously selected volumes. Cleanup needs access to the selected
        volume; retained copies require destruction of the installation KEK for a
        cryptographic purge. Disk metadata and malicious firmware are not hidden or
        authenticated by payload encryption."

  - id: TB-009
    name: apple_attestation_chain
    description: >
      The legacy evidence path consists of SE key generation → attestation
      blob construction and SE signing → coordinator signature verification → MDM
      SecurityInfo cross-check (the sole hardware grant) → MDA cert chain from Apple
      (the separate mda_verified flag) → ongoing challenge-response.
      This describes the legacy path, not every eligible provider. TB-011 describes
      independent App Attest authorization; a connection may hold either or both.
      Shared runtime gates and explicit hard denial constrain both. MDA is not a
      prerequisite for the legacy hardware level, and App Attest does not manufacture
      legacy hardware, MDA or APNs evidence.
    how_it_works: >
      SE key lifecycle: PersistentEnclaveKey.swift creates or loads a persistent
      SecureEnclave P-256 signing key stored in the macOS keychain under access group
      SLDQ2GJ6TL.io.darkbloom.provider (team ID prefix) with label
      io.darkbloom.provider.attestation-signing.v2 and kSecAttrIsPermanent=true. A
      legacy v1 key is never read or migrated; a host that holds only a v1 key
      creates a fresh v2 key.
      The same public key is reused across restarts, giving the provider a stable
      hardware-bound identity. The private key never leaves the SE silicon. The public
      key (raw 64-byte X||Y without 0x04 prefix, base64-encoded) is bound to the X25519
      encryption key in the attestation blob and in the coordinator registration message.
      Routine process restarts reuse a working key. PersistentEnclaveKey
      (loadOrCreateVerified) can repair an unusable key once; startup can fall back
      to an ephemeral SE key. A new key must not inherit old trust by identifier alone.
      The separate App Attest credential has its own enrollment/recovery lifecycle.

      Attestation blob: AttestationBuilder.swift constructs a JSON structure containing
      hardware info, SIP/SecureBoot/ARV state, the SE public key, the X25519 encryption
      public key, the binary SHA-256 hash, system volume hash, serial number, and an
      RFC3339 timestamp. Keys are serialized in sorted order to match Go's
      encoding/json field ordering. The blob is signed with SE P-256 ECDSA (DER-encoded).

      Coordinator verification (attestation.go): the raw P-256 public key is
      decoded (raw 65-byte uncompressed format), validated on the P-256 curve, then used
      to verify the DER ECDSA signature over SHA-256(canonical_json_bytes). Three checks
      are mandatory and will fail the attestation: SecureEnclave not available, SIP
      disabled, SecureBoot disabled. ARV and RDMA are parsed and logged but not enforced.
      The blob timestamp must be within ±2 minutes of coordinator time
      (RegistrationAttestationMaxAge, CheckTimestamp()) or the provider is marked
      untrusted; providers re-sign the blob on every reconnect.

      Challenge-response: every 5 minutes the coordinator generates a 32-byte random
      nonce (base64), stores it in a one-time-use map keyed by nonce string, and sends
      it with a UTC RFC3339 timestamp. The provider signs (nonce + timestamp) with the
      SE key — raw string concatenation with no delimiter. The coordinator verifies the
      ECDSA signature, checks nonce matches, and checks that SIPEnabled is not nil and
      not false. SIP=false (and other security failures: bad signature, hash mismatch,
      impersonation) trigger immediate, non-recoverable MarkUntrusted(). 3 consecutive
      challenge *timeouts* (sleep / network blip) trigger MarkUntrustedTransient() via the
      3-strike counter: the provider is derouted but the challenge loop keeps probing it,
      and the next fully passing challenge restores it to online (RecordChallengeSuccess).
      Signature/SIP/hash failures are never auto-recovered and still require a reconnect.

      Status signature: nonce, timestamp and the reported fields in
      StatusCanonicalInput are signed separately. StatusCanonical.build in
      provider-swift/Sources/ProviderCore/Security/AttestationBuilder.swift uses a
      typed JSONEncoder payload with sorted keys, including mixed-case keys inside
      model_hashes and template_hashes, to match BuildStatusCanonical in
      coordinator/attestation/attestation.go byte-for-byte. Actual U+2028/U+2029
      scalars are escaped as \u2028/\u2029; literal backslash-u text stays distinct.
      Nonce and timestamp remain present; absent optional flags, empty optional hash
      strings and empty maps are omitted, while explicit false remains signed.

      VerifyStatusSignature in coordinator/attestation/attestation.go checks the
      P-256 DER signature over SHA-256 of those canonical bytes. Byte compatibility
      fixes false signature failures without changing the signed field set or trust
      policy. Malformed or mismatching signatures remain challenge failures in
      coordinator/api/provider.go (verifyChallengeResponse). If status_signature is
      absent or empty, ErrStatusSignatureMissing is returned and the challenge fails
      (outcome status_sig_missing); every Swift provider signs the status in every
      challenge response. Canonical mechanism: docs/architecture/security/attestation.md.
    current_limitations:
      - "Nonce and timestamp are concatenated without a delimiter for the challenge
        signature (nonce + timestamp). A crafted nonce ending with a partial timestamp
        string could theoretically produce the same signed bytes as a different
        (nonce, timestamp) pair, though in practice base64 nonces (44 chars) and RFC3339
        timestamps are statistically non-overlapping."
      - "Upcoming legacy MDM policy freezes authenticated account/SE-key/serial
        membership for already successfully MDM-verified devices on first upgraded
        startup after revocation replay. FreezeLegacyMDMCohort persists the cutoff
        and cohort across restarts, including an empty cohort. Initial qualification
        excludes soft-deleted users and provider records; later reads preserve
        the frozen snapshot. See docs/architecture/security/enrollment.md. New accounts,
        devices, keys and associations are excluded. Lost or hashless historical
        evidence may be conservatively omitted; retained hardware snapshots plus
        authenticated inventory may supplement it. Membership never replaces
        revocation, posture, freshness or code-identity checks. No grace period is
        chosen and no expiry is implemented. Code: coordinator/internal/provider/legacymdm/policy.go
        (Policy.Initialize, Policy.RegistrationAllowed, Policy.ProviderAllowed),
        coordinator/store/legacy_mdm_cohort.go (LegacyMDMCohortStore)."
      - "The upcoming /v1/enroll gate requires a linked provider Bearer token and
        an SE-key signature over darkbloom-mdm-enroll-v1, the lowercase SHA-256
        token hash, the SE public key and Unix timestamp separated by LF. Proofs
        are bounded to five minutes of coordinator time; reenrollment requires
        the existing key under its frozen account. Identity recovery, scheduler
        submission, live MDM, late callbacks and cached trust reuse apply cohort
        gates. New identities require qualified App Attest; unsupported OS
        versions do not create a fallback."
      - "Noncohort connections require qualified App Attest on owner self/prefer
        routes too; a TrustNone floor cannot bypass the per-connection
        RequireAppAttestServingAuthorization gate at shared routing and final
        handoff. Initialization validates enabled production App Attest serving
        with full rollout before freezing; invalid configuration fails startup
        without silently freezing membership. Configuration does not qualify a
        build or replace verified proofs."
      - "Grandfathered MDM-only serving does not qualify for base rewards: current
        qualified App Attest authorization is required, including for machines
        with both evidence paths. Existing economics guards and inference/work
        earnings are unchanged; historical rewards are not clawed back."
      - "The generic MDM profile remains inherently copyable. MicroMDM SCEP and
        check-in bypass coordinator enrollment authorization, so a copied profile
        can enroll another Mac directly in MicroMDM. Cohort restrictions guarantee
        coordinator MDM authorization, not literal inability to enroll through
        those direct endpoints. Profile possession or MicroMDM enrollment does
        not add a new identity to the cohort or grant legacy serving permission."
      - "MDA freshness code is sha256(SE_public_key_bytes). The SE public key remains
        visible for public connections in GET /v1/providers/attestation and can link
        successive sessions. Private-only providers are excluded before shared caching.
        An attacker can pre-compute the expected freshness code for any known provider."
      - "No OCSP or CRL checks on the Apple Enterprise Attestation Root CA chain. A
        compromised or revoked Apple intermediate CA certificate would be accepted by the
        coordinator until the embedded root CA is manually updated."
      - "ARV (Authenticated Root Volume) status is parsed from both SE attestation and
        MDA OIDs but is explicitly not enforced in the trust state machine. Providers
        with a tampered system volume can still reach TrustHardware."
      - "MDM webhook authentication is an optional shared secret (see TB-005). Where it
        is unset, a forged SecurityInfo callback matching a live CommandUUID can cause a
        provider to reach TrustHardware without genuine Apple MDM enrollment, which is
        a prerequisite for the MDA step."
      - "MDM/MDA verification is asynchronous. A self_signed label alone is not
        public authorization: the configured trust floor and other legacy gates must
        pass, or a current App Attest lease must independently qualify. Owner routing
        is a separate authenticated policy with common privacy/runtime gates."

  - id: TB-010
    name: provider_to_privileged_fan_helper
    description: >
      An optional root LaunchDaemon owns the AppleSMC fan-write connection. The
      unprivileged provider may only renew a bounded activity lease or read status;
      root may additionally request automatic restoration. The helper is outside
      the user-writable provider install tree.
    how_it_works: >
      Explicit sudo enable verifies the separately signed nested helper and atomically
      copies it to /Library/PrivilegedHelperTools/io.darkbloom.fan-helper, with a
      root-owned LaunchDaemon plist and validated JSON policy. Both XPC peers use
      NSXPCConnection code-signing requirements that pin Team SLDQ2GJ6TL and the
      io.darkbloom.provider / io.darkbloom.fan-helper identifiers. The helper also
      requires the configured numeric provider UID. The provider renews every five
      seconds; expiry after fifteen seconds restores automatic mode. The root helper
      exposes no arbitrary key/value SMC API and has no network, model, credential,
      or prompt dependency. Before any manual-mode write it fsyncs a root-owned
      ownership journal; launchd restart restores those fan indices before accepting
      another lease.
    current_limitations:
      - "Apple does not publish stable GPU sensor names or fan-write semantics. Active
        support is capability-gated by an explicit M1-M5 catalog and requires real-device
        validation for each model family."
      - "No process can catch SIGKILL. Safety after SIGKILL depends on launchd KeepAlive
        restart plus the durable ownership journal; simultaneous helper death and
        launchd disablement can leave manual state until reboot or administrator repair."
      - "The root-installed helper is not replaced by the unprivileged self-updater.
        Protocol mismatch intentionally leaves it dormant until the operator reruns
        sudo darkbloom fan enable."

  - id: TB-011
    name: app_attest_authorization_and_legacy_coexistence
    description: >
      Apple authenticates an App Attest credential and signed code/access-policy
      evidence; the coordinator evaluates that evidence and grants bounded permission
      to one current provider connection. This is an independent alternative to the
      legacy MDM/APNs path, not an automatic upgrade of its trust_level or flags.
    how_it_works: >
      ProviderLoop.handleAppAttestShadow first opens a challenge encrypted to its own
      process X25519 endpoint. Only protocol 3 is negotiated; older protocols get no
      frames and pre-v3 stored enrollments cannot resume. The capability replaces
      the old fixed claimed-version gate; it is not itself code qualification.
      Protocol 3 binds account, session, endpoint, environment,
      credential, challenge, app-reported status/hardware and the legacy verification
      public key into the assertion transcript. The coordinator verifies enrollment,
      nonce/signature/counter, exact Mac ACL and authenticated code measurement before
      EvaluateAuthorization evaluates the serving policy. Names containing shadow
      remain in the shared protocol; only an explicit serving policy grants permission.

      Serving requires verified current binding, protocol3 hardware/verification-key
      match, complete private archive, production rollout/build eligibility, approved
      code measurement, a nonrevoked credential and verified fresh risk receipt.
      AssertionFreshness is 15 minutes; receipt expiry and renewal deadlines can shorten
      it. A worker refreshes durable readiness every 5 seconds; revocation and build
      qualification snapshots impose a 30-second ceiling measured from read start.
      Failed reads cannot extend that ceiling. Local credential revocation fences
      matching current/retained presenters immediately after durable success, including
      their legacy fallback. Expiry or unavailable evidence alone does not invalidate
      independently valid legacy authorization. Policy and qualification generation
      changes invalidate stale grants. For existing deployments, full Apple code
      measurements can still use exact configured build/code mappings if no durable
      row exists and the qualification snapshot is fresh. Durable rows/tombstones
      override this compatibility path; truncated measurements and new publication
      require durable qualification.

      A configured provider-version floor excludes missing versions as well as
      versions below that floor; this is separate from protocol negotiation.
      Common routing gates still require an online, non-denied connection, completed
      identity restoration, runtime verification, checked manifest, encrypted Swift
      transport, privacy capabilities and the applicable model/trait policy. Every
      final handoff checks live authorization after frame preparation and owner handoff.
      Owner-only routing relaxes the public trust floor/private-only gate; it does not
      bypass hard denial, runtime/privacy checks or the final handoff. App Attest may
      coexist with legacy self_signed, hardware, MDA and APNs evidence without rewriting
      those fields. Public snapshot badges describe a past coordinator observation;
      neither a badge nor an optional diagnostic grants permission.

      New macOS27+ onboarding skips new MDM enrollment and waits for App Attest;
      existing profiles remain installed. Serving and MDM removal are separate opt-ins.
      Removal guidance needs a fresh current coordinator decision and exact local
      Darkbloom profile identification, followed by the user's action. Other MDM
      profiles and the application's embedded signing profile are not removal targets.
      Code: coordinator/appattest/authorization.go (EvaluateAuthorization),
      coordinator/appattest/service/authorization_identity.go (updateServingAuthorization),
      coordinator/appattest/service/authorizer.go (refresh, applyDetailed),
      coordinator/registry/app_attest_authorization.go,
      coordinator/registry/inference_authorization.go (authorizeInferenceHandoff).
      Canonical explanation: docs/architecture/security/provider-trust.md.
    current_limitations:
      - "Neither attestation path proves each inference used the requested model or
        returned a correct result; inference runs in the provider process/GPU, not SE."
      - "App-origin hardware/status reports are cryptographically bound assertions,
        not independent Apple certification of RAM, model bytes or physical uniqueness."
      - "Signed-artifact and physical SIP/boot-security transition qualification is
        an operator evidence requirement. Source review and synthetic tests do not
        establish resistance to a compromised host or all recovery transitions."
      - "Apple availability, archive/receipt storage, durable policy and coordinator
        compromise remain trust/availability dependencies. Already delivered plaintext
        and committed frames cannot be recalled by revocation."
      - "Checked-in flags and onboarding behavior do not prove live fleet activation.
        Inspect current authorized deployment state separately."

threats:
  - id: T-007
    trust_boundary: TB-002
    stride: Tampering
    title: Provider serves manipulated model outputs to consumers
    description: >
      A malicious provider can run a modified model or post-process outputs before
      returning them. The consumer has no cryptographic proof that outputs came from
      the advertised model weights.
    adversaries: [ADV-001]
    affected_assets: [A-001, A-004]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - provider-swift/Sources/ProviderCore/Inference/**
      - provider-swift/Sources/ProviderCoreFoundation/WeightHasher.swift
      - provider-swift/Tests/ProviderCoreFoundationTests/WeightHasherMemoryTests.swift
    mitigations:
      - description: Weight hash advertised by provider at registration and in heartbeats.
        status: implemented
      - description: Coordinator verification of weight hash is fail-open when hash is omitted (SEC-007).
        status: open
      - description: No consumer-side output proof (output signing not implemented).
        status: open
    open_findings: [SEC-007]
    severity: high
    detection_hint: >
      Changes to model hash advertisement, registry scoring, or the routing gate
      should check that weight hash enforcement is fail-closed for catalog models.

  - id: T-008
    trust_boundary: TB-002
    stride: Information_Disclosure
    title: Regression could expose plaintext SSE chunks on encryption failure
    description: >
      The provider must fail closed if shared-key setup or response encryption fails.
      Current Swift code sends inference_error and aborts without emitting plaintext;
      the coordinator also rejects plaintext chunks as an independent backstop.
    adversaries: [ADV-001]
    affected_assets: [A-001]
    affected_files:
      - provider-swift/Sources/ProviderCore/ProviderLoop+InferenceHandler.swift
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
    mitigations:
      - description: Coordinator rejects plaintext inference chunks and marks provider untrusted.
        status: implemented
      - description: Provider fails closed with inference_error on key setup or chunk-encryption failure.
        status: implemented
    open_findings: []
    severity: medium
    detection_hint: >
      Any change to the streaming response path in ProviderLoop.swift, encryption
      error handling, or the coordinator's chunk ingestion should verify the
      fail-closed behaviour is preserved.

  - id: T-009
    trust_boundary: TB-002
    stride: Elevation_of_Privilege
    title: Swift provider excluded from private-request routing due to missing Python flags (resolved)
    description: >
      The coordinator's private-text routing gate used to require Python-specific
      flags (python_runtime_locked, dangerous_modules_blocked) that the Swift provider
      always reports as false, which would have excluded Swift providers from routing
      or created pressure to lie about controls that do not exist in the Swift backend.
      providerSupportsPrivateTextLocked now requires only the five backend-neutral
      PrivacyCapabilities (text_backend_inprocess, text_proxy_disabled,
      anti_debug_enabled, core_dumps_disabled, env_scrubbed) plus backend mlx-swift;
      the Swift provider no longer sends the two Python fields at all.
    adversaries: [ADV-001]
    affected_assets: [A-001]
    affected_files:
      - provider-swift/Sources/ProviderCore/ProviderLoop.swift
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
    mitigations:
      - description: Routing gate exists and enforces the five backend-neutral privacy flags.
        status: implemented
      - description: Python-only flags are retired from the provider wire and are not gate inputs.
        status: implemented
    open_findings: []
    resolved_findings:
      - id: SEC-017
        resolution: >
          Closed: registry.go providerSupportsPrivateTextLocked no longer reads
          PythonRuntimeLocked / DangerousModulesBlocked; Swift providers pass the gate
          with the five required capabilities.
    severity: medium
    detection_hint: >
      Changes to the provider registration message, registry routing gate, or
      backend-type handling should verify the gate keeps evaluating backend-neutral
      controls rather than reintroducing Python flag semantics.

  - id: T-010
    trust_boundary: TB-002
    stride: Denial_of_Service
    title: In-flight inference cancellation not propagated to inference engine
    description: >
      On a coordinator cancel message the provider must stop the in-flight
      inference task, or it keeps consuming GPU and memory after cancellation.
      This was an open gap in the now-removed legacy provider (SEC-020),
      which created a cancellation token but never wired it into the in-process
      task. The Swift provider wires InferenceCancellation into the generation
      loop; the residual "cannot interrupt an active GPU forward pass"
      limitation is documented in the TB-007 current limitations.
    adversaries: [ADV-002]
    affected_assets: [A-009]
    affected_files:
      - provider-swift/Sources/ProviderCore/ProviderLoop.swift
    mitigations:
      - description: Swift provider wires InferenceCancellation into the generation loop.
        status: implemented
    open_findings: []
    severity: medium
    detection_hint: >
      Changes to cancellation handling in ProviderLoop.swift should verify the
      cancel signal reaches the inference loop and aborts generation.

  - id: T-011
    trust_boundary: TB-003
    stride: Information_Disclosure
    title: Provider operator reads X25519 private key from process memory
    description: >
      The X25519 Diffie-Hellman private key used for E2E encryption is generated in
      memory for each provider process and never written to disk (legacy key files
      are purged at start). An operator with root can still read the memory of the
      running process and recover the key for that process lifetime, decrypting the
      traffic routed to it during that time. Severity has not been re-rated since
      the on-disk storage was removed.
    adversaries: [ADV-001]
    affected_assets: [A-003, A-001]
    affected_files:
      - provider-swift/Sources/ProviderCore/Crypto/NodeKeyPair.swift
      - provider-swift/Sources/ProviderCore/ProviderLoop.swift
    mitigations:
      - description: Key is process-scoped and never persisted (NodeKeyPair.generate()).
        status: implemented
      - description: XSalsa20-Poly1305 provides no forward secrecy within a process lifetime; a new key per process bounds exposure to that lifetime.
        status: implemented
      - description: Key material is not protected by the Secure Enclave; only the P-256 identity key is.
        status: open
    open_findings: []
    severity: high
    detection_hint: >
      Changes to key generation, storage, or loading in ProviderConfig.swift or
      config.rs should verify whether the X25519 private key is protected at rest
      (e.g. moved to macOS Keychain or derived from SE-sealed material).

  - id: T-012
    trust_boundary: TB-003
    stride: Tampering
    title: Operator replaces model weights with manipulated files
    description: >
      The operator has write access to ~/.cache/huggingface where model weights are
      stored. Replacing weights causes the provider to serve outputs from a different
      or adversarially fine-tuned model while advertising the original model's hash.
      The coordinator's weight-hash check is currently fail-open.
    adversaries: [ADV-001]
    affected_assets: [A-004, A-001]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - provider-swift/Sources/ProviderCoreFoundation/WeightHasher.swift
      - provider-swift/Tests/ProviderCoreFoundationTests/WeightHasherMemoryTests.swift
    mitigations:
      - description: Provider computes and advertises weight hash at registration.
        status: implemented
      - description: Coordinator fails open when provider omits weight_hash for a catalog model (SEC-007).
        status: open
    open_findings: [SEC-007]
    severity: high
    detection_hint: >
      Changes to WeightHasher.swift, model registration, heartbeat hash fields, or
      the coordinator's registry admission should verify that hash enforcement is
      fail-closed for all catalog models.

  - id: T-013
    trust_boundary: TB-003
    stride: Tampering
    title: Operator modifies darkbloom binary
    description: >
      The operator attempts to replace or patch the darkbloom binary to bypass
      security checks, fake attestation, or exfiltrate data.
    adversaries: [ADV-001]
    affected_assets: [A-011, A-010]
    affected_files:
      - provider-swift/Sources/ProviderCore/Security/BinaryHasher.swift
      - https://github.com/Layr-Labs/darkbloom-platform/tree/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/attestation
    mitigations:
      - description: Code signing enforced by macOS; SIP prevents unsigned binaries from launching.
        status: implemented
      - description: Binary SHA-256 hash included in SE-signed attestation blob, verified by coordinator.
        status: implemented
      - description: Coordinator maintains registry of blessed binary hashes; unregistered hashes rejected.
        status: implemented
      - description: >
          Persistent SE key access group (SLDQ2GJ6TL.io.darkbloom.provider) enforces that
          only binaries with the matching keychain-access-groups entitlement can load the
          established identity. A patched binary lacking the entitlement receives
          errSecMissingEntitlement (-34018) and falls back to an ephemeral key, which the
          coordinator will reject as the public key no longer matches the registered
          fingerprint (PersistentEnclaveKey.swift).
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Changes to binary hash computation in BinaryHasher.swift, attestation blob
      construction, the coordinator's binary hash registry admission, or the keychain
      access group entitlement in the provisioning profile should preserve the
      end-to-end tamper-detection chain.

  - id: T-014
    trust_boundary: TB-003
    stride: Information_Disclosure
    title: Operator inspects darkbloom process memory
    description: >
      The operator attempts to attach a debugger or read process memory to extract
      decrypted prompt content, the X25519 key from memory, or SE-derived material.
    adversaries: [ADV-001]
    affected_assets: [A-001, A-003, A-002]
    affected_files:
      - provider-swift/Sources/ProviderCore/Security/AntiDebug.swift
      - provider-swift/Sources/ProviderCore/Security/SecurityHardening.swift
    mitigations:
      - description: PT_DENY_ATTACH applied at startup; kernel denies task_for_pid.
        status: implemented
      - description: Hardened Runtime entitlement blocks external memory inspection.
        status: implemented
      - description: SE P-256 key is non-exportable and never present in regular process memory.
        status: implemented
      - description: Memory wiping applied to inference buffers after each request.
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Any weakening of AntiDebug.swift, removal of PT_DENY_ATTACH, changes to
      Hardened Runtime entitlements, or deferral of memory wiping should be
      treated as a critical regression.

  - id: T-015
    trust_boundary: TB-003
    stride: Elevation_of_Privilege
    title: Operator disables SIP to bypass security controls
    description: >
      The operator reboots into Recovery Mode to disable SIP, then restarts darkbloom
      to operate without code-signing and anti-debug protections.
    adversaries: [ADV-001]
    affected_assets: [A-001, A-010]
    affected_files:
      - provider-swift/Sources/ProviderCore/Security/SecurityHardening.swift
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
    mitigations:
      - description: darkbloom checks SIP at startup and refuses to serve if disabled.
        status: implemented
      - description: SIP status included in every 5-minute challenge-response; coordinator marks untrusted immediately on false.
        status: implemented
      - description: Disabling SIP requires reboot into Recovery Mode, which terminates the process and wipes inference data from memory.
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Changes to SIP-check logic in SecurityHardening.swift, the challenge-response
      handler, or the coordinator's untrust-on-SIP-false path are critical and should
      be reviewed against this threat.

  - id: T-016
    trust_boundary: TB-003
    stride: Denial_of_Service
    title: Operator fills disk to prevent model loading
    description: >
      The operator fills the local filesystem to prevent model weight files from
      being cached or loaded, degrading provider availability.
    adversaries: [ADV-001]
    affected_assets: []
    affected_files:
      - provider-swift/Sources/ProviderCore/Models/ModelDownloader.swift
    mitigations:
      - description: Model load failure reported to coordinator; provider marked unavailable and re-queued.
        status: implemented
      - description: No disk quota enforcement for HuggingFace cache.
        status: open
    open_findings: []
    severity: low
    detection_hint: >
      Changes to model loading error handling should verify failures are reported
      upstream rather than silently retried.

  - id: T-027
    trust_boundary: TB-007
    stride: Tampering
    title: Model weight substitution causes inference on unadvertised model
    description: >
      If the weight-hash check is fail-open (SEC-007), a provider serving from
      substituted weights will pass the routing gate. Consumers receive outputs
      from an unknown model while trusting the advertised model's properties.
    adversaries: [ADV-001]
    affected_assets: [A-004, A-001]
    affected_files:
      - provider-swift/Sources/ProviderCoreFoundation/WeightHasher.swift
      - provider-swift/Tests/ProviderCoreFoundationTests/WeightHasherMemoryTests.swift
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
    mitigations:
      - description: Weight hash computed by WeightHasher and advertised in registration.
        status: implemented
      - description: Coordinator enforcement is fail-open when hash is omitted (SEC-007).
        status: open
    open_findings: [SEC-007]
    severity: high
    detection_hint: >
      This threat is a mirror of T-012 at the inference layer. Changes to weight
      hashing or coordinator enforcement should be reviewed together.

  - id: T-028
    trust_boundary: TB-007
    stride: Information_Disclosure
    title: Residual inference data in GPU memory accessible after request completes
    description: >
      Decrypted prompt tokens and KV-cache data remain in GPU memory until
      overwritten by the next request. A provider who can read GPU memory between
      requests could recover prior prompt content.
    adversaries: [ADV-001]
    affected_assets: [A-001]
    affected_files:
      - provider-swift/Sources/ProviderCore/Inference/Engine/Bridge/EngineV2Bridge.swift
      - provider-swift/Sources/ProviderCore/Inference/Engine/EngineV2Runtime.swift
      - libs/mlx-swift-lm/Libraries/MLXLMCommon/ContinuousBatchingV2/SequenceKV/ContiguousKVBackend.swift
    mitigations:
      - description: CPU-side inference buffers are zeroed after each request.
        status: implemented
      - description: GPU-side MLX buffers (Metal) are not explicitly zeroed between requests.
        status: open
      - description: >
          No hardware memory isolation exists for inference memory. Hypervisor
          Stage 2 page-table isolation was never implemented; the
          hypervisor_active attestation field was a hardcoded-false stub and is
          retired: the coordinator no longer decodes it or includes it in the
          status canonical (attestation.go BuildStatusCanonical).
        status: open
    open_findings: []
    severity: medium
    detection_hint: >
      Changes to the inference pipeline, KV-cache management, or batch scheduling
      that affect buffer lifecycle should consider GPU-side residual data.

  - id: T-029
    trust_boundary: TB-007
    stride: Denial_of_Service
    title: Idle GPU timeout not triggered, monopolising provider resources
    description: >
      If IdleTimeoutPolicy fails to unload the model after inactivity, the GPU
      remains occupied and the provider cannot serve other models or recover memory.
    adversaries: [ADV-002]
    affected_assets: []
    affected_files:
      - provider-swift/Sources/ProviderCore/Inference/Engine/IdleTimeoutPolicy.swift
    mitigations:
      - description: IdleTimeoutPolicy unloads model after 1 hour of no requests.
        status: implemented
    open_findings: []
    severity: low
    detection_hint: >
      Changes to IdleTimeoutPolicy.swift or the inference loop that could defer
      or skip idle detection should be reviewed.

  - id: T-041
    trust_boundary: TB-007
    stride: Information_Disclosure
    title: Cross-tenant prefix-cache sharing + TTFT timing oracle (v0.7.5 ships the encrypted SSD offload tier — HMAC-keyed at-rest artifacts, default-on for CBv2-supported models with per-donation gating)
    description: >
      The encrypted prefix KV cache (DARKBLOOM_PREFIX_CACHE) is shared across all
      consumers on a provider — the provider cannot see tenant identity, so a KV
      prefix cached for one consumer is reused for any other consumer whose prompt
      shares that prefix. This creates two cross-tenant leaks that AT-REST
      encryption does NOT mitigate (it only defends disk theft / a foreign process,
      not co-tenants on the same live provider):
        1. TTFT timing oracle: the time-to-first-token difference between a cache
           HIT and a MISS lets a consumer who already knows (or guesses) an exact
           prompt prefix detect whether another consumer recently submitted it —
           i.e. confirm the presence of a known prefix in another tenant's traffic.
        2. Plaintext on-disk metadata (the GCM AAD, not encrypted) carries a STABLE
           tokenPrefixHash = SHA-256 of the prefix token IDs, plus tokenCount /
           model binding / timestamps. A disk observer (NOT a co-tenant — see T-028
           for the in-memory variant) can hash a guessed prefix and test it against
           on-disk filenames/metadata to confirm a known prefix was cached.
      As of 2026-06, the cache is ON BY DEFAULT (operator decision); it was
      previously opt-in. Default-on makes this channel the baseline exposure for
      every provider unless explicitly disabled.
      As of v0.7.5 the serving engine is CBv2 and the legacy engine/on-disk tier
      are deleted. The default successor SSD tier does write encrypted DBK3
      blocks, but closes leak #2 with KEK-derived HMAC lookup tags: raw prefix
      hashes and token IDs never touch disk. The plaintext tokenPrefixHash
      description above is therefore historical and does not describe KVCacheSSD.
      Exact routing closes the cross-account form of leak #1. The coordinator
      derives cacheSalt from authenticated account ID, concrete model build,
      prompt-contract ID, and block-hash version under a server HMAC key
      (coordinator/registry/cache_route_keys.go). Caller prompt_cache_key and
      user fields do not participate. Entries from different accounts therefore
      cannot resolve or be preferred across scopes. A same-account caller can
      still distinguish hit from miss by first-token latency; SEC-035 remains
      the accepted risk for that narrower trust boundary.
      CURRENT SHIP DECISION: encrypted SSD is the sole production tier and is
      default-on for every eligible CBv2 model, with a PER-DONATION
      gate (replacing the earlier per-model funding rule for this tier):
      a donation persists only when its whole-block prefix exceeds the
      model's adoption bound + the 1,024-token benefit floor. gpt-oss
      (bound 1,536) therefore skips never-adoptable sub-~2.5k donations
      (pure wear savings); gemma-4 (bound 25,600) caches exactly its
      >26.6k long-context tail — at-rest exposure UNCHANGED IN KIND
      (same HMAC names, same sliding TTL — 30 minutes since 2026-09-26 — same crypto), merely extended to
      gemma's long-context traffic. SSD construction can be disabled by the
      single DARKBLOOM_PREFIX_CACHE kill switch or an unavailable KEK; when
      active, individual donations
      can still be declined by the adoption/benefit, staging, endurance, or
      disk guards. This review is the mandated
      sign-off for the tier's reintroduction of an at-rest artifact (the
      leak #2 class). Posture of the SSD tier
      (provider-swift/Sources/ProviderCore/KVCacheSSD/):
        (a) LEAK #2 CLOSED, not re-accepted: on-disk file names, the RAM
            index, and file metadata carry ONLY HMAC-SHA256 tags under
            K_lookup = HKDF(KEK, "dbkv3-lookup-v1") — a per-install secret
            rooted in the Secure Enclave via the existing KEK chain. Raw
            chain hashes / token-prefix hashes never touch disk, so a disk
            observer cannot test a guessed prefix against anything. The
            long-open HMAC mitigation ships IMPLEMENTED with the tier that
            re-opened it.
        (b) Cache reuse is bounded by a 30-MINUTE sliding TTL
            (raised from 15 minutes on 2026-09-26 by operator decision, the
            SEC-035 re-acceptance recorded in detection_hint below;
            DARKBLOOM_PREFIX_CACHE_SSD_TTL_SECONDS can only shorten it;
            sliding on hit; opportunistic sweep on write + periodic task);
            a default box-wide LRU disk budget of half the currently available
            disk space, with no fixed ceiling, unlinks oldest-by-last-hit.
            Unknown available space uses a 20 GiB budget fallback.
            DARKBLOOM_PREFIX_CACHE_DISK_GB overrides that default budget.
            The separate fixed 20 GiB pre-write free-space reserve includes
            the pending donation payload; it does not reserve OS disk blocks
            against unrelated concurrent writers.
            TTL/LRU cleanup requires the selected volume to remain mounted and
            accessible. Detached, replaced and previously selected volumes can
            retain ciphertext and visible metadata indefinitely. Expiration
            is enforced on entries the cache considers expired. File mtimes
            seed restart freshness; TTL is not an anti-rollback proof against
            a controller replaying metadata. KEK destruction provides the
            cryptographic purge for retained copies, not a promise of physical erasure.
        (c) File crypto is the reviewed legacy scheme unchanged: per-file
            random DEK wrapped AES-256-GCM under the SE-rooted KEK,
            HKDF-derived per-chunk nonces ("dbkv-chunk-v3"), canonical
            metadata JSON as AAD on every chunk (tamper ⇒ auth failure ⇒
            delete + recompute), atomic tmp+rename writes (DBK3 format,
            version 2).
        (d) Salt scoping is PRESERVED on disk: the request's cacheSalt is
            folded into both the engine chain hash AND (length-prefixed)
            the HMAC tag input, so entries donated under different scopes
            can never resolve — or even name-collide with — each other.
        (e) NO persistent KV memory carve: the engine keeps its full KV grant.
            Transient RAM includes read-through staging (one shared reservation
            per staged entry; requests attach) and bounded host Data in the
            write-behind donation pipeline. Refusal/drop preserves live serving
            and falls back to recompute.
      Residual at-rest metadata, accepted: file sizes (uniform block
      shape), file count, mtimes/createdAt (activity timing), and the
      cached-model identity (modelKey directory — already public via
      heartbeats). None of these confirm a specific prefix.
      Payload roots can be operator-selected external APFS volumes. Their
      controllers are outside the attested process boundary: UUID cloning,
      retained ciphertext, replay of authenticated data and filesystem metadata,
      and denial of service remain possible. AES-GCM and context bindings reject
      forged or incompatible payloads; they do not attest the peripheral or
      provide a trusted monotonic freshness record. Relocation does not sweep
      the old root. Disk budget and free-space guards apply to the selected
      payload volume; the rolling-day write ledger remains on the Mac.
      Kill switch: DARKBLOOM_PREFIX_CACHE=0 disables the sole production
      tier, encrypted SSD. There is no production RAM tier or tier
      composition. Purge points: KEK wipe makes all files
      unreadable AND unfindable (K_lookup derives from the KEK).
      SEC-035 (leak #1, the in-process TTFT oracle) is UNCHANGED IN KIND
      and stays the accepted risk — with one extension for this sign-off:
      durability extends the oracle across restarts/idle-unloads within
      the 30-minute TTL window (a co-tenant can probe whether a prefix was
      cached earlier the same half-hour). Cache scope is coordinator-authored
      from authenticated account, model build, and prompt-contract identity;
      callers cannot choose or override it.
    adversaries: [ADV-001, ADV-002]
    affected_assets: [A-001]
    affected_files:




      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDPrefixCache.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDBlockStore.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDLookupKeys.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDBlockIndex.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDWriteBehind.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDPrefixCachePolicy.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDPrefixCacheFactory.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/CacheStorage.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/CacheVolume.swift
      - provider-swift/Sources/ProviderCore/KVCacheSSD/SSDNoFollowIO.swift
      - provider-swift/Sources/ProviderCore/Inference/PrefixCache/PrefixCachePolicy.swift
      - provider-swift/Sources/ProviderCore/Inference/Engine/Factory/EngineV2SlotFactory.swift
      - provider-swift/Sources/ProviderCore/Inference/Engine/Factory/EngineV2Factory+Production.swift
      - provider-swift/Sources/ProviderCore/Inference/Engine/Bridge/EngineV2Bridge.swift
      - provider-swift/Sources/ProviderCore/ProviderLoop+EngineV2.swift
    mitigations:
      - description: >
          AES-256-GCM encryption at rest (per-file DEK wrapped by an SE-derived KEK)
          — closes disk-theft + foreign-process reads, but NOT the cross-tenant
          sharing or TTFT timing channel.
        status: implemented
      - description: >
          DARKBLOOM_PREFIX_CACHE is the single production gate. Unset or an
          explicit affirmative value enables encrypted SSD; any explicit
          non-affirmative value disables it. Production never constructs or
          funds the upstream resident-RAM PrefixCacheV2 implementation
          (ProviderCore/Inference/PrefixCache/PrefixCachePolicy.swift and
          EngineV2SlotFactory.swift).
        status: implemented
      - description: >
          Protocol-v2 cacheSalt is coordinator-authored from authenticated
          account, model build, prompt contract, and block-hash version under
          a server HMAC key. Entries from different accounts can never resolve.
          The SSD tier folds the opaque scope into both the canonical block
          chain and HMAC lookup tag, so files are unfindable and unusable
          outside that scope. Caller prompt_cache_key/user values are ignored.
        status: implemented
      - description: >
          SSD tier reuse window bound: 30-minute sliding TTL (env can only
          shorten), default available-disk/2 box-wide LRU disk budget without
          a fixed ceiling (20 GiB fallback when unavailable;
          DARKBLOOM_PREFIX_CACHE_DISK_GB overrides), a fixed 20 GiB pre-write
          free-space reserve including the pending donation payload, verified weightHash in
          coordinator mode (model-ID fallback in standalone) + layoutEpoch
          fail-closed bindings, and KEK-wipe purge (files become unreadable AND
          unfindable — K_lookup derives from the KEK). TTL/LRU deletion requires
          a mounted, accessible selected volume; it cannot purge detached media.
        status: implemented
      - description: >
          SSD tier NO-persistent-memory-carve posture: the engine keeps its full
          slot KV grant and production creates no resident-RAM prefix cache.
          Transient RAM includes read-through staging (one shared
          GlobalKVCacheBudget reservation per staged entry, with requests
          attaching) and bounded host Data in the write-behind donation
          pipeline. Refusal/drop preserves live serving and falls back to
          recompute.
        status: implemented
      - description: >
          ACCEPTED RISK (SEC-035): accepts the cross-tenant timing/sharing channel
          for deployments running a prefix cache, per an explicit operator
          decision. Requires a per-deployment threat-model sign-off before serving
          multi-tenant traffic with the cache on. Status is "open" because this is
          a documented accepted risk, not a code mitigation. Scope at v0.7.5:
          the SSD tier is DEFAULT-ON, so the acceptance again covers the fleet
          baseline (as it did under the 2026-06 default-on legacy posture) —
          but the covered channel is strictly narrower than legacy: leak #2 is
          CLOSED (HMAC-keyed names, vs legacy's plaintext tokenPrefixHash),
          cache reuse is TTL-bounded and accessible selected storage is swept,
          authenticated account scoping
          closes cross-account reuse, per-donation gating caches only adoptable
          long prefixes, and DARKBLOOM_PREFIX_CACHE=0 survives restarts. The
          residual same-account in-process TTFT oracle can extend across
          restarts within the 30-minute TTL, as accepted in the description.
        status: open
      - description: >
          Per-deployment gating by trust level (e.g. force-off for shared/untrusted
          multi-tenant, on only for single-tenant / hardware-trust) is not enforced
          in code — the operator must opt out manually.
        status: open
      - description: >
          HMAC the on-disk prefix identity with a per-install secret so a disk
          observer cannot recompute it from a guessed prefix (mitigates leak #2).
          IMPLEMENTED for the v2 SSD tier (v0.7.5): file names, index keys, and
          metadata carry only HMAC-SHA256 tags under K_lookup =
          HKDF(SE-rooted KEK, "dbkv3-lookup-v1"), with the request salt
          length-prefix-folded into the tag input (SSDLookupKeys). The new tier
          never reads the retired tier's files under darkbloom/kv/. Releases
          through v0.9.10 deleted them in a startup sweep; later releases leave
          any remaining ones in place (KEK wipe is the crypto purge).
        status: implemented
      - description: >
          Operator-selected cache storage is constrained by CacheVolume.inspect
          and CacheStorage.validateOpenedDirectory: local writable APFS, ownership
          enabled, private operator-owned directories without write-granting ACLs,
          encrypted external volumes rechecked during active I/O,
          and a pinned filesystem UUID checked against opened descriptors. Missing
          mounts and changed UUIDs refuse I/O without recreating mount paths or
          falling back to internal payload storage. Encryption keys and the
          rolling-day write ledger stay on the Mac. DBK3 payload authentication,
          HMAC names and TTL remain unchanged. These checks do not authenticate
          peripheral firmware or defeat UUID cloning, ciphertext retention,
          denial of service or every replay of still-valid ciphertext; operators
          must source trusted hardware. See encryption.md, Provider cache storage.
        status: implemented
    open_findings: [SEC-035]
    severity: medium
    detection_hint: >
      A persistence tier now EXISTS (KVCacheSSD, v0.7.5). Review under this
      finding: any change to the production gate in
      PrefixCachePolicy (DARKBLOOM_PREFIX_CACHE semantics —
      the SSD tier is default-on with a PER-DONATION gate: adoption bound +
      benefit floor in SSDPrefixCache.donate; loosening it widens the
      at-rest surface), to the TTL or disk-budget
      policy (SSDPrefixCachePolicy.ttlSeconds, 30-min max since 2026-09-26,
      PrefixCachePolicy.ssdDiskBudgetBytes), to the NAME DERIVATION
      (SSDLookupKeys: HKDF info string, HMAC domain tag, salt length-prefix,
      tag truncation), to the DBK3 metadata fields or AAD construction
      (SSDBlockStore — nothing prompt-derived beyond the keyed lookupTag may
      ever be added), to the purge points or the tier's own on-disk root
      (darkbloom/kv3 — deliberately OUTSIDE the retired kv/ root, which is
      never read or written; KEK wipe remains the crypto purge), or to the
      staging-reservation release paths
      (SSDPrefixCache.endAdoption/completeStaging, EngineV2Bridge backstops).
      Also still: coordinator-authenticated scope derivation
      (coordinator/registry/cache_route_keys.go), cacheScope →
      CBv2Request.cacheSalt plumbing, and EngineV2Factory production SSD
      construction. Raising the TTL past 30 minutes or weakening authenticated
      account isolation needs a fresh SEC-035 sign-off. Sign-off history:
      15 minutes at the tier's introduction; 30 minutes on 2026-09-26
      (operator decision, SSDPrefixCachePolicy.defaultTTLSeconds =
      maxTTLSeconds = 1800, so the environment override still only
      shortens). The same change set stops per-file eviction, TTL expiry
      and corrupt-file removal from rotating the cache epoch; the epoch is
      a coordinator routing-evidence generation, not an at-rest purge
      primitive, so that leaves the mitigations above unchanged (the KEK
      wipe and per-file AES-GCM authentication are untouched).

  - id: T-033
    trust_boundary: TB-009
    stride: Spoofing
    title: Attestation blob replay from a previously trusted provider
    description: >
      An attacker captures a valid attestation blob from a trusted provider and
      replays it from a different machine to inherit that provider's trust level.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-010]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/tree/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/attestation
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - provider-swift/Sources/ProviderCore/Security/AttestationBuilder.swift
      - provider-swift/Sources/ProviderCore/Security/PersistentEnclaveKey.swift
      - provider-swift/Sources/ProviderCore/Security/AttestationSigner.swift
    mitigations:
      - description: >
          verifyProviderAttestation requires every signed registration timestamp to
          pass CheckTimestamp with RegistrationAttestationMaxAge (2 minutes),
          regardless of a missing or old claimed provider version. This bounds
          replay age; it is not a one-time-use registration nonce.
        status: implemented
      - description: 5-minute challenge-response requires signing a fresh coordinator-generated nonce with the SE key.
        status: implemented
      - description: >
          The registered X25519 endpoint must match the signed encryptionPublicKey.
          A fresh challenge requires possession of the registered signing key, and
          an attested-key response must also sign current status. A captured blob
          alone proves neither current possession nor independent hardware provenance;
          serving still requires the applicable legacy or App Attest authorization.
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Changes to attestation blob construction, timestamp validation, the
      challenge-response nonce flow, or the PersistentEnclaveKey / AttestationSigner
      protocol must preserve replay protection.

  - id: T-034
    trust_boundary: TB-009
    stride: Tampering
    title: Provider runs modified code while advertising a trusted identity
    description: >
      The original control was a SHA-256 binary hash in the attestation blob. That
      hash is SELF-REPORTED by the provider's own (possibly modified) code, so it is
      worthless against a malicious operator: a fork can report a blessed hash while
      running prompt-logging code. The real control is APNs code-identity attestation
      (v0.6.0): only our genuine, Team-ID-signed, push-provisioned binary can RECEIVE
      an APNs push for our App-ID, and only the genuine hardened process can DECRYPT
      the E_K(nonce) challenge with its in-memory key K and sign the nonce with its
      registration-bound SE key — re-proved on every WebSocket connection, either by
      a fresh APNs push or, when a durable proof for the same SE key + APNs token
      is younger than the 30-minute reuseWindow, or coordinator-observed code-verified
      continuity covers the exact same process within 120 seconds, by a NaCl-sealed resume challenge
      over the WebSocket (code_attestation_resume_challenge, 30 s) that costs no APNs
      budget. Pushes are throttled (20 min background / 75 s alert cooldown per device,
      3 attempts per loop, 300 s challenge validity; code_attest_throttle.go).
    adversaries: [ADV-001]
    affected_assets: [A-010, A-011]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/apns/attestor.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
      - provider-swift/Sources/ProviderCore/ProviderLoop.swift
      - provider-swift/Sources/darkbloom/ProviderAppKitHost.swift
    mitigations:
      - description: >
          Same-process code continuity is observed only on online hardware-trusted
          connections with CodeAttested and FreshCodeAttested, matching SE key,
          token, process key, version and binary. Only final disconnect stamping may
          accept the just-offlined connection with all those checks intact; periodic
          and shutdown sweeps cannot refresh offline coverage, and untrusted
          providers are always rejected. Conditional coverage writes match
          the original APNs proof instant, never create rows or refresh attested_at,
          and cannot resurrect deleted or replaced proof. Future or expired coverage
          refuses reuse. Process-key/version changes cannot inherit continuity;
          every resume still decrypts a fresh sealed nonce and signs it with the
          registration-bound SE key. Hardware-only liveness cannot seed code continuity.
        status: implemented
      - description: >
          APNs code-identity round-trip: coordinator pushes E_K(nonce) to the
          registration-bound device token; provider decrypts with K and replies
          nonce + Sign_SE(nonce) over the WebSocket; coordinator verifies the nonce
          matches and the SE signature verifies against the registration-bound key.
        status: implemented
      - description: >
          CodeAttested gate at the single routing chokepoint
          (providerSupportsPrivateTextLocked), fail-closed, no self-route exemption;
          enforced once an attestor is configured AND the APNS_ENFORCE_AFTER deadline
          has passed (codeAttestationEnforcedLocked); before that providers are
          challenged and coverage is measured but nobody is derouted.
        status: implemented
      - description: >
          Self-reported binaryHash DEMOTED to drift telemetry — derouting on mismatch
          is behind a default-off binaryHashEnforce flag. It is no longer relied on as
          a code-identity control.
        status: implemented
      - description: >
          Strongest version (cross-cutting): reproducible build + public transparency
          log of blessed cdhashes, so the genuine APNs-proven binary's self-reported
          cdhash becomes auditable (version/downgrade control).
        status: open
    open_findings: []
    severity: critical
    detection_hint: >
      Changes to coordinator/apns, the per-connection push-attest step in
      api/provider.go, the CodeAttested gate in registry, or the provider's
      decrypt→Sign_SE→reply handler must preserve the property that only genuine,
      Apple-provisioned code can pass. Re-relying on binaryHash as a security control
      (vs telemetry) is a regression.

  - id: T-035
    trust_boundary: TB-009
    stride: Repudiation
    title: Provider denies performing actions after key rotation
    description: >
      The SE key is now persistent across process restarts (keychain-backed, label
      io.darkbloom.provider.attestation-signing.v2). Key rotation occurs only on
      explicit keychain deletion (factory reset, device wipe, or deliberate operator
      action). After rotation the new key is unlinked from prior attestations; audit
      trails tied to the old public key cannot be attributed to the new identity. A
      provider could opportunistically delete the keychain item to discard the audit
      chain tied to a prior identity.
    adversaries: [ADV-001]
    affected_assets: [A-002, A-010]
    affected_files:
      - provider-swift/Sources/ProviderCore/Security/PersistentEnclaveKey.swift
      - provider-swift/Sources/ProviderCore/Security/SecureEnclaveIdentity.swift
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
    mitigations:
      - description: Coordinator logs registration events with SE public key fingerprint.
        status: implemented
      - description: Persistent key (kSecAttrIsPermanent) survives process restarts, reducing
          involuntary rotation events compared to the prior ephemeral design.
        status: implemented
      - description: No explicit key-rotation policy, cross-signing between old and new SE keys,
          or coordinator-side detection when a provider re-registers with a new key.
        status: open
    open_findings: []
    severity: medium
    detection_hint: >
      Changes to PersistentEnclaveKey.swift key creation/deletion paths, or provider
      re-enrollment flows, should consider whether key rotation is logged and whether
      prior audit trails remain valid. A provider that re-registers with a new SE key
      after an unexplained keychain delete should be flagged.

  - id: T-036
    trust_boundary: TB-009
    stride: Elevation_of_Privilege
    title: Legacy hardware trust elevated without valid MDM SecurityInfo evidence
    description: >
      If any step in the hardware-trust chain (SE signature check, MDM SecurityInfo
      callback) is bypassed or short-circuited — whether by a code bug, a test flag
      left in production, or an MDM webhook deployed without its shared secret
      (SEC-004) — a provider can reach hardware trust level without Apple's genuine
      verification. The MDA certificate chain is verified afterwards and surfaced as
      the separate mda_verified flag; it neither grants nor blocks the level.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-010]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/tree/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/attestation
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/mdm/mdm.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/registry.go
    mitigations:
      - description: >
          Hardware grant requires SE signature verification and then an MDM SecurityInfo
          cross-check whose SIP and SecureBootLevel == full agree with the SE blob
          (verifyProviderViaMDM); a posture mismatch proven by a received SecurityInfo
          is terminal (MarkUntrusted), while lookup failures and timeouts leave trust
          unchanged and retry. The MDA cert chain from the Apple root CA is verified
          afterwards and attached only if hardware is already held
          (SetMDAProofIfHardwareBound). A stored hardware level is never restored on
          reconnect (RestoreProviderState caps to self_signed).
        status: implemented
      - description: MDM webhook shared secret is optional; where unset, an injected callback matching a live CommandUUID can manipulate SecurityInfo state (SEC-004).
        status: open
      - description: >
          DAR-326 trust-reuse fast-skip (coordinator/api/trust_reuse.go tryTrustReuseFastSkip)
          lets a reconnecting, recently-fully-verified provider regain hardware trust from a
          persisted record without re-running the live MDM SecurityInfo round-trip — avoiding a
          fleet-wide MDM/APNs re-verification herd on a planned coordinator restart/swap. ACCEPTED
          TRADE-OFF (relative to TB-005): within the reuse admission the fast-skip captures the
          prior SIP/Secure-Boot posture but does NOT re-prove MDA cert-chain freshness. Admission
          requires ONE of two premises: (a) STALENESS BOUND — the last live MDM verification is
          within the reuse window (EIGENINFERENCE_TRUST_REUSE_WINDOW, default 5m, tightened from
          10m); or (b) CONNECTION CONTINUITY — the
          provider was live-verified, stayed continuously connected and hardware-trusted (the
          coordinator batch-advances a durable continuous_coverage_until watermark ~every 30s
          while it observes the live SE-challenged connection, plus exact-time disconnect and
          graceful-shutdown sweeps), and the coordinator-MEASURED offline gap
          (now - continuous_coverage_until) is within the reconnect allowance
          (EIGENINFERENCE_TRUST_REUSE_RECONNECT_GAP, default 90s, HARD-clamped to [0,120s] —
          values above the ceiling clamp DOWN). Both premises assume security posture
          remains valid within the accepted window; the continuity premise further
          assumes a posture-changing RecoveryOS round trip cannot fit the allowed gap. This is a physical-platform/timing assumption requiring
          adversarial qualification on supported hardware, not a theorem established
          by the coordinator timer or unit tests. The gap is
          never provider-claimed; a coordinator crash leaves the last periodic watermark standing
          so a stale watermark over-estimates the offline gap. For chained reconnects,
          each continuity grant runs a live signature challenge and
          re-anchors coverage at the grant, while the hardware-proof timestamp is NEVER advanced
          by reuse. Both premises stay bounded by (1) the ALWAYS-run live SE challenge that
          re-proves key possession and checks signed posture/binary reports on every reuse,
          not independent hardware measurements, (2) a
          durable hard-untrust epoch/tombstone that refuses/removes a record if a hard untrust
          races the grant (tombstones win; coverage never resurrects), and (3) declining the
          fast-skip entirely when no MDM client is configured. A live MDM verification
          still runs for every first-ever connection and for any reconnect failing both premises
          or any other gate. This reuse applies to legacy evidence only; it does not
          grant or refresh App Attest authorization. Continuity grants carry a distinct decision label ("continuity" /
          "continuity_release_transition") in logs and metrics so both premises are observable.
        status: accepted
    open_findings: [SEC-004]
    severity: critical
    detection_hint: >
      Any change to the attestation verification sequence, trust-level assignment
      logic, or MDM webhook handling is critical. Verify each step in the chain is
      required and cannot be individually bypassed.

  - id: T-037
    trust_boundary: TB-009
    stride: Information_Disclosure
    title: SIP/SecureBoot state self-reported without independent verification between challenges
    description: >
      Between 5-minute challenge intervals, the coordinator relies on the provider's
      self-reported SIP and SecureBoot state. A provider could report true at the
      challenge boundary and then disable protections until the next challenge.
    adversaries: [ADV-001]
    affected_assets: [A-001, A-010]
    affected_files:
      - provider-swift/Sources/ProviderCore/Security/SecurityHardening.swift
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/provider.go
    mitigations:
      - description: SIP checked at startup, before every request, and in every 5-minute challenge.
        status: implemented
      - description: Disabling SIP requires reboot (kills process); practical attack window is extremely narrow.
        status: implemented
      - description: MDM SecurityInfo provides independent SIP verification on demand.
        status: implemented
    open_findings: []
    severity: medium
    detection_hint: >
      Changes to challenge cadence, SIP-check frequency, or the per-request SIP
      gate in SecurityHardening.swift should preserve defense-in-depth against
      this narrow window.

  - id: T-042
    trust_boundary: TB-009
    stride: Spoofing
    title: Forged code-identity via attacker-key challenge + log/disk harvest (R-snoop)
    description: >
      The APNs challenge (T-034) is encrypted to the provider's self-reported key K.
      A fork that registers its OWN key K' could, in principle, harvest the pushed
      E_K'(nonce) from a root-readable surface on its own machine and decrypt it with
      K' — passing attestation without being genuine code. This requires the push
      payload to be readable by root AND a genuine App-ID device token bound to K'.
      Residual: a determined attacker on their own hardware could manually enable
      private-data logging via the GUI AND harvest a genuine token AND race the
      genuine T↔K registration — the "patient insider on own hardware" class
      (consistent with T-037 and the irreducible residuals), not a casual log read.
    adversaries: [ADV-001]
    affected_assets: [A-001, A-010]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/apns/attestor.go
      - provider-swift/Sources/darkbloom/ProviderAppKitHost.swift
      - provider-swift/Sources/ProviderCore/Apns/APNsBridge.swift
    mitigations:
      - description: >
          R-snoop verified CLOSED on current macOS (26.4, on-box): the encrypted
          code_challenge is redacted (<private>) in the unified log and absent from
          every on-disk store (apsd store, Notification Center DB) for background AND
          alert pushes; CLI un-redaction (log config private_data:on / profiles
          install) is removed. See docs/apns-code-attestation-design.md §1.6.1.
        status: implemented
      - description: >
          INVARIANT — the provider requests no UNUserNotificationCenter authorization,
          so an alert-mode push is never presented/persisted to the root-readable
          Notification Center DB. Enforced by code review + comments at both ends
          (ProviderAppKitHost.swift, coordinator/apns/attestor.go).
        status: implemented
      - description: >
          Challenge encrypted as E_K(nonce) (defense-in-depth for older macOS / a
          user-enabled private-data logging profile); the SE signature is verified
          against the key bound at registration, never a key supplied in the response.
        status: implemented
    open_findings: []
    severity: high
    detection_hint: >
      Reopens if any change (a) makes the provider request user-notification
      authorization, (b) carries code_challenge in an alert-rendering payload, or
      (c) logs the push payload. The closed-verification scope is current macOS
      (min target is 15); re-verify on a version bump.

  - id: T-043
    trust_boundary: TB-003
    stride: Denial of Service
    title: Watchdog rollback authority is the same replaceable provider binary
    description: >
      The crash-recovery watchdog (`io.darkbloom.watchdog`) and the automatic
      predecessor rollback it performs run the SAME installed `darkbloom`
      binary that updates replace. This is a deliberate, documented limitation
      set, not an oversight. (1) Rollback protection depends on the pre-update
      watchdog PROCESS surviving a candidate's stabilization window: launchd
      KeepAlive keeps the old process alive across the install, but if that
      process dies (reboot, logout, crash) launchd relaunches the watchdog
      FROM the candidate binary. (2) Rollback therefore does NOT survive a
      reboot into a candidate broken at the binary level (dyld failure,
      code-signature rejection, eager crash before command dispatch) — such a
      host stays down until a manual reinstall. (3) The failed-version
      quarantine is intentionally single-slot and exact-version:
      quarantining v3 OVERWRITES the v2 quarantine record, and only normal
      monotonic version ordering (a quarantined version is never strictly
      newer than the rolled-back-to predecessor's successor) prevents v2 from
      reinstalling. No component may claim multi-version quarantine.
      (4) Rollback/replay verification is fail-closed on the pinned Darkbloom
      designated requirement (Team SLDQ2GJ6TL): legacy flat/ad-hoc or locally
      re-signed installs are NOT rollback-eligible; the watchdog logs an
      actionable refusal and preserves the live install, and the remedy is a
      signed reinstall via install.sh. This is an accepted fleet-impact
      decision — hosts on unsigned installs keep restart recovery but not
      rollback.
    adversaries: [ADV-001]
    affected_assets: [A-010]
    affected_files:
      - provider-swift/Sources/ProviderCore/Service/WatchdogAgent.swift
      - provider-swift/Sources/ProviderCore/Service/WatchdogRecoveryService.swift
      - provider-swift/Sources/ProviderCore/Update/UpdateRecoveryStore.swift
      - provider-swift/Sources/ProviderCore/Update/UpdateInstallLayout.swift
      - provider-swift/Sources/ProviderCore/Update/DarkbloomCodeSignature.swift
    mitigations:
      - description: >
          Persistent KeepAlive watchdog process with an internal monotonic
          scheduler (GUI StartInterval one-shots are stranded by launchd
          on-demand-only mode), so the pre-update process normally survives
          the whole stabilization window without respawning.
        status: implemented
      - description: >
          Journaled, fsync-fail-closed install/rollback transactions with
          crash replay, so every power-loss boundary converges to a fully
          verified install; predecessor material is hash+signature verified
          against the pinned designated requirement before any restore.
        status: implemented
      - description: >
          Bounded watchdog network I/O (URLSession request/resource timeouts)
          plus a safe-point per-tick budget so a stalled download or wedged
          tick cannot hold the cross-process update lock forever; the budget
          is only consulted between complete operations and can never
          interrupt a journaled commit.
        status: implemented
      - description: >
          A separately installed, independently signed minimal bootstrap
          executable outside the replaceable install tree, giving recovery
          authority that survives reboot into a binary-level-broken candidate.
        status: open
    open_findings: []
    severity: medium
    detection_hint: >
      Reopens if any code or docs claim rollback survives a reboot into a
      non-launchable candidate, claim multi-version quarantine, weaken the
      designated-requirement pin to structural codesign validity, or move the
      candidate-hung timeout below the operator's configured
      startup_preload_timeout_secs plus margin.

  - id: T-044
    trust_boundary: TB-010
    stride: Elevation_of_Privilege
    title: Untrusted local process impersonates the provider to the root fan helper
    description: >
      A local process that can acquire or renew a helper lease can cause root-owned
      AppleSMC writes whenever the configured temperature threshold is met.
    adversaries: [ADV-001]
    affected_assets: [A-014]
    affected_files:
      - provider-swift/Sources/DarkbloomFanService/FanPeerAuthentication.swift
      - provider-swift/Sources/DarkbloomFanHelper/FanXPCService.swift
      - provider-swift/Sources/darkbloom/FanActivityLease.swift
    mitigations:
      - description: >
          Production XPC connections mutually pin exact signing identifiers and
          Developer ID Team SLDQ2GJ6TL using NSXPCConnection requirements; the
          helper separately restricts peers to root or the configured numeric UID
          whose directory-service GeneratedUID still matches the opt-in account.
        status: implemented
      - description: >
          The exported protocol contains only lease, status, and root-only Auto
          restoration operations; no arbitrary SMC write primitive exists.
        status: implemented
    open_findings: []
    severity: high
    detection_hint: >
      Reopens if production accepts identifier-only/ad-hoc peers, trusts a PID or
      user-controlled name instead of XPC credentials, or adds a generic SMC method.

  - id: T-045
    trust_boundary: TB-010
    stride: Tampering
    title: User-writable helper, plist, or policy turns launchd into root execution
    description: >
      A system LaunchDaemon that executes a binary or parses executable paths from a
      provider-owned home directory would convert ordinary account access into root.
    adversaries: [ADV-001]
    affected_assets: [A-014]
    affected_files:
      - provider-swift/Sources/darkbloom/Fan/FanServiceManager.swift
      - provider-swift/Sources/DarkbloomFanService/FanDurableFile.swift
      - provider-swift/Sources/ProviderCore/Update/FanHelperCapabilityVerifier.swift
    mitigations:
      - description: >
          The helper is copied to a fixed root:wheel 0755 path after exact signature
          verification; plist and policy are fixed-path, root-owned, non-symlink files.
        status: implemented
      - description: >
          Writes use same-directory temporary files, fchmod/fchown, fsync, atomic
          rename, and parent-directory fsync. The helper rejects unsafe file metadata.
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Reopens if ProgramArguments points into ~/.darkbloom, a user supplies a path,
      signature/ownership checks weaken, or config grows command/path fields.

  - id: T-046
    trust_boundary: TB-010
    stride: Denial_of_Service
    title: Helper crash or partial SMC write strands fans in manual mode
    description: >
      Manual mode and Ftst can outlive the process that asserted them. A failure
      between multi-fan writes can also leave inconsistent fan state.
    adversaries: [ADV-001]
    affected_assets: [A-014]
    affected_files:
      - provider-swift/Sources/DarkbloomFanCore/FanController.swift
      - provider-swift/Sources/DarkbloomFanHelper/FanDaemon.swift
      - provider-swift/Sources/DarkbloomFanService/FanOwnershipRecovery.swift
    mitigations:
      - description: >
          Controller writes are verified and transactional; any partial failure
          restores every possibly touched fan and clears only possibly owned Ftst.
        status: implemented
      - description: >
          A durable ownership journal is committed before the first possible SMC
          mutation; KeepAlive restart reconciles it before XPC activation.
        status: implemented
      - description: >
          Signal shutdown, sleep, administrator disable, and uninstall restore and
          verify Auto. Uninstall refuses to delete recovery state if restoration fails.
        status: implemented
    open_findings: []
    severity: high
    detection_hint: >
      Reopens if journal persistence moves after an SMC write, rollback stops after
      the first fan error, or shutdown/uninstall deletes an unresolved journal.

  - id: T-047
    trust_boundary: TB-010
    stride: Tampering
    title: Stale provider or downgrade keeps privileged fan control active
    description: >
      Provider stop, schedule closure, update, rollback, or a hung process must not
      leave a permanent root-authorized manual policy.
    adversaries: [ADV-001]
    affected_assets: [A-014]
    affected_files:
      - provider-swift/Sources/darkbloom/FanActivityLease.swift
      - provider-swift/Sources/darkbloom/Start/StartCommand+Modes.swift
      - provider-swift/Sources/DarkbloomFanHelper/FanDaemon.swift
    mitigations:
      - description: >
          Connection-scoped leases renew every five seconds and expire after fifteen;
          invalidation and task cancellation request immediate restoration.
        status: implemented
      - description: >
          Sleep revokes the lease and wake requires a fresh renewal. Protocol mismatch
          and rollback to pre-lease versions leave the helper dormant in Auto.
        status: implemented
    open_findings: []
    severity: medium
    detection_hint: >
      Reopens if a lease becomes persistent, cancellation stops releasing it, or an
      incompatible provider can trigger manual mode.

  - id: T-048
    trust_boundary: TB-010
    stride: Denial_of_Service
    title: Incorrect private GPU sensor mapping applies an unsafe fan policy
    description: >
      Apple changes private SMC sensor names by chip family. A wrong or stale mapping
      can engage too early, fail to cool, or hold a manual ceiling while another
      component overheats.
    adversaries: []
    affected_assets: [A-014]
    affected_files:
      - provider-swift/Sources/DarkbloomFanCore/FanHardware.swift
      - provider-swift/Sources/DarkbloomFanCore/FanPolicy.swift
      - provider-swift/Sources/DarkbloomFanHelper/FanDaemon.swift
    mitigations:
      - description: >
          Explicit M1-M5 allowlists, runtime key/type probing, finite plausible-value
          checks, missing-sensor fail-safe, and read-only diagnose output.
        status: implemented
      - description: >
          Takeover never lowers the existing target; serious/critical macOS thermal
          pressure, invalid readings, or control failures restore system Auto.
        status: implemented
    open_findings: []
    severity: medium
    detection_hint: >
      Every new chip/model or macOS release needs GPU-load correlation and full
      engage/release/restore hardware validation before support is claimed.

  - id: T-050
    trust_boundary: TB-003
    stride: Information_Disclosure
    title: Inline video plaintext exposed through provider temporary files
    description: >
      The provider decrypts each inline video before inference. The pre-fix path
      wrote those bytes to FileManager.default.temporaryDirectory as
      vlm-<UUID>.mp4 because AVFoundation consumed a URL, then removed the file
      only when EngineV2VisionPrefill.prepare returned. A provider operator could
      watch and copy the live file despite the process-memory protections, and a
      crash, SIGKILL, or power loss could bypass the defer cleanup and leave the
      consumer's video on disk. Coordinator-to-provider transport encryption does
      not protect such an at-rest artifact.
    adversaries: [ADV-001]
    affected_assets: [A-001]
    affected_files:
      - provider-swift/Sources/ProviderCore/Inference/Vision/MediaIngest.swift
      - provider-swift/Sources/ProviderCore/Inference/Vision/EngineV2VisionPrefill.swift
      - provider-swift/Sources/ProviderCore/Service/ProcessLifecycle.swift
      - provider-swift/Sources/darkbloom/Start/StartCommand+Modes.swift
      - libs/mlx-swift-lm/Libraries/MLXLMCommon/MemoryBackedVideoAsset.swift
      - libs/mlx-swift-lm/Libraries/MLXLMCommon/UserInput.swift
      - libs/mlx-swift-lm/Libraries/MLXVLM/MediaProcessing.swift
    mitigations:
      - description: >
          Inline MP4 and QuickTime bytes are retained by MemoryBackedVideoAsset.
          Its AVAssetResourceLoader delegate serves bounded byte ranges from Data
          over a private custom URL scheme, and UserInput.Video.memoryBacked owns
          the asset, loader, bytes, and serial delegate queue through frame
          sampling. No file or network URL is involved.
        status: implemented
      - description: >
          AVURLAssetReferenceRestrictions.forbidAll prevents the container from
          following external references. Provider media ingestion still accepts
          only base64 data:video/mp4 or data:video/quicktime payloads, applies the
          existing decoded-byte, duration, frame-pixel, video-count, and aggregate
          caps, and rejects http(s), file, and unsupported container MIME types.
        status: implemented
      - description: >
          Coordinator-connected foreground and standalone local startup each
          call ProcessLifecycle.acquireMediaServingLock exactly once. The shared
          seam first acquires the production single-instance lock, then removes
          regular files matching the exact legacy vlm-<UUID>.mp4 name. It runs
          outside ProviderLoop construction and scheduled-loop reconstruction,
          clearing crash-orphaned plaintext without touching unrelated or
          non-regular temporary-directory entries.
        status: implemented
      - description: >
          Provider and mlx-swift-lm tests force AVFoundation metadata and frame
          processing through the memory-backed asset, pin random-access range and
          cancellation behavior, verify MP4/QuickTime wire compatibility, assert
          that no vlm-*.mp4 file appears, lock the startup purge allowlist, and
          verify that the shared media-serving seam orders one housekeeping pass
          after successful lock acquisition and none after lock failure.
        status: implemented
    open_findings: []
    severity: high
    detection_hint: >
      Any inline-video path that calls Data.write, FileManager.createFile, or
      AVAsset(url:) with a file/http URL reopens this finding. Changes to
      MemoryBackedVideoAsset ownership, resource-loader ranges, reference
      restrictions, MIME support, cancellation, or startup cleanup require the
      focused provider and mlx-swift-lm media suites.

  - id: T-052
    trust_boundary: TB-011
    stride: Elevation_of_Privilege
    title: Shadow evidence or a legacy label is mistaken for serving permission
    description: >
      Treating a valid diagnostic, self_signed label or enrolled App Attest key as
      authorization can admit an unqualified connection. Conversely, requiring both
      complete legacy and App Attest evidence can deny intentionally migrated providers.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-001, A-016]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/attestation_policy.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/routing_eligibility.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/owner_authorization.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/config.go
    mitigations:
      - description: >
          Explicit serving opt-in; independent legacy-or-App-Attest evaluation retains
          shared runtime/privacy gates and separates authenticated owner eligibility.
          Shadow/optional diagnostics cannot grant permission or manufacture legacy flags.
        status: implemented
    open_findings: []
    severity: critical
    detection_hint: >
      Test legacy-only, App-Attest-only, both and neither; distinguish transient missing
      evidence from hard denial. Exercise owner routing without weakening public gates.

  - id: T-053
    trust_boundary: TB-011
    stride: Spoofing
    title: Replayed proof or stale authorization survives a connection change or revocation
    description: >
      A queued request may outlive a grant, credential revocation, endpoint replacement
      or policy change. Selection-time authorization and a public snapshot are insufficient.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-001, A-009, A-015, A-016]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/verify.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/authorizer.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/app_attest_authorization.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/app_attest_presenter.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/inference_authorization.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/autopilot_reward_snapshot.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/api/provider/autopilot_rewards.go
    mitigations:
      - description: >
          Verified transcript/credential/counter and current account/session/endpoint
          bindings, bounded durable freshness, generation invalidation and final handoff
          checks cover direct, queued, retry, cold and hedge dispatches.
        status: implemented
      - description: >
          Explicit credential revocation denies matching live presenters and retained
          grant keys across both paths; failed storage reads never extend readiness.
        status: implemented
      - description: >
          Autopilot reward qualification evaluates the lease interval at the original
          server receive time while retaining current binding, policy, revocation
          and privacy checks. A grant accepted during delayed frame processing cannot
          retroactively qualify an earlier UTC day. Consent journaling preserves that
          original timestamp through deferred baseline materialization and retries.
        status: implemented
      - description: Committed in-flight frames and already delivered plaintext cannot be recalled.
        status: accepted
    open_findings: []
    severity: critical
    detection_hint: >
      Expire/revoke/replace after selection and during frame preparation; reject the
      subsequent handoff, including self-route, without reusing cached verdicts.

  - id: T-054
    trust_boundary: TB-011
    stride: Tampering
    title: Unqualified or revoked signed build is accepted through stale code evidence
    description: >
      App-reported hashes, a truncated Apple code measurement, a CI publication key or
      stale approval could be mistaken for independently qualified full artifact identity.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-005, A-011, A-017]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/authorization.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/build_qualifications.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/authorizer.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/app_attest_authorization.go
    mitigations:
      - description: >
          Separate operator approval, durable revocation tombstones and current
          qualification generation; Apple's 20-byte measurement must uniquely match
          the approved full hash across durable rows, including revoked rows. Existing
          deployments may use exact configured build/code mappings for a full Apple
          measurement only when no durable row exists and the policy snapshot is fresh;
          durable rows/tombstones override this fallback. Truncated measurements and
          new release publication require durable qualification.
        status: implemented
      - description: >
          Physical-Mac security-transition qualification must be supplied by the operator;
          source review and CI success cannot establish that qualification.
        status: open
    open_findings: []
    severity: critical
    detection_hint: >
      Reject ambiguous or unresolved truncated measurements, report-only identity, stale approval,
      qualification withdrawal and attempts by release publication credentials to approve.

  - id: T-055
    trust_boundary: TB-011
    stride: Spoofing
    title: Credential continuity is mistaken for unique hardware or certified capacity
    description: >
      An operator may rotate credentials, reinstall, create new accounts or inflate
      app-origin hardware claims. Verified aliases identify known continuity, not a
      globally unique physical Mac or an Apple-certified RAM entitlement.
      Autopilot's cohort fallback can pay a new machine with little or no personal
      inference history. Provider-origin inventory and connected-session evidence
      do not prove useful work or prevent an operator from enrolling unlinkable
      identities to draw multiple cohort floors.
    adversaries: [ADV-001]
    affected_assets: [A-009, A-015]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/authorization_identity.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/store/machine_continuity.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/store/machine_floor_settlement.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/payments/baserewards/machine_candidates.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/autopilot_reward_snapshot.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/store/postgres/autopilot_rewards_cohort_peers.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/store/postgres/autopilot_rewards_uptime.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/store/postgres/autopilot_rewards_settlement.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/store/memory/autopilot_rewards_settlement.go
    mitigations:
      - description: >
          Protocol3 binds hardware and the verification key; authenticated associations,
          canonical settlement identity, overlapping-uptime union and account/pool caps
          prevent known duplicate sessions from multiplying base floors.
        status: implemented
      - description: >
          Autopilot rejects provisional or ambiguous ownership, unions known machine
          sessions for uptime, freezes the original baseline and atomically records
          one finalized payment per canonical machine/day against a shared pool cap.
          Historical qualification and missing cohort evidence fail closed. These
          controls bound known duplicate claims, not unlinkable physical identities.
        status: implemented
      - description: Deliberate unlinkable identities and false capacity require separate abuse policy/qualification.
        status: open
      - description: >
          Autopilot has no minimum personal served-work requirement, cohort-size
          threshold beyond one eligible peer, or per-account payout cap. Those
          abuse controls and independent
          validation of provider-origin inventory need a separate product policy;
          the current global pool cap only bounds aggregate loss.
        status: open
    open_findings: []
    severity: high
    detection_hint: >
      Test rotations/merges and same-epoch settlement races; never present inventory
      counts or the risk metric as proof of physical uniqueness or measured RAM.

  - id: T-056
    trust_boundary: TB-011
    stride: Information_Disclosure
    title: Attested app identity is overclaimed as runtime secrecy or correct computation
    description: >
      Apple-signed code/access-policy evidence and app-signed model/status fields do
      not provide per-request computation proofs or place inference inside the SE.
      A compromised running endpoint can expose prompts, keys or results; the
      coordinator also remains a plaintext endpoint under the hop-by-hop model.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-001, A-003, A-004]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/authorization.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/attestation_policy.go
      - provider-swift/Sources/ProviderCore/ProviderLoop+AppAttestShadow.swift
    mitigations:
      - description: >
          Platform access-policy verification, bounded assertions, common privacy/runtime
          gates and encrypted transport constrain admission and exposure.
        status: implemented
      - description: >
          Physical SIP/boot transitions, host-compromise resistance and inference/result
          integrity need independent adversarial qualification; neither path proves them.
        status: open
    open_findings: []
    severity: critical
    detection_hint: >
      Keep Apple measurements, app-origin assertions and operator qualification distinct;
      do not infer model correctness or zero plaintext exposure from a verification badge.

  - id: T-057
    trust_boundary: TB-011
    stride: Denial_of_Service
    title: Apple recovery or premature MDM removal strands a provider without authorization
    description: >
      Enrollment/assertion errors, receipt/archive failures or unqualified builds can
      leave App-Attest-only providers pending. Removing a working profile too early
      can remove their independently valid legacy path.
    adversaries: [ADV-001, ADV-003]
    affected_assets: [A-015, A-016]
    affected_files:
      - provider-swift/Sources/ProviderAppAttest/EnrollmentKeyLifecycle.swift
      - provider-swift/Sources/ProviderCore/Auth/ProviderOnboardingPolicy.swift
      - provider-swift/Sources/ProviderCore/Diagnostics/ProviderAuthorizationReadiness.swift
      - provider-swift/Sources/darkbloom/UnenrollCommand+KeepServing.swift
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/authorizer.go
    mitigations:
      - description: >
          Bounded persisted enrollment recovery and receipt renewal never grant trust.
          macOS27+ onboarding waits for App Attest without silently installing MDM;
          existing profiles remain. Removal is a separate opt-in with fresh readiness,
          exact profile targeting and explicit local user action.
        status: implemented
      - description: Apple availability and a future loss of authorization after removal remain operational risks.
        status: accepted
    open_findings: []
    severity: high
    detection_hint: >
      Exercise response loss, exhausted key budgets, receipt failure, stale readiness,
      foreground-auth denial and employer-profile coexistence without widening permission.

  - id: T-058
    trust_boundary: TB-011
    stride: Information_Disclosure
    title: Evidence archives or verification diagnostics leak stable identities or misstate trust
    description: >
      Raw receipts, key/account/machine associations and legacy public SE keys can link
      sessions. Stale diagnostic snapshots or forged optional metadata can mislead users
      even when dispatch remains correctly gated.
    adversaries: [ADV-001, ADV-002, ADV-003]
    affected_assets: [A-010, A-015, A-016]
    affected_files:
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/appattest/service/archive.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/appattest/service/ready_diagnostics.go
      - https://github.com/Layr-Labs/darkbloom-platform/blob/48a198c71a2d30feec5597bacf1101120f7f955d/coordinator/registry/verification.go
      - https://github.com/Layr-Labs/d-inference/blob/48d2be458b3ce511a2a9006238b923295c9c6718/coordinator/api/me_authorization.go
    mitigations:
      - description: >
          Private evidence storage, bounded diagnostics excluded from authorization,
          public method states/timestamps, private-only roster filtering and live owner
          expiry checks separate presentation from dispatch permission.
        status: implemented
      - description: >
          Legacy public SE keys remain linkable; private evidence and operational logs
          still require access/retention controls. A historical verdict is not a live grant.
        status: accepted
    open_findings: []
    severity: high
    detection_hint: >
      Review public payloads, archives, logs and cache timing separately; never expose
      raw evidence or infer authorization from client-supplied diagnostics.
