name: SDK 27 provider build
description: Cache and build one unsigned release or SDK qualification lane.
inputs:
  lane:
    description: release or qualification; compiled outputs never cross lanes
    required: true
  version:
    description: Release version for the release lane; a dev version X.Y.Z-dev.N is stamped into ProviderCore.version
    required: false
    default: ''
  environment:
    description: Resolved environment (dev, staging or prod); only disambiguates retained SDK diagnostics names when dev and staging share one run
    required: false
    default: ''
outputs:
  bin-dir:
    description: Optimized Swift products (release lane only)
    value: ${{ steps.products.outputs.bin_dir }}
  metallib:
    description: Source-validated Metal library
    value: ${{ steps.metallib.outputs.metallib }}
  cluster-helpers-dir:
    description: Unsigned cluster worker and placement tool with their Metal library (release lane only)
    value: ${{ steps.cluster-helpers.outputs.cluster_helpers_dir }}
  build-sdk-version:
    description: SDK selected for Swift compilation
    value: ${{ steps.identity.outputs.sdk_version }}
  mlx-sha-short:
    description: Exact native MLX source revision
    value: ${{ steps.mlxkey.outputs.mlx_sha_short }}
runs:
  using: composite
  steps:
    - name: Validate lane
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        case "$LANE" in release|qualification) ;; *) exit 2 ;; esac
    - name: Verify checked-out source
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code HEAD --ignore-submodules=none
        if git submodule status --recursive | grep -qE '^[-+U]'; then
          echo 'Recursive submodules differ from committed source' >&2
          exit 1
        fi
    - name: Stamp dev release version
      # Runs after the clean-source check and changes only the version line.
      # Cached timestamps are restored only for identical file contents, so
      # a later build never reuses the stamped file's timestamp.
      if: inputs.lane == 'release' && inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ./scripts/check-release-version.sh "$VERSION"
        SOURCE=provider-swift/Sources/ProviderCore/ProviderCore.swift
        BASE=$(awk -F'"' '/public static let version =/ { print $2 }' "$SOURCE")
        if [ "$VERSION" != "$BASE" ]; then
          sed -i '' "s/public static let version = \"$BASE\"/public static let version = \"$VERSION\"/" "$SOURCE"
          ./scripts/check-release-version.sh "$VERSION"
          test "$(git diff --name-only)" = "$SOURCE"
        fi
    - name: Select SDK 27 provider toolchain
      shell: bash
      run: ./scripts/prepare-provider-release-toolchain.sh
    - name: Test Qwen resources in a relocated app
      shell: bash
      run: python3 scripts/test-qwen4-packaged-resources.py
    - name: Record build identity
      id: identity
      shell: bash
      run: |
        echo "sdk_version=$PROVIDER_SDK_VERSION" >> "$GITHUB_OUTPUT"
        swift --version
        xcodebuild -version
        sysctl -n hw.logicalcpu hw.memsize
    - name: Resolve compatible build cache keys
      id: keys
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: python3 scripts/provider-release-cache.py keys --lane "$LANE" >> "$GITHUB_OUTPUT"
    - name: Restore SDK-specific Swift build cache
      id: swift-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: |
          provider-swift/.build
          libs/mlx-swift-lm/.build
        key: ${{ steps.keys.outputs.swift-key }}
        restore-keys: ${{ steps.keys.outputs.swift-prefix }}
    - name: Restore unchanged source timestamps
      shell: bash
      run: |
        python3 scripts/provider-release-cache.py restore-mtimes
        # A generic Swift cache cannot authorize a runtime Metal library.
        for root in provider-swift/.build libs/mlx-swift-lm/.build; do
          [ ! -d "$root" ] || find "$root" -type f -name mlx.metallib -delete
        done
    - name: Ensure matching Metal compiler is available
      shell: bash
      run: python3 scripts/prepare-metal-toolchain.py
    - name: Install pinned CMake for Metal build
      shell: bash
      run: ./scripts/install-release-cmake.sh
    - name: Resolve source-matched metallib cache namespace
      id: mlxkey
      shell: bash
      run: |
        set -euo pipefail
        MLX_SRC="libs/mlx-swift/Source/Cmlx/mlx"
        test -f "$MLX_SRC/mlx/version.h"
        test -z "$(git -C "$MLX_SRC" status --porcelain=v1 --untracked-files=all)"
        MLX_SHA=$(git -C "$MLX_SRC" rev-parse HEAD)
        HELPER_SHA=$(shasum -a 256 scripts/fetch-metallib.sh | cut -d' ' -f1)
        SDK=$(xcrun --sdk macosx --show-sdk-version)
        XCODE=$(xcodebuild -version | tr -cs '[:alnum:].' '-')
        METAL_COMPILER=$(xcrun --no-cache --sdk macosx --find metal)
        METAL_SHA=$(shasum -a 256 "$METAL_COMPILER" | cut -d' ' -f1)
        CMAKE_COMPILER=$(command -v cmake)
        CMAKE_VERSION=$(cmake --version)
        CMAKE_BINARY_SHA=$(shasum -a 256 "$CMAKE_COMPILER" | cut -d' ' -f1)
        CMAKE_SHA=$(printf '%s\n' "$CMAKE_VERSION" "$CMAKE_BINARY_SHA" | shasum -a 256 | cut -d' ' -f1)
        echo "key=metallib-helper-v3-${MLX_SHA}-${HELPER_SHA}-${METAL_SHA}-${CMAKE_SHA}-${XCODE}-sdk${SDK}-dt${MLX_METALLIB_DEPLOYMENT_TARGET}-jitoff" >> "$GITHUB_OUTPUT"
        echo "mlx_sha_short=${MLX_SHA:0:12}" >> "$GITHUB_OUTPUT"
    - name: Restore source-matched metallib cache
      id: metallib-cache
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ runner.temp }}/metallib-cache
        key: ${{ steps.mlxkey.outputs.key }}
    - name: Build or validate source-matched metallib
      id: metallib
      shell: bash
      env:
        METALLIB_CACHE_DIR: ${{ runner.temp }}/metallib-cache
      run: |
        set -euo pipefail
        cmake --version
        MLX_SRC="libs/mlx-swift/Source/Cmlx/mlx"
        ./scripts/fetch-metallib.sh "$RUNNER_TEMP/metallib"
        test -z "$(git -C "$MLX_SRC" status --porcelain=v1 --untracked-files=all)"
        test -s "$RUNNER_TEMP/metallib/mlx.metallib"
        echo "metallib=$RUNNER_TEMP/metallib/mlx.metallib" >> "$GITHUB_OUTPUT"
    - name: Save source-matched metallib cache
      if: steps.metallib-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ runner.temp }}/metallib-cache
        key: ${{ steps.mlxkey.outputs.key }}
    - name: Verify public prompt golden vectors
      if: inputs.lane == 'qualification'
      id: parity
      shell: bash
      run: ./scripts/verify-prompt-parity.sh
    - name: Build SDK test products and stage Metal library
      if: inputs.lane == 'qualification'
      id: test-build
      shell: bash
      working-directory: provider-swift
      env:
        RELEASE_TEST_METALLIB: ${{ steps.metallib.outputs.metallib }}
      run: |
        set -euo pipefail
        swift build --build-tests
        TEST_BIN_DIR=$(swift build --show-bin-path)
        cp "$RELEASE_TEST_METALLIB" "$TEST_BIN_DIR/mlx.metallib"
        while IFS= read -r macos; do
          cp "$RELEASE_TEST_METALLIB" "$macos/mlx.metallib"
        done < <(find .build -type d -path '*.xctest/Contents/MacOS' -print)
    - name: Prepare MiMo image HTTP fixtures
      if: inputs.lane == 'qualification'
      shell: bash
      run: |
        python3 scripts/prepare-mimo-image-http-fixtures.py \
          --output "$RUNNER_TEMP/mimo-sdk-image-http-fixtures" --github-env "$GITHUB_ENV"
    - name: Test provider with release SDK
      if: inputs.lane == 'qualification'
      shell: bash
      working-directory: provider-swift
      env:
        MIMO_V26_PROVIDER_LIFETIME_METADATA_TESTS: '1'
      run: |
        python3 ../scripts/prepare-mimo-prompt-fixtures.py \
          --output "$RUNNER_TEMP/mimo-sdk-prompt-fixtures" --github-env "$GITHUB_ENV"
        python3 ../scripts/prepare-mimo-provider-fixtures.py \
          --output "$RUNNER_TEMP/mimo-sdk-provider-fixtures" --github-env "$GITHUB_ENV"
        export MIMO_PROMPT_ARTIFACT_DIRECTORY="$RUNNER_TEMP/mimo-sdk-prompt-fixtures"
        export MIMO_PROMPT_REFERENCE_VECTORS="$GITHUB_WORKSPACE/fixtures/prompt-contract/mimo-v26-additional20.json"
        export MIMO_V26_SERIAL_LOAD_FIXTURES="$RUNNER_TEMP/mimo-sdk-provider-fixtures"
        export MIMO_V26_WIRED_METADATA_FIXTURE="$RUNNER_TEMP/mimo-sdk-provider-fixtures/tiny-bf16"
        python3 ../scripts/run-provider-test-watchdog.py \
          --output-dir "$RUNNER_TEMP/provider-sdk-tests" \
          --diagnostic-after-seconds 480 --timeout-seconds 900 \
          -- ../scripts/run-provider-tests.sh
    - name: Restore pinned MiMo audio codec
      if: inputs.lane == 'qualification'
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
      id: mimo-audio-cache
      with:
        path: ${{ runner.temp }}/mimo-audio-source
        key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
    - name: Prepare selected MiMo audio fixture
      if: inputs.lane == 'qualification'
      id: mimo-audio-fixtures
      shell: bash
      run: python3 scripts/prepare-mimo-audio-fixtures.py --cache "$RUNNER_TEMP/mimo-audio-source" --output "$RUNNER_TEMP/mimo-audio-fixtures" --github-env "$GITHUB_ENV"
    - name: Cache verified MiMo audio codec
      if: inputs.lane == 'qualification' && steps.mimo-audio-fixtures.outcome == 'success' && steps.mimo-audio-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ runner.temp }}/mimo-audio-source
        key: mimo-audio-source-v2-077033345d80eef3a315e8d394e0589667e80e4cdaba9bc5a7488410c6657265
    - name: Qualify authenticated native MiMo PCM8 audio inference
      if: inputs.lane == 'qualification'
      shell: bash
      working-directory: provider-swift
      env:
        MIMO_V26_SERIAL_NATIVE_TESTS: '1'
        MIMO_V26_MANAGED_AUDIO_PROVIDER_TESTS: '1'
      run: ../scripts/run-nested-suite.sh testNativeAudioRelease --no-parallel
    - name: Resolve provider product and packaged names
      if: inputs.lane == 'release'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      # Exports PRODUCT_CLI_NAME and PRODUCT_ENCLAVE_NAME from
      # provider-swift/identity/provider-identity.json for this and later steps.
      run: python3 scripts/provider_release_identity.py "$VERSION" >> "$GITHUB_ENV"
    - name: Build optimized provider products
      if: inputs.lane == 'release'
      id: products
      shell: bash
      working-directory: provider-swift
      run: |
        set -euo pipefail
        swift build -c release --product "$PRODUCT_CLI_NAME"
        swift build -c release --product "$PRODUCT_ENCLAVE_NAME"
        swift build -c release --product darkbloom-fan-helper
        BIN_DIR=$(swift build -c release --show-bin-path)
        for product in "$PRODUCT_CLI_NAME" "$PRODUCT_ENCLAVE_NAME" darkbloom-fan-helper; do
          test -x "$BIN_DIR/$product"
        done
        echo "bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"
    - name: Build cluster helpers (worker and placement tool)
      # The installed provider launches darkbloom-cluster-worker (and runs
      # darkbloom-cluster-plan beside it) from Darkbloom.app/Contents/Helpers.
      # Built by the worker package's native build (macOS 26.2, real JACCL)
      # against the SAME source-matched metallib as the provider; staged into
      # the app by provider-signing-validation.py, which refuses an app
      # without them.
      if: inputs.lane == 'release'
      id: cluster-helpers
      shell: bash
      env:
        MATCHED_METALLIB: ${{ steps.metallib.outputs.metallib }}
      run: |
        set -euo pipefail
        export DARKBLOOM_CLUSTER_WORKER_BUILD_JOBS="$(sysctl -n hw.logicalcpu)"
        OUT="$RUNNER_TEMP/cluster-helpers"
        ./scripts/build-cluster-helpers.sh "$MATCHED_METALLIB" "$OUT"
        for helper in darkbloom-cluster-worker darkbloom-cluster-plan; do
          test -x "$OUT/$helper"
        done
        cmp "$OUT/mlx.metallib" "$MATCHED_METALLIB"
        echo "cluster_helpers_dir=$OUT" >> "$GITHUB_OUTPUT"
    - name: Retain SDK test diagnostics
      if: always() && inputs.lane == 'qualification'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        # The environment infix keeps the dev and staging qualify-sdk lanes from
        # clashing when they share one GitHub run. The name is diagnostics only
        # (resume never references it): a release lane adds -<environment>- (so
        # prod deliberately carries -prod-), and a caller that passes no
        # environment (the warm lane) keeps the historical name with no infix and
        # no empty double dash.
        name: provider-sdk-test-diagnostics${{ inputs.environment != '' && format('-{0}', inputs.environment) || '' }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/provider-sdk-tests
        if-no-files-found: ignore
        retention-days: 14
    - name: Record timestamps for successfully compiled sources
      # Failed assertions do not invalidate successfully built objects. Never
      # certify source timestamps for an incomplete compilation.
      if: always() && !cancelled() && (steps.products.outcome == 'success' || steps.test-build.outcome == 'success')
      id: timestamps
      shell: bash
      run: python3 scripts/provider-release-cache.py snapshot-mtimes
    - name: Save SDK-specific Swift build cache
      if: always() && !cancelled() && steps.timestamps.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: |
          provider-swift/.build
          libs/mlx-swift-lm/.build
        key: ${{ steps.keys.outputs.swift-key }}
    - name: Summarize cache reuse
      if: always()
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        SWIFT_HIT: ${{ steps.swift-cache.outputs.cache-hit }}
        METAL_HIT: ${{ steps.metallib-cache.outputs.cache-hit }}
        SWIFT_MATCH: ${{ steps.swift-cache.outputs.cache-matched-key }}
      run: |
        {
          echo "### SDK 27 $LANE build cache"
          echo "Swift exact hit: ${SWIFT_HIT:-false}; restored key: ${SWIFT_MATCH:-none}"
          echo "Metal exact hit: ${METAL_HIT:-false}"
          echo 'A cache hit reuses compilation; it never skips qualification or signing.'
        } >> "$GITHUB_STEP_SUMMARY"
