name: Register Model

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Model ID, for example mlx-community/foo
        required: true
      version:
        description: Manifest version
        required: true
      display_name:
        description: Human-readable display name
        required: true
      family:
        description: Model family
        required: false
        default: ''
      architecture:
        description: Architecture description
        required: false
        default: ''
      quantization:
        description: Quantization
        required: false
        default: ''
      capabilities_csv:
        description: Comma-separated capabilities
        required: false
        default: chat
      context_length:
        description: Context length
        required: false
        default: '0'
      min_ram_gb:
        description: Minimum RAM in GB
        required: false
        default: '0'
      recommended_ram_gb:
        description: Recommended RAM in GB
        required: false
        default: '0'
      description:
        description: Model description
        required: false
        default: ''
      metadata_json:
        description: Metadata JSON object
        required: false
        default: '{}'
      source_hf_id:
        description: Source Hugging Face ID
        required: false
        default: ''
      source_hf_revision:
        description: Source Hugging Face revision
        required: false
        default: ''
      promote:
        description: Promote this version after registration
        required: false
        default: false
        type: boolean
      coordinator_url:
        description: Coordinator base URL
        required: false
        default: https://api.darkbloom.dev

jobs:
  register:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Build registration payload
        env:
          MODEL_ID: ${{ inputs.model_id }}
          VERSION: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          FAMILY: ${{ inputs.family }}
          ARCHITECTURE: ${{ inputs.architecture }}
          QUANTIZATION: ${{ inputs.quantization }}
          CAPABILITIES_CSV: ${{ inputs.capabilities_csv }}
          CONTEXT_LENGTH: ${{ inputs.context_length }}
          MIN_RAM_GB: ${{ inputs.min_ram_gb }}
          RECOMMENDED_RAM_GB: ${{ inputs.recommended_ram_gb }}
          DESCRIPTION: ${{ inputs.description }}
          METADATA_JSON: ${{ inputs.metadata_json }}
          SOURCE_HF_ID: ${{ inputs.source_hf_id }}
          SOURCE_HF_REVISION: ${{ inputs.source_hf_revision }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          jq -n \
            --arg model_id "$MODEL_ID" \
            --arg version "$VERSION" \
            --arg display_name "$DISPLAY_NAME" \
            --arg family "$FAMILY" \
            --arg architecture "$ARCHITECTURE" \
            --arg quantization "$QUANTIZATION" \
            --arg capabilities_csv "$CAPABILITIES_CSV" \
            --argjson context_length "$CONTEXT_LENGTH" \
            --argjson min_ram_gb "$MIN_RAM_GB" \
            --argjson recommended_ram_gb "$RECOMMENDED_RAM_GB" \
            --arg description "$DESCRIPTION" \
            --argjson metadata "$METADATA_JSON" \
            --arg source_hf_id "$SOURCE_HF_ID" \
            --arg source_hf_revision "$SOURCE_HF_REVISION" \
            --argjson promote "$PROMOTE" \
            '{
              model_id: $model_id,
              version: $version,
              display_name: $display_name,
              family: $family,
              architecture: $architecture,
              quantization: $quantization,
              context_length: $context_length,
              min_ram_gb: $min_ram_gb,
              recommended_ram_gb: $recommended_ram_gb,
              capabilities: ($capabilities_csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
              description: $description,
              metadata: $metadata,
              source_hf_id: $source_hf_id,
              source_hf_revision: $source_hf_revision,
              promote: $promote
            }' > payload.json
          jq . payload.json

      - name: Register model with coordinator
        env:
          COORDINATOR_URL: ${{ inputs.coordinator_url }}
          MODEL_REGISTRY_PUBLISHING_KEY: ${{ secrets.MODEL_REGISTRY_PUBLISHING_KEY }}
        run: |
          test -n "$MODEL_REGISTRY_PUBLISHING_KEY"
          curl -fsS \
            -H "Authorization: Bearer ${MODEL_REGISTRY_PUBLISHING_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "${COORDINATOR_URL%/}/v1/admin/models/register"
