          SHARD: ${{ matrix.shard }}
        run: python3 scripts/cluster-test-plan.py run nonblocking "$SHARD"
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  cluster-release-checks:
    # The worker capability and prefill schedule checks compile a release
    # build of the cluster runtime and MLX (each runner its own source
    # closure; no GPU, no model load, no weights), so they run in a job of
    # their own: no test job waits for them. The build is reused across runs:
    # SwiftPM rebuilds what changed, and source timestamps are restored only
    # for files whose contents match the cached build's
    # (scripts/provider-release-cache.py). Its lane asks as the build jobs'
    # lanes do: with its size while job sizes are on, without one otherwise
    # (provider-plan.yml).
    name: Cluster Release Build Checks
    if: ${{ inputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(inputs.routes)['cluster-release-checks'] }}
    timeout-minutes: 60
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        id: toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      # The key binds the toolchain, the package manifests, the submodule pins,
      # the runner script and the paths; it drops `git describe` text, which
      # depends on the refs a cached .git holds.
      - name: Resolve cluster metadata build cache key
        id: cluster-build-key
        if: ${{ steps.toolchain.outcome == 'success' }}
        env:
          MANIFESTS: ${{ hashFiles('libs/darkbloom-cluster/Package.swift', 'libs/darkbloom-cluster/Package.resolved', 'libs/darkbloom-cluster-worker/Package.swift', 'libs/darkbloom-cluster-worker/Package.resolved', 'libs/darkbloom-cluster/Tests/Support/native-metadata.sh', '.gitmodules') }}
        run: |
          set -euo pipefail
          identity=$( { swift --version 2>&1; xcodebuild -version; xcrun --show-sdk-path; \
            git submodule status --recursive | awk '{print $1, $2}'; echo "$GITHUB_WORKSPACE $RUNNER_TEMP $MANIFESTS"; } | shasum -a 256 | cut -c1-32)
          echo "prefix=cluster-metadata-release-v1-$identity-" >> "$GITHUB_OUTPUT"
          echo "key=cluster-metadata-release-v1-$identity-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore cluster metadata build
        id: cluster-build-cache
        if: ${{ steps.cluster-build-key.outcome == 'success' }}
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/cluster-native-metadata
          key: ${{ steps.cluster-build-key.outputs.key }}
          restore-keys: ${{ steps.cluster-build-key.outputs.prefix }}
      - name: Restore unchanged source timestamps
        if: ${{ steps.cluster-build-key.outcome == 'success' }}
        run: |
          manifest="$RUNNER_TEMP/cluster-native-metadata/provider-release-source-mtimes.json"
          if [ -f "$manifest" ]; then
            mkdir -p provider-swift/.build
            cp "$manifest" provider-swift/.build/
            python3 scripts/provider-release-cache.py restore-mtimes
          fi
      - name: Run worker capability checks
        id: capability-checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        # The runner is this job's alone: compile the native closure on all its cores.
        env:
          DARKBLOOM_CLUSTER_METADATA_BUILD_JOBS: '12'
          DARKBLOOM_CLUSTER_METADATA_BUILD_ROOT: ${{ runner.temp }}/cluster-native-metadata
        run: bash libs/darkbloom-cluster-worker/Tests/CapabilityChecks/run.sh
      # Builds the bootstrap product beside the capability runner's, in the same
      # retained build, before the steps below record and save it.
      - name: Run prefill schedule checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          DARKBLOOM_CLUSTER_METADATA_BUILD_JOBS: '12'
          DARKBLOOM_CLUSTER_METADATA_BUILD_ROOT: ${{ runner.temp }}/cluster-native-metadata
        run: bash libs/darkbloom-cluster/Tests/PrefillScheduleChecks/run.sh
      # Only pushes to master and dev save the cluster build (SAVE_CACHES).
      - name: Record source timestamps for the cluster build
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.capability-checks.outcome == 'success' && steps.cluster-build-cache.outputs.cache-hit != 'true' }}
        run: |
          python3 scripts/provider-release-cache.py snapshot-mtimes
          cp provider-swift/.build/provider-release-source-mtimes.json "$RUNNER_TEMP/cluster-native-metadata/"
      - name: Upload cluster metadata build cache
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.capability-checks.outcome == 'success' && steps.cluster-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/cluster-native-metadata
          key: ${{ steps.cluster-build-key.outputs.key }}
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  test-cluster-focused:
    # The model-free cluster check runners on two Macs; each compiles its own
    # source closure and runs on retained fixtures (no GPU, no model load, no
    # weights; every runner runs even after another fails). Shard 1 runs the
    # runner scripts under libs/darkbloom-cluster/Tests
    # (scripts/cluster-test-plan.py focused lane) and the pairing, diagnostics
    # and placement flow runners;
    # shard 2 runs the stage metadata, provisioning, onboarding and console
    # runners. They need no test
    # products. Both shards read the one lane test-cluster-focused, which the
    # route requests for 2 jobs (provider-plan.yml).
    name: Cluster Focused Checks (shard ${{ matrix.shard }})
    if: ${{ inputs.cluster == 'true' }}
    runs-on: ${{ fromJSON(inputs.routes)['test-cluster-focused'] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Select today's .git cache
        id: git-day
        run: |
          day=$(date -u +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "month=${day%-*}" >> "$GITHUB_OUTPUT"
          echo "actions/cache compressor: $(command -v zstd >/dev/null && echo zstd || echo gzip)"
      - name: Restore the newest saved .git
        id: git-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: git-v1-${{ runner.os }}-${{ steps.git-day.outputs.day }}
          restore-keys: |
            git-v1-${{ runner.os }}-${{ steps.git-day.outputs.month }}-
            git-v1-${{ runner.os }}-
      - name: Discard a damaged cached .git
        run: |
          if [ -d .git ] && ! { git rev-parse --verify -q HEAD >/dev/null &&
              git fsck --connectivity-only --no-progress >/dev/null 2>&1; }; then
            echo "::warning title=.git cache::git fsck rejected the restored .git; checking out without it."
            rm -rf .git
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Save .git for later runs
        if: env.SAVE_CACHES == 'true' && steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}
      - name: Start the resource sampler
        run: python3 scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select SDK 27 provider toolchain
        id: toolchain
        run: ./scripts/prepare-provider-release-toolchain.sh
      - name: Run stage metadata checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: python3 libs/darkbloom-cluster/Tests/StageMetadataChecks/run.py --output "$RUNNER_TEMP/stage-metadata-checks"
      - name: Run GPT-OSS stage checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: bash libs/darkbloom-cluster/Tests/GPTOSSStageChecks/run.sh
      - name: Run Nemotron stage checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: bash libs/darkbloom-cluster/Tests/NemotronStageChecks/run.sh
      # The download cache-policy check of the same runner stays on a Mac: on the
      # hosted VM, 0.75 of the pages written with F_NOCACHE stayed resident
      # (run 40804083002), which the VM's kernel and disk decide, not the code.
      - name: Run cluster model provisioning checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterModelProvisioningChecks/run.sh provisioning
      - name: Run cluster onboarding checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterOnboardingChecks/run.sh
      - name: Run cluster console checks
        if: ${{ !cancelled() && matrix.shard == 2 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterConsoleChecks/run.sh
      - name: Run cluster pairing checks
        if: ${{ !cancelled() && matrix.shard == 1 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterPairingChecks/run.sh
      - name: Run cluster diagnostics checks
        if: ${{ !cancelled() && matrix.shard == 1 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterDiagnosticsChecks/run.sh
      - name: Run cluster placement flow checks
        if: ${{ !cancelled() && matrix.shard == 1 && steps.toolchain.outcome == 'success' }}
        run: bash provider-swift/Tests/ClusterPlacementChecks/run-flow.sh
      - name: Run cluster focused checks
        if: ${{ !cancelled() && matrix.shard == 1 && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 40
        run: python3 scripts/cluster-test-plan.py run focused 1
      # Report-only (scripts/ci-resource-sampler.py): it never fails the job.
      - name: Report the resource samples
        if: ${{ always() }}
        run: python3 scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
      - name: Upload the resource samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-samples-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/resource-samples
          if-no-files-found: ignore
          retention-days: 14

  # The CI plans run on dev too, not only in master's Release Integrity: the
  # cluster plan's audit against the sources and this workflow, the provider
  # shard plan, the component classifier, the tested-change lookup, the route,
  # the workflow pins (the release pipeline, dev-branch caller and recovery
  # pins too, which otherwise run only in master's Release Integrity), the
  # test products hand-off and the resource sampler.
  # Python only; no build and no test result, so they run beside the test
  # jobs, on every run, and the Provider Tests gate requires them.
  ci-plan-checks:
    name: Check the CI plans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: ${{ env.CHECKOUT_SPARSE }}
          sparse-checkout-cone-mode: false
      - name: Check the CI plans
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/cluster-test-plan.py audit
          python3 scripts/test-cluster-test-plan.py
          python3 scripts/test-provider-test-shards.py
          python3 scripts/test-ci-component-paths.py
          python3 scripts/test-ci-tested-tree.py
          python3 scripts/test-darkbloom-route.py
          python3 scripts/test-provider-release-pipeline.py
          python3 scripts/test-release-dev-branch.py
          python3 scripts/test-provider-release-resume.py
          python3 scripts/test-provider-ci-workflow.py
          python3 scripts/test-ci-test-products.py
          python3 scripts/test-ci-resource-sampler.py
      # dev has no Release Integrity, so this job runs the Date comparison
      # check too. SDK 27.2 back-deploys Date's >= and <=; pre-release macOS
      # 27.2 builds lack the symbols. The release build also checks the built
      # binaries (.github/actions/provider-release-build).
      - name: Refuse back-deployed Date comparisons in provider source
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-check-date-comparisons.py
          python3 scripts/test-check-provider-weak-imports.py
          python3 scripts/check-date-comparisons.py
      # The prompt fixture downloaders' retry and redirect rules, offline: no Mac, no network.
      # Master also runs the first in its provider script checks.
      - name: Test the prompt fixture downloaders offline
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-prepare-prompt-fixtures.py
          python3 scripts/test-prepare-mimo-prompt-fixtures.py
          python3 scripts/test-prepare-mimo-image-http-fixtures.py

  provider-test-gate:
    name: Provider Tests
    runs-on: ubuntu-24.04
    # The test jobs need their build jobs: a failed build skips its test jobs,
    # and a skipped test job that should have run fails this gate.
    needs: [test-provider, test-cluster, test-cluster-focused, cluster-release-checks, ci-plan-checks]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require selected provider lanes or verified intentional skips
        env:
          CHANGES_RESULT: ${{ inputs.changes_result }}
          SKIP: ${{ inputs.skip }}
          TESTED_RUN: ${{ inputs.tested_run }}
          PROVIDER_CHANGED: ${{ inputs.provider }}
          CLUSTER_CHANGED: ${{ inputs.cluster }}
          UNIT_RESULT: ${{ needs.test-provider.result }}
          CLUSTER_RESULT: ${{ needs.test-cluster.result }}
          CLUSTER_FOCUSED_RESULT: ${{ needs.test-cluster-focused.result }}
          CLUSTER_RELEASE_RESULT: ${{ needs.cluster-release-checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          # A tree that a successful run of this workflow already tested runs
          # no test job here (provider-plan.yml); the plan then selects none.
          if [ "$SKIP" = true ]; then
            echo "::notice title=Tested once::This tree passed in $TESTED_RUN; no test job ran."
          fi
          case "$PROVIDER_CHANGED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$UNIT_RESULT" = "$expected"
          # The cluster jobs run only when their inputs changed; a skip passes
          # only when the classifier did not select them.
          case "$CLUSTER_CHANGED" in
            true) cluster_expected=success ;;
            false) cluster_expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$CLUSTER_RESULT" = "$cluster_expected"
          test "$CLUSTER_FOCUSED_RESULT" = "$cluster_expected"
          test "$CLUSTER_RELEASE_RESULT" = "$cluster_expected"
      # The CI plan checks, which ran beside the test jobs: the cluster plan's
      # audit against the sources and this workflow, the provider shard plan,
      # the component classifier, the tested-change lookup, the route, the
      # workflow pins, the test products hand-off, the resource sampler, the
      # Date comparison check and the prompt fixture downloaders.
      - name: Require the CI plan checks
        env:
          PLAN_CHECKS_RESULT: ${{ needs.ci-plan-checks.result }}
        run: test "$PLAN_CHECKS_RESULT" = success
      # Only the record's naming script is checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ inputs.skip != 'true' && (inputs.provider == 'true' || inputs.cluster == 'true') }}
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-tested-tree.py
          sparse-checkout-cone-mode: false
      # The record a later run of the same change finds (scripts/ci-tested-tree.py):
      # the tree, the event's base and head, and the components that ran. It
      # counts only once the whole run succeeded. A run that tested nothing
      # records nothing.
      - name: Name the record of the change these tests passed
        id: record
        if: ${{ inputs.skip != 'true' && (inputs.provider == 'true' || inputs.cluster == 'true') }}
        env:
          TREE: ${{ inputs.tree }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          RAN: provider=${{ inputs.provider }},cluster=${{ inputs.cluster }},mimo_audio=${{ inputs.mimo_audio }}
        run: |
          name=$(python3 scripts/ci-tested-tree.py name --tree "$TREE" --base "$BASE" --head "$HEAD" --components "$RAN")
          mkdir -p "$RUNNER_TEMP/tested-change"
          printf '%s\n' "$name" > "$RUNNER_TEMP/tested-change/record"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload the record
        if: ${{ inputs.skip != 'true' && (inputs.provider == 'true' || inputs.cluster == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/tested-change/record
          if-no-files-found: error
          retention-days: 30
