# Cloud Build config for the d-inference DEV coordinator on Google Cloud.
#
# Triggered on push to master (path filter: coordinator/** | coordinator-rs/**
# | deploy/gcp/** | tests/contracts/**).
# Builds the dual Go/Rust image, validates it, and invokes the automated dev
# serial-handoff deploy. Production never consumes this trigger.
#
# Why GCE VM instead of Cloud Run: the coordinator runs
# MicroMDM (BoltDB), which needs reliable local filesystem semantics that
# Cloud Run's ephemeral FS + gcsfuse can't provide. The VM has a persistent
# disk at /mnt/disks/userdata — the same persistent path used in prod.
#
# Upgrade time: ~2-4 minutes end-to-end (build + push + SSH restart).

timeout: 1800s

substitutions:
  _INSTANCE: d-inference-dev
  _ZONE: us-central1-a
  _IMAGE: us-central1-docker.pkg.dev/sepolia-ai/coordinator/coordinator
  _COORDINATOR_BINARY: go
  # One-time only for the first migration of the known legacy dev schema.
  _ADOPT_LEGACY: 'false'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:$SHORT_SHA
      - --tag=${_IMAGE}:latest
      - --file=coordinator/Dockerfile
      - --build-arg=BUILD_VERSION=$SHORT_SHA
      - --build-arg=BUILD_COMMIT=$SHORT_SHA
      - .

  - id: image-smoke
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=/usr/local/bin/coordinator-image-check
      - '${_IMAGE}:$SHORT_SHA'
      - smoke

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:$SHORT_SHA']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - PROJECT_ID=$PROJECT_ID
      - PROJECT=sepolia-ai
      - INSTANCE=${_INSTANCE}
      - ZONE=${_ZONE}
      - IMAGE_REPO=${_IMAGE}
      - COORDINATOR_BINARY=${_COORDINATOR_BINARY}
      - ADOPT_LEGACY=${_ADOPT_LEGACY}
      - BUILD_SHORT_SHA=$SHORT_SHA
    args:
      - -c
      - |
        set -euo pipefail
        deploy/gcp/deploy-dev.sh \
          "$BUILD_SHORT_SHA" \
          "$COORDINATOR_BINARY" \
          "$BUILD_SHORT_SHA" \
          "$ADOPT_LEGACY"

  # The mutable convenience tag advances only after the immutable digest has
  # passed deploy validation and been committed to VM metadata.
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:latest']

images:
  - '${_IMAGE}:$SHORT_SHA'
  - '${_IMAGE}:latest'
