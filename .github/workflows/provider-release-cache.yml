name: SDK 27 release preparation

on:
  schedule:
    # Daily warm on master instead of firing 2 Blacksmith Macs on every master
    # push; the cheap gate job skips when provider-swift/ and libs/ have not
    # changed since the last successful warm.
    - cron: '47 6 * * *'
  pull_request:
    paths:
      - '.github/actions/provider-release-build/**'
      - '.github/workflows/release-swift.yml'
      - '.github/workflows/provider-release-cache.yml'
      - 'scripts/provider-release-cache.py'
      - 'scripts/provider_release_cache/**'
      - 'scripts/test-provider-release-cache.py'
      - 'scripts/test-provider-release-pipeline.py'
      - 'scripts/provider-release-swift.sh'
      - 'scripts/prepare-provider-release-toolchain.sh'
      - 'scripts/check-provider-weak-imports.py'
      - 'scripts/install-release-cmake.sh'
      - 'scripts/prepare-metal-toolchain.py'
      - 'scripts/test-prepare-metal-toolchain.py'
      - 'scripts/fetch-metallib.sh'
      - 'scripts/verify-prompt-parity.sh'
      - 'scripts/verify-nemotron-prompt-parity.sh'
      - 'scripts/prepare-prompt-fixtures.py'
      - 'scripts/verified_download_cache.py'
      - 'scripts/fixture_redirects.py'
      - 'scripts/test-prepare-prompt-fixtures.py'
      - 'scripts/run-provider-tests.sh'
      - 'provider-swift/Tests/ProviderCoreTests/Qwen4StandaloneAdmissionTests.swift'
      - 'provider-swift/Sources/ProviderCore/KVCacheSSD/BoundedSingleConsumerPipeline.swift'
      - 'provider-swift/Tests/ProviderCoreTests/KVCacheSSD/BoundedSingleConsumerPipelineTests.swift'
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale warms on the same PR or branch.
concurrency:
  group: provider-sdk27-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check whether release cache needs warming
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether to warm SDK 27 caches
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_green=$(gh api "repos/$REPOSITORY/actions/workflows/provider-release-cache.yml/runs?branch=master&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push")][0].head_sha // ""')
          if [ -n "$last_green" ] && [ "$last_green" = "$HEAD_SHA" ]; then
            echo "::notice title=Release cache warm skipped::master HEAD ($HEAD_SHA) already has a successful warm."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$last_green" ]; then
            compare_json=$(mktemp)
            trap 'rm -f "$compare_json"' EXIT
            if gh api "repos/$REPOSITORY/compare/${last_green}...${HEAD_SHA}" > "$compare_json" 2>/dev/null; then
              should_run=$(python3 - "$compare_json" <<'PY'
          import fnmatch, json, sys

          PATTERNS = [
              'provider-swift/**',
              'libs/**',
              '.gitmodules',
              'fixtures/prompt-contract/**',
              '.github/actions/provider-release-build/**',
              '.github/workflows/provider-release-cache.yml',
              '.github/workflows/release-swift.yml',
          ]

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          files = data.get('files') or []
          if len(files) >= 300:
              print('true')
              sys.exit(0)
          def matches(path, pat):
              if pat.endswith('/**'):
                  prefix = pat[:-3]
                  return path == prefix or path.startswith(prefix + '/')
              return fnmatch.fnmatchcase(path, pat)
          for entry in files:
              name = entry.get('filename') or ''
              prev = entry.get('previous_filename') or ''
              if any(matches(p, pat) for p in (name, prev) if p for pat in PATTERNS):
                  print('true')
                  sys.exit(0)
          print('false')
          PY
              )
              if [ "$should_run" = false ]; then
                echo "::notice title=Release cache warm skipped::No provider-swift/ or libs/ changes between $last_green and $HEAD_SHA."
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  # Only pull-request warming may use Darkbloom Sandboxes. Master and dispatched
  # runs warm the caches that release builds restore, so they keep Blacksmith.
  route:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        warm macos_arm64 blacksmith-12vcpu-macos-27 ${{ github.event_name == 'pull_request' && 2 || 0 }}

  warm:
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
    name: SDK 27 ${{ matrix.lane }}
    needs: [gate, route]
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(needs.route.outputs.routes)['warm'] || 'blacksmith-12vcpu-macos-27' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [release, qualification]
    env:
      MLX_METALLIB_DEPLOYMENT_TARGET: '26.2'
      # As in ci.yml: test and warm the production identity on the dev branch too.
      DARKBLOOM_RELEASE_ENVIRONMENT: prod
      # Master and dispatched warms fill the caches that release builds
      # restore, so they use the release toolchain. A pull request may run on
      # a Darkbloom Sandbox with another accepted SDK.
      DARKBLOOM_PROVIDER_TOOLCHAIN: ${{ github.event_name == 'pull_request' && 'qualification' || 'release' }}
    steps:
      # Before every cache step: a Darkbloom Sandbox that the plane gave no
      # Darkbloom cache would reach GitHub's own Actions cache, so there every
      # cache step is skipped (docs/developer/build.md#ci-caching).
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} != darkbloom-* ]]; then
            echo "Actions cache: this runner's own"
          elif [[ -n ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "Actions cache: the Darkbloom cache at $DARKBLOOM_CACHE_URL"
          else
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so every cache step is skipped."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Warm the same unsigned build used by releases
        id: build
        uses: ./.github/actions/provider-release-build
        with:
          lane: ${{ matrix.lane }}
      - name: Verify unsigned release handoff without signing
        if: matrix.lane == 'release'
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          METALLIB: ${{ steps.build.outputs.metallib }}
          CLUSTER_HELPERS: ${{ steps.build.outputs.cluster-helpers-dir }}
        run: |
          set -euo pipefail
          REPORTED=$("$BIN_DIR/darkbloom" --version)
          VERSION=${REPORTED#darkbloom }
          ./scripts/check-release-version.sh "$VERSION" "$REPORTED"
          python3 scripts/provider-signing-validation.py stage \
            --source "$GITHUB_WORKSPACE" --bin "$BIN_DIR" --metallib "$METALLIB" \
            --cluster-helpers "$CLUSTER_HELPERS" \
            --output "$RUNNER_TEMP/unsigned-roundtrip" --version "$VERSION"
          COPYFILE_DISABLE=1 tar czf "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" -C "$RUNNER_TEMP/unsigned-roundtrip" .
          python3 scripts/provider-signing-validation.py unpack \
            --archive "$RUNNER_TEMP/unsigned-roundtrip.tar.gz" \
            --output "$RUNNER_TEMP/verified-roundtrip" \
            --source-sha "$GITHUB_SHA" --version "$VERSION"
