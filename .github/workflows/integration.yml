name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  integration-tests:
    name: E2E Integration Tests
    runs-on: blacksmith-12vcpu-macos-latest
    # Job budget = the sum of every step's worst case, not the warm-path wall
    # time (a green run takes ~26m with warm caches). Test allowances:
    # 25m (blocking paged lane) + 15m (expected-red exact-cache lane)
    # + 10m (default-posture smoke) + 15m (mixed-version, released provider)
    # + 30m (reverse lane: TWO sequential `go test -timeout 15m` runs)
    # = 95m. Setup/build/download overhead: ~3m warm, but a cold runner pays
    # the full Swift provider build, the cargo sidecar build, and the
    # gpt-oss-20b (~12 GB) + gemma-4 snapshot downloads — budget 25m.
    # 95m + 25m = 120m.
    timeout-minutes: 120
    env:
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
      DARKBLOOM_PROMPT_SIDECAR_BINARY: ${{ github.workspace }}/coordinator/promptsidecar/target/release/promptsidecar
      TESTBED_PROVIDER_CONFIG: debug
      GPT_OSS_REVISION: 773a7da77e569019bb0fd17a554b263738d669a3
      EXACT_CACHE_MODEL_REVISION: 2c3e507453b4f218d05fe3cc97bea5c5a654257e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install Postgres
        run: brew install postgresql@16

      - name: Build provider (Swift)
        run: |
          cd provider-swift
          swift build -c debug

      - name: Build prompt-contract sidecar
        run: cargo build --manifest-path coordinator/promptsidecar/Cargo.toml --release

      - name: Build and stage source-matched mlx.metallib
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || brew install cmake
          METALLIB_CACHE_DIR="$RUNNER_TEMP/metallib-cache" \
            ./scripts/fetch-metallib.sh "$RUNNER_TEMP"
          metallib="$RUNNER_TEMP/mlx.metallib"
          provider_bin=$(cd provider-swift && swift build -c debug --show-bin-path)
          for destination in provider-swift/.build/debug "$provider_bin"; do
            mkdir -p "$destination"
            cp "$metallib" "$destination/mlx.metallib"
          done
          while IFS= read -r macos; do
            cp "$metallib" "$macos/mlx.metallib"
          done < <(
            find provider-swift/.build libs/mlx-swift-lm/.build \
              -type d -path '*.xctest/Contents/MacOS' -print 2>/dev/null
          )

      - name: Install Hugging Face client
        # Both lanes use pinned public HF fixtures, not exact production IDs.
        # GPT-OSS supplies ordinary inference; small Gemma 4 supplies the
        # separate cache-routing fixture with an explicit SSD opt-in.
        run: |
          python3 -m venv /tmp/mlxvenv
          /tmp/mlxvenv/bin/pip install huggingface_hub

      - name: Download model (protected read-only auth)
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: |
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=os.environ.get('HF_TOKEN') or None)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=os.environ.get('HF_TOKEN') or None)"

      - name: Download public model (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request: downloading public model without Hugging Face authentication"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gpt-oss-20b-MXFP4-Q8', revision=os.environ['GPT_OSS_REVISION'], token=False)"
          /tmp/mlxvenv/bin/python -c "import os; from huggingface_hub import snapshot_download; snapshot_download('mlx-community/gemma-4-e2b-it-4bit', revision=os.environ['EXACT_CACHE_MODEL_REVISION'], token=False)"

      - name: Pin exact-cache model snapshot selection
        run: |
          /tmp/mlxvenv/bin/python <<'PY'
          import os
          from pathlib import Path

          snapshots = (
              Path.home()
              / ".cache/huggingface/hub/models--mlx-community--gemma-4-e2b-it-4bit/snapshots"
          )
          selected = snapshots / os.environ["EXACT_CACHE_MODEL_REVISION"]
          if not selected.is_dir():
              raise SystemExit(f"pinned exact-cache snapshot missing: {selected}")
          for candidate in snapshots.iterdir():
              if candidate.is_dir():
                  os.utime(candidate, (1, 1))
          os.utime(selected, None)
          print(f"Pinned exact-cache snapshot: {selected.name}")
          PY

      # THE PAGED GATE — BLOCKING. Pinned to an EXPLICIT paged posture, not
      # left on the provider's default, because `.auto` is ALLOWED to degrade:
      # a paged preflight, capacity-planning or pool-construction failure
      # silently lands an `.auto` slot on contiguous and the suite still
      # passes. That made this job green whether or not paged ever ran.
      #
      # `EngineV2KVBackendPolicy.degradesPagedFailure` returns false for an
      # explicit `.paged` selection: it REFUSES the load with
      # `EngineV2ProductionError.pagedUnavailable` instead of degrading. So a
      # paged regression that trips that path now fails this step rather than
      # quietly swapping the system under test.
      #
      # The cap is pinned WITH the backend and not inherited. An unnamed cap
      # seats the provider on its own default, which v0.8.1 reverted to 4 along
      # with the contiguous KV default. Paged at B=4 measures 0.98x of
      # contiguous against 1.17x at B=8, so setting the backend alone would
      # have bought the B=1 regression and none of the throughput. This lane
      # pins 8 explicitly, so the concurrency revert does not move it.
      #
      # DARKBLOOM_TESTBED_EXPECT_KV_BACKEND closes the last construction-side
      # hole: after the providers register, the testbed pre-warms each
      # advertised slot and asserts the ENGINE-REPORTED `kv_backend` on the
      # heartbeat equals the lane's declared backend, failing the suite when
      # it does not. Explicit-paged refusal covers the load path; the
      # expectation covers everything else (a future degrade path, a testbed
      # regression that stops writing the TOML, the wrong binary under test).
      #
      # BLOCKING as of the v0.8.0 gate audit. This step used to be
      # `continue-on-error: true` because ONE fixture-specific test
      # (TestIntegrationExactCacheRouting) is expected-red on paged — which
      # meant the whole 16-test paged lane could fail without failing the
      # job, and on the PR head it was in fact swallowing a live FAIL. The
      # expected-red test now runs in its own informational step below;
      # everything here must pass.
      - name: Run integration + profile tests (paged @ 8 — BLOCKING gate)
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: paged
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # The one silent hole an explicit paged selection does NOT close: the
          # fleet kill switch is an override, not a failure, so it degrades
          # without refusing. Fail loudly rather than measure contiguous.
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this gate"
            exit 1
          fi
          echo "KV posture requested: engine_v2_kv_backend=$DARKBLOOM_TESTBED_KV_BACKEND" \
               "engine_v2_max_concurrent=$DARKBLOOM_TESTBED_MAX_CONCURRENT" \
               "DARKBLOOM_CBV2_PAGED_KV=<unset>"
          echo "Backend assertion armed: the testbed fails any suite whose" \
               "providers do not report kv_backend=$DARKBLOOM_TESTBED_EXPECT_KV_BACKEND."
          go test ./e2e/ -count=1 -v -timeout 25m -p=1 \
            -run 'TestIntegration|TestProfile' \
            -skip '^TestIntegrationExactCacheRouting$'

      # Informational fixture lane: retain the original exact cold/adopted
      # output gate for the small e2b artifact. Historical adoption mismatch
      # evidence does not qualify current source. Before the explicit SSD
      # opt-in, the latest master run stopped at capability advertisement,
      # because this HF ID is outside the production SSD-default allowlist.
      # Promote only after a real fixture run reaches and passes every check.
      # Do not prewarm via EXPECT_KV_BACKEND: that perturbs cold-vs-adopted
      # routing. The test performs its own controlled loads and this step
      # pins the requested backend explicitly.
      - name: Run exact-cache routing (paged @ 8 — informational fixture)
        continue-on-error: true
        env:
          DARKBLOOM_TESTBED_KV_BACKEND: paged
          DARKBLOOM_TESTBED_MAX_CONCURRENT: "8"
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "the kill switch degrades paged silently and voids this lane"
            exit 1
          fi
          echo "Informational e2b fixture: explicit SSD opt-in; exact adoption checks retained."
          go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
            -run '^TestIntegrationExactCacheRouting$'

      # Unqualified-fixture defaults lane. Leave backend/cap unset so the
      # provider decodes its defaults in the isolated generated TOML (which
      # always disables auto-update/watchdog). No backend field is written.
      # The exact HF ID below is outside the production paged/SSD allowlist,
      # so its .auto backend is contiguous. Exact catalog gpt-oss-20b instead
      # defaults to paged + SSD; this lane does not qualify that artifact.
      # Its release-default gate requires explicit pinned runtime/catalog
      # input in TestIntegrationReleaseDefaultsHTTP.
      # Keep the engine-reported backend assertion and reject inherited
      # kill switches; never label a configured fallback as a default result.
      - name: Run unqualified-fixture defaults (contiguous — BLOCKING gate)
        env:
          DARKBLOOM_TESTBED_MODEL: mlx-community/gpt-oss-20b-MXFP4-Q8
          DARKBLOOM_TESTBED_EXPECT_KV_BACKEND: contiguous
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          if [ -n "${DARKBLOOM_CBV2_PAGED_KV:-}" ]; then
            echo "::error::DARKBLOOM_CBV2_PAGED_KV=${DARKBLOOM_CBV2_PAGED_KV} is set;" \
                 "this lane must measure the DEFAULT, not a killed paged"
            exit 1
          fi
          echo "KV posture requested: defaults for the pinned unqualified HF fixture;" \
               "exact production catalog defaults require the release-default gate"
          echo "Backend assertion armed: this unqualified fixture resolving paged" \
               "fails this gate via DARKBLOOM_TESTBED_EXPECT_KV_BACKEND=contiguous."
          go test ./e2e/ -count=1 -v -timeout 10m -p=1 \
            -run '^TestIntegration_(NonStreaming|Streaming)Inference$'

      # The paged env is scoped to the gate STEP on purpose — do not promote it
      # to the job's `env:`. This lane and the reverse one below run RELEASED
      # v0.7.12 binaries, and a job-level setting would make the current
      # testbed hand a v0.7.12 provider a TOML selecting a backend that release
      # does not have.
      #
      # DARKBLOOM_MIXED_VERSION_EXPECT declares the coverage tier THIS runner
      # must reach, and the lane goes red when it falls short of it.
      #
      #   artifact — verify the pinned v0.7.12 executable + metallib digests.
      #              Needs no provider process, so it runs anywhere.
      #   full     — additionally boot the released provider and exercise
      #              every compatibility endpoint. Requires SIP ENABLED: the
      #              v0.7.12 release build throws SecurityError.sipDisabled
      #              before it registers (see mixedVersionSIPRequired).
      #
      # `artifact` and not `full`, because blacksmith-12vcpu-macos-latest is
      # SIP-DISABLED and no SIP-enabled runner is available to this repo.
      # Declaring `full` here would only make the step permanently red, which
      # is not a gate either. Declaring `artifact` states plainly what this
      # runner covers and, via the marker grep below, makes the lane fail if
      # it stops covering even that. When a SIP-enabled runner exists, move
      # this step to it and flip this to `full`: a skip is then red.
      - name: Verify current coordinator with released v0.7.12 provider
        env:
          DARKBLOOM_MIXED_VERSION_EXPECT: artifact
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          # Recorded, not enforced: SIP state is a property of the runner, not
          # of the candidate. What IS enforced is the tier grep below.
          echo "Runner SIP state: $(/usr/bin/csrutil status 2>&1 || true)"
          RELEASED_PROVIDER=$(./scripts/fetch-v0712-provider.sh "$RUNNER_TEMP/released-providers")
          MIXED_VERSION_LOG="$RUNNER_TEMP/mixed-version.log"
          DARKBLOOM_MIXED_VERSION=1 \
          DARKBLOOM_PROVIDER_BINARY="$RELEASED_PROVIDER" \
            go test ./e2e/ -count=1 -v -timeout 15m -p=1 \
              -run TestIntegrationMixedVersionReleasedV0712Provider \
            2>&1 | tee "$MIXED_VERSION_LOG"
          # `go test` exits 0 for a skipped test, for a `-run` pattern that
          # matched nothing, and for a package with no tests — so the exit
          # code above cannot distinguish "gated the release artifact" from
          # "ran nothing at all". That is exactly how this lane previously
          # reported green while never executing. Require the tier marker.
          if ! grep -q MIXED_VERSION_TIER_ARTIFACT_OK "$MIXED_VERSION_LOG"; then
            echo "::error::mixed-version lane did not reach its declared" \
                 "DARKBLOOM_MIXED_VERSION_EXPECT=artifact tier: no" \
                 "MIXED_VERSION_TIER_ARTIFACT_OK in the log. The released v0.7.12" \
                 "bundle pins were NOT verified — the lane was skipped, filtered" \
                 "out, or renamed. This step gates nothing until that is fixed."
            exit 1
          fi
          if grep -q MIXED_VERSION_TIER_FULL_OK "$MIXED_VERSION_LOG"; then
            echo "::notice::mixed-version lane reached the FULL tier: the released" \
                 "v0.7.12 provider booted and every compatibility endpoint was" \
                 "exercised."
          else
            echo "::warning::mixed-version lane reached the ARTIFACT tier only:" \
                 "the released v0.7.12 executable and metallib digests are verified," \
                 "but the provider was NOT booted and no compatibility request was" \
                 "served. Grep MIXED_VERSION_SIP_REQUIRED for why. Run this step on a" \
                 "SIP-enabled runner with DARKBLOOM_MIXED_VERSION_EXPECT=full to gate" \
                 "the wire surface."
          fi

      # Reverse lane: the RELEASED v0.7.12 coordinator against the CANDIDATE
      # provider. Named for v0.7.13 until v0.7.15; the pinned tag below has
      # always been v0.7.12, which is what this actually checks out.
      - name: Verify released v0.7.12 coordinator with candidate provider
        run: |
          set -euo pipefail
          PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          export PATH
          RELEASED_COORDINATOR="$RUNNER_TEMP/d-inference-v0.7.12"
          git worktree add --detach "$RELEASED_COORDINATOR" v0.7.12
          trap 'git worktree remove --force "$RELEASED_COORDINATOR"' EXIT
          (
            cd "$RELEASED_COORDINATOR"
            for test_name in NonStreamingInference StreamingInference; do
              DARKBLOOM_REPO_ROOT="$GITHUB_WORKSPACE" \
              TESTBED_PROVIDER_CONFIG=debug \
              DARKBLOOM_CBV2_MTP=0 \
              DARKBLOOM_PREFIX_CACHE_ALLOW_EPHEMERAL=1 \
              DARKBLOOM_PREFIX_CACHE_TEST_ROOT="$RUNNER_TEMP/v0712-reverse-cache-$test_name" \
                go test ./e2e -count=1 -v -timeout 15m -p=1 \
                  -run "^TestIntegration_${test_name}$"
            done
          )

  # The E2E Benchmarks job used to live here as a second job. It is gated on
  # the approval-required `benchmarks` environment, which is created on every
  # PR and — measured over this release's 26 PR runs — never approved, so the
  # workflow-level status of "Integration Tests" was permanently `waiting`
  # even when the integration job above had long since completed. The
  # benchmark job now lives in `.github/workflows/benchmarks.yml` so its
  # (deliberate, cost-controlling) approval gate holds only its own workflow
  # open, and this one concludes with the integration job's real result.
