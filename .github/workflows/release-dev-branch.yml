name: Release Dev-Branch Provider (self-signed)

# Experimental dev-only provider lane: build a provider from ANY d-inference
# branch or SHA and publish it to the dev coordinator as a self-signed release,
# without merging to master.
#
# Why this is a separate workflow from release-swift.yml:
#   release-swift.yml holds the production Apple signing certificate and the
#   production release keys. Its trust gate (scripts/provider_release_resume/
#   api.py verify_source and resolve-provider-release.sh) refuses to build
#   anything but the reviewed master tip, on purpose. This workflow never
#   touches that gate, never reads a production secret and never submits the
#   bundle to Apple's release-signing service. It signs the bundle ad-hoc
#   (codesign -s -) and publishes with DEV_RELEASE_KEY and the dev R2 keys only.
#
# Trust model:
#   - This file is dispatched on master, so the credentialed publication logic
#     (job `publish`) runs the REVIEWED master copy of every script.
#   - Branch code is only COMPILED and ad-hoc signed in job `build-sign`, which
#     holds no secret. It is never executed in a step that holds a credential.
#   - Job `publish` holds DEV_RELEASE_KEY and the dev R2 keys. It only uploads
#     bytes and makes one HTTP registration call; it never runs the branch
#     binary.
#
# Signature model (option B):
#   The installer accepts an ad-hoc / non-Apple-anchored signature for versions
#   that carry a pre-release marker (-dev. or -staging.), while prod keeps the
#   full Apple-team requirement unchanged (scripts/install.sh
#   select_provider_identity and verify_staged_app_signature). A -dev.branch.N
#   build is therefore installable once the dev coordinator serves the relaxed
#   installer. The installer is a pinned provider-contract snapshot, so the
#   darkbloom-platform served copy (scripts/install.sh and
#   coordinator/api/install.sh) must be re-snapshotted from the merged
#   d-inference commit in a separate darkbloom-platform PR before the dev
#   coordinator serves it. Until that re-snapshot lands, the dev coordinator
#   still serves the old installer and installs via it are rejected.

run-name: >-
  dev-branch provider build of ${{ inputs.ref }} (-dev.branch.${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build (any d-inference ref)'
        required: true
        type: string

# One dev-branch publication at a time, serialized with itself. This never joins
# the release-dev group that release-swift.yml uses for the master dev lane.
concurrency:
  group: release-dev-branch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sign:
    name: Build and ad-hoc self-sign the branch provider
    runs-on: blacksmith-12vcpu-macos-27
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      artifact_name: ${{ steps.sign.outputs.artifact_name }}
      binary_hash: ${{ steps.sign.outputs.binary_hash }}
      bundle_hash: ${{ steps.sign.outputs.bundle_hash }}
      metallib_hash: ${{ steps.sign.outputs.metallib_hash }}
      code_directory_hash: ${{ steps.sign.outputs.code_directory_hash }}
    env:
      # Dev identity and dev build defaults. Package.swift compiles the dev
      # coordinator URL from this; the version marker selects the dev identity.
      DARKBLOOM_RELEASE_ENVIRONMENT: dev
    steps:
      # Build only the chosen ref. No secret is referenced in this job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Derive the dev-branch version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(awk -F'"' '/public static let version =/ { print $2 }' \
            provider-swift/Sources/ProviderCore/ProviderCore.swift)
          # Distinct from the master dev lane's X.Y.Z-dev.N: the `branch` segment
          # keeps every dev-branch build apart from the numeric master dev lane.
          VERSION="${BASE}-dev.branch.${RUN_NUMBER}"
          ./scripts/check-release-version.sh "$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
          {
            echo "version=$VERSION"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Dev-branch version: $VERSION from $SOURCE_SHA"
      - uses: ./.github/actions/provider-release-build
        id: build
        with:
          lane: release
          version: ${{ steps.version.outputs.version }}
      - name: Resolve packaged dev app names
        run: python3 scripts/provider_release_identity.py "$VERSION" >> "$GITHUB_ENV"
      - name: Stage the unsigned dev app, ad-hoc sign it, retain the bundle
        id: sign
        env:
          BIN_DIR: ${{ steps.build.outputs.bin-dir }}
          METALLIB: ${{ steps.build.outputs.metallib }}
          CLUSTER_HELPERS: ${{ steps.build.outputs.cluster-helpers-dir }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          # The CLI the build stamped must report the dev-branch version.
          ./scripts/check-release-version.sh "$VERSION" "$("$BIN_DIR/$PRODUCT_CLI_NAME" --version)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          # Reuse the exact unsigned app layout the master lane builds.
          UNSIGNED="$RUNNER_TEMP/unsigned-provider"
          python3 scripts/provider-signing-validation.py stage \
            --source "$GITHUB_WORKSPACE" --bin "$BIN_DIR" --metallib "$METALLIB" \
            --cluster-helpers "$CLUSTER_HELPERS" \
            --output "$UNSIGNED" --version "$VERSION"

          STAGE="$RUNNER_TEMP/dev-branch-bundle"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin"
          APP="$STAGE/$APP_NAME"
          cp -R "$UNSIGNED/$APP_NAME" "$APP"

          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>io.darkbloom.provider</string>
              <key>CFBundleExecutable</key>
              <string>${CLI_NAME}</string>
              <key>CFBundleName</key>
              <string>${APP_DISPLAY_NAME}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature only: no certificate, no entitlements that need a
          # provisioning profile, no Apple release-signing submission. Sign
          # nested Mach-O first, the
          # bundle last. Without keychain-access-groups the provider uses an
          # ephemeral Secure Enclave key and stays at the self_signed tier, which
          # is exactly what the dev coordinator accepts.
          codesign --force --sign - "$APP/Contents/MacOS/mlx.metallib"
          if [ -f "$APP/Contents/Helpers/darkbloom-fan-helper" ]; then
            codesign --force --sign - "$APP/Contents/Helpers/darkbloom-fan-helper"
          fi
          # The cluster helpers (ad-hoc too), resources first: a nested code location may hold no unsigned file.
          for helper in mlx.metallib pagedattention.metal darkbloom-cluster-worker darkbloom-cluster-plan; do
            codesign --force --sign - "$APP/Contents/Helpers/$helper"
          done
          codesign --force --sign - "$APP/Contents/MacOS/$ENCLAVE_NAME"
          codesign --force --sign - "$APP/Contents/MacOS/$CLI_NAME"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Flat verifier copies keep the SwiftPM product names; the coordinator
          # artifact verifier hashes bin/darkbloom.
          cp "$APP/Contents/MacOS/$CLI_NAME" "$STAGE/bin/$PRODUCT_CLI_NAME"
          cp "$APP/Contents/MacOS/$ENCLAVE_NAME" "$STAGE/bin/$PRODUCT_ENCLAVE_NAME"
          cp "$APP/Contents/MacOS/mlx.metallib" "$STAGE/bin/mlx.metallib"

          BUNDLE="$RUNNER_TEMP/publication-input/darkbloom-bundle-macos-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/publication-input"
          tar czf "$BUNDLE" -C "$STAGE" .

          BINARY_HASH=$(shasum -a 256 "$STAGE/bin/$PRODUCT_CLI_NAME" | cut -d' ' -f1)
          METALLIB_HASH=$(shasum -a 256 "$STAGE/bin/mlx.metallib" | cut -d' ' -f1)
          BUNDLE_HASH=$(shasum -a 256 "$BUNDLE" | cut -d' ' -f1)
          CODE_DIRECTORY_HASH=$(codesign -d --verbose=4 \
            "$APP/Contents/MacOS/$CLI_NAME" 2>&1 \
            | sed -n 's/^CandidateCDHashFull sha256=//p')
          if [[ ! "$CODE_DIRECTORY_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected one full SHA-256 CodeDirectory hash from the ad-hoc signed provider"
            exit 1
          fi
          {
            echo "artifact_name=dev-branch-bundle-${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
            echo "binary_hash=$BINARY_HASH"
            echo "metallib_hash=$METALLIB_HASH"
            echo "bundle_hash=$BUNDLE_HASH"
            echo "code_directory_hash=$CODE_DIRECTORY_HASH"
          } >> "$GITHUB_OUTPUT"
      - name: Transfer the self-signed dev bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.sign.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication-input/darkbloom-bundle-macos-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Register the dev build on the dev coordinator
    needs: build-sign
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    # Join the dev publication serialization group that release-swift.yml's
    # publish-release job uses for environment=dev, so a dev-branch publish and
    # a master dev publish never register against the dev coordinator at once.
    concurrency:
      group: provider-publication-dev
      cancel-in-progress: false
    env:
      ENV_PREFIX: dev
      VERSION: ${{ needs.build-sign.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.build-sign.outputs.source_sha }}
      BINARY_HASH: ${{ needs.build-sign.outputs.binary_hash }}
      BUNDLE_HASH: ${{ needs.build-sign.outputs.bundle_hash }}
      METALLIB_HASH: ${{ needs.build-sign.outputs.metallib_hash }}
      CODE_DIRECTORY_HASH: ${{ needs.build-sign.outputs.code_directory_hash }}
    steps:
      # The reviewed master copy of every publication script runs here, never
      # the branch copy. Branch bytes arrive only as the downloaded bundle.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Resolve dev publication endpoints
        env:
          DEV_R2_PUBLIC_URL: ${{ secrets.DEV_R2_PUBLIC_URL }}
          DEV_COORDINATOR_URL: ${{ secrets.DEV_COORDINATOR_URL }}
        run: |
          set -euo pipefail
          test -n "$DEV_R2_PUBLIC_URL"
          test -n "$DEV_COORDINATOR_URL"
          {
            echo "r2_public_url=$DEV_R2_PUBLIC_URL"
            echo "coordinator_url=$DEV_COORDINATOR_URL"
          } >> "$GITHUB_ENV"
      - name: Download this run's self-signed dev bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build-sign.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" --dir "$RUNNER_TEMP/publication-input"
      - name: Prepare the exact dev release identity
        id: prepare
        env:
          R2_PUBLIC_URL: ${{ env.r2_public_url }}
          COORDINATOR_URL: ${{ env.coordinator_url }}
        run: |
          set -euo pipefail
          python3 scripts/provider-release-publication.py prepare \
            --directory "$RUNNER_TEMP/provider-publication" \
            --bundle "$RUNNER_TEMP/publication-input/darkbloom-bundle-macos-arm64.tar.gz"
          {
            echo "RELEASE_PAYLOAD_SHA256=$(shasum -a 256 "$RUNNER_TEMP/provider-publication/release-payload.json" | cut -d' ' -f1)"
            echo "RELEASE_PROVENANCE_SHA256=$(shasum -a 256 "$RUNNER_TEMP/provider-publication/release-provenance.json" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
      - name: Install publication tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/publication-tools"
          "$RUNNER_TEMP/publication-tools/bin/pip" install awscli
          echo "$RUNNER_TEMP/publication-tools/bin" >> "$GITHUB_PATH"
      - name: Stage the immutable bundle in dev R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.DEV_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DEV_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ env.r2_public_url }}
        run: python3 scripts/provider-release-publication.py stage --directory "$RUNNER_TEMP/provider-publication"
      - name: Register the release and publish dev latest aliases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.DEV_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DEV_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ env.r2_public_url }}
          COORDINATOR_URL: ${{ env.coordinator_url }}
          RELEASE_KEY: ${{ secrets.DEV_RELEASE_KEY }}
        run: python3 scripts/provider-release-publication.py publish --directory "$RUNNER_TEMP/provider-publication"
