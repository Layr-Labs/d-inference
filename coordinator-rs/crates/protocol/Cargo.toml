[package]
name = "darkbloom-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
crypto_box = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
# Shared-key precompute compatible with Go `box.Precompute` /
# `box.OpenAfterPrecomputation` (crypto_box does not expose the derived key).
hex = "0.4"
curve25519-dalek = "4"
salsa20 = "0.10"
crypto_secretbox = { version = "0.1", features = ["salsa20"] }

[dev-dependencies]
proptest = { workspace = true }
